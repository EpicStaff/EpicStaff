# The container runs nginx as a non-root user on a read-only root filesystem: every path nginx
# writes is under the /tmp tmpfs (the pid file is moved there in Dockerfile.fe).
client_body_temp_path /tmp/client_temp;
proxy_temp_path       /tmp/proxy_temp;
fastcgi_temp_path     /tmp/fastcgi_temp;
uwsgi_temp_path       /tmp/uwsgi_temp;
scgi_temp_path        /tmp/scgi_temp;

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # An operator-mounted /usr/share/nginx/html/config.json wins; otherwise the one entrypoint.sh
    # generated at start.
    location = /config.json {
        try_files $uri @generated_config;
    }

    location @generated_config {
        root /tmp/frontend-config;
        try_files /config.json =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.fe
    ports:
      - "4200:80"
    # Same hardening as in src/docker-compose.yaml: nginx runs as a non-root user, writes only /tmp,
    # and the sysctl lets it listen on 80.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      - frontend-network
    environment:
      # Absolute on purpose: this standalone frontend has no reverse proxy, so the browser
      # reaches django/realtime directly. Use localhost (not 127.0.0.1) to stay same-site
      # with the app on :4200 so the SameSite=Lax refresh cookie is kept. All four are
      # required; with the backend on its default ports, for example:
      #   API_URL=http://localhost:8000/api/
      #   REALTIME_API_URL=http://localhost:8050/realtime/
      #   AUDITOR_API_URL=http://localhost:8060/
      #   SESSION_AUDIT_TRAIL_ENABLED=false
      #   USER_AUDIT_TRAIL_ENABLED=false
      API_URL: ${API_URL:?}
      REALTIME_API_URL: ${REALTIME_API_URL:?}
      AUDITOR_API_URL: ${AUDITOR_API_URL:?}
      SESSION_AUDIT_TRAIL_ENABLED: ${SESSION_AUDIT_TRAIL_ENABLED:?}
      USER_AUDIT_TRAIL_ENABLED: ${USER_AUDIT_TRAIL_ENABLED:?}
    # Docker's default json-file log never rotates; keep at most 50 MB, as src/docker-compose.yaml does.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  frontend-network:
    driver: bridge

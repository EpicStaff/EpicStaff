<div class="container">
    <div class="dialog-header">
        <div class="header-left">
            <app-svg-icon
                icon="settings"
                size="1.5rem"
                class="header-icon"
            />
            <h2 class="title">Flow Settings</h2>
        </div>
        <button
            class="close-btn"
            type="button"
            aria-label="Close"
            (click)="dialogRef.close()"
            matTooltip="Close"
            matTooltipPosition="above"
        >
            <app-icon
                icon="ui/close"
                size="14px"
            />
        </button>
    </div>

    <div class="dialog-content">
        <p class="field-hint">These settings apply to this flow, and only you see them.</p>

        <div class="form-section form-section--toggle">
            <span class="section-label">Arrow colors</span>
            <app-toggle-switch
                ariaLabel="Arrow colors"
                [checked]="flowSettings.arrowColorsEnabled()"
                (checkedChange)="flowSettings.setForCurrentFlow({ arrow_colors: $event })"
            />
        </div>

        <div class="form-section form-section--toggle">
            <span class="section-label">Show Inputs/Outputs</span>
            <app-toggle-switch
                ariaLabel="Show Inputs/Outputs"
                [checked]="flowSettings.showInputsOutputs()"
                (checkedChange)="flowSettings.setForCurrentFlow({ show_inputs_outputs: $event })"
            />
        </div>

        <div class="form-section form-section--toggle">
            <span class="section-label">Curved connections</span>
            <app-toggle-switch
                ariaLabel="Curved connections"
                [checked]="flowSettings.edgeStyle() === 'adaptive-curve'"
                (checkedChange)="
                    flowSettings.setForCurrentFlow({ edge_style: $event ? 'adaptive-curve' : 'orthogonal' })
                "
            />
        </div>

        <div class="form-section form-section--toggle">
            <span class="section-label">Always show node numbers</span>
            <app-toggle-switch
                ariaLabel="Always show node numbers"
                [checked]="flowSettings.alwaysShowNodeNumbers()"
                (checkedChange)="flowSettings.setForCurrentFlow({ always_show_node_numbers: $event })"
            />
        </div>

        <div class="form-section form-section--toggle">
            <span class="section-label">Highlight unused nodes</span>
            <app-toggle-switch
                ariaLabel="Highlight unused nodes"
                [checked]="flowSettings.highlightUnusedNodes()"
                (checkedChange)="flowSettings.setForCurrentFlow({ highlight_unused_nodes: $event })"
            />
        </div>

        <div class="form-section">
            <span class="section-label">Timezone</span>
            <span class="field-hint">Default for new schedule triggers in this flow</span>
            <app-timezone-selector
                [formControl]="scheduleZoneControl"
                [offerDefaultZone]="flowSettings.accountScheduleZone()"
            />
        </div>
    </div>

    <!-- Shown only when the flow has settings of its own, like "Reset to defaults" on the Shortcuts settings page. -->
    @if (flowSettings.hasFlowOverride()) {
        <div class="dialog-footer">
            <app-button
                type="outline-primary"
                tooltip="Use your account's flow editor settings for this flow again"
                (click)="flowSettings.resetCurrentFlow()"
            >
                Reset to my defaults
            </app-button>
        </div>
    }
</div>

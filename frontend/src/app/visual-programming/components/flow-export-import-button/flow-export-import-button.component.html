@if (canUseMenu()) {
    <button
        #origin="cdkOverlayOrigin"
        cdkOverlayOrigin
        type="button"
        class="feib"
        [class.feib--active]="selectedCount() > 0"
        [class.feib--open]="isOpen()"
        aria-label="Export / Import nodes"
        aria-haspopup="menu"
        [attr.aria-expanded]="isOpen()"
        [matTooltip]="keymap.withShortcut('Export / Import nodes', 'flow.export-import')"
        matTooltipPosition="below"
        (click)="toggle($event)"
    >
        <app-svg-icon
            class="feib__icon"
            icon="flow-export"
            size="10px"
        />
        @if (selectedCount() > 0) {
            <span class="feib__count">{{ selectedCount() }}</span>
        }
        <app-svg-icon
            class="feib__chevron"
            [class.feib__chevron--open]="isOpen()"
            icon="chevron-small"
            size="10px"
        />
    </button>

    <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="origin"
        [cdkConnectedOverlayOpen]="isOpen()"
        cdkConnectedOverlayPanelClass="action-dropdown-panel"
        [cdkConnectedOverlayPositions]="[
            {
                originX: 'start',
                originY: 'bottom',
                overlayX: 'start',
                overlayY: 'top',
                offsetY: 6,
            },
        ]"
        (overlayOutsideClick)="close()"
        (detach)="close()"
    >
        <!-- The focus moves in on open and back to what had it on close. Escape closes only this menu: it is handled
             here, ahead of the tooltip of the focused item, which would take the first one, and of the editor. -->
        <div
            class="action-dropdown-panel__inner"
            role="menu"
            aria-label="Export / Import nodes"
            cdkTrapFocus
            [cdkTrapFocusAutoCapture]="true"
            (keydown)="onMenuKeydown($event)"
            (keydown.escape)="onMenuEscape($event)"
        >
            @if (selectedCount() > 0) {
                <button
                    #menuItem
                    *appHasPermission="[ResourceCode.Flows, ActionCode.Export]"
                    type="button"
                    role="menuitem"
                    class="action-dropdown-panel__item"
                    matTooltip="Export Selected as JSON (Start and End nodes excluded)"
                    (click)="onExportSelectedJson()"
                >
                    Export Selected as JSON
                </button>
                @if (allSelectedAreCdt()) {
                    <button
                        #menuItem
                        *appHasPermission="[ResourceCode.Flows, ActionCode.Export]"
                        type="button"
                        role="menuitem"
                        class="action-dropdown-panel__item"
                        matTooltip="Export Selected as CSV (Start and End nodes excluded)"
                        (click)="onExportSelectedCsv()"
                    >
                        Export Selected as CSV
                    </button>
                }
                <div
                    class="action-dropdown-panel__separator"
                    role="separator"
                ></div>
            }
            <button
                #menuItem
                *appHasPermission="[ResourceCode.Flows, ActionCode.Export]"
                type="button"
                role="menuitem"
                class="action-dropdown-panel__item"
                matTooltip="Export All as JSON (Start and End nodes excluded)"
                (click)="onExportJson()"
            >
                Export All as JSON
            </button>
            <div
                class="action-dropdown-panel__separator"
                role="separator"
            ></div>
            <button
                #menuItem
                *appHasPermission="[ResourceCode.Flows, ActionCode.Update]"
                type="button"
                role="menuitem"
                class="action-dropdown-panel__item"
                matTooltip="Import"
                (click)="onImport()"
            >
                Import
            </button>
        </div>
    </ng-template>
}

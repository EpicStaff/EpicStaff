<ng-template #menuTemplate>
    <!-- The focus stays in the menu while it is open and goes back to what had it on close. Escape is handled here,
         ahead of the tooltip of the focused control, which would take the first one, and of the editor. -->
    <div
        class="context-menu dark-theme"
        role="dialog"
        aria-label="Add node"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
        (keydown.escape)="onEscape($event)"
    >
        <div class="search-container">
            <i
                class="ti ti-search"
                aria-hidden="true"
            ></i>
            <input
                #searchInput
                type="text"
                placeholder="Search..."
                aria-label="Search nodes"
                matTooltip="Search nodes"
                (input)="onSearchInput($event)"
                [value]="searchTerm()"
            />
        </div>

        @if (visibleTabs().length > 1) {
            <div class="menu-header">
                @for (item of visibleTabs(); track item.type) {
                    <button
                        type="button"
                        [class.active]="item.type === selectedMenu()"
                        [attr.aria-pressed]="item.type === selectedMenu()"
                        [matTooltip]="'Node list: ' + item.label"
                        (click)="onSelectMenu(item.type)"
                    >
                        {{ item.label }}
                    </button>
                }
            </div>
        }

        <div class="menu-content">
            @switch (selectedMenu()) {
                @case (menuTab.FLOW_CORE) {
                    <app-flow-graph-core-menu
                        [searchTerm]="searchTerm()"
                        (nodeSelected)="onNodeSelected($event)"
                    ></app-flow-graph-core-menu>
                }
                @case (menuTab.FLOWS) {
                    <app-flows-menu
                        [searchTerm]="searchTerm()"
                        [flows]="otherFlows()"
                        (nodeSelected)="onNodeSelected($event)"
                    ></app-flows-menu>
                }
            }
        </div>
    </div>
</ng-template>

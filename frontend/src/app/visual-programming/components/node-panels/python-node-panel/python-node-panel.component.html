<div class="panel-container">
    <div
        class="panel-content"
        [class.editor-fullwidth]="isFormCollapsed()"
    >
        <form
            [formGroup]="form"
            class="form-container"
        >
            <div
                class="form-layout"
                [class.expanded]="isExpanded()"
                [class.collapsed]="!isExpanded()"
                [class.form-collapsed]="isFormCollapsed()"
            >
                <!-- Form Fields (stable single instance) -->
                <div
                    #formColumn
                    class="form-fields"
                    [style.flex-basis.px]="isExpanded() ? leftColumnWidth.width() : null"
                >
                    <div class="field-isolated">
                        <app-custom-input
                            label="Node Name"
                            tooltipText="A label for this node. Names may repeat — the #N under the name identifies the node."
                            formControlName="node_name"
                            placeholder="Enter node name"
                            [activeColor]="activeColor"
                            [readonly]="isReadOnly()"
                        ></app-custom-input>
                        <app-validation-errors [control]="form.get('node_name')!" />
                    </div>

                    <div class="input-map">
                        <app-input-map
                            [activeColor]="activeColor"
                            [readonly]="isReadOnly()"
                            [showTestMode]="!isReadOnly()"
                            [testMode]="isOpenTestMode()"
                            [pythonNodeId]="node().backendId"
                            [graphId]="graphId()"
                            [nodeName]="node().node_name"
                            [nodeNumber]="node().nodeNumber"
                            [testRunning]="codeTestRun.isRunning()"
                            [testInputDirty]="testInputDirty()"
                            [runTestBlocker]="runTestBlocker()"
                            (testModeChange)="isOpenTestMode.set($event)"
                            (runTest)="onRunTest($event)"
                        ></app-input-map>
                    </div>

                    <app-node-secrets-field
                        [activeColor]="activeColor"
                        [value]="selectedSecretIds()"
                        [readonly]="!canEditSecrets()"
                        [names]="secretNames()"
                        [tooltipText]="secretsTooltip()"
                        (valueChange)="onSecretsChange($event)"
                    />

                    <app-custom-input
                        label="Output Variable Path"
                        tooltipText="The path where the output of this node will be stored in your flow variables. Leave empty if you don't need to store the output."
                        formControlName="output_variable_path"
                        placeholder="Enter output variable path (leave empty for null)"
                        [activeColor]="activeColor"
                        [readonly]="isReadOnly()"
                    ></app-custom-input>

                    <div class="form-group">
                        <app-select
                            label="Venv"
                            tooltipText="The virtual environment this Python code runs in. Leave empty to use the default environment."
                            placeholder="Select venv"
                            formControlName="venv"
                            [items]="venvItems()"
                            [grouped]="true"
                            [loading]="loadingVenvs()"
                            [readonly]="isReadOnly()"
                            (opened)="onVenvDropdownOpened()"
                            (changed)="onVenvChanged($event)"
                        />
                    </div>

                    <app-execution-timeout-field
                        [field]="executionTimeout"
                        [readonly]="isReadOnly()"
                    />

                    <app-node-storage-section
                        [readonly]="isReadOnly()"
                        [useStorage]="useStorage()"
                        (onToggleChange)="onStorageToggle($event)"
                        (onInsertCode)="insertStorageCode($event)"
                        (onRemoveCode)="removeStorageCode($event)"
                    ></app-node-storage-section>
                </div>

                @if (isExpanded()) {
                    <app-column-resize-divider
                        ariaLabel="Resize form and code editor columns"
                        [column]="formColumn"
                        [opposite]="editorColumn"
                        [(width)]="leftColumnWidth.width"
                        [defaultWidth]="leftColumnWidth.defaultWidth"
                        [collapsible]="true"
                        [minWidth]="400"
                        [(collapsed)]="isFormCollapsed"
                    />
                }

                <div
                    #editorColumn
                    class="code-editor-wrapper"
                >
                    <div class="code-editor-column">
                        <app-code-editor
                            class="code-editor-section"
                            [pythonCode]="pythonCode"
                            [secretNames]="secretNames()"
                            [inputMapKeys]="inputMapKeys()"
                            [readOnly]="isReadOnly()"
                            (pythonCodeChange)="onPythonCodeChange($event)"
                            (errorChange)="onCodeErrorChange($event)"
                        ></app-code-editor>

                        @if (isOpenTestMode() && !isReadOnly()) {
                            <app-python-terminal
                                [logs]="codeTestRun.logs()"
                                [terminalHeight]="codeTestRun.terminalHeight()"
                                [status]="codeTestRun.status()"
                                (heightChange)="codeTestRun.setTerminalHeight($event)"
                                (clearLogs)="codeTestRun.clearLogs()"
                            />
                        }
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

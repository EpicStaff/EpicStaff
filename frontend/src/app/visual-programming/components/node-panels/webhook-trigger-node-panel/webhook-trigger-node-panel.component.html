<div class="panel-container">
    <div
        class="panel-content"
        [class.editor-fullwidth]="isFormCollapsed()"
    >
        <form
            [formGroup]="form"
            class="form-container"
        >
            <div
                class="form-layout"
                [class.expanded]="isExpanded()"
                [class.collapsed]="!isExpanded()"
                [class.form-collapsed]="isFormCollapsed()"
            >
                <div
                    #formColumn
                    class="form-fields"
                    [style.flex-basis.px]="isExpanded() ? leftColumnWidth.width() : null"
                >
                    <app-custom-input
                        label="Node Name"
                        tooltipText="The unique identifier used to reference this Python node. This name must be unique within the flow."
                        formControlName="node_name"
                        placeholder="Enter node name"
                        [activeColor]="activeColor"
                        [errorMessage]="getNodeNameErrorMessage()"
                    ></app-custom-input>

                    <app-webhook-trigger-select
                        formControlName="webhook_trigger"
                        [disallowedAuthKinds]="['telegram', 'twilio']"
                        disallowedProviderMessage="This trigger is not supported for Webhook nodes. Use a trigger with webhook auth."
                        (triggerResolved)="onTriggerResolved($event)"
                    ></app-webhook-trigger-select>

                    @if (fullUrl(); as url) {
                        <div class="webhook-url-display">
                            <span
                                class="webhook-url-text"
                                [style.color]="activeColor"
                            >
                                {{ url }}
                            </span>
                            <button
                                type="button"
                                class="copy-button"
                                (click)="copyWebhookUrl()"
                                [disabled]="!url"
                                aria-label="Copy webhook URL"
                            >
                                <span
                                    class="copy-icon"
                                    aria-hidden="true"
                                ></span>
                                <span>{{ copied() ? 'Copied' : 'Copy' }}</span>
                            </button>
                        </div>
                    } @else if (webhookInvalid()) {
                        <div class="webhook-warning">Webhook is not registered. Check the trigger configuration.</div>
                    }

                    <app-node-secrets-field
                        [activeColor]="activeColor"
                        [value]="selectedSecretIds()"
                        [readonly]="!canEditSecrets()"
                        [names]="secretNames()"
                        [tooltipText]="secretsTooltip()"
                        (valueChange)="onSecretsChange($event)"
                    />

                    <app-custom-input
                        label="Libraries"
                        tooltipText="Python libraries required by this code (comma-separated). For example: requests, pandas, numpy"
                        formControlName="libraries"
                        placeholder="Enter libraries (e.g., requests, pandas, numpy)"
                        [activeColor]="activeColor"
                    ></app-custom-input>
                </div>
                @if (isExpanded()) {
                    <app-column-resize-divider
                        ariaLabel="Resize form and code editor columns"
                        [column]="formColumn"
                        [opposite]="editorColumn"
                        [(width)]="leftColumnWidth.width"
                        [defaultWidth]="leftColumnWidth.defaultWidth"
                        [collapsible]="true"
                        [minWidth]="400"
                        [(collapsed)]="isFormCollapsed"
                    />
                }

                <div
                    #editorColumn
                    class="code-editor-wrapper"
                >
                    <app-code-editor
                        class="code-editor-section"
                        [pythonCode]="pythonCode"
                        [secretNames]="secretNames()"
                        (pythonCodeChange)="onPythonCodeChange($event)"
                        (errorChange)="onCodeErrorChange($event)"
                    ></app-code-editor>
                </div>
            </div>
        </form>
    </div>
</div>

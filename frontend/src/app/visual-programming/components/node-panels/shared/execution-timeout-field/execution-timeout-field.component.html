<div class="execution-timeout">
    <app-tooltip
        label="Execution Timeout"
        [tooltipText]="tooltipText()"
        [required]="true"
    />
    <input
        #timeoutInput
        type="text"
        class="execution-timeout__input text-body"
        aria-label="Execution timeout, hh:mm:ss"
        placeholder="hh:mm:ss"
        autocomplete="off"
        spellcheck="false"
        [class.execution-timeout__input--invalid]="!!errorMessage()"
        [class.execution-timeout__input--warning]="!!aboveMaximumWarning()"
        [attr.aria-invalid]="!!errorMessage()"
        [attr.aria-describedby]="messageId"
        [disabled]="isReadOnly()"
        [value]="text()"
        (input)="onInput(timeoutInput.value)"
        (blur)="commit()"
        (keydown.enter)="commit(); $event.preventDefault()"
    />
    <div
        aria-live="polite"
        [id]="messageId"
    >
        @if (errorMessage()) {
            <small class="execution-timeout__message execution-timeout__message--error text-body-small">
                {{ errorMessage() }}
            </small>
        } @else if (aboveMaximumWarning()) {
            <small class="execution-timeout__message execution-timeout__message--warning text-body-small">
                {{ aboveMaximumWarning() }}
            </small>
        }
    </div>
</div>

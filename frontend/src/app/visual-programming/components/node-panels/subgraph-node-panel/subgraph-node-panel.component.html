<div class="panel-container">
    <div class="panel-content">
        <form
            [formGroup]="form"
            class="form-container"
        >
            <div class="field-isolated">
                <app-diff-field-mark [diffField]="'node_name'">
                    <app-custom-input
                        label="Node Name"
                        tooltipText="A label for this node. Names may repeat — the #N under the name identifies the node."
                        formControlName="node_name"
                        placeholder="Enter node name"
                        [activeColor]="activeColor"
                        [readonly]="isReadOnly()"
                    ></app-custom-input>
                </app-diff-field-mark>
                <app-validation-errors [control]="form.get('node_name')!" />
            </div>

            <div class="input-map">
                <app-input-map
                    [activeColor]="activeColor"
                    [readonly]="isReadOnly()"
                    [rowChanges]="inputMapRowChanges()"
                ></app-input-map>
            </div>

            <app-diff-field-mark [diffField]="'output_variable_path'">
                <app-custom-input
                    label="Output Variable Path"
                    tooltipText="The path where the output of this node will be stored in your flow variables. Leave empty if you don't need to store the output."
                    formControlName="output_variable_path"
                    placeholder="Enter output variable path (leave empty for null)"
                    [activeColor]="activeColor"
                    [readonly]="isReadOnly()"
                ></app-custom-input>
            </app-diff-field-mark>

            <div class="field">
                <label>
                    Selected Flow
                    <app-help-tooltip
                        text="Select the flow that this node will execute"
                        size="1rem"
                    />
                </label>
                <div class="selected-flow-row">
                    <app-diff-field-mark
                        class="select-field"
                        [diffField]="'subgraph'"
                        [diffFormat]="flowNameFormat"
                    >
                        <app-select
                            class="select-field"
                            formControlName="selectedFlowId"
                            placeholder="Select a flow"
                            [items]="flowItems()"
                            [readonly]="isReadOnly()"
                        />
                    </app-diff-field-mark>
                    <app-go-to-button
                        variant="full"
                        label="Go to flow"
                        [href]="getSelectedFlowUrl()"
                        target="_blank"
                        [disabled]="!selectedFlowExists()"
                    ></app-go-to-button>
                </div>
                <app-missing-reference-note
                    class="missing-reference-note"
                    [fields]="['subgraph']"
                />
            </div>
        </form>
    </div>
</div>

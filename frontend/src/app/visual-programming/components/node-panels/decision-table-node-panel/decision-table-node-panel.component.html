<div class="panel-container">
    <div class="panel-content">
        @if (form) {
            <form
                [formGroup]="form"
                class="form-container"
            >
                <div class="form-header">
                    <app-diff-field-mark [diffField]="'node_name'">
                        <app-custom-input
                            label="Node Name"
                            tooltipText="A label for this node. Names may repeat — the #N under the name identifies the node."
                            icon="help-circle"
                            formControlName="node_name"
                            placeholder="Enter node name"
                            [activeColor]="activeColor"
                            [errorMessage]="getNodeNameErrorMessage()"
                            [readonly]="isReadOnly()"
                        ></app-custom-input>
                    </app-diff-field-mark>

                    <app-diff-field-mark
                        [diffField]="'default_next_node'"
                        [diffFormat]="routeTargetFormat"
                    >
                        <app-select
                            label="Default Next Node"
                            tooltipText="Optional fallback branch when no condition matches"
                            placeholder="-- Select Node --"
                            formControlName="default_next_node"
                            [items]="availableNodeItems()"
                            [readonly]="isReadOnly()"
                        />
                    </app-diff-field-mark>

                    <app-diff-field-mark
                        [diffField]="'next_error_node'"
                        [diffFormat]="routeTargetFormat"
                    >
                        <app-select
                            label="Error Next Node"
                            tooltipText="Optional error branch if decision evaluation fails"
                            placeholder="-- Select Node --"
                            formControlName="next_error_node"
                            [items]="availableNodeItems()"
                            [readonly]="isReadOnly()"
                        />
                    </app-diff-field-mark>
                    <div class="convert-cdt-field">
                        <app-button
                            type="outline-primary"
                            [leftIcon]="'refresh'"
                            [disabled]="isReadOnly()"
                            (click)="convertToCdt()"
                        >
                            Convert to CDT
                        </app-button>
                    </div>
                </div>

                <div class="grid-section">
                    <app-decision-table-grid
                        [conditionGroups]="conditionGroups()"
                        [activeColor]="activeColor"
                        [currentNodeId]="node().id"
                        [readonly]="isReadOnly()"
                        [rowChanges]="rowChanges()"
                        title="Condition groups define branching paths evaluated in order"
                        (conditionGroupsChange)="onConditionGroupsChange($event)"
                    />
                    <!-- The default and error routes too: a note in the header row would break its columns. -->
                    <app-missing-reference-note
                        class="routes-missing-reference-note"
                        [fields]="routeDiffFields"
                    />
                </div>
            </form>
        }
    </div>
</div>

<button
    type="button"
    class="flow-shortcuts-btn"
    [class.flow-shortcuts-btn--active]="active()"
    matTooltip="Keyboard shortcuts"
    matTooltipPosition="right"
    (click)="clicked.emit()"
>
    <span class="flow-shortcuts-btn__icon">
        <app-svg-icon
            [icon]="icon()"
            [size]="iconSize()"
        ></app-svg-icon>
    </span>

    <span
        class="flow-shortcuts-btn__text"
        [class.flow-shortcuts-btn__text--end]="textEnd()"
        >{{ label() }}</span
    >
</button>

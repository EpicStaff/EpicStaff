<button
    type="button"
    class="flow-shortcuts-btn"
    [class.flow-shortcuts-btn--active]="active()"
    [attr.aria-label]="ariaLabel()"
    [matTooltip]="tooltip()"
    matTooltipPosition="right"
    (click)="clicked.emit()"
>
    <span
        class="flow-shortcuts-btn__icon"
        [style.translate]="'0 ' + iconOffsetY()"
    >
        <app-svg-icon
            [icon]="icon()"
            [size]="iconSize()"
        ></app-svg-icon>
    </span>
</button>

<button
    class="flow-files-btn"
    [class.flow-files-btn--active]="attachedCount() > 0"
    [appCollapseOnOverflow]="true"
    collapseOnOverflowTarget=".flow-files-btn__label"
    collapseOnOverflowClass="flow-files-btn--icon-only"
    (click)="openDialog()"
    [matTooltip]="keymap.withShortcut(isReadOnly() ? 'View flow files' : 'Add files to flow', 'flow.add-files')"
>
    <app-svg-icon
        icon="file-upload"
        size="12px"
        class="flow-files-btn__icon"
    ></app-svg-icon>
    @if (attachedCount() > 0) {
        <span class="flow-files-btn__count">{{ attachedCount() }}</span>
    } @else {
        <span class="flow-files-btn__label">{{ isReadOnly() ? 'View files' : 'Add files' }}</span>
    }
</button>

@if (label()) {
    <app-tooltip
        [required]="required()"
        [tooltipText]="tooltipText()"
        [label]="label()"
        [icon]="icon()"
    />
}

<div
    class="voice-selector"
    appClickOutside
    (appClickOutside)="isOpen = false"
    (keydown.escape)="isOpen = false"
>
    <!-- <label *ngIf="label">{{ label }}</label> -->
    <button
        type="button"
        class="selector"
        [class.disabled]="disabled()"
        [disabled]="disabled()"
        [attr.aria-expanded]="isOpen"
        [matTooltip]="label() || 'Voice'"
        (click)="toggleDropdown()"
    >
        <span class="selected-voice">{{ getSelectedVoiceName() }}</span>
        <span
            class="selector-arrow"
            [class.open]="isOpen"
        >
            <svg
                width="10"
                height="6"
                viewBox="0 0 10 6"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M1 1L5 5L9 1"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </span>
    </button>

    @if (isOpen) {
        <div class="dropdown-menu">
            @for (voice of voices(); track voice.id) {
                <button
                    type="button"
                    class="dropdown-item"
                    [class.selected]="voice.id === selectedVoice()"
                    [attr.aria-pressed]="voice.id === selectedVoice()"
                    [matTooltip]="voice.name"
                    (click)="selectVoice(voice.id)"
                >
                    <span class="dropdown-item__name">{{ voice.name }}</span>
                    @if (voice.description) {
                        <span class="dropdown-item__desc">{{ voice.description }}</span>
                    }
                </button>
            }
        </div>
    }
</div>

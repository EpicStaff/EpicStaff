<div class="template-textarea">
    @if (label()) {
        <app-tooltip
            [required]="required()"
            [tooltipText]="tooltipText()"
            [label]="label()"
            [icon]="icon()"
        />
    }

    <div
        class="template-textarea__field"
        [class.template-textarea__field--disabled]="isDisabled()"
    >
        @if (showLineNumbers()) {
            <div
                #gutterRef
                class="template-textarea__gutter"
                aria-hidden="true"
            >
                @for (n of lineNumbers(); track n) {
                    <span>{{ n }}</span>
                }
            </div>
        }

        <div class="template-textarea__editor">
            <pre
                #highlightRef
                class="template-textarea__highlight"
                aria-hidden="true"
                [innerHTML]="highlightedHtml()"
            ></pre>

            <textarea
                #textareaRef
                class="template-textarea__input"
                spellcheck="false"
                [attr.rows]="rows()"
                [placeholder]="placeholder()"
                [disabled]="isDisabled()"
                [value]="value()"
                (input)="handleInput($event)"
                (scroll)="onScroll($event)"
                (blur)="handleBlur()"
            ></textarea>

            @if (resizable() && !isDisabled()) {
                <span
                    class="template-textarea__resize-handle"
                    title="Drag to resize"
                    (pointerdown)="onResizeStart($event)"
                    (pointermove)="onResizeMove($event)"
                    (pointerup)="onResizeEnd($event)"
                    (pointercancel)="onResizeEnd($event)"
                >
                    <svg
                        width="10"
                        height="10"
                        viewBox="0 0 10 10"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M9 1L1 9M9 5L5 9"
                            stroke="currentColor"
                            stroke-width="1.25"
                            stroke-linecap="round"
                        />
                    </svg>
                </span>
            }
        </div>
    </div>
</div>

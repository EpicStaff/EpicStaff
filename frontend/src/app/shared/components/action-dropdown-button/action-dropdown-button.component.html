<div
    #origin="cdkOverlayOrigin"
    cdkOverlayOrigin
    class="adb"
    [class.adb--disabled]="disabled() || loading()"
    [style.width]="buttonWidth() === null ? 'auto' : buttonWidth() + 'px'"
    [style.min-width]="buttonWidth() === null ? '0' : buttonWidth() + 'px'"
>
    <button
        type="button"
        class="adb__main"
        [disabled]="disabled() || loading()"
        [matTooltip]="label()"
        (click)="onMainClick()"
    >
        @if (leftIcon()) {
            <app-svg-icon
                [icon]="leftIcon()!"
                size="1rem"
            />
        }
        <span>{{ label() }}</span>
    </button>
    <button
        type="button"
        class="adb__chevron"
        [disabled]="disabled() || loading()"
        aria-label="More options"
        [attr.aria-expanded]="isOpen()"
        matTooltip="More options"
        (click)="toggle($event)"
    >
        <app-svg-icon
            icon="chevron-down"
            size="1rem"
        />
    </button>
</div>

<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayWidth]="panelWidth()"
    cdkConnectedOverlayPanelClass="action-dropdown-panel"
    [cdkConnectedOverlayPositions]="[
        {
            originX: 'end',
            originY: 'bottom',
            overlayX: 'end',
            overlayY: 'top',
            offsetY: 6,
        },
    ]"
    (overlayOutsideClick)="close()"
    (detach)="close()"
>
    <div
        class="action-dropdown-panel__inner"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
    >
        @for (item of items(); track item.value) {
            <button
                type="button"
                class="action-dropdown-panel__item"
                [matTooltip]="item.label"
                (click)="onItemClick(item)"
            >
                {{ item.label }}
            </button>
        }
    </div>
</ng-template>

<button
    type="button"
    class="stop-btn"
    [class.stop-btn--stop]="variant() === 'stop'"
    [disabled]="disabled()"
    [matTooltip]="tooltip()"
    (click)="triggered.emit()"
>
    @if (variant() === 'stop') {
        <span class="stop-square"></span>
    } @else {
        <span class="stop-bar"></span>
        <span class="stop-bar"></span>
    }
</button>

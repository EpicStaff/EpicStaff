@if (label()) {
    <app-tooltip
        [required]="required()"
        [tooltipText]="tooltipText()"
        [label]="label()"
        [icon]="icon()"
    />
}

<div class="kv-list">
    @for (item of items(); track $index; let i = $index) {
        <div class="kv-list__row">
            <input
                class="kv-list__input"
                type="text"
                [class.kv-list__input--error]="hasNameError(i)"
                [placeholder]="namePlaceholder()"
                [attr.aria-label]="'Header name, row ' + (i + 1)"
                matTooltip="Header name"
                [attr.aria-invalid]="hasNameError(i)"
                [attr.aria-describedby]="hasNameError(i) ? errorId(i) : null"
                [ngModel]="item.name"
                (ngModelChange)="updateName(i, $event)"
                (blur)="onNameBlur(i)"
                [disabled]="isDisabled()"
            />
            <div class="kv-list__value-wrapper">
                <input
                    class="kv-list__input"
                    type="text"
                    [class.kv-list__input--error]="hasValueError(i)"
                    [class.kv-list__input--has-badge]="isSecretValue(item.value)"
                    [placeholder]="valuePlaceholder()"
                    [attr.aria-label]="'Header value, row ' + (i + 1)"
                    matTooltip="Header value"
                    [attr.aria-invalid]="hasValueError(i)"
                    [attr.aria-describedby]="hasValueError(i) ? errorId(i) : null"
                    [ngModel]="displayValue(item.value)"
                    (ngModelChange)="updateValue(i, $event)"
                    (keydown.escape)="closeSuggestions()"
                    (focus)="onValueFocus($event, i)"
                    [disabled]="isDisabled()"
                />
                @if (isSecretValue(item.value)) {
                    <app-svg-icon
                        class="kv-list__secret-badge"
                        icon="secret-reference"
                        width="15px"
                        height="12px"
                        ariaLabel="This value references a secret"
                    />
                }
            </div>
            <button
                type="button"
                class="kv-list__remove-btn"
                [class.kv-list__remove-btn--hidden]="isSpareRow(i)"
                matTooltip="Remove"
                [attr.aria-label]="'Remove header, row ' + (i + 1)"
                matTooltipPosition="above"
                (click)="removeCard(i)"
                [disabled]="isDisabled()"
            >
                <i class="ti ti-x"></i>
            </button>
        </div>
        @if (rowErrors()[i]; as error) {
            <div
                class="kv-list__error-message"
                [id]="errorId(i)"
            >
                {{ error }}
            </div>
        }
    }
</div>

<ng-template #suggestionsTemplate>
    <div
        class="kv-list__suggestions"
        (mousedown)="$event.preventDefault()"
    >
        @for (item of activeSuggestions(); track item.value) {
            <button
                type="button"
                class="kv-list__suggestion-item"
                [matTooltip]="item.name"
                (click)="selectSuggestion(item)"
            >
                {{ item.name }}
            </button>
        } @empty {
            <div class="kv-list__suggestions-empty">No secrets found</div>
        }
    </div>
</ng-template>

@if (label()) {
    <app-tooltip
        [required]="required()"
        [tooltipText]="tooltipText()"
        [label]="label()"
        [icon]="icon()"
    />
}

<div class="kv-list">
    <div class="kv-list__row">
        <input
            class="kv-list__input"
            type="text"
            [class.kv-list__input--error]="draftError()"
            [placeholder]="namePlaceholder()"
            [ngModel]="draftName()"
            (ngModelChange)="updateDraftName($event)"
            (keydown)="handleKeydown($event)"
            [disabled]="isDisabled()"
        />
        <div class="kv-list__value-wrapper">
            <input
                class="kv-list__input"
                type="text"
                [placeholder]="valuePlaceholder()"
                [ngModel]="displayValue(draftValue())"
                (ngModelChange)="updateDraftValue($event)"
                (keydown)="handleKeydown($event)"
                (keydown.escape)="closeSuggestions()"
                (focus)="onValueFocus($event, 'draft')"
                [disabled]="isDisabled()"
            />
        </div>
        <button
            type="button"
            class="kv-list__add-btn"
            matTooltip="Add"
            matTooltipPosition="above"
            (click)="confirm()"
            [disabled]="isDisabled() || !draftName().trim() || draftRowError() !== null"
        >
            <i class="ti ti-plus"></i>
        </button>
    </div>

    @if (draftError(); as error) {
        <div class="kv-list__error-message">{{ error }}</div>
    }

    @for (item of items(); track $index; let i = $index) {
        <div class="kv-list__row">
            <input
                class="kv-list__input"
                type="text"
                [class.kv-list__input--error]="rowErrors()[i]"
                [ngModel]="item.name"
                (ngModelChange)="updateName(i, $event)"
                (blur)="onNameBlur(i)"
                [disabled]="isDisabled()"
            />
            <div class="kv-list__value-wrapper">
                <input
                    class="kv-list__input"
                    type="text"
                    [class.kv-list__input--has-badge]="isSecretValue(item.value)"
                    [ngModel]="displayValue(item.value)"
                    (ngModelChange)="updateValue(i, $event)"
                    (keydown.escape)="closeSuggestions()"
                    (focus)="onValueFocus($event, i)"
                    [disabled]="isDisabled()"
                />
                @if (isSecretValue(item.value)) {
                    <app-svg-icon
                        class="kv-list__secret-badge"
                        icon="secret-reference"
                        width="15px"
                        height="12px"
                        ariaLabel="This value references a secret"
                    />
                }
            </div>
            <button
                type="button"
                class="kv-list__remove-btn"
                matTooltip="Remove"
                matTooltipPosition="above"
                (click)="removeCard(i)"
                [disabled]="isDisabled()"
            >
                <i class="ti ti-x"></i>
            </button>
        </div>
        @if (rowErrors()[i]; as error) {
            <div class="kv-list__error-message">{{ error }}</div>
        }
    }
</div>

<ng-template #suggestionsTemplate>
    <div
        class="kv-list__suggestions"
        (mousedown)="$event.preventDefault()"
    >
        @for (item of activeSuggestions(); track item.value) {
            <button
                type="button"
                class="kv-list__suggestion-item"
                (click)="selectSuggestion(item)"
            >
                {{ item.name }}
            </button>
        } @empty {
            <div class="kv-list__suggestions-empty">No secrets found</div>
        }
    </div>
</ng-template>

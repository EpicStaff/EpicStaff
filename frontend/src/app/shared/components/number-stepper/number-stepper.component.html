<div
    class="number-stepper"
    [class]="'number-stepper--' + size()"
>
    @if (label()) {
        <app-tooltip
            [tooltipText]="tooltipText()"
            [label]="label()"
        />
    }

    <div
        class="number-stepper__control"
        [class]="'number-stepper__control--' + size()"
        [class.number-stepper__control--error]="hasError() && !readonly()"
        [class.number-stepper__control--readonly]="readonly()"
        (mouseenter)="hovered.set(true)"
        (mouseleave)="hovered.set(false)"
    >
        @if (showButtons()) {
            <button
                type="button"
                class="number-stepper__btn number-stepper__btn--minus"
                [class]="'number-stepper__btn--' + size()"
                aria-label="Decrease"
                matTooltip="Decrease"
                tabindex="-1"
                (mousedown)="onStepDown(); $event.preventDefault()"
                [disabled]="isDisabled() || !canStepDown()"
            >
                <app-svg-icon
                    icon="minus-fit"
                    [size]="stepIconSize()"
                />
            </button>
        }

        <input
            [type]="integer() ? 'text' : 'number'"
            [attr.inputmode]="integer() ? 'numeric' : null"
            [attr.aria-label]="ariaLabel()"
            [matTooltip]="fieldName()"
            class="number-stepper__input"
            [class]="'number-stepper__input--' + size()"
            [placeholder]="placeholder()"
            [value]="displayValue()"
            (input)="onInputChange($event)"
            (keydown)="onKeyDown($event)"
            (blur)="onBlur()"
            [disabled]="isDisabled()"
            [readonly]="readonly()"
        />

        @if (showButtons()) {
            <button
                type="button"
                class="number-stepper__btn number-stepper__btn--plus"
                [class]="'number-stepper__btn--' + size()"
                aria-label="Increase"
                matTooltip="Increase"
                tabindex="-1"
                (mousedown)="onStepUp(); $event.preventDefault()"
                [disabled]="isDisabled() || !canStepUp()"
            >
                <app-svg-icon
                    icon="plus-fit"
                    [size]="stepIconSize()"
                />
            </button>
        }
    </div>

    @if (hasError() && errorMessage() && !readonly()) {
        <div class="number-stepper__error">{{ errorMessage() }}</div>
    }
</div>

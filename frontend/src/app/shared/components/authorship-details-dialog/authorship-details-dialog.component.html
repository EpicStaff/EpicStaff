<div class="authorship-details-dialog">
    <div class="authorship-details-dialog__header">
        <h2
            class="authorship-details-dialog__title"
            [id]="data.titleId"
        >
            {{ data.title }}
        </h2>
        <button
            class="authorship-details-dialog__close"
            type="button"
            aria-label="Close dialog"
            matTooltip="Close"
            matTooltipPosition="above"
            (click)="close()"
        >
            <app-svg-icon
                icon="x"
                size="1.25rem"
            />
        </button>
    </div>

    <div class="authorship-details-dialog__content">
        <app-authorship-details
            [owner]="data.created_by"
            [createdAt]="data.created_at"
            [lastEditor]="data.last_edited_by"
            [lastEditedAt]="data.last_edited_at"
        />

        @if (data.extraContent; as extraContent) {
            <div class="authorship-details-dialog__extra">
                <ng-container
                    [ngComponentOutlet]="extraContent.component"
                    [ngComponentOutletInputs]="extraContentInputs"
                />
            </div>
        }
    </div>
</div>

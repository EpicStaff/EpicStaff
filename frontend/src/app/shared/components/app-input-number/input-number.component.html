@if (label()) {
    <app-tooltip
        [required]="required()"
        [tooltipText]="tooltipText()"
        [label]="label()"
        [icon]="icon()"
    />
}

<div
    class="input__wrapper"
    [class.input__wrapper--invalid]="isInvalid()"
    [class.input__wrapper--warning]="isAboveWarning()"
    [class.input__wrapper--disabled]="isDisabled()"
    (mouseenter)="hovered.set(true)"
    (mouseleave)="hovered.set(false)"
    (focusin)="focusWithin.set(true)"
    (focusout)="onFocusOut($event)"
>
    @if (stepsShown()) {
        <button
            type="button"
            class="input__step input__step--minus"
            aria-label="Decrease"
            matTooltip="Decrease"
            [disabled]="isDisabled()"
            [attr.aria-disabled]="!canStepDown()"
            (mousedown)="$event.preventDefault()"
            (click)="onStep(-1)"
        >
            −
        </button>
    }

    <input
        #nativeInput
        type="number"
        class="input"
        [ngClass]="'input--mod-' + mod()"
        [placeholder]="placeholder()"
        [attr.aria-label]="ariaLabel() || null"
        [matTooltip]="fieldName()"
        [ngModel]="value()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="onInputChange($event)"
        (blur)="onTouched()"
        (keydown)="onKeyDown($event)"
        [disabled]="isDisabled()"
        [attr.aria-invalid]="isInvalid()"
        [attr.aria-describedby]="message() ? messageId : null"
    />

    @if (stepsShown()) {
        <button
            type="button"
            class="input__step input__step--plus"
            aria-label="Increase"
            matTooltip="Increase"
            [disabled]="isDisabled()"
            [attr.aria-disabled]="!canStepUp()"
            (mousedown)="$event.preventDefault()"
            (click)="onStep(1)"
        >
            +
        </button>
    }
</div>

@if (message()) {
    <small
        class="input__message"
        [class.input__message--error]="isInvalid()"
        [class.input__message--warning]="!isInvalid()"
        [id]="messageId"
        >{{ message() }}</small
    >
}

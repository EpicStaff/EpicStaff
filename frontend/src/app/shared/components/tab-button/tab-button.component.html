<button
    appContentText
    #label="appContentText"
    class="tab-btn"
    [class.active]="active"
    [class.disabled]="disabled"
    [ngClass]="mod"
    [disabled]="disabled"
    [attr.aria-pressed]="active"
    [attr.aria-describedby]="describedBy()"
    [matTooltip]="label.text()"
    (click)="onAction($event)"
    type="button"
>
    <ng-content></ng-content>
    <span class="tab-btn__label"><ng-content></ng-content></span>
</button>

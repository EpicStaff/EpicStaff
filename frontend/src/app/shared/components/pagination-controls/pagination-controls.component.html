<!-- pagination-controls.component.html -->
<nav
    class="pagination"
    aria-label="Pagination"
>
    <button
        class="page-btn nav"
        (click)="prev()"
        [disabled]="currentPage === 1"
        aria-label="Previous page"
    >
        <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
        >
            <path
                d="M15 6l-6 6 6 6"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>
    </button>

    <ul class="page-list">
        <li
            *ngFor="let p of pages"
            [class.ellipsis]="p === '…'"
        >
            <ng-container *ngIf="p !== '…'; else dots">
                <button
                    class="page-btn"
                    [class.active]="p === currentPage"
                    (click)="goTo(p)"
                >
                    {{ p }}
                </button>
            </ng-container>
            <ng-template #dots>
                <span class="dots">…</span>
            </ng-template>
        </li>
    </ul>

    <button
        class="page-btn nav"
        (click)="next()"
        [disabled]="currentPage === totalPages"
        aria-label="Next page"
    >
        <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
        >
            <path
                d="M9 6l6 6-6 6"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>
    </button>
</nav>

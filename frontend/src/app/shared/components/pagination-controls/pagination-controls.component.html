<!-- pagination-controls.component.html -->
<nav
    class="pagination"
    aria-label="Pagination"
>
    <button
        type="button"
        class="page-btn nav"
        (click)="prev()"
        [disabled]="currentPage === 1"
        aria-label="Previous page"
        matTooltip="Previous page"
    >
        <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
        >
            <path
                d="M15 6l-6 6 6 6"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>
    </button>

    <ul class="page-list">
        @for (p of pages; track p) {
            <li [class.ellipsis]="p === '…'">
                @if (p !== '…') {
                    <button
                        type="button"
                        class="page-btn"
                        [class.active]="p === currentPage"
                        [attr.aria-current]="p === currentPage ? 'page' : null"
                        [attr.aria-label]="'Page ' + p"
                        [matTooltip]="'Page ' + p"
                        (click)="goTo(p)"
                    >
                        {{ p }}
                    </button>
                } @else {
                    <span class="dots">…</span>
                }
            </li>
        }
    </ul>

    <button
        type="button"
        class="page-btn nav"
        (click)="next()"
        [disabled]="currentPage === totalPages"
        aria-label="Next page"
        matTooltip="Next page"
    >
        <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
        >
            <path
                d="M9 6l6 6-6 6"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>
    </button>
</nav>

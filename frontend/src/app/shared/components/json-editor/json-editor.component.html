<!-- Editor Header -->
<div
    *ngIf="showHeader"
    class="editor-header"
>
    <div class="left-section">
        <span class="editor-title">
            <app-svg-icon
                icon="brackets"
                size="1.2rem"
                class="json-icon"
            />
            {{ title }}
        </span>
        <span
            class="editor-subtitle"
            *ngIf="subtitle"
        >
            {{ subtitle }}
        </span>
        <span
            class="validation-message"
            *ngIf="!jsonIsValid"
        >
            Invalid JSON format
        </span>
    </div>
    <div class="right-section">
        @if (collapsible) {
            <app-svg-icon
                class="action-icon"
                [icon]="collapsed ? 'preview' : 'preview-hidden'"
                size="1rem"
                [matTooltip]="collapsed ? 'Show editor' : 'Hide editor'"
                matTooltipPosition="above"
                (click)="onToggle()"
            />
        }
        @if (allowCopy) {
            <app-svg-icon
                class="action-icon"
                icon="copy"
                size="1rem"
                matTooltip="Copy to clipboard"
                matTooltipPosition="above"
                (click)="onCopy()"
            />
        }
        @if (allowExpand) {
            <app-svg-icon
                class="action-icon"
                icon="editor-expand"
                size="0.875rem"
                (click)="onExpand()"
            />
        }
    </div>
</div>

<!-- Editor Container -->
<div
    class="editor-container"
    [class.collapsed]="collapsible && collapsed"
    [class.expanded]="collapsible && !collapsed"
    [class.has-example]="showExampleHint"
    #editorContainer
>
    @if (!collapsible || !collapsed) {
        @if (showExampleHint) {
            <div class="example-block">
                <button
                    type="button"
                    class="example-block__toggle"
                    [attr.aria-expanded]="!exampleCollapsed"
                    [attr.aria-label]="exampleCollapsed ? 'Show example' : 'Hide example'"
                    (click)="onToggleExample()"
                >
                    <app-svg-icon
                        class="example-block__chevron"
                        [class.example-block__chevron--open]="!exampleCollapsed"
                        icon="chevron-down-filled"
                        size="8px"
                    />
                    <span class="example-block__caption">Example</span>
                </button>
                @if (!exampleCollapsed) {
                    <pre
                        class="example-block__code"
                        tabindex="-1"
                        [style.fontFamily]="hintFontFamily"
                        [style.fontSize.px]="hintFontSize"
                        >{{ exampleHint }}</pre
                    >
                }
            </div>
        }

        <ngx-monaco-editor
            [options]="editorOptions"
            [(ngModel)]="jsonData"
            (ngModelChange)="onJsonChange($event)"
            (onInit)="onEditorInit($event)"
            class="monaco-editor"
            [class.shrink-for-example]="showExampleHint && fullHeight"
            [style.height]="showExampleHint && fullHeight ? null : fullHeight ? '100%' : editorHeight + 'px'"
        ></ngx-monaco-editor>
    }

    <!-- Loading Overlay -->
    <div
        class="editor-loading-overlay"
        *ngIf="!editorLoaded"
    >
        <div class="spinner"></div>
        <span>Loading editor...</span>
    </div>
</div>

<!-- Resize Handle with the directive -->
<div
    class="editor-resize-handle"
    appResizable
    (heightChange)="onResize($event)"
    *ngIf="!fullHeight"
>
    <div class="little-handle"></div>
</div>

@if (firstLabel() && secondLabel()) {
    <div class="tooltip-container">
        <app-tooltip
            [required]="firstRequired()"
            [tooltipText]="firstTooltipText()"
            [label]="firstLabel()"
            [icon]="icon()"
            [inline]="true"
        />

        <app-tooltip
            [required]="secondRequired()"
            [tooltipText]="secondTooltipText()"
            [label]="secondLabel()"
            [icon]="icon()"
            [inline]="true"
        />
    </div>
}
<div class="dual-slider">
    @if (disabled()) {
        <span class="dual-slider__readonly-value">{{ firstPercentLabel() }}</span>
    } @else {
        <div class="controls">
            <button
                type="button"
                class="btn"
                [attr.aria-label]="'Decrease ' + firstName()"
                [matTooltip]="'Decrease ' + firstName()"
                (click)="onFirstStepDown()"
                [disabled]="firstValue() <= min()"
            >
                <svg
                    width="10"
                    height="2"
                    viewBox="0 0 10 2"
                    fill="none"
                >
                    <path
                        d="M0 1H10"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />
                </svg>
            </button>

            <span class="value">{{ firstDisplayValue() }}</span>

            <button
                type="button"
                class="btn"
                [attr.aria-label]="'Increase ' + firstName()"
                [matTooltip]="'Increase ' + firstName()"
                (click)="onFirstStepUp()"
                [disabled]="firstValue() >= max()"
            >
                <svg
                    width="10"
                    height="10"
                    viewBox="0 0 10 10"
                    fill="none"
                >
                    <path
                        d="M5 0V10M0 5H10"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />
                </svg>
            </button>
        </div>
    }
    <div class="track">
        <input
            type="range"
            class="slider left-slider"
            [attr.aria-label]="firstName()"
            [matTooltip]="firstName()"
            [class.active]="activeThumb() === 'left'"
            [style.--slider-percentage]="firstPercentage() + '%'"
            [min]="min()"
            [max]="max()"
            [step]="step()"
            [ngModel]="firstValue()"
            [disabled]="disabled()"
            (input)="updateFirst($any($event.target).valueAsNumber)"
            (mousedown)="activeThumb.set('left')"
            (focus)="activeThumb.set('left')"
        />

        <input
            type="range"
            class="slider right-slider"
            [attr.aria-label]="secondName()"
            [matTooltip]="secondName()"
            [class.active]="activeThumb() === 'right'"
            [style.--slider-percentage]="secondPercentage() + '%'"
            [min]="min()"
            [max]="max()"
            [step]="step()"
            [ngModel]="secondValue()"
            [disabled]="disabled()"
            (input)="updateSecond($any($event.target).valueAsNumber)"
            (mousedown)="activeThumb.set('right')"
            (focus)="activeThumb.set('right')"
        />
    </div>
    @if (disabled()) {
        <span class="dual-slider__readonly-value">{{ secondPercentLabel() }}</span>
    } @else {
        <div class="controls">
            <button
                type="button"
                class="btn"
                [attr.aria-label]="'Decrease ' + secondName()"
                [matTooltip]="'Decrease ' + secondName()"
                (click)="onSecondStepDown()"
                [disabled]="secondValue() <= min()"
            >
                <svg
                    width="10"
                    height="2"
                    viewBox="0 0 10 2"
                    fill="none"
                >
                    <path
                        d="M0 1H10"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />
                </svg>
            </button>

            <span class="value">{{ secondDisplayValue() }}</span>

            <button
                type="button"
                class="btn"
                [attr.aria-label]="'Increase ' + secondName()"
                [matTooltip]="'Increase ' + secondName()"
                (click)="onSecondStepUp()"
                [disabled]="secondValue() >= max()"
            >
                <svg
                    width="10"
                    height="10"
                    viewBox="0 0 10 10"
                    fill="none"
                >
                    <path
                        d="M5 0V10M0 5H10"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />
                </svg>
            </button>
        </div>
    }
</div>

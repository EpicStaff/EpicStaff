<app-grouped-picker
    [groups]="groups()"
    [selected]="selectedKey()"
    [placeholder]="placeholder()"
    [label]="label()"
    [icon]="icon()"
    [required]="required()"
    [tooltipText]="tooltipText()"
    [disabled]="isDisabled()"
    [loading]="modelsResource.isLoading()"
    loadingText="Loading providers and models..."
    emptyTitle="Model not found"
    emptyText="Please find a provider to add the LLM"
    emptyGroupText='No visible models. Click "Add model" to manage visibility.'
    [groupActionTemplate]="addModel"
    [itemSuffixTemplate]="modelActions"
    [triggerSuffixTemplate]="deprecatedBadge"
    (picked)="selectModel($event.model, $event.provider)"
    (closed)="onTouched()"
/>

@if (isSelectedModelDeprecated()) {
    <div class="llm-selector__deprecated-banner">
        The model {{ selectedModelInfo()!.model.name }} is deprecated and can no longer be used in new configurations.
    </div>
}

<ng-template #deprecatedBadge>
    @if (isSelectedModelDeprecated()) {
        <span class="llm-selector__deprecated">
            <app-svg-icon
                icon="warning"
                size="12px"
                aria-hidden="true"
            />
            <span>Deprecated</span>
        </span>
    }
</ng-template>

<ng-template
    #addModel
    let-group
>
    <app-button
        type="primary"
        mod="small"
        (click)="openAllModelsModal(group.provider)"
    >
        + Add model
    </app-button>
</ng-template>

<ng-template
    #modelActions
    let-item
>
    @if (item.disabled) {
        <span class="llm-selector__model-deprecated">Deprecated</span>
    }
    @if (item.model.is_custom) {
        <app-icon-button
            icon="edit"
            size="2rem"
            tooltip="Edit model"
            (click)="openEditModal(item.model, item.provider); $event.stopPropagation()"
        />
    }
</ng-template>

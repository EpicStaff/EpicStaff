<div class="create-model">
    <div class="create-model__header">
        <h3 class="create-model__title">{{ isEditMode ? 'Edit LLM Model' : 'Add LLM Model' }}</h3>
        <button
            type="button"
            class="create-model__close-btn"
            matTooltip="Close"
            matTooltipPosition="above"
            (click)="onClose()"
        >
            <app-svg-icon
                icon="x"
                size="0.875rem"
            />
        </button>
    </div>

    <div
        class="create-model__content"
        [formGroup]="form"
    >
        <div class="create-model__field">
            <app-tooltip
                [required]="true"
                [label]="'Provider'"
            />
            <div class="create-model__provider">
                <app-svg-icon
                    [icon]="getProviderIcon(provider.name)"
                    size="1rem"
                />
                <span>{{ provider.name | uppercase }}</span>
            </div>
        </div>

        <div class="create-model__field">
            <app-custom-input
                placeholder="Enter model name"
                label="Model Name"
                [required]="true"
                formControlName="name"
            />
            <app-validation-errors [control]="form.get('name')!" />
        </div>

        <div class="create-model__field">
            <app-custom-input
                label="Base URL"
                tooltipText="Custom API endpoint for this provider. Leave empty to use the default."
                placeholder="e.g. https://api.openai.com/v1"
                formControlName="baseUrl"
            />
            <app-validation-errors [control]="form.get('baseUrl')!" />
        </div>

        <div class="create-model__field">
            <app-custom-input
                label="Deployment"
                tooltipText="The deployment name for this model, used by providers such as Azure OpenAI that deploy models under a custom name."
                placeholder="Enter deployment name"
                formControlName="deploymentId"
            />
        </div>

        <div class="create-model__field">
            <app-custom-input
                label="API Version"
                tooltipText="The provider's API version to target, in YYYY-MM-DD format (required for Azure OpenAI)."
                placeholder="e.g. 2024-10-21"
                formControlName="apiVersion"
            />
        </div>

        <div class="create-model__field create-model__field--inline">
            <app-toggle-switch
                label="Visible"
                formControlName="isVisible"
            />
        </div>
    </div>

    <div class="create-model__footer">
        <app-button
            type="ghost"
            (click)="onClose()"
            [disabled]="isSubmitting()"
        >
            Cancel
        </app-button>
        <app-button
            type="primary"
            (click)="onSubmit()"
            [disabled]="form.invalid || isSubmitting()"
        >
            {{ isSubmitting() ? (isEditMode ? 'Saving...' : 'Adding...') : isEditMode ? 'Save Changes' : 'Add Model' }}
        </app-button>
    </div>
</div>

@if (label()) {
    <app-tooltip
        [required]="required()"
        [tooltipText]="tooltipText()"
        [label]="label()"
        [icon]="icon()"
    />
}

<div class="wrapper">
    @if (!readOnly()) {
        <div class="input">
            <app-custom-input
                [placeholder]="activePlaceholder()"
                [ariaLabel]="label()"
                [formControl]="inputControl"
                (keydown)="onKeydown($event)"
            />

            <button
                type="button"
                class="input-icon"
                [class.disabled]="inputControl.invalid"
                [attr.aria-disabled]="inputControl.invalid || null"
                [attr.aria-label]="addButtonTooltip()"
                [matTooltip]="addButtonTooltip()"
                (click)="onAdd()"
            >
                <app-svg-icon
                    icon="plus"
                    size="1.5rem"
                />
            </button>
        </div>
        <app-validation-errors [control]="inputControl" />

        @if (showSeparatorToggle()) {
            <label class="separator-toggle">
                <app-checkbox
                    [checked]="separatorEnabled()"
                    (changed)="separatorEnabled.set($event)"
                />
                <span>{{ separatorLabel() }}</span>
            </label>
        }
    }

    @if (readOnly() && value().length === 0) {
        <span class="chips-empty">No libraries</span>
    }

    <div class="chips">
        @for (item of value(); track $index; let i = $index) {
            <div class="chip">
                {{ item }}
                @if (!readOnly()) {
                    <button
                        type="button"
                        class="action"
                        [attr.aria-label]="'Remove ' + item"
                        matTooltip="Remove"
                        (click)="onRemove(i)"
                    >
                        <app-svg-icon
                            icon="close"
                            size="1.25rem"
                        />
                    </button>
                }
            </div>
        }
    </div>
</div>

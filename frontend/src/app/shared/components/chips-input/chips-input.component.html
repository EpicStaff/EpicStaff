@if (label()) {
    <app-tooltip
        [required]="required()"
        [tooltipText]="tooltipText()"
        [label]="label()"
        [icon]="icon()"
    />
}

<div class="wrapper">
    @if (!readOnly()) {
        <div class="input">
            <app-custom-input
                [placeholder]="activePlaceholder()"
                [formControl]="inputControl"
                (keydown)="onKeydown($event)"
            />

            <app-svg-icon
                class="input-icon"
                [class.disabled]="inputControl.invalid"
                icon="plus"
                size="1.5rem"
                [matTooltip]="addButtonTooltip()"
                matTooltipPosition="above"
                (click)="onAdd()"
            />
        </div>
        <app-validation-errors [control]="inputControl" />

        @if (showSeparatorToggle()) {
            <label class="separator-toggle">
                <app-checkbox
                    [checked]="separatorEnabled()"
                    (changed)="separatorEnabled.set($event)"
                />
                <span>{{ separatorLabel() }}</span>
            </label>
        }
    }

    @if (readOnly() && value().length === 0) {
        <span class="chips-empty">No libraries</span>
    }

    <div class="chips">
        @for (item of value(); track $index; let i = $index) {
            <div class="chip">
                {{ item }}
                @if (!readOnly()) {
                    <app-svg-icon
                        class="action"
                        icon="close"
                        size="1.25rem"
                        (click)="onRemove(i)"
                    />
                }
            </div>
        }
    </div>
</div>

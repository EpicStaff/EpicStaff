<button
    #triggerBtn
    class="tz-selector__btn"
    type="button"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    [disabled]="isDisabled()"
    [class.tz-selector__btn--open]="open()"
    [class.tz-selector__btn--placeholder]="!selectedValue()"
    [class.tz-selector__btn--readonly]="readonly()"
    (click)="toggle()"
>
    <span class="tz-selector__text">{{ selectedOption()?.displayLabel ?? selectedValue() ?? 'Select timezone' }}</span>
    @if (!readonly()) {
        <svg
            class="tz-selector__chevron"
            [class.tz-selector__chevron--open]="open()"
            width="16"
            height="16"
            viewBox="0 0 24 24"
        >
            <path
                d="M6 9l6 6 6-6"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
            />
        </svg>
    }
</button>

<ng-template #dropdownTemplate>
    <div class="tz-selector__dropdown">
        <div class="tz-selector__search-wrap">
            <input
                #searchInput
                class="tz-selector__search"
                type="text"
                placeholder="Search timezone..."
                role="combobox"
                aria-autocomplete="list"
                aria-expanded="true"
                [attr.aria-controls]="listId"
                [attr.aria-activedescendant]="activeIndex() < 0 ? null : optionId(activeIndex())"
                [ngModel]="searchQuery()"
                (ngModelChange)="onSearchChange($event)"
                (keydown)="onSearchKeydown($event)"
            />
        </div>
        <div
            class="tz-selector__list"
            role="listbox"
            aria-label="Timezones"
            [id]="listId"
        >
            @for (tz of filteredOptions(); track tz.iana; let index = $index) {
                <div
                    class="tz-selector__option"
                    role="option"
                    [id]="optionId(index)"
                    [attr.aria-selected]="index === activeIndex()"
                    [class.tz-selector__option--selected]="tz.iana === selectedValue()"
                    [class.tz-selector__option--active]="index === activeIndex()"
                    (click)="onSelect(tz)"
                >
                    <span class="tz-selector__iana">{{ tz.iana }}</span>
                    <span class="tz-selector__offset">{{ tz.offsetLabel }}</span>
                </div>
            }
            @if (!filteredOptions().length) {
                <div class="tz-selector__empty">No timezones found</div>
            }
        </div>
    </div>
</ng-template>

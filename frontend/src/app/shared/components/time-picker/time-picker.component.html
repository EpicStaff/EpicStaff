@if (label()) {
    <app-tooltip
        [required]="required()"
        [tooltipText]="tooltipText()"
        [label]="label()"
    />
}

<div class="time-picker">
    <div
        class="time-picker__trigger"
        #triggerEl
        [class.time-picker__trigger--open]="isOpen()"
        [class.time-picker__trigger--disabled]="isDisabled()"
        [class.time-picker__trigger--readonly]="readonly()"
        [class.time-picker__trigger--error]="errorMessage() && !readonly()"
        [style.--active-color]="activeColor()"
    >
        <i class="ti ti-clock time-picker__icon"></i>
        <div class="time-picker__time-group">
            <input
                #timeInputEl
                class="time-picker__input"
                [placeholder]="placeholder()"
                [attr.aria-label]="fieldName()"
                [matTooltip]="fieldName()"
                [disabled]="isDisabled()"
                [readonly]="readonly()"
                [ngModel]="timeInput()"
                (ngModelChange)="onTimeInput($event)"
                (click)="$event.stopPropagation()"
                (keydown.enter)="onEnterKey()"
            />
        </div>
        @if (!readonly()) {
            <button
                type="button"
                class="time-picker__chevron-btn"
                aria-label="Choose time"
                matTooltip="Choose time"
                [attr.aria-expanded]="isOpen()"
                [disabled]="isDisabled()"
                (click)="$event.stopPropagation(); toggleDropdown()"
            >
                <svg
                    class="time-picker__chevron"
                    [class.time-picker__chevron--open]="isOpen()"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                >
                    <path
                        d="M6 9l6 6 6-6"
                        stroke="currentColor"
                        stroke-width="2"
                        fill="none"
                        stroke-linecap="round"
                    />
                </svg>
            </button>
        }
    </div>
</div>

@if (errorMessage() && !readonly()) {
    <div class="time-picker__error">{{ errorMessage() }}</div>
}

<ng-template #dropdownTemplate>
    <div
        class="time-picker__dropdown"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
        [style.--active-color]="activeColor()"
    >
        <div class="time-picker__slots">
            @for (slot of filteredSlots(); track slot) {
                <button
                    type="button"
                    class="time-picker__option"
                    [class.time-picker__option--selected]="slot === timeInput()"
                    [attr.aria-pressed]="slot === timeInput()"
                    [matTooltip]="slot"
                    (click)="selectSlot(slot)"
                >
                    {{ slot }}
                </button>
            }
        </div>
    </div>
</ng-template>

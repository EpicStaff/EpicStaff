<div class="color-picker-wrapper">
    <button
        #triggerButton
        type="button"
        class="color-trigger-btn"
        cdkOverlayOrigin
        #trigger="cdkOverlayOrigin"
        aria-haspopup="listbox"
        [attr.aria-expanded]="isOpen()"
        (click)="toggle($event)"
        title="Select color"
    >
        <span
            class="color-dot"
            [style.background]="currentOption.circleBg"
        ></span>
        <svg
            class="chevron"
            [class.rotated]="isOpen()"
            width="10"
            height="10"
            viewBox="0 0 12 12"
            fill="none"
        >
            <path
                d="M2 4L6 8L10 4"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>
    </button>

    <!-- An overlay, so a scrolling container around the picker (e.g. a dropdown list) cannot clip it. -->
    <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="trigger"
        [cdkConnectedOverlayOpen]="isOpen()"
        [cdkConnectedOverlayPositions]="positions"
        (attach)="onPanelAttached()"
        (detach)="isOpen.set(false)"
        (overlayKeydown)="onPanelKeydown($event)"
        (overlayOutsideClick)="onOutsideClick($event)"
    >
        <div
            class="color-options-panel"
            role="listbox"
            aria-label="Color"
            (click)="$event.stopPropagation()"
        >
            @for (option of colorOptions; track option.id) {
                <button
                    #optionButton
                    type="button"
                    role="option"
                    tabindex="-1"
                    class="color-option-btn"
                    [class.selected]="option.id === currentOption.id"
                    [attr.aria-selected]="option.id === currentOption.id"
                    [attr.aria-label]="option.id"
                    [title]="option.id"
                    (click)="select(option, $event)"
                >
                    <span
                        class="color-dot"
                        [style.background]="option.circleBg"
                    ></span>
                    <span
                        class="aa-preview"
                        [style.background]="option.chipBg"
                        [style.color]="option.chipColor"
                        >Aa</span
                    >
                </button>
            }
        </div>
    </ng-template>
</div>

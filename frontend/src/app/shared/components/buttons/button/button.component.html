<button
    #button
    [appCollapseOnOverflow]="collapseEnabled"
    [collapseOnOverflowTarget]="'.btn-content'"
    [collapseOnOverflowClass]="'btn--only-icon'"
    [collapseOnOverflowCheckExternalClip]="true"
    (collapseOnOverflowChange)="onCollapseChange($event)"
    [ngClass]="[
        'btn',
        'btn-' + type,
        leftIcon ? 'btn--icon-left-' + mod : '',
        rightIcon ? 'btn--icon-right-' + mod : '',
        shouldCollapseToIcon ? 'btn--only-icon' : '',
        'btn--mod-' + mod,
    ]"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabelAttribute()"
    [attr.aria-describedby]="ariaDescribedby()"
    [attr.aria-disabled]="ariaDisabled() || null"
    [matTooltip]="tooltipText()"
    [matTooltipDisabled]="!showsOwnTooltip()"
    type="button"
    (click)="stopClickWhileAriaDisabled($event)"
    (focus)="showHostTooltipOnKeyboardFocus()"
    (blur)="hideHostTooltip()"
>
    @if (type === 'icon') {
        @if (leftIcon) {
            <app-svg-icon
                [icon]="leftIcon!"
                [size]="iconSize"
                [width]="iconWidth"
                class="btn-icon left"
                [ngStyle]="leftIconColor ? { color: leftIconColor } : null"
            />
        }
        @if (rightIcon) {
            <app-svg-icon
                [icon]="rightIcon!"
                [size]="iconSize"
                [width]="iconWidth"
                class="btn-icon right"
                [ngStyle]="rightIconColor ? { color: rightIconColor } : null"
            />
        }
    } @else {
        @if (showLeftIcon) {
            <app-svg-icon
                [icon]="leftIcon!"
                [size]="iconSize"
                [width]="iconWidth"
                class="btn-icon left"
                [ngStyle]="leftIconColor ? { color: leftIconColor } : null"
            />
        }

        <div
            appContentText
            class="btn-content"
        >
            <ng-content></ng-content>
        </div>

        @if (showRightIcon) {
            <app-svg-icon
                [icon]="rightIcon!"
                [size]="iconSize"
                [width]="iconWidth"
                class="btn-icon right"
                [ngStyle]="rightIconColor ? { color: rightIconColor } : null"
            />
        }
    }
</button>
@if (disabled()) {
    <span
        class="btn-disabled-hover-target"
        (mouseenter)="showTooltipWhileDisabled()"
        (mouseleave)="hideTooltipWhileDisabled()"
        (click)="$event.stopPropagation()"
    ></span>
}

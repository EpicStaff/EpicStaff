<div
    class="search"
    [ngClass]="'search--mod-' + mod()"
    [style.width]="width()"
>
    <app-svg-icon
        [icon]="icon()"
        class="search__icon"
        [size]="iconSize()"
    />

    <input
        #searchInput
        type="text"
        class="search__input"
        [ngClass]="'search__input--' + mod()"
        [class.search__input--with-clear]="!!searchTerm()"
        [placeholder]="placeholder()"
        [attr.aria-label]="ariaLabel()"
        [matTooltip]="ariaLabel() || placeholder()"
        [ngModel]="searchTerm()"
        (ngModelChange)="onSearchTermChange($event)"
    />

    @if (searchTerm()) {
        <button
            type="button"
            class="search__clear-btn"
            aria-label="Clear search"
            matTooltip="Clear search"
            (click)="clearSearch()"
        >
            <app-svg-icon
                icon="x"
                size="1.1rem"
            />
        </button>
    }
</div>

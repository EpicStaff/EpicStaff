<div
    class="tooltip-label-container"
    [class.tooltip-label-container--inline]="inline()"
>
    <label class="tooltip-label">
        <span class="tooltip-label-text">{{ label() }}</span>
        @if (required()) {
            <span class="tooltip-label-required">*</span>
        }
    </label>
    @if (tooltipText()) {
        <app-help-tooltip
            [text]="tooltipText()"
            position="right"
            size="18px"
        ></app-help-tooltip>
    }
</div>

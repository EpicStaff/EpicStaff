@if (label()) {
    <app-tooltip
        [required]="required()"
        [tooltipText]="tooltipText()"
        [label]="label()"
        [icon]="icon()"
    />
}

@if (!hideTrigger()) {
    <div class="selector">
        <button
            #triggerBtn
            class="selector__btn"
            [disabled]="isDisabled()"
            [ngClass]="'selector__btn--' + mod()"
            [class.selector__btn--invalid]="invalid()"
            [class.selector__btn--open]="open()"
            [class.selector__btn--placeholder]="!selectedItem()"
            (click)="toggle()"
        >
            @if (loading()) {
                <div
                    class="selector__spinner"
                    [ngClass]="'selector__spinner--' + mod()"
                ></div>
            } @else {
                @if (selectedItem()?.icon) {
                    <app-svg-icon
                        [icon]="selectedItem()!.icon!"
                        [size]="'18px'"
                    ></app-svg-icon>
                }
                <span class="selector__text">
                    {{ selectedItem() ? selectedItem()!.name : placeholder() }}
                </span>

                <svg
                    class="selector__chevron"
                    [class.selector__chevron--open]="open()"
                    [ngClass]="'selector__chevron--' + mod()"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                >
                    <path
                        d="M6 9l6 6 6-6"
                        stroke="currentColor"
                        stroke-width="2"
                        fill="none"
                        stroke-linecap="round"
                    />
                </svg>
            }
        </button>
    </div>
} @else {
    <span
        #triggerBtn
        style="display: none"
    ></span>
}

<ng-template #dropdownTemplate>
    <div class="selector__dropdown">
        @if (showSearch()) {
            <input
                type="text"
                class="selector__search"
                [placeholder]="searchPlaceholder()"
                [value]="search()"
                (input)="search.set($any($event.target).value)"
                (click)="$event.stopPropagation()"
            />
        }

        @for (item of filteredItems(); track item.name) {
            <div
                class="selector__option selector__option--exists"
                [ngClass]="'selector__option--' + mod()"
                [class.selector__option--selected]="item.value === selectedValue()"
                [class.selector__option--boxed]="showSearch()"
                (click)="select(item)"
            >
                @if (item.icon) {
                    <app-svg-icon
                        [icon]="item.icon"
                        [size]="'18px'"
                    ></app-svg-icon>
                }
                <span class="selector__text">{{ item.name }}</span>
                @if (item.tip) {
                    <span class="selector__tip">{{ item.tip }}</span>
                }
            </div>
        }

        @if (!filteredItems().length) {
            <div
                class="selector__option selector__option--empty"
                [ngClass]="'selector__option--' + mod()"
                [class.selector__option--boxed]="showSearch()"
            >
                No items available
            </div>
        }
    </div>
</ng-template>

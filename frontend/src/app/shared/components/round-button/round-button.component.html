<button
    type="button"
    class="round-btn"
    [class.round-btn--active]="selected()"
    [class.round-btn--disabled]="disabled()"
    [disabled]="disabled()"
    [attr.aria-pressed]="selected()"
    [matTooltip]="tooltip()"
    matTooltipPosition="above"
    [attr.aria-label]="tooltip() || null"
>
    {{ label() }}
</button>

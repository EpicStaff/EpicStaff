<div class="icon-picker-container">
    <button
        type="button"
        class="icon-selector"
        aria-label="Select icon"
        matTooltip="Select icon"
        [attr.aria-expanded]="showIconPicker"
        (click)="toggleIconPicker()"
    >
        @if (selectedIcon) {
            <div class="selected-icon">
                <app-icon
                    [icon]="getIconPath(selectedIcon)"
                    [size]="'20'"
                ></app-icon>
            </div>
        }
        @if (!selectedIcon) {
            <div class="icon-placeholder">
                <app-icon
                    [icon]="'ui/star'"
                    [size]="'20'"
                ></app-icon>
            </div>
        }
    </button>

    <!-- Icon Picker Popup -->
    @if (showIconPicker) {
        <div
            class="icon-picker-popup"
            animate.enter="icon-picker-enter"
            animate.leave="icon-picker-leave"
        >
            <div class="icons-grid">
                @for (iconName of availableIcons; track iconName) {
                    <button
                        type="button"
                        class="icon-item"
                        [class.selected]="selectedIcon === iconName"
                        [attr.aria-pressed]="selectedIcon === iconName"
                        [attr.aria-label]="iconName"
                        [matTooltip]="iconName"
                        (click)="selectIcon(iconName)"
                    >
                        <app-icon
                            [icon]="getIconPath(iconName)"
                            [size]="'24'"
                        ></app-icon>
                    </button>
                }
            </div>
            <div class="icon-picker-footer">
                <button
                    type="button"
                    matTooltip="Clear"
                    (click)="clearIcon()"
                >
                    Clear
                </button>
                <button
                    type="button"
                    matTooltip="Close"
                    (click)="toggleIconPicker()"
                >
                    Close
                </button>
            </div>
        </div>
    }
</div>

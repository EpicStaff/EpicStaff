<div
    #strip
    class="tabs-wrapper"
    (wheel)="onWheel($event)"
>
    @for (tab of visibleTabs(); track tab.routerLink) {
        <a
            #tabLink
            [routerLink]="tab.routerLink"
            routerLinkActive="active"
            (isActiveChange)="onActiveChange($event, tabLink)"
            class="route-tab"
            [attr.data-tour]="tab.tourAnchor ?? null"
        >
            @if (tab.icon) {
                <app-svg-icon
                    size="18px"
                    [icon]="tab.icon"
                />
            } @else if (tab.iconClass) {
                <i
                    [class]="'route-tab__icon-font ' + tab.iconClass"
                    aria-hidden="true"
                ></i>
            }
            {{ tab.label }}
        </a>
    }
</div>
<ng-content />

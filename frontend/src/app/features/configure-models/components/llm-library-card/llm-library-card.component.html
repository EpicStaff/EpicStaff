<article
    class="llm-card"
    [class.llm-card--select-mode]="selectMode()"
    [class.llm-card--selected]="selectMode() && selected()"
    (click)="onCardClick()"
>
    <div class="llm-card__top">
        <span
            class="llm-card__label"
            appTooltipOnOverflow
            [matTooltip]="model().customName"
        >
            {{ model().customName }}
        </span>
        @if (selectMode()) {
            <div
                class="llm-card__checkbox"
                (click)="$event.stopPropagation()"
            >
                <app-checkbox
                    color="secondary"
                    [ariaLabel]="'Select ' + model().customName"
                    [checked]="selected()"
                    [disabled]="isDeleting()"
                    (changed)="onCardClick()"
                ></app-checkbox>
            </div>
        } @else {
            <div class="llm-card__actions">
                <app-config-card-more-menu (viewDetailsClick)="onViewDetails($event)" />
                <button
                    *appHasPermission="[ResourceCode.LlmConfigs, ActionCode.Update]"
                    type="button"
                    class="llm-card__action"
                    [attr.aria-label]="'Edit ' + model().customName"
                    matTooltip="Edit"
                    matTooltipPosition="above"
                    (click)="onEdit()"
                >
                    <i
                        class="ti ti-pencil"
                        aria-hidden="true"
                    ></i>
                </button>
                <button
                    *appHasPermission="[ResourceCode.LlmConfigs, ActionCode.Delete]"
                    type="button"
                    class="llm-card__action"
                    [attr.aria-label]="'Delete ' + model().customName"
                    matTooltip="Delete"
                    matTooltipPosition="above"
                    (click)="onDelete()"
                >
                    <i
                        class="ti ti-x"
                        aria-hidden="true"
                    ></i>
                </button>
            </div>
        }
    </div>

    <div
        class="llm-card__name"
        appTooltipOnOverflow
        [matTooltip]="model().modelName"
    >
        {{ model().modelName }}
    </div>

    @if (hasBottomRow()) {
        <div class="llm-card__bottom">
            @let temperature = model().temperature;
            @if (temperature !== null) {
                <div class="llm-card__temp">
                    <app-svg-icon
                        icon="thermometer"
                        size="16px"
                        aria-hidden="true"
                    />
                    <span>{{ temperature }}°</span>
                </div>
            }

            <div class="llm-card__badges">
                @if (model().needsReview) {
                    <span
                        class="llm-card__badge llm-card__badge--review"
                        tabindex="0"
                        matTooltipClass="multiline-tooltip"
                        [matTooltip]="reviewTooltip()"
                    >
                        <app-svg-icon
                            icon="alert-triangle"
                            size="12px"
                            aria-hidden="true"
                        />
                        Needs review
                    </span>
                }
                @if (defaultRoles().length > 0) {
                    <span
                        class="llm-card__badge llm-card__badge--default"
                        tabindex="0"
                        matTooltipClass="multiline-tooltip"
                        [matTooltip]="defaultTooltip()"
                    >
                        <app-svg-icon
                            icon="robot"
                            size="12px"
                            aria-hidden="true"
                        />
                        Default
                    </span>
                }
            </div>
        </div>
    }
</article>

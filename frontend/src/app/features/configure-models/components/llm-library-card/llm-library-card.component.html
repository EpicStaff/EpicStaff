<article class="llm-card">
    <div class="llm-card__top">
        <span class="llm-card__model">{{ model().customName }}</span>
        <div class="llm-card__actions">
            <button
                #menuTrigger="cdkMenuTriggerFor"
                type="button"
                class="llm-card__action"
                aria-label="More actions"
                matTooltip="More"
                matTooltipPosition="above"
                [cdkMenuTriggerFor]="menu"
                [cdkMenuPosition]="menuPositions"
                [class.llm-card__action--active]="menuTrigger.isOpen()"
            >
                <i
                    class="ti ti-dots-vertical"
                    aria-hidden="true"
                ></i>
            </button>
            <ng-template #menu>
                <div
                    cdkMenu
                    class="llm-card-menu"
                >
                    <!-- Every item needs (keydown.escape): see onMenuItemEscape(). -->
                    <button
                        cdkMenuItem
                        type="button"
                        class="llm-card-menu__item"
                        (cdkMenuItemTriggered)="onViewDetails()"
                        (keydown.escape)="onMenuItemEscape($event)"
                    >
                        View Details
                    </button>
                </div>
            </ng-template>
            <button
                *appHasPermission="[ResourceCode.LlmConfigs, ActionCode.Update]"
                type="button"
                class="llm-card__action"
                matTooltip="Edit"
                matTooltipPosition="above"
                (click)="onEdit()"
            >
                <i
                    class="ti ti-pencil"
                    aria-hidden="true"
                ></i>
            </button>
            <button
                *appHasPermission="[ResourceCode.LlmConfigs, ActionCode.Delete]"
                type="button"
                class="llm-card__action llm-card__action--delete"
                matTooltip="Delete"
                matTooltipPosition="above"
                (click)="onDelete()"
            >
                <i
                    class="ti ti-x"
                    aria-hidden="true"
                ></i>
            </button>
        </div>
    </div>

    <div class="llm-card__name">{{ model().modelName }}</div>

    @if (model().tags.length > 0) {
        <div class="llm-card__tags">
            @for (tag of model().tags; track tag) {
                <span class="llm-card__tag">#{{ tag.name }}</span>
            }
        </div>
    }

    <div class="llm-card__bottom">
        <div class="llm-card__temp">
            <i
                class="ti ti-thermometer"
                aria-hidden="true"
            ></i>
            {{ model().temperature }}°
        </div>

        @if (model().isDeprecated) {
            <div class="llm-card__deprecated">
                <app-svg-icon
                    icon="warning"
                    size="12px"
                    aria-hidden="true"
                />
                <span>Deprecated</span>
            </div>
        }
    </div>
</article>

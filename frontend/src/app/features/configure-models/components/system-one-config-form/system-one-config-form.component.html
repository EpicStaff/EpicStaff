<form [formGroup]="form">
    <section class="section">
        <h3 class="section-title">MODEL INFORMATION</h3>
        <div>
            <app-custom-input
                formControlName="custom_name"
                label="Configuration Name"
                placeholder="Enter a custom name"
                tooltipText="A friendly name to identify this configuration across the app"
                [required]="true"
                autocomplete="off"
            />
            <app-validation-errors [control]="form.controls.custom_name" />
        </div>
        <div>
            <app-grouped-picker
                label="Provider"
                placeholder="Select provider"
                tooltipText="TypeSafe runs a Jev model and OpenAI runs a Decisions model, each with your API key. LLM answers with one of your LLM configurations."
                emptyGroupText="No LLM configs yet. Add one in the LLM tab first."
                [required]="true"
                [groups]="groups()"
                [selected]="selectedKey()"
                (picked)="pick($event)"
                (closed)="form.controls.model.markAsTouched()"
            />
            @if (selectedProvider() === 'llm') {
                <app-hint-message>Its probabilities are the LLM's own estimate, not calibrated.</app-hint-message>
            }
            <app-validation-errors [control]="form.controls.model" />
        </div>

        @if (usesKey()) {
            <div>
                <app-select
                    formControlName="api_key_secret_id"
                    label="API Key"
                    variant="boxed"
                    placeholder="Select a secret"
                    [tooltipText]="
                        selectedProvider() === 'openai'
                            ? 'The stored secret holding your OpenAI API key'
                            : 'The stored secret holding your TypeSafe API key'
                    "
                    [items]="apiKeyItems()"
                    [required]="true"
                    [showSearch]="true"
                    searchPlaceholder="Search a secret..."
                />
                <app-binned-secret-note [selected]="form.controls.api_key_secret_id.value" />
                @if (!form.controls.api_key_secret_id.value) {
                    <app-hint-message>
                        Choose an existing secret. To add a new one, go to the <strong>Secrets tab</strong>.
                    </app-hint-message>
                }
                <app-validation-errors [control]="form.controls.api_key_secret_id" />
            </div>
        }
    </section>
</form>

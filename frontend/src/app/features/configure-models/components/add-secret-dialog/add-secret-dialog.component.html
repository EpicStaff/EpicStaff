<div
    class="add-secret-dialog"
    (appEnterSubmit)="onSubmit()"
    [appEnterSubmitDisabled]="form.invalid || isSubmitting()"
>
    <header class="add-secret-dialog__header">
        <span class="add-secret-dialog__title">Add Secret</span>
        <button
            type="button"
            class="add-secret-dialog__close-btn"
            aria-label="Close"
            matTooltip="Close"
            (click)="onCancel()"
        >
            <app-svg-icon
                icon="close"
                size="16px"
            />
        </button>
    </header>

    <form
        class="add-secret-dialog__form"
        [formGroup]="form"
    >
        @if (errorMessage()) {
            <div class="add-secret-dialog__error-message">
                <p>{{ errorMessage() }}</p>
            </div>
        }

        <div>
            <!-- The dialog opens with the focus here, its first field. -->
            <app-custom-input
                cdkFocusInitial
                label="Name"
                formControlName="name"
                [required]="true"
                placeholder="e.g. OpenAI API Key"
            />
            <app-validation-errors [control]="form.get('name')!" />
        </div>

        <div>
            <app-textarea
                class="add-secret-dialog__value-input"
                label="Value"
                formControlName="value"
                [required]="true"
                placeholder="Paste the secret value"
                [rows]="1"
            />
            <app-validation-errors [control]="form.get('value')!" />
        </div>
    </form>

    <div class="add-secret-dialog__actions">
        <app-button
            type="outline-primary"
            (click)="onCancel()"
        >
            Cancel
        </app-button>
        <app-button
            type="primary-white"
            (click)="onSubmit()"
            [disabled]="form.invalid || isSubmitting()"
        >
            {{ isSubmitting() ? 'Adding...' : 'Add Secret' }}
        </app-button>
    </div>
</div>

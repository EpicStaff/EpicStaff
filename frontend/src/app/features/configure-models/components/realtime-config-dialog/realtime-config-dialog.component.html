<div
    class="dialog"
    (appEnterSubmit)="onSave()"
    [appEnterSubmitDisabled]="isSaving()"
>
    <div class="header">
        <h2 class="title">Edit Voice Configuration</h2>
        <app-icon-button
            icon="x"
            ariaLabel="Close dialog"
            size="2rem"
            tooltip="Close"
            (onClick)="onCancel()"
        />
    </div>

    <app-error-banner
        class="error-banner"
        [message]="saveError()"
    />

    <app-realtime-config-form
        [config]="data.config"
        [provider]="data.provider"
        (saved)="onSaved()"
    />

    <div class="footer">
        <app-button
            type="outline-primary"
            (click)="onCancel()"
        >
            Cancel
        </app-button>
        <app-button
            type="primary"
            [disabled]="isSaving()"
            (click)="onSave()"
        >
            {{ saveLabel() }}
        </app-button>
    </div>
</div>

<article
    class="default-llms-card"
    [class.default-llms-card--active]="selectedConfigId()"
>
    <div class="default-llms-card__top">
        <div class="default-llms-card__header">
            <app-svg-icon
                [icon]="card().icon"
                size="2rem"
                class="default-llms-card__icon"
            />
            @if (selectedConfigId()) {
                <!-- Goes away with the choice it clears: the focus moves to the card's Add model button. -->
                <button
                    *appHasPermission="[ResourceCode.LlmConfigs, ActionCode.Update]"
                    type="button"
                    class="default-llms-card__close-icon"
                    [attr.aria-label]="'Clear ' + card().title"
                    matTooltip="Clear"
                    (click)="onResetConfig()"
                >
                    <app-svg-icon
                        size="1.25rem"
                        icon="close"
                    />
                </button>
            }
        </div>

        <div
            class="default-llms-card__title"
            [id]="titleId()"
        >
            {{ card().title }}
        </div>
    </div>
    <div class="default-llms-card__controls">
        <div class="default-llms-card__select-wrapper">
            <app-select
                [ariaLabelledby]="titleId()"
                [tooltip]="card().title"
                [disabled]="!permissionService.can(ResourceCode.LlmConfigs, ActionCode.Update)"
                [placeholder]="card().selectLabel"
                [items]="selectItems()"
                [selectedValue]="selectedConfigId()"
                (changed)="selectConfig($event)"
            />
        </div>
        <button
            #addButton
            *appHasPermission="[ResourceCode.LlmConfigs, ActionCode.Create]"
            class="default-llms-card__add"
            type="button"
            aria-label="Add model"
            matTooltip="Add model"
            (click)="onAddModel()"
        >
            <i
                class="ti ti-plus"
                aria-hidden="true"
            ></i>
        </button>
    </div>
    <div
        class="default-llms-card__divider"
        aria-hidden="true"
    ></div>
    <p class="default-llms-card__description">{{ card().description }}</p>
</article>

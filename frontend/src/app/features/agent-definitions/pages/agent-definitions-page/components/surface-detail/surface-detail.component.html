<app-surface-card
    class="detail__surface-card"
    [surface]="surface()"
    [isCreating]="isCreating()"
    [readOnly]="readOnly()"
    [isShared]="isShared()"
    [showMeta]="showMeta()"
    [currentPlace]="currentPlace()"
    [surfacePlaces]="surfacePlaces()"
    [placesBusy]="placesBusy()"
    [expanded]="true"
    (renameSurface)="rename.emit($event)"
    (createDraft)="create.emit($event)"
    (surfaceChange)="surfaceChange.emit($event)"
    (openSource)="openSource.emit()"
    (detach)="detach.emit()"
    (makeShared)="makeShared.emit()"
    (makeAgentSpecificCopy)="makeAgentSpecificCopy.emit()"
    (placesChange)="setSurfacePlaces.emit($event)"
    (duplicate)="duplicate.emit()"
    (deleteSurface)="deleteSurface.emit()"
/>

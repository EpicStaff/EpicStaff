@if (facade.isLoading() && items().length === 0) {
    <div class="section-state">Loading storage…</div>
} @else if (facade.error()) {
    <app-fetch-error-state
        mod="small"
        title="Failed to load storage"
        message="Check your connection and try again."
        (retry)="facade.loadTree()"
    />
} @else if (items().length === 0) {
    <div class="section-state">Storage is empty</div>
} @else {
    <app-storage-tree
        [items]="items()"
        [showHeader]="false"
        (fileSelected)="onItemSelected($event)"
        (folderSelected)="onItemSelected($event)"
        (folderToggled)="facade.onFolderToggle($event)"
        (contextAction)="facade.onContextAction($event)"
        (openCreateFolder)="facade.openCreateFolderDialog($event)"
        (selectionChange)="facade.selectedItems.set($event)"
    />
}

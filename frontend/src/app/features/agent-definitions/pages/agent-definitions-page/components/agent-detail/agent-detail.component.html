<form
    class="detail"
    [formGroup]="form"
    (submit)="$event.preventDefault()"
>
    <section
        id="agent-section-basics"
        class="section"
    >
        <div class="section__header-row">
            <button
                type="button"
                class="section__header"
                (click)="toggleSection('basics')"
            >
                <app-svg-icon
                    class="section__chevron"
                    [class.section__chevron--open]="isOpen('basics')"
                    icon="chevron-down-filled"
                    size="8px"
                />
                <span class="section__title">Required Setup</span>
            </button>

            @if (!isCreating() && agent() && canOpenSettings()) {
                <button
                    type="button"
                    class="section__settings"
                    aria-label="Additional Settings"
                    matTooltip="Additional Settings"
                    matTooltipPosition="above"
                    matTooltipClass="custom-tooltip"
                    (click)="openAdditionalSettings()"
                >
                    <app-svg-icon
                        icon="settings"
                        size="16px"
                    />
                </button>
            }
        </div>

        @if (isOpen('basics')) {
            <div class="section__body">
                <div class="row row--name-llm">
                    <div class="field">
                        <label class="label"> Agent Name<span class="required">*</span> </label>
                        <input
                            type="text"
                            class="text-input"
                            formControlName="name"
                            placeholder="e.g. CV Processor"
                            appEnterBlur
                            (blur)="autosaveName()"
                        />
                    </div>
                    <div class="field">
                        <label class="label">LLM Configuration<span class="required">*</span></label>
                        <app-llm-model-selector
                            formControlName="llm_config"
                            placeholder="Select LLM model"
                            (modelSelected)="autosave()"
                        />
                    </div>
                </div>

                <div class="field">
                    <label class="label">About this Agent</label>
                    <textarea
                        #aboutTa
                        class="text-area text-area--about"
                        formControlName="description"
                        appEnterBlur
                        placeholder="Describe this agent for your team..."
                        rows="1"
                        (input)="adjustTextareaHeight(aboutTa, 400)"
                        (focus)="adjustTextareaHeight(aboutTa, 400)"
                        (blur)="autosave()"
                    ></textarea>
                </div>

                <div class="field">
                    <label class="label">Instructions<span class="required">*</span></label>
                    <app-agent-instructions-list
                        [instructions]="instructionList()"
                        [saveErrorTick]="saveErrorTick()"
                        [serverError]="instructionListError()"
                        [isCreating]="isCreating()"
                        [readOnly]="readOnly()"
                        (instructionListChange)="onInstructionListChange($event)"
                        (openInstruction)="openInstruction.emit($event)"
                    />
                </div>
            </div>
        }
    </section>

    <section
        *appHasPermission="[ResourceCode.Surfaces, ActionCode.Read]"
        id="agent-section-surfaces"
        class="section"
    >
        <button
            type="button"
            class="section__header"
            appHideInlineSubtitleOnOverflow
            overflowTitleSelector=".section__title"
            overflowInlineSelector=".section__title-hint"
            overflowTrailingSelector=".section__title-summary"
            overflowMeasureSelector=".section__title-row"
            (click)="toggleSection('surfaces')"
        >
            <app-svg-icon
                class="section__chevron"
                [class.section__chevron--open]="isOpen('surfaces')"
                icon="chevron-down-filled"
                size="8px"
            />
            <span class="section__title-row">
                <span class="section__title">
                    Surfaces
                    <span class="section__title-hint">(Additional Instructions and Access in Defined Places)</span>
                </span>
                <span
                    class="section__title-summary"
                    aria-hidden="true"
                >
                    <span class="section__title-summary-sep">=</span>
                    <span class="section__title-summary-item">
                        <app-svg-icon
                            icon="tools"
                            size="12px"
                        />
                        Tools
                    </span>
                    <span class="section__title-summary-sep">+</span>
                    <span class="section__title-summary-item">
                        <app-svg-icon
                            icon="files-tab"
                            size="12px"
                        />
                        Files
                    </span>
                    <span class="section__title-summary-sep">+</span>
                    <span class="section__title-summary-item">
                        <app-svg-icon
                            icon="knowledge-tab"
                            size="12px"
                        />
                        Collections
                    </span>
                </span>
            </span>
        </button>

        @if (isOpen('surfaces')) {
            <div class="section__body">
                <app-agent-surfaces-panel
                    [surfaces]="surfaces()"
                    [agentId]="agent()?.id ?? null"
                    [llmConfigId]="liveLlmConfigId()"
                    [defaultSurfaces]="agent()?.default_surfaces ?? []"
                    [sharedSurfaceIds]="sharedSurfaceIds()"
                    [saving]="saving()"
                    [saveError]="surfaceSaveError()"
                    [surfaceCreateErrorTick]="surfaceCreateErrorTick()"
                    (createSurface)="createSurface.emit($event)"
                    (setSharedInCategory)="setSharedInCategory.emit($event)"
                    (dropSharedSurface)="dropSharedSurface.emit($event)"
                    (setSurfacePlaces)="setSurfacePlaces.emit($event)"
                    (makeSharedSurface)="makeSharedSurface.emit($event)"
                    (detachSurface)="detachSurface.emit($event)"
                    (deleteSurface)="deleteSurfaceFromPanel.emit($event)"
                    (duplicateSurface)="duplicateSurface.emit($event)"
                    (makeAgentSpecificCopy)="makeAgentSpecificCopy.emit($event)"
                    (openSource)="openSurfaceSource.emit($event)"
                    (renameSurface)="renameSurface.emit($event)"
                    (surfaceChange)="surfaceChange.emit($event)"
                    (viewSummary)="viewSummary.emit($event)"
                />
            </div>
        }
    </section>
</form>

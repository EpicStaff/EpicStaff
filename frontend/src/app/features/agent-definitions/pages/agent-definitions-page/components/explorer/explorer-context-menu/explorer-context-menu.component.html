@if (open()) {
    <div
        class="explorer-menu__overlay"
        (click)="close.emit()"
    ></div>
    <div
        #menu
        class="explorer-menu"
        role="menu"
        [style.left.px]="placement().x"
        [style.top.px]="placement().y"
        (keydown)="onMenuKeydown($event)"
    >
        @for (item of items(); track item.id) {
            <button
                #rowButton
                type="button"
                role="menuitem"
                tabindex="-1"
                class="explorer-menu__item"
                [class.explorer-menu__item--disabled]="item.disabled"
                [class.explorer-menu__item--danger]="item.danger"
                [disabled]="item.disabled"
                [attr.aria-expanded]="item.children ? expandedId() === item.id : null"
                [attr.aria-controls]="item.children && expandedId() === item.id ? groupId(item) : null"
                (click)="onRowClick(item)"
            >
                @if (item.dotColor !== undefined) {
                    <span
                        class="explorer-menu__dot"
                        [class.explorer-menu__dot--empty]="item.dotColor === null"
                        [style.background-color]="item.dotColor"
                    ></span>
                }
                <span class="explorer-menu__label">{{ item.label }}</span>
                @if (item.children) {
                    <app-svg-icon
                        class="explorer-menu__chevron"
                        [class.explorer-menu__chevron--open]="expandedId() === item.id"
                        icon="chevron-down-filled"
                        size="8px"
                    />
                }
            </button>
            <!-- A sub-list opens inline under its row (a disclosure), not as a submenu popup. -->
            @if (item.children && expandedId() === item.id) {
                <div
                    role="group"
                    [id]="groupId(item)"
                    [attr.aria-label]="item.label"
                >
                    @for (child of item.children; track child.id) {
                        <button
                            #rowButton
                            type="button"
                            role="menuitem"
                            tabindex="-1"
                            class="explorer-menu__item explorer-menu__item--nested"
                            [class.explorer-menu__item--disabled]="child.disabled"
                            [class.explorer-menu__item--danger]="child.danger"
                            [disabled]="child.disabled"
                            (click)="onRowClick(child)"
                        >
                            @if (child.dotColor !== undefined) {
                                <span
                                    class="explorer-menu__dot"
                                    [class.explorer-menu__dot--empty]="child.dotColor === null"
                                    [style.background-color]="child.dotColor"
                                ></span>
                            }
                            <span class="explorer-menu__label">{{ child.label }}</span>
                        </button>
                    }
                </div>
            }
        }
    </div>
}

@if (open()) {
    <div
        class="explorer-menu__overlay"
        (click)="close.emit()"
    ></div>
    <!-- Takes the focus on opening and hands it back to the row's ⋮ button when it closes. -->
    <div
        class="explorer-menu"
        role="menu"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
        [style.left.px]="position().x"
        [style.top.px]="position().y"
        (keydown.escape)="onEscape($event)"
    >
        @for (item of items(); track item.id) {
            <button
                type="button"
                class="explorer-menu__item"
                role="menuitem"
                [class.explorer-menu__item--disabled]="item.disabled"
                [disabled]="item.disabled"
                [matTooltip]="item.label"
                (click)="onAction(item.id, item.disabled)"
            >
                {{ item.label }}
            </button>
        }
    </div>
}

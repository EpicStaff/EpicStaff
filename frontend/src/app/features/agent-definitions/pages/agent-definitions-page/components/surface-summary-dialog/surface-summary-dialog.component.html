<div
    class="summary-backdrop"
    (click)="close.emit()"
></div>

<div
    class="summary-dialog"
    role="dialog"
    aria-label="Surface Summary"
>
    <header class="summary-dialog__header">
        <h2 class="summary-dialog__title">{{ placeLabel() }} — Combined Surface</h2>
        <button
            type="button"
            class="summary-dialog__close"
            aria-label="Close"
            (click)="close.emit()"
        >
            <app-svg-icon
                icon="x"
                size="16px"
            />
        </button>
    </header>

    <div class="summary-dialog__body">
        <app-surface-card
            [surface]="summarySurface()"
            [readOnly]="true"
            [hideHeader]="true"
            [expanded]="true"
        />
    </div>
</div>

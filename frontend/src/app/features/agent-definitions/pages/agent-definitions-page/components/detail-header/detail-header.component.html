<div class="detail-header">
    <button
        type="button"
        class="detail-header__toggle"
        [class.detail-header__toggle--active]="showSidebar()"
        title="Toggle Branches"
        (click)="toggleSidebar.emit()"
    >
        <app-svg-icon
            icon="expand-sidebar"
            size="0.85rem"
        />
    </button>

    <nav class="crumbs">
        @for (crumb of crumbs(); track $index; let last = $last) {
            @if (crumb.navAgentId != null) {
                <button
                    type="button"
                    class="crumbs__item crumbs__item--link"
                    (click)="navAgent.emit(crumb.navAgentId)"
                >
                    @if (crumb.icon) {
                        <app-svg-icon
                            class="crumbs__icon"
                            [icon]="crumb.icon"
                            [size]="crumb.iconSize || '14px'"
                        />
                    }
                    {{ crumb.label }}
                </button>
            } @else {
                <span
                    class="crumbs__item"
                    [class.crumbs__item--current]="last"
                >
                    @if (crumb.icon) {
                        <app-svg-icon
                            class="crumbs__icon"
                            [icon]="crumb.icon"
                            [size]="crumb.iconSize || '14px'"
                        />
                    }
                    {{ crumb.label }}
                </span>
            }
            @if (!last) {
                <span class="crumbs__sep">/</span>
            }
        }
    </nav>

    <div class="detail-header__actions">
        <ng-content></ng-content>
    </div>
</div>

<div
    class="form-section"
    [formGroup]="form()"
>
    <h3 class="section-title">ADVANCED OPTIONS</h3>

    <div class="form-group-container">
        <div class="form-group">
            <app-toggle-switch
                formControlName="prompt_caching_enabled"
                label="Prompt Caching"
                tooltipText="Reuse the unchanged start of this agent's prompts for 5 minutes on Claude models. The first call costs 25% more on input; repeats cost 5–10% of the input price."
            />
        </div>
    </div>
</div>

@if (table().rows.length > 0) {
    <div class="table-wrapper">
        <table class="ef-table">
            <thead>
                <tr>
                    @for (col of resolvedColumns(); track col.key) {
                        <th
                            [class.sortable]="isSortable()"
                            [class.sort-active]="isSortActive(col.key)"
                            [attr.aria-sort]="sortState(col.key)"
                            (click)="toggleSort(col.key)"
                        >
                            @if (isSortable()) {
                                <!-- The keyboard's way to sort; its click reaches the header cell's handler. -->
                                <button
                                    type="button"
                                    class="sort-btn"
                                    [matTooltip]="'Sort by ' + (col.title ?? col.key)"
                                >
                                    <span>{{ col.title ?? col.key }}</span>
                                    @if (isSortActive(col.key)) {
                                        <span class="sort-indicator">{{ sortDir() === 'asc' ? '↑' : '↓' }}</span>
                                    }
                                </button>
                            } @else {
                                <span>{{ col.title ?? col.key }}</span>
                            }
                        </th>
                    }
                </tr>
            </thead>
            <tbody>
                @for (row of displayedRows(); track $index) {
                    <tr>
                        @for (col of resolvedColumns(); track col.key) {
                            <td>{{ formatCell(row[col.key], col) }}</td>
                        }
                    </tr>
                }
            </tbody>
        </table>
    </div>
}

<div class="sidebar">
    <div class="sidebar-header">
        <span class="sidebar-title">Sessions</span>
        <button
            type="button"
            class="sidebar-btn"
            aria-label="New session"
            matTooltip="New session"
            (click)="newSession()"
        >
            <app-svg-icon
                icon="plus"
                size="0.9rem"
            />
        </button>
    </div>

    <div class="sessions-list">
        @for (session of sessions(); track trackById($index, session); let i = $index) {
            <!-- A row and not a button: it holds the delete button. The title is the row's keyboard stop. -->
            <div
                class="session-row"
                [class.session-row--active]="currentConversationId() === session.id"
                (click)="selectSession(session.id)"
            >
                <div class="session-row__body">
                    <!-- Its click reaches the row's handler. -->
                    <button
                        type="button"
                        class="session-row__title"
                        [attr.aria-current]="currentConversationId() === session.id ? 'true' : null"
                        [matTooltip]="sessionTitle(session, i)"
                    >
                        {{ sessionTitle(session, i) }}
                    </button>
                    <div class="session-row__meta">
                        <span class="session-row__date">{{ formatDate(session.last_message_at) }}</span>
                        @if (session.message_count > 0) {
                            <span class="session-row__count">{{ session.message_count }}</span>
                        }
                    </div>
                </div>
                <button
                    type="button"
                    class="session-row__delete delete-btn"
                    aria-label="Delete session"
                    matTooltip="Delete session"
                    (click)="deleteSession($event, session.id)"
                >
                    <app-svg-icon
                        icon="trash"
                        size="0.8rem"
                    />
                </button>
            </div>
        }

        @if (sessions().length === 0) {
            <div class="sessions-empty">No sessions yet</div>
        }
    </div>
</div>

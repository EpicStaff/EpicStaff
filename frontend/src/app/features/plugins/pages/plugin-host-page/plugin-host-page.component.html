<div class="plugin-host">
    @if (inDevelopment() && readyView()) {
        <p
            class="plugin-host__development text-body-small"
            role="status"
        >
            Development: this plugin is served from a developer's machine.
        </p>
    }
    @for (ready of frameViews(); track ready.frameKey) {
        <!-- sandbox / referrerpolicy / allow must stay literal: Angular refuses to bind them. -->
        <!-- No [src]: the component sets the validated address once the frame protocol listens. -->
        <iframe
            #pluginFrame
            class="plugin-host__frame"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"
            referrerpolicy="strict-origin"
            allow="clipboard-write"
            [attr.data-frame-key]="ready.frameKey"
            [title]="ready.name"
        ></iframe>
    } @empty {
        @if (maintenanceView(); as maintenance) {
            <div class="plugin-host__state">
                <app-plugin-maintenance-panel [pluginName]="maintenance.name" />
            </div>
        } @else if (messageView(); as message) {
            <div class="plugin-host__state">
                <app-fetch-error-state
                    [title]="message.title"
                    [message]="message.message"
                    retryLabel="Try again"
                    (retry)="reload()"
                />
            </div>
        }
    }
</div>

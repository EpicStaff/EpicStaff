<div class="dialog">
    <div class="dialog__header">
        <h2
            class="dialog__title text-h3"
            [id]="titleId"
        >
            Restore {{ backupTitle }}
        </h2>
        <button
            class="dialog__close"
            type="button"
            aria-label="Close"
            [disabled]="isRestoring()"
            (click)="close()"
        >
            <app-svg-icon
                icon="x"
                size="18px"
            />
        </button>
    </div>

    <div class="dialog__body">
        <p class="restore__question text-body">{{ question }}</p>
        <p class="restore__facts text-body-small">
            {{ data.pluginName }} · holds {{ data.backup.version }} · <code>{{ data.backup.file_name }}</code>
        </p>

        <div class="restore__verification">
            <label
                class="restore__verification-label text-body"
                for="plugin-restore-verification"
            >
                Type <code class="restore__phrase">{{ data.verificationPhrase }}</code> to confirm
            </label>
            <input
                id="plugin-restore-verification"
                class="restore__verification-input text-body"
                type="text"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                [formControl]="phraseControl"
            />
        </div>

        @if (restoreError(); as message) {
            <div
                class="dialog__error text-body"
                role="alert"
            >
                {{ message }}
            </div>
        }
    </div>

    <div class="dialog__footer">
        <app-button
            type="outline-secondary"
            [disabled]="isRestoring()"
            (click)="close()"
        >
            Cancel
        </app-button>
        <app-button
            type="outline-danger"
            [disabled]="!canRestore()"
            (click)="restore()"
        >
            Restore
        </app-button>
    </div>
</div>

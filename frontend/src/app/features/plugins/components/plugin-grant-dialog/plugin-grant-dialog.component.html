<div class="dialog">
    <div class="dialog__header">
        <h2
            class="dialog__title text-h3"
            [id]="titleId"
        >
            Grant {{ data.name }}
        </h2>
        <button
            class="dialog__close"
            type="button"
            aria-label="Close"
            matTooltip="Close"
            (click)="close()"
        >
            <app-svg-icon
                icon="x"
                size="18px"
            />
        </button>
    </div>

    <div class="dialog__body">
        <p class="grant__hint text-body">
            Members of the organization see the plugin when their role gives them its View permission.
        </p>
        <app-select
            label="Organization"
            placeholder="Choose an organization"
            [items]="organizationItems()"
            [loading]="isLoading()"
            [showSearch]="true"
            searchPlaceholder="Search organizations..."
            [selectedValue]="organizationId()"
            (changed)="onOrganizationChange($event)"
        />

        @if (error(); as failure) {
            <div
                class="dialog__error text-body"
                role="alert"
            >
                {{ failure.message }}
            </div>
        }
    </div>

    <div class="dialog__footer">
        <app-button
            type="outline-secondary"
            (click)="close()"
        >
            Cancel
        </app-button>
        <app-button
            type="primary"
            [disabled]="!canGrant()"
            (click)="grant()"
        >
            Grant
        </app-button>
    </div>
</div>

<div class="dialog">
    <div class="dialog__header">
        <h2
            class="dialog__title text-h3"
            [id]="titleId"
        >
            Review plugin package
        </h2>
        <button
            class="dialog__close"
            type="button"
            aria-label="Close"
            (click)="close()"
        >
            <app-svg-icon
                icon="x"
                size="18px"
            />
        </button>
    </div>

    <div class="dialog__body">
        @if (error(); as failure) {
            <div
                class="dialog__error text-body"
                role="alert"
            >
                <span>{{ failure.message }}</span>
                @if (failure.items.length > 0) {
                    <ul class="dialog__error-items">
                        @for (item of failure.items; track $index) {
                            <li>
                                <code>{{ item.loc }}</code
                                >: {{ item.message }}
                            </li>
                        }
                    </ul>
                }
            </div>
        }
        @if (review(); as reviewed) {
            <app-plugin-review-panel
                [review]="reviewed"
                [busy]="busy()"
                (approveRequested)="approve(reviewed, $event)"
                (rejectRequested)="reject(reviewed)"
            />
        } @else if (!error()) {
            <app-loading-spinner size="sm" />
        }
    </div>
</div>

@if (lines().length) {
    <ul class="plugin-secret-destinations">
        @for (line of lines(); track $index) {
            <li
                class="plugin-secret-destinations__item"
                [class.plugin-secret-destinations__item--custom]="line.isCustomHost"
            >
                @if (line.isCustomHost) {
                    <i
                        class="plugin-secret-destinations__icon ti ti-alert-triangle"
                        aria-hidden="true"
                    ></i>
                }
                <!-- &ngsp; keeps the space between the two spans, so the line reads as one sentence. -->
                <span class="plugin-secret-destinations__target">{{ line.target }}</span
                >&ngsp;<span class="plugin-secret-destinations__via">{{ line.via }}</span>
            </li>
        }
    </ul>
}

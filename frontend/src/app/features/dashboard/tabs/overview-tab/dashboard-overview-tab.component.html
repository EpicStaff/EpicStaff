@if (resource.error()) {
    <app-fetch-error-state
        title="Could not load the dashboard"
        (retry)="resource.reload()"
    />
} @else if (!resource.hasValue()) {
    <app-loading-spinner />
} @else if (report(); as report) {
    <div class="overview__kpis">
        <app-kpi-card
            icon="ti-bolt"
            label="Active triggers"
            [value]="report.active_triggers.length"
        >
            {{ waitingSessions().length }} {{ waitingSessions().length === 1 ? 'session' : 'sessions' }} waiting for
            user
        </app-kpi-card>
    </div>

    <app-active-triggers-card
        [triggers]="report.active_triggers"
        [waitingSessions]="waitingSessions()"
    />
} @else {
    <app-first-report-state />
}

<div class="dashboard-page">
    <header class="header">
        <div class="header-titles">
            <h1 class="title">Dashboard</h1>
            @if (report(); as report) {
                <app-updated-at
                    [builtAt]="report.built_at"
                    [nextBuildAt]="report.next_build_at"
                />
            }
        </div>
        <app-dashboard-toolbar class="header-actions" />
    </header>
    @if (tabs.length > 1) {
        <app-route-tabs
            class="tabs"
            [tabs]="tabs"
        />
    }
    <section class="dashboard-page__body">
        <router-outlet></router-outlet>
    </section>
</div>

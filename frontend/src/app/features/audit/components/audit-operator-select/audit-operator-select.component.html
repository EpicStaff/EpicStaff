<div class="operator-select">
    <select
        class="operator-select__control"
        (change)="onSelect($event)"
    >
        @for (operator of operators(); track operator) {
            <option
                [value]="operator"
                [selected]="operator === selectedOperator()"
            >
                {{ labelFor(operator) }}
            </option>
        }
    </select>
</div>

<div class="audit-value-dialog">
    <div class="audit-value-dialog__header">
        <h2 class="audit-value-dialog__title">{{ data.title }}</h2>
        <app-copy-button [text]="data.value" />
        <button
            class="audit-value-dialog__close"
            type="button"
            aria-label="Close dialog"
            matTooltip="Close"
            matTooltipPosition="above"
            (click)="close()"
        >
            <app-svg-icon
                icon="x"
                size="1rem"
            />
        </button>
    </div>
    <app-json-editor
        [jsonData]="data.value"
        [showHeader]="false"
        [readonly]="true"
        [fullHeight]="true"
        [editorOptions]="editorOptions"
    />
</div>

@for (chip of chips(); track chip.key) {
    <span class="filter-chip">
        <!-- a query names its own fields, which are highlighted inside the value instead -->
        <span
            class="filter-chip__label"
            [class.filter-chip__label--plain]="chip.key === 'query'"
            >{{ chip.label }}</span
        >
        <span
            class="filter-chip__value"
            [class.filter-chip__value--wide]="isConditionChip(chip.key)"
            [matTooltip]="chip.value"
            matTooltipPosition="above"
        >
            @if (chip.parts) {
                @for (part of chip.parts; track $index) {
                    <span [class.filter-chip__keyword]="part.isKeyword">{{ part.text }}</span>
                }
            } @else {
                {{ chip.value }}
            }
        </span>
        <button
            class="filter-chip__remove"
            type="button"
            [attr.aria-label]="'Remove ' + chip.label + ' filter'"
            (click)="removed.emit(chip.key)"
        >
            ✕
        </button>
    </span>
}

@if (chips().length > 1) {
    <button
        class="filter-chips__clear"
        type="button"
        (click)="cleared.emit()"
    >
        Clear all
    </button>
}

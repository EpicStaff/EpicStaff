<span
    class="usage-ring"
    tabindex="0"
    role="img"
    [class]="'usage-ring--' + level()"
    [attr.aria-label]="accessibleName()"
    [matTooltip]="tooltip()"
    matTooltipPosition="below"
>
    <span class="usage-ring__summary">
        <app-svg-icon
            class="usage-ring__icon"
            aria-hidden="true"
            [icon]="icon()"
            size="14px"
        />
        <span
            class="usage-ring__text text-body-small"
            aria-hidden="true"
            >{{ text() }}</span
        >
    </span>
    <span
        class="usage-ring__bar"
        aria-hidden="true"
    >
        <span
            class="usage-ring__fill"
            [style.width.%]="fillPercent()"
        ></span>
    </span>
</span>

@if (canChange()) {
    <button
        #menuTrigger="cdkMenuTriggerFor"
        type="button"
        class="desk-status desk-status--button"
        matTooltipPosition="below"
        [attr.aria-label]="triggerLabel()"
        [matTooltip]="brokenReason() ?? ''"
        [matTooltipDisabled]="!brokenReason()"
        [cdkMenuTriggerFor]="runStateMenu"
        [cdkMenuPosition]="menuPositions"
    >
        <ng-container
            [ngTemplateOutlet]="statusMark"
            [ngTemplateOutletContext]="{ $implicit: status(), color: dotColor() }"
        />
        <span class="desk-status__label text-body-small-large">{{ label() }}</span>
        <span
            class="desk-status__chevron"
            aria-hidden="true"
            [class.desk-status__chevron--open]="menuTrigger.isOpen()"
        >
            <app-svg-icon
                icon="chevron-down"
                size="16px"
            />
        </span>
    </button>
} @else {
    <!-- Focusable only while it has a reason to show. -->
    <span
        class="desk-status"
        matTooltipPosition="below"
        [attr.tabindex]="brokenReason() ? 0 : null"
        [matTooltip]="brokenReason() ?? ''"
        [matTooltipDisabled]="!brokenReason()"
    >
        <ng-container
            [ngTemplateOutlet]="statusMark"
            [ngTemplateOutletContext]="{ $implicit: status(), color: dotColor() }"
        />
        <span class="desk-status__label text-body-small-large">{{ label() }}</span>
    </span>
}

<ng-template #runStateMenu>
    <div
        class="desk-status-menu"
        cdkMenu
        appTabThroughMenu
    >
        @for (option of options; track option.value) {
            <button
                type="button"
                class="desk-status-menu__item"
                cdkMenuItemRadio
                [cdkMenuItemChecked]="option.value === currentRunState()"
                (cdkMenuItemTriggered)="pick(option.value)"
            >
                <ng-container
                    [ngTemplateOutlet]="statusMark"
                    [ngTemplateOutletContext]="{ $implicit: option.value, color: option.dotColor }"
                />
                <span class="desk-status-menu__text">
                    <span class="desk-status-menu__label text-body-small-large">{{ option.label }}</span>
                    <span class="desk-status-menu__description">{{ option.description }}</span>
                </span>
            </button>
        }
    </div>
</ng-template>

<!-- The status mark: a dot, or for a paused desk the pause sign. -->
<ng-template
    #statusMark
    let-state
    let-color="color"
>
    <span
        class="desk-status__mark"
        aria-hidden="true"
        [class.desk-status__mark--dot]="state !== 'paused'"
        [style.color]="color"
    >
        @if (state === 'paused') {
            <app-svg-icon
                icon="pause-mark"
                size="8px"
            />
        }
    </span>
</ng-template>

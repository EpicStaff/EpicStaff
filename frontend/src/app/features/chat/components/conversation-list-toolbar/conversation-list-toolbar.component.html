<!-- Escape is caught here, around the field: the shared search does not handle it. -->
<app-search
    class="conversation-list-toolbar__search"
    mod="small"
    placeholder="Visitor number, visitor id or operator"
    ariaLabel="Search conversations"
    [searchTerm]="searchText()"
    (searchTermChange)="onSearchText($event)"
    (keydown.escape)="onEscape($event)"
/>
@if (searchError(); as error) {
    <p
        class="conversation-list-toolbar__error text-body-small"
        role="alert"
    >
        {{ error }}
    </p>
}
<div class="conversation-list-toolbar__controls">
    @if (canFilterMine()) {
        <button
            type="button"
            class="conversation-list-toolbar__button"
            matTooltip="Only the conversations you took over"
            [class.conversation-list-toolbar__button--pressed]="isMineOnly()"
            [attr.aria-pressed]="isMineOnly()"
            (click)="mineOnlyChange.emit(!isMineOnly())"
        >
            Mine
        </button>
    }
    <!-- Waiting is a queue and ignores this; its section says so. -->
    <button
        type="button"
        class="conversation-list-toolbar__button conversation-list-toolbar__sort"
        [attr.aria-label]="sortName()"
        matTooltip="Sorts In progress, Tests and Bot. Waiting for a person is always longest wait first."
        (click)="toggleOrder()"
    >
        <app-svg-icon
            icon="arrow-up-down"
            size="14px"
        />
        {{ orderLabel() }}
    </button>
</div>

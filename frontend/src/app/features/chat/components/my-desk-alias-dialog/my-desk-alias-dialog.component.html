<div class="alias-dialog">
    <header class="alias-dialog__header">
        <h2
            class="alias-dialog__title"
            [id]="titleId"
        >
            My name on this desk
        </h2>
        <button
            type="button"
            class="alias-dialog__icon-btn"
            aria-label="Close dialog"
            matTooltip="Close dialog"
            (click)="close()"
        >
            <app-svg-icon
                icon="close"
                size="16px"
            />
        </button>
    </header>

    <form
        class="alias-dialog__form"
        [formGroup]="form"
        (ngSubmit)="save()"
    >
        <label
            class="alias-dialog__label"
            [for]="inputId"
            >Name visitors see</label
        >
        <!-- The dialog opens with the focus here: the one thing to do in it. -->
        <input
            #aliasInput
            cdkFocusInitial
            type="text"
            class="alias-dialog__input"
            autocomplete="off"
            formControlName="alias"
            [id]="inputId"
            [placeholder]="binding.operator_display_name"
            matTooltip="Name visitors see"
            [class.alias-dialog__input--invalid]="!!error()"
            [attr.aria-invalid]="!!error()"
            [attr.aria-describedby]="error() ? hintId + ' ' + errorId : hintId"
            (blur)="isChecked.set(true)"
        />
        <p
            class="alias-dialog__hint text-body-small"
            [id]="hintId"
        >
            Visitors on “{{ binding.name }}” see this name on your replies. Leave blank to use “{{
                binding.operator_display_name
            }}”.
        </p>
        @if (error(); as message) {
            <p
                class="alias-dialog__error text-body-small"
                role="alert"
                [id]="errorId"
            >
                {{ message }}
            </p>
        }
    </form>

    <div class="alias-dialog__actions">
        <app-button
            type="outline-primary"
            (click)="close()"
            >Cancel</app-button
        >
        <app-button
            type="primary-white"
            [disabled]="isSaving()"
            (click)="save()"
        >
            {{ isSaving() ? 'Saving...' : 'Save' }}
        </app-button>
    </div>
</div>

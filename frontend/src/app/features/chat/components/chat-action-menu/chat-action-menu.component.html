<button
    #trigger
    #origin="cdkOverlayOrigin"
    cdkOverlayOrigin
    type="button"
    class="chat-action-menu__trigger"
    aria-haspopup="menu"
    [attr.aria-label]="label()"
    [attr.aria-expanded]="isOpen()"
    [matTooltip]="label()"
    (click)="toggle()"
>
    <app-svg-icon
        size="1rem"
        [icon]="icon()"
    />
</button>
<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayPositions]="positions"
    (overlayOutsideClick)="close()"
    (overlayKeydown)="$event.key === 'Escape' && close()"
    (detach)="close()"
>
    <div
        class="chat-action-menu"
        role="menu"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
    >
        @for (item of items(); track item.id) {
            <button
                type="button"
                class="chat-action-menu__item"
                role="menuitem"
                [disabled]="item.disabled"
                [matTooltip]="item.label"
                (click)="choose(item)"
            >
                {{ item.label }}
            </button>
        }
    </div>
</ng-template>

<div
    class="copy-to-dialog"
    (appEnterSubmit)="onConfirm()"
    [appEnterSubmitDisabled]="!isValid"
>
    <div class="copy-to-dialog__header">
        <h2 class="copy-to-dialog__title">Copy to Folder</h2>
        <button
            type="button"
            class="copy-to-dialog__close"
            aria-label="Close"
            matTooltip="Close"
            (click)="onCancel()"
        >
            <app-svg-icon
                icon="x"
                size="1rem"
            ></app-svg-icon>
        </button>
    </div>

    <div class="copy-to-dialog__body">
        <!-- Escape here closes only the folder list, not the dialog. -->
        <div
            class="copy-to-dialog__field"
            (keydown.escape)="onFolderListEscape($event)"
        >
            <label class="copy-to-dialog__label">Folder <span class="copy-to-dialog__required">*</span></label>
            <!-- The dialog opens with the focus here: the only choice the form asks for. -->
            <button
                #selectorEl
                type="button"
                class="copy-to-dialog__selector"
                [class.copy-to-dialog__selector--filled]="selectedPath() !== null"
                [class.copy-to-dialog__selector--open]="dropdownOpen()"
                cdkFocusInitial
                [attr.aria-expanded]="dropdownOpen()"
                [attr.aria-label]="'Folder: ' + (selectedPath() !== null ? selectedFolderLabel : 'Select folder')"
                matTooltip="Folder"
                (click)="toggleDropdown($event)"
            >
                <span class="copy-to-dialog__selector-text">
                    {{ selectedPath() !== null ? selectedFolderLabel : 'Select folder' }}
                </span>
                <app-svg-icon
                    icon="chevron-down"
                    size="0.875rem"
                    class="copy-to-dialog__selector-chevron"
                    [class.copy-to-dialog__selector-chevron--open]="dropdownOpen()"
                ></app-svg-icon>
            </button>

            @if (dropdownOpen()) {
                <!-- Tab cycles inside the open list; Escape or picking a folder hands the focus back to the selector. -->
                <div
                    class="copy-to-dialog__dropdown"
                    cdkTrapFocus
                    [style.max-height.px]="dropdownMaxHeight()"
                    (click)="stopPropagation($event)"
                >
                    <div class="copy-to-dialog__search">
                        <app-svg-icon
                            icon="search"
                            size="0.875rem"
                            class="copy-to-dialog__search-icon"
                        ></app-svg-icon>
                        <input
                            #folderSearchInput
                            class="copy-to-dialog__search-input"
                            type="text"
                            placeholder="Search folder..."
                            aria-label="Search folder"
                            matTooltip="Search folder"
                            [ngModel]="searchQuery()"
                            (ngModelChange)="searchQuery.set($event)"
                            (keydown.enter)="$event.preventDefault()"
                        />
                    </div>

                    <div class="copy-to-dialog__tree">
                        @if (isLoadingRoot()) {
                            <div class="copy-to-dialog__state">Loading folders...</div>
                        } @else if (visibleNodes().length === 0) {
                            <div class="copy-to-dialog__state">No folders found</div>
                        } @else {
                            <div
                                class="copy-to-dialog__node"
                                [class.copy-to-dialog__node--selected]="isSelected('')"
                                [style.padding-left.px]="12"
                                (click)="selectFolder('')"
                            >
                                <span
                                    class="copy-to-dialog__chevron-btn copy-to-dialog__chevron-btn--open"
                                    aria-hidden="true"
                                >
                                    <app-svg-icon
                                        icon="expand"
                                        size="0.5rem"
                                    ></app-svg-icon>
                                </span>
                                <app-svg-icon
                                    class="copy-to-dialog__node-icon"
                                    icon="folder-storage"
                                    size="12px"
                                ></app-svg-icon>
                                <!-- Picks the folder, from the keyboard too; its click reaches the row's handler. -->
                                <button
                                    type="button"
                                    class="copy-to-dialog__node-name"
                                    [attr.aria-pressed]="isSelected('')"
                                    matTooltip="/"
                                >
                                    /
                                </button>
                            </div>
                            @for (node of visibleNodes(); track node.path) {
                                <div
                                    class="copy-to-dialog__node"
                                    [class.copy-to-dialog__node--selected]="isSelected(node.path)"
                                    [style.padding-left.px]="32 + node.level * 20"
                                    (click)="selectFolder(node.path)"
                                >
                                    @if (canExpand(node)) {
                                        <button
                                            type="button"
                                            class="copy-to-dialog__chevron-btn"
                                            [class.copy-to-dialog__chevron-btn--open]="node.isExpanded"
                                            [attr.aria-expanded]="node.isExpanded"
                                            [attr.aria-label]="(node.isExpanded ? 'Collapse ' : 'Expand ') + node.name"
                                            [matTooltip]="(node.isExpanded ? 'Collapse ' : 'Expand ') + node.name"
                                            (click)="toggleExpand($event, node)"
                                        >
                                            <app-svg-icon
                                                icon="expand"
                                                size="0.5rem"
                                            ></app-svg-icon>
                                        </button>
                                    } @else {
                                        <span class="copy-to-dialog__chevron-gap"></span>
                                    }

                                    <app-svg-icon
                                        class="copy-to-dialog__node-icon"
                                        [class.copy-to-dialog__node-icon--empty]="node.isEmpty"
                                        icon="folder-storage"
                                        size="12px"
                                    ></app-svg-icon>

                                    <!-- Picks the folder, from the keyboard too (its click reaches the row's handler);
                                         Right and Left arrows expand and collapse it. -->
                                    <button
                                        type="button"
                                        class="copy-to-dialog__node-name"
                                        [attr.aria-pressed]="isSelected(node.path)"
                                        [matTooltip]="'/' + node.path"
                                        (keydown)="onFolderKeydown($event, node)"
                                    >
                                        {{ node.name }}
                                    </button>

                                    @if (node.isEmpty) {
                                        <span class="copy-to-dialog__empty-badge">Empty</span>
                                    }
                                </div>
                            }
                        }
                    </div>
                </div>
            }
        </div>
    </div>

    <div class="copy-to-dialog__footer">
        <button
            type="button"
            class="copy-to-dialog__btn copy-to-dialog__btn--cancel"
            matTooltip="Cancel"
            (click)="onCancel()"
        >
            Cancel
        </button>
        <button
            type="button"
            class="copy-to-dialog__btn copy-to-dialog__btn--confirm"
            matTooltip="Copy"
            [disabled]="!isValid"
            (click)="onConfirm()"
        >
            Copy
        </button>
    </div>
</div>

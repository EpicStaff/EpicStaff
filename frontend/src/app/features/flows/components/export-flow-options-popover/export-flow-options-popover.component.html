<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin()"
    [cdkConnectedOverlayOpen]="open()"
    [cdkConnectedOverlayPositions]="positions"
    [cdkConnectedOverlayHasBackdrop]="false"
    (overlayOutsideClick)="close()"
    (overlayKeydown)="onOverlayKeydown($event)"
    (detach)="close()"
>
    <div
        class="popover"
        role="dialog"
        aria-labelledby="export-flow-options-title"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
    >
        <div
            id="export-flow-options-title"
            class="popover__header"
        >
            Export options
        </div>

        <div class="popover__row">
            <label class="popover__option">
                <app-checkbox
                    color="primary"
                    [(checked)]="includeKnowledge"
                />
                Include knowledge data
            </label>
            <app-help-tooltip
                size="0.875rem"
                class="help-icon"
                text="Add the knowledge collections the flows use, with their files, so they work after import. The archive can get large."
                tooltipClass="builtin-copy-tooltip"
                position="right"
            />
        </div>

        <div class="popover__footer">
            <app-button
                type="primary"
                mod="small"
                (click)="confirm()"
            >
                Export
            </app-button>
        </div>
    </div>
</ng-template>

<div
    class="item-details grid-collapsible"
    [class.expanded]="expanded()"
>
    <div class="item-details-grid">
        @for (entry of fields(); track entry.label) {
            <div class="detail-key">{{ entry.label }}</div>
            <div class="detail-value">{{ entry.value }}</div>
        }
    </div>
</div>

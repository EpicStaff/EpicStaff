@if (clickable()) {
    <button
        type="button"
        class="status-badge"
        [ngClass]="reviewed() ? 'status-reviewed' : 'status-needs-review'"
        [attr.aria-pressed]="reviewed()"
        [matTooltip]="label()"
        (click)="onToggle($event)"
    >
        <app-svg-icon
            [icon]="reviewed() ? 'review-checkmark' : 'review-circle'"
            size="10px"
        ></app-svg-icon>
        {{ label() }}
    </button>
} @else {
    <span
        class="status-badge"
        [ngClass]="reviewed() ? 'status-reviewed' : 'status-needs-review'"
    >
        <app-svg-icon
            [icon]="reviewed() ? 'review-checkmark' : 'review-circle'"
            size="10px"
        ></app-svg-icon>
        {{ label() }}
    </span>
}

<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="open"
    [cdkConnectedOverlayPositions]="positions"
    [cdkConnectedOverlayHasBackdrop]="false"
    (overlayOutsideClick)="close()"
    (detach)="close()"
>
    <div class="popover">
        <div class="popover__header">Import options</div>

        <div class="popover__section">
            <div class="popover__row">
                <span class="popover__label">
                    Preserve Flow UUIDs
                    <app-help-tooltip
                        size="0.875rem"
                        class="help-icon"
                        text="Imported flows keep their UUIDs from the source system. If a flow already uses that UUID, the import gets a new one, unless that flow is in this organization and Replace existing is on."
                        tooltipClass="builtin-copy-tooltip"
                        position="right"
                    />
                </span>
                <div
                    class="toggle-group"
                    (click)="togglePreserveUuids()"
                >
                    <div
                        class="toggle-slider"
                        [class.right]="settings().preserveUuids"
                    ></div>
                    <button
                        type="button"
                        class="toggle-btn"
                        [class.text-active]="!settings().preserveUuids"
                    >
                        No
                    </button>
                    <button
                        type="button"
                        class="toggle-btn"
                        [class.text-active]="settings().preserveUuids"
                    >
                        Yes
                    </button>
                </div>
            </div>

            @if (settings().preserveUuids && canReplaceExisting()) {
                <div class="popover__row popover__row--nested">
                    <span class="popover__label">
                        Replace existing
                        <app-help-tooltip
                            size="0.875rem"
                            class="help-icon"
                            text="Overwrite the flow in this organization with the same UUID instead of adding a copy; subflows in the file overwrite theirs too, for every flow that uses them. It keeps its id, sessions, versions and webhook/Telegram credentials, and flows that use it as a subflow keep working. Nodes come from the file, so schedules are switched off. A 'Before import' version is saved for rollback."
                            tooltipClass="builtin-copy-tooltip"
                            position="right"
                        />
                    </span>
                    <div
                        class="toggle-group"
                        (click)="toggleReplaceExisting()"
                    >
                        <div
                            class="toggle-slider"
                            [class.right]="settings().replaceExisting"
                        ></div>
                        <button
                            type="button"
                            class="toggle-btn"
                            [class.text-active]="!settings().replaceExisting"
                        >
                            No
                        </button>
                        <button
                            type="button"
                            class="toggle-btn"
                            [class.text-active]="settings().replaceExisting"
                        >
                            Yes
                        </button>
                    </div>
                </div>
            }
        </div>

        <div class="popover__row">
            <span class="popover__label">
                Import labels
                <app-help-tooltip
                    size="0.875rem"
                    class="help-icon"
                    text="Include flow labels and categories during import. A replaced flow gets exactly the labels from the file."
                    tooltipClass="builtin-copy-tooltip"
                    position="right"
                />
            </span>
            <div
                class="toggle-group"
                (click)="toggleImportLabels()"
            >
                <div
                    class="toggle-slider"
                    [class.right]="settings().importLabels"
                ></div>
                <button
                    type="button"
                    class="toggle-btn"
                    [class.text-active]="!settings().importLabels"
                >
                    No
                </button>
                <button
                    type="button"
                    class="toggle-btn"
                    [class.text-active]="settings().importLabels"
                >
                    Yes
                </button>
            </div>
        </div>

        <div class="popover__footer">
            <button
                type="button"
                class="popover__reset"
                (click)="resetDefaults()"
            >
                Reset to defaults
            </button>
        </div>
    </div>
</ng-template>

<div
    class="menu-container"
    [ngClass]="{ 'menu-active': isMenuOpen() }"
    (keydown.escape)="closeOnEscape($event)"
>
    <button
        #menuTrigger
        type="button"
        class="menu-button"
        [class.active]="isMenuOpen()"
        aria-label="Options"
        aria-haspopup="menu"
        [attr.aria-expanded]="isMenuOpen()"
        matTooltip="Options"
        matTooltipPosition="left"
        (click)="toggleMenu($event)"
        (mouseenter)="onButtonEnter()"
        (mouseleave)="onButtonLeave()"
    >
        <app-svg-icon
            icon="dots-vertical"
            size="1rem"
        ></app-svg-icon>
    </button>
    @if (isMenuOpen()) {
        <!-- Takes the focus on opening and hands it back to the ⋮ button when it closes. -->
        <div
            class="context-menu"
            role="menu"
            cdkTrapFocus
            [cdkTrapFocusAutoCapture]="true"
            (mouseenter)="onMenuEnter()"
            (mouseleave)="onMenuLeave()"
        >
            <app-flow-menu-item
                label="View Sessions"
                (itemClick)="onActionClick($event, 'viewSessions')"
            ></app-flow-menu-item>
            <app-flow-menu-item
                *appHasPermission="[ResourceCode.Flows, ActionCode.Use]"
                label="Run"
                (itemClick)="onActionClick($event, 'run')"
            ></app-flow-menu-item>
            <app-flow-menu-item
                *appHasPermission="[ResourceCode.Flows, ActionCode.Update]"
                label="Edit"
                (itemClick)="onActionClick($event, 'rename')"
            ></app-flow-menu-item>
            <app-flow-menu-item
                *appHasPermission="[ResourceCode.Flows, ActionCode.Create]"
                label="Copy"
                (itemClick)="onActionClick($event, 'copy')"
            ></app-flow-menu-item>
            <app-flow-menu-item
                *appHasPermission="[ResourceCode.Flows, ActionCode.Export]"
                label="Export"
                (itemClick)="onActionClick($event, 'export')"
            ></app-flow-menu-item>
            <!-- Read-only: anyone who sees the flow may see who authored it. -->
            <app-flow-menu-item
                label="View Details"
                (itemClick)="onActionClick($event, 'viewDetails')"
            ></app-flow-menu-item>
            <app-flow-menu-item
                *appHasPermission="[ResourceCode.Flows, ActionCode.Delete]"
                label="Delete"
                [isDelete]="true"
                (itemClick)="onActionClick($event, 'delete')"
            ></app-flow-menu-item>
        </div>
    }
</div>

<div class="dialog-container">
    <div class="dialog-header">
        <div class="dialog-title-row">
            <app-svg-icon
                icon="alert-circle"
                size="20px"
                class="warning-icon"
            />
            <h2 class="dialog-title">Missing Dependencies</h2>
        </div>
        <button
            class="close-button"
            (click)="dialogRef.close()"
        >
            <app-svg-icon
                icon="x"
                size="20px"
            />
        </button>
    </div>

    <div class="dialog-divider"></div>

    <p class="dialog-message">{{ message }}</p>

    <div class="warnings-list">
        @for (warning of data.warnings; track $index) {
            <div
                class="warning-item"
                [class.warning-item--clickable]="warning.node_id != null"
                (click)="selectWarning(warning)"
            >
                <span>
                    @if (warning.node_name) {
                        In node <strong>{{ warning.node_name }}</strong
                        >,&nbsp;
                    }
                    {{ warning.reason }}
                </span>
                @if (warning.node_id != null) {
                    <app-svg-icon
                        icon="chevron-right"
                        size="1rem"
                        class="warning-item-arrow"
                    />
                }
            </div>
        }
    </div>

    <div class="dialog-divider"></div>

    <div class="dialog-footer">
        <app-button
            type="outline-primary"
            (click)="dialogRef.close()"
            >Close</app-button
        >
        <app-button
            type="primary"
            (click)="dialogRef.close()"
            >Got it</app-button
        >
    </div>
</div>

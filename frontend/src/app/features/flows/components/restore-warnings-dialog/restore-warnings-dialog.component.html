<div class="dialog-container">
    <div class="dialog-header">
        <div class="dialog-title-row">
            <app-svg-icon
                icon="alert-circle"
                size="20px"
                class="warning-icon"
            />
            <h2 class="dialog-title">Missing Dependencies</h2>
        </div>
        <button
            type="button"
            class="close-button"
            aria-label="Close"
            matTooltip="Close"
            (click)="dialogRef.close()"
        >
            <app-svg-icon
                icon="x"
                size="20px"
            />
        </button>
    </div>

    <div class="dialog-divider"></div>

    <p class="dialog-message">{{ message }}</p>

    <div class="warnings-list">
        @for (warning of data.warnings; track $index) {
            <!-- A warning about a node opens that node: a button; any other is plain text. -->
            @if (warning.node_id != null) {
                <button
                    type="button"
                    class="warning-item warning-item--clickable"
                    matTooltip="Go to node"
                    (click)="selectWarning(warning)"
                >
                    <ng-container
                        [ngTemplateOutlet]="warningText"
                        [ngTemplateOutletContext]="{ $implicit: warning }"
                    />
                    <app-svg-icon
                        icon="chevron-right"
                        size="1rem"
                        class="warning-item-arrow"
                    />
                </button>
            } @else {
                <div class="warning-item">
                    <ng-container
                        [ngTemplateOutlet]="warningText"
                        [ngTemplateOutletContext]="{ $implicit: warning }"
                    />
                </div>
            }
        }
    </div>

    <ng-template
        #warningText
        let-warning
    >
        <span>
            @if (warning.node_name) {
                In node <strong>{{ warning.node_name }}</strong
                >,&nbsp;
            }
            {{ warning.reason }}
        </span>
    </ng-template>

    <div class="dialog-divider"></div>

    <div class="dialog-footer">
        <app-button
            type="outline-primary"
            (click)="dialogRef.close()"
            >Close</app-button
        >
        <app-button
            type="primary"
            (click)="dialogRef.close()"
            >Got it</app-button
        >
    </div>
</div>

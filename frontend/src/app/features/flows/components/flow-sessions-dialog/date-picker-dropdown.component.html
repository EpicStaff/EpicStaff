<button
    #triggerEl
    type="button"
    class="cd-toggle"
    [class.cd-toggle--active]="hasValue || isOpen"
    aria-haspopup="dialog"
    [attr.aria-expanded]="isOpen"
    matTooltip="Filter by date"
    (click)="toggle($event)"
>
    <ng-content></ng-content>
    <app-svg-icon
        icon="date-filter"
        size="16px"
    ></app-svg-icon>
</button>

<ng-template #dropdownTemplate>
    <!-- Takes the focus when it opens and hands it back to the toggle when it closes. -->
    <div
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
    >
        <app-date-range-picker
            [value]="value"
            (apply)="onSelect($event)"
            (clear)="clear()"
        />
    </div>
</ng-template>

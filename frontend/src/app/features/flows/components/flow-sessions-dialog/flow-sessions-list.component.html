<div class="dialog-wrapper">
    <div class="dialog-header">
        <h2>Sessions for {{ flow.name }}</h2>
        <button
            type="button"
            class="close-button"
            aria-label="Close dialog"
            matTooltip="Close"
            matTooltipPosition="below"
            (click)="dialogRef.close()"
        >
            <app-svg-icon
                icon="x"
                size="1.5rem"
            />
        </button>
    </div>

    <div class="dialog-content">
        <div class="filter-controls">
            <app-search
                class="id-search"
                icon="search-bold"
                iconSize="1rem"
                placeholder="Search by ID..."
                (searchTermChange)="onIdSearchChange($event)"
            />

            <div class="action-buttons">
                <button
                    class="delete-btn"
                    [class.delete-btn--hidden]="selectedIds().size === 0"
                    (click)="onBulkDelete()"
                >
                    Delete Selected
                </button>
                <app-action-dropdown-button
                    *appHasPermission="[ResourceCode.Flows, ActionCode.Export]"
                    [label]="'Export (' + (selectedIds().size === 0 ? totalCount() : selectedIds().size) + ')'"
                    [items]="exportItems"
                    [buttonWidth]="null"
                    [disabled]="isDeleting() || isExporting() || (selectedIds().size === 0 && totalCount() === 0)"
                    (mainClick)="onExport('json')"
                    (itemClick)="onExportItemSelected($event)"
                />
            </div>
        </div>
        <div class="table-container">
            <app-flow-sessions-table
                [sessions]="sessions()"
                [flow]="flow"
                [isLoading]="!isLoaded()"
                [showEmptyState]="isLoaded() && sessions().length === 0"
                [selectedIds]="selectedIds()"
                (deleteSelected)="onDeleteSelected($event)"
                (viewSession)="onViewSession($event)"
                (stopSession)="onStopSession($event)"
                [statusFilter]="statusFilter()"
                (statusFilterChange)="onStatusFilterChange($event)"
                [trigger]="triggerFilter()"
                (triggerFilterChange)="onTriggerFilterChange($event)"
                [runTypeFilter]="runTypeFilter()"
                (runTypeFilterChange)="onRunTypeFilterChange($event)"
                [showDateFilter]="true"
                [dateFilter]="dateFilter()"
                (dateFilterChange)="onDateFilterChange($event)"
                (selectedIdsChange)="onSelectedIdsChange($event)"
            >
            </app-flow-sessions-table>
        </div>

        <div class="pagination-container">
            <div class="page-size-selector">
                <span>Sessions to display:</span>
                <app-input-number
                    class="page-size-input"
                    ariaLabel="Sessions to display"
                    [alwaysShowSteps]="true"
                    [min]="pageSizeMin"
                    [max]="pageSizeMax()"
                    [stepSize]="pageSizeStep"
                    [(value)]="pageSizeDraft"
                    (changed)="onPageSizeChange($event)"
                    (focusout)="onPageSizeCommit()"
                    (wheel)="$event.preventDefault()"
                    (keydown.enter)="onPageSizeCommit()"
                />
            </div>
            @if (isLoaded() && totalCount() > pageSize()) {
                <app-pagination-controls
                    [pageSize]="pageSize()"
                    [totalCount]="totalCount()"
                    [currentPage]="currentPage()"
                    [maxPagesToShow]="5"
                    (pageChange)="onPageChange($event)"
                >
                </app-pagination-controls>
            }
        </div>
    </div>
</div>

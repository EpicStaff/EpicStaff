<div
    class="dur-dropdown"
    [class.open]="open"
    [class.has-value]="hasValue"
    (appClickOutside)="close()"
>
    <button
        class="toggle-btn"
        (click)="toggle($event)"
    >
        <span>{{ label }}</span>
        <app-svg-icon
            icon="menu"
            size="16px"
        ></app-svg-icon>
    </button>

    @if (open) {
        <div class="dur-panel">
            <div class="op-row">
                @for (op of operators; track op.value) {
                    <button
                        class="op-btn"
                        [class.op-btn--active]="selectedOperator === op.value"
                        (click)="selectOperator(op.value)"
                    >
                        {{ op.label }}
                    </button>
                }
            </div>

            <div class="unit-row">
                @for (u of units; track u.value) {
                    <button
                        class="unit-btn"
                        [class.unit-btn--active]="selectedUnit === u.value"
                        (click)="selectUnit(u.value)"
                    >
                        {{ u.label }}
                    </button>
                }
            </div>

            <div class="input-row">
                <input
                    class="dur-input"
                    type="number"
                    min="0"
                    step="1"
                    [placeholder]="selectedUnit"
                    [(ngModel)]="val1"
                    (keydown.enter)="apply()"
                />
                @if (selectedOperator === 'between') {
                    <span class="sep">—</span>
                    <input
                        class="dur-input"
                        type="number"
                        min="0"
                        step="1"
                        [placeholder]="selectedUnit"
                        [(ngModel)]="val2"
                        (keydown.enter)="apply()"
                    />
                }
            </div>

            <div class="action-row">
                <button
                    class="apply-btn"
                    (click)="apply()"
                >
                    Apply
                </button>
                @if (value !== null) {
                    <button
                        class="clear-btn"
                        (click)="clear()"
                    >
                        Clear
                    </button>
                }
            </div>
        </div>
    }
</div>

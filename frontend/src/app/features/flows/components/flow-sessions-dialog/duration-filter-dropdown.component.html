<div
    class="dur-dropdown"
    [class.open]="open"
    [class.has-value]="hasValue"
    (appClickOutside)="close()"
    (keydown.escape)="closeOnEscape($event)"
>
    <button
        type="button"
        class="toggle-btn"
        aria-haspopup="dialog"
        [attr.aria-expanded]="open"
        matTooltip="Filter by duration"
        (click)="toggle($event)"
    >
        <span>{{ label }}</span>
        <app-svg-icon
            icon="menu"
            size="16px"
        ></app-svg-icon>
    </button>

    @if (open) {
        <!-- Takes the focus when it opens and hands it back to the toggle when it closes. -->
        <div
            class="dur-panel"
            cdkTrapFocus
            [cdkTrapFocusAutoCapture]="true"
        >
            <div class="op-row">
                @for (op of operators; track op.value) {
                    <button
                        type="button"
                        class="op-btn"
                        [class.op-btn--active]="selectedOperator === op.value"
                        [attr.aria-pressed]="selectedOperator === op.value"
                        [matTooltip]="'Comparison: ' + op.label"
                        (click)="selectOperator(op.value)"
                    >
                        {{ op.label }}
                    </button>
                }
            </div>

            <div class="unit-row">
                @for (u of units; track u.value) {
                    <button
                        type="button"
                        class="unit-btn"
                        [class.unit-btn--active]="selectedUnit === u.value"
                        [attr.aria-pressed]="selectedUnit === u.value"
                        [matTooltip]="'Unit: ' + u.label"
                        (click)="selectUnit(u.value)"
                    >
                        {{ u.label }}
                    </button>
                }
            </div>

            <div class="input-row">
                <input
                    class="dur-input"
                    type="number"
                    min="0"
                    step="1"
                    [placeholder]="selectedUnit"
                    [attr.aria-label]="firstValueLabel"
                    [matTooltip]="firstValueLabel"
                    [(ngModel)]="val1"
                    (keydown.enter)="apply()"
                />
                @if (selectedOperator === 'between') {
                    <span class="sep">—</span>
                    <input
                        class="dur-input"
                        type="number"
                        min="0"
                        step="1"
                        [placeholder]="selectedUnit"
                        aria-label="To"
                        matTooltip="To"
                        [(ngModel)]="val2"
                        (keydown.enter)="apply()"
                    />
                }
            </div>

            <div class="action-row">
                <button
                    type="button"
                    class="apply-btn"
                    matTooltip="Apply"
                    (click)="apply()"
                >
                    Apply
                </button>
                @if (value !== null) {
                    <button
                        type="button"
                        class="clear-btn"
                        matTooltip="Clear"
                        (click)="clear()"
                    >
                        Clear
                    </button>
                }
            </div>
        </div>
    }
</div>

<div
    class="filter-group"
    [class.filter-group--expanded]="isOpen()"
    [class.filter-group--disabled]="disabled()"
    [matTooltip]="disabled() ? hint() : ''"
    matTooltipPosition="above"
>
    <div class="filter-group__header-row">
        <button
            class="filter-group__header"
            type="button"
            [attr.aria-expanded]="isOpen()"
            [attr.aria-description]="disabled() && hint() ? hint() : null"
            [disabled]="disabled()"
            (click)="toggle()"
        >
            <app-svg-icon
                class="filter-group__chevron"
                [class.filter-group__chevron--collapsed]="!isOpen()"
                icon="chevron-down-filled"
                size="8px"
            />
            <span class="filter-group__title">{{ label() }}</span>
            @if (hint() && !disabled()) {
                <span class="filter-group__hint">{{ hint() }}</span>
            }
            @if (summary()) {
                <span
                    class="filter-group__summary"
                    [title]="summary()"
                    >{{ summary() }}</span
                >
            }
        </button>
        @if (summary()) {
            <button
                class="filter-group__clear"
                type="button"
                [attr.aria-label]="'Clear ' + label()"
                (click)="cleared.emit()"
            >
                <app-svg-icon
                    icon="x"
                    size="12px"
                />
            </button>
        }
    </div>

    <div
        class="filter-group__body"
        [class.is-collapsed]="!isOpen()"
        [attr.inert]="isOpen() ? null : ''"
    >
        <div class="filter-group__clip">
            <div class="filter-group__content">
                <ng-content />
            </div>
        </div>
    </div>
</div>

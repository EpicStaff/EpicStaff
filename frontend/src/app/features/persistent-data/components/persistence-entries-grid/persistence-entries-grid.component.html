<section class="entries-grid">
    <header class="entries-grid__header">
        <h2 class="entries-grid__title">{{ table().name }}</h2>
        @if (canCreate()) {
            <app-button
                type="primary-white"
                leftIcon="plus"
                (click)="onAdd()"
            >
                Add entry
            </app-button>
        }
    </header>

    <div class="entries-grid__body">
        <app-table
            [columns]="columns()"
            [data]="rows()"
            [hasExternalFilter]="!!search()"
            rowId="id"
            (headerIconClick)="onSortToggle($event.key)"
        >
            <ng-template
                appTableCell="key"
                let-row
            >
                <div
                    class="entries-grid__cell"
                    [class.entries-grid__cell--editable]="canUpdate()"
                    (dblclick)="onCellDoubleClick(row)"
                >
                    <span
                        class="entries-grid__key"
                        [attr.title]="canUpdate() ? 'Double-click to edit' : null"
                        >{{ row['key'] }}</span
                    >
                    <!-- A fast double click on Copy must not also open the editor. -->
                    <app-copy-button
                        class="entries-grid__copy"
                        ariaLabel="Copy key"
                        [text]="row['key']"
                        (dblclick)="$event.stopPropagation()"
                    />
                </div>
            </ng-template>

            <ng-template
                appTableCell="preview"
                let-row
            >
                <div
                    class="entries-grid__cell"
                    [class.entries-grid__cell--editable]="canUpdate()"
                    (dblclick)="onCellDoubleClick(row)"
                >
                    <span
                        class="entries-grid__preview"
                        [attr.title]="canUpdate() ? 'Double-click to edit' : null"
                        >{{ row['preview'] }}</span
                    >
                    <app-copy-button
                        class="entries-grid__copy"
                        ariaLabel="Copy value"
                        [text]="row['copy_text']"
                        (dblclick)="$event.stopPropagation()"
                    />
                </div>
            </ng-template>

            <ng-template
                appTableCell="session_label"
                let-row
            >
                @if (row['session_label']; as label) {
                    <a
                        class="entries-grid__session-link"
                        [title]="label"
                        [routerLink]="['/graph', row['updated_by_graph'], 'session', row['updated_by_session']]"
                        >{{ label }}</a
                    >
                } @else {
                    <span class="entries-grid__no-session">—</span>
                }
            </ng-template>

            <ng-template
                appTableCell="updated_at"
                let-row
            >
                <span class="entries-grid__updated">{{ row['updated_at'] | date: dateFormat }}</span>
            </ng-template>

            <div
                tableNoResults
                class="entries-grid__empty"
            >
                No entries match your search.
            </div>
            @if (!loading()) {
                <p
                    tableEmpty
                    class="entries-grid__empty"
                >
                    No entries yet
                </p>
            }
        </app-table>
    </div>

    <app-pagination-controls
        [pageSize]="pageSize"
        [totalCount]="totalCount()"
        [currentPage]="page()"
        (pageChange)="page.set($event)"
    />
</section>

<div class="persistence-dialog persistence-dialog--wide">
    <header class="persistence-dialog__header">
        <span class="persistence-dialog__title">{{ isEdit ? 'Edit entry' : 'Add entry' }}</span>
        <app-svg-icon
            class="persistence-dialog__close-btn"
            icon="close"
            size="16px"
            matTooltip="Close"
            matTooltipPosition="above"
            (click)="cancel()"
        />
    </header>

    <form
        class="persistence-dialog__form"
        [formGroup]="form"
    >
        @if (errorMessage()) {
            <div class="persistence-dialog__error-message">
                <p>{{ errorMessage() }}</p>
            </div>
        }

        <div>
            <app-custom-input
                label="Key"
                formControlName="key"
                [required]="true"
                placeholder="e.g. profile_42"
            />
            <app-validation-errors [control]="form.controls.key" />
        </div>

        <app-json-editor-form-field
            label="Value (JSON)"
            formControlName="value"
            [required]="true"
            [editorHeight]="240"
        />
    </form>

    <div class="persistence-dialog__actions">
        <app-button
            type="outline-primary"
            (click)="cancel()"
        >
            Cancel
        </app-button>
        <app-button
            type="primary-white"
            [disabled]="form.invalid || isSubmitting()"
            (click)="submit()"
        >
            {{ isSubmitting() ? 'Saving...' : 'Save' }}
        </app-button>
    </div>
</div>

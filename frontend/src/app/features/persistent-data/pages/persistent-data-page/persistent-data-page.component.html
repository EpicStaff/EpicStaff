<div class="persistent-data-page">
    <aside class="persistent-data-page__sidebar">
        <app-persistence-table-list
            [tables]="visibleTables()"
            [selectedId]="selectedTableId()"
            [canManage]="canManage()"
            (selected)="selectedTableId.set($event.id)"
            (renameRequested)="onRename($event)"
            (deleteRequested)="onDelete($event)"
        />
    </aside>

    <section class="persistent-data-page__content">
        @if (selectedTable(); as table) {
            <app-persistence-entries-grid
                [table]="table"
                [canEdit]="canEdit()"
                (changed)="persistenceTablesStorage.triggerRefresh()"
            />
        }
    </section>
</div>

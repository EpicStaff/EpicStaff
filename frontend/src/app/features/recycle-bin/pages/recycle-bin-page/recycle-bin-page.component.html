<div class="recycle-bin-page">
    <div class="sticky-header">
        <header class="header">
            <div
                class="header-titles"
                appHideInlineSubtitleOnOverflow
            >
                <h1 class="title">
                    Recycle Bin
                    <span class="subtitle-inline">{{ subtitle() }}</span>
                </h1>
            </div>
            @if (canEmpty()) {
                <div class="header-actions">
                    <app-button
                        class="empty-bin-btn"
                        type="outline-primary"
                        leftIcon="trash"
                        iconSize="14px"
                        [ariaDisabled]="emptying()"
                        (click)="onEmptyRecycleBin()"
                    >
                        {{ emptyButtonLabel() }}
                    </app-button>
                </div>
            }
        </header>
        <app-route-tabs
            class="tabs"
            [tabs]="routeTabs()"
        />
    </div>
    <section class="body">
        <router-outlet></router-outlet>
    </section>
</div>

<div
    class="tool-card"
    appLabelDrop
    [resourceCode]="ResourceCode.Tools"
    [class.selected]="selected()"
    [class.drag-over]="cardDrop.isDragOver()"
    (click)="onCardClick()"
    (labelDropped)="onLabelDropped($event)"
    #cardDrop="appLabelDrop"
>
    <div class="card-body">
        <div class="card-top-row">
            <div class="card-top-left">
                <span
                    class="checkbox-hit"
                    (click)="$event.stopPropagation(); onCheckboxHitClick($event)"
                >
                    <app-checkbox
                        color="secondary"
                        [ariaLabel]="'Select ' + tool().name"
                        [checked]="selected()"
                        (changed)="onSelectToggle($event)"
                    />
                </span>
                <app-svg-icon
                    icon="tools"
                    size="1rem"
                />

                @if (showUsage() && !tool().unused) {
                    <button
                        type="button"
                        class="usage-chip"
                        aria-label="Show used places"
                        matTooltip="Show used places"
                        (click)="$event.stopPropagation(); onUsageChipClick()"
                    >
                        @if (tool().agentSurfaceUsage) {
                            <span class="chip-item">
                                <app-svg-icon
                                    icon="agent"
                                    size="1rem"
                                />
                                <span>{{ tool().agentSurfaceUsage }}</span>
                            </span>
                        }
                        @if (tool().sharedSurfaceUsage) {
                            <span class="chip-item">
                                <app-svg-icon
                                    icon="surfaces-tab"
                                    size="0.875rem"
                                />
                                <span>{{ tool().sharedSurfaceUsage }}</span>
                            </span>
                        }
                        @if (tool().inlineSurfaceUsage) {
                            <span class="chip-item">
                                <app-svg-icon
                                    icon="local-surface"
                                    size="1rem"
                                />
                                <span>{{ tool().inlineSurfaceUsage }}</span>
                            </span>
                        }
                    </button>
                }
            </div>

            <div class="card-top-right">
                <button
                    type="button"
                    class="star-btn"
                    aria-label="Favorite"
                    [attr.aria-pressed]="!!tool().favorite"
                    [matTooltip]="tool().favorite ? 'Remove from favorites' : 'Add to favorites'"
                    [class.active]="tool().favorite"
                    (click)="$event.stopPropagation(); onStarClick($event)"
                >
                    <app-svg-icon
                        [icon]="tool().favorite ? 'star-filled' : 'star'"
                        size="1.125rem"
                    />
                </button>
                <button
                    #menuTrigger="cdkOverlayOrigin"
                    cdkOverlayOrigin
                    type="button"
                    class="menu-btn"
                    aria-label="Options"
                    aria-haspopup="menu"
                    [attr.aria-expanded]="menuOpen()"
                    matTooltip="Options"
                    [class.active]="menuOpen()"
                    (click)="$event.stopPropagation(); toggleMenu($event)"
                    (mouseenter)="onButtonEnter()"
                    (mouseleave)="onButtonLeave()"
                >
                    <app-svg-icon
                        icon="dots-vertical"
                        size="1rem"
                    />
                </button>

                <!-- Escape detaches the overlay, which closes the menu; its focus trap returns the focus to the ⋮ button. -->
                <ng-template
                    cdkConnectedOverlay
                    [cdkConnectedOverlayOrigin]="menuTrigger"
                    [cdkConnectedOverlayOpen]="menuOpen()"
                    [cdkConnectedOverlayOffsetX]="6"
                    [cdkConnectedOverlayPositions]="[
                        {
                            originX: 'end',
                            originY: 'top',
                            overlayX: 'start',
                            overlayY: 'top',
                        },
                        {
                            originX: 'start',
                            originY: 'top',
                            overlayX: 'end',
                            overlayY: 'top',
                        },
                    ]"
                    (overlayOutsideClick)="onOverlayOutsideClick()"
                    (detach)="closeMenu()"
                >
                    <app-tool-card-menu
                        [toolLabelIds]="tool().labelIds"
                        [isBuiltIn]="!!tool().builtIn"
                        (actionSelected)="onMenuAction($event)"
                        (labelsChanged)="onMenuLabelsChanged($event)"
                        (labelsOpenChange)="onLabelsOpenChange($event)"
                        (mouseenter)="onMenuEnter()"
                        (mouseleave)="onMenuLeave()"
                    />
                </ng-template>
            </div>
        </div>

        <div class="card-main">
            <div class="card-main-info">
                <!-- Opens the tool, from the keyboard too; its click reaches the card's handler. -->
                <button
                    type="button"
                    #nameButton
                    class="card-name"
                    [matTooltip]="tool().name"
                >
                    {{ tool().name }}
                </button>
                <div class="card-description">{{ tool().description }}</div>
            </div>

            @if (labels().length > 0) {
                <div
                    class="card-labels"
                    (click)="$event.stopPropagation()"
                    (wheel)="onLabelsWheel($event)"
                >
                    @for (label of labels(); track label.id) {
                        <span
                            class="label-chip"
                            [style.background]="chipBg(label)"
                            [style.color]="chipColor(label)"
                            [matTooltip]="label.full_path || label.name"
                            matTooltipClass="allow-scroll-tooltip"
                        >
                            {{ label.name }}
                        </span>
                    }
                </div>
            }
        </div>
    </div>

    <div class="card-footer">
        <app-svg-icon
            class="card-icon"
            [icon]="ToolCardIcon[tool().kind]"
            size="1rem"
        />
        @if (tool().builtIn) {
            <span class="built-in-pill">Built in</span>
        }
    </div>
</div>

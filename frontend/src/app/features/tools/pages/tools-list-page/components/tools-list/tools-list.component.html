<div class="tools-list">
    @if (!isLoaded()) {
        <app-loading-spinner
            size="md"
            [message]="loadingMessage()"
        ></app-loading-spinner>
    } @else {
        @if (error()) {
            <div class="error">{{ error() }}</div>
            <button
                type="button"
                (click)="reload()"
            >
                Retry
            </button>
        } @else {
            <div class="tools-list-grid">
                @if (cards().length === 0) {
                    <div class="empty-message">
                        <p>{{ emptyMessage() }}</p>
                    </div>
                } @else {
                    @for (card of cards(); track card.id) {
                        <app-tool-card
                            [tool]="card"
                            [selected]="viewState.isSelected(card.id)"
                            [showUsage]="viewState.showUsageAndUnused()"
                            (configure)="onCardConfigure($event)"
                            (selectedChange)="onCardSelectedChange($event)"
                            (favoriteChange)="onCardFavoriteChange($event)"
                            (labelsChange)="onCardLabelsChange($event)"
                            (menuAction)="onCardMenuAction($event)"
                        ></app-tool-card>
                    }
                }
            </div>
        }
    }
</div>

<div class="custom-tools">
    @if (!isLoaded()) {
        <app-loading-spinner
            size="md"
            message="Loading custom tools..."
        ></app-loading-spinner>
    } @else {
        @if (error()) {
            <div class="error">{{ error() }}</div>
            <button
                type="button"
                (click)="ngOnInit()"
            >
                Retry
            </button>
        } @else {
            <div class="custom-tools-grid">
                @if (tools().length === 0) {
                    <div class="empty-message">
                        <p>No custom tools found.</p>
                    </div>
                } @else {
                    @for (card of cards(); track card.id) {
                        <app-tool-card
                            [tool]="card"
                            (configure)="onCardConfigure($event)"
                            (menuAction)="onCardMenuAction($event)"
                        ></app-tool-card>
                    }
                }
            </div>
        }
    }
</div>

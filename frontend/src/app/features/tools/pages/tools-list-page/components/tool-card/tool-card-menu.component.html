<div
    #panel
    class="card-menu"
    role="menu"
    (click)="$event.stopPropagation()"
>
    <button
        *appHasPermission="[ResourceCode.Tools, ActionCode.Create]"
        type="button"
        class="menu-item"
        role="menuitem"
        (click)="onSelect('duplicate')"
    >
        <span class="label">Duplicate</span>
    </button>
    <button
        *appHasPermission="[ResourceCode.Tools, ActionCode.Update]"
        type="button"
        class="menu-item"
        role="menuitem"
        (click)="$event.stopPropagation(); ld.openAt(panel, labelsPositions)"
    >
        <span class="label">Manage Labels</span>
    </button>
    <button
        *appHasPermission="[ResourceCode.Tools, ActionCode.Export]"
        type="button"
        class="menu-item"
        role="menuitem"
        (click)="onSelect('export')"
    >
        <span class="label">Export</span>
    </button>
    <button
        type="button"
        class="menu-item"
        role="menuitem"
        (click)="onSelect('show_used_places')"
    >
        <span class="label">Show Used Places</span>
    </button>
    @if (!isBuiltIn()) {
        <!-- Read-only: anyone who sees the tool may see who authored it. Built-in tools have no author. -->
        <button
            type="button"
            class="menu-item"
            role="menuitem"
            (click)="onSelect('view_details')"
        >
            <span class="label">View Details</span>
        </button>
        <button
            *appHasPermission="[ResourceCode.Tools, ActionCode.Delete]"
            type="button"
            class="menu-item"
            role="menuitem"
            (click)="onSelect('delete')"
        >
            <span class="label">Delete</span>
        </button>
    }

    <!-- Label picker (custom trigger: the "Add Label" menu-item button above). -->
    <app-label-dropdown
        #ld
        [hideTrigger]="true"
        [selectedLabelIds]="toolLabelIds()"
        (selectionChange)="onLabelsChanged($event)"
    />
</div>

<!-- Takes the focus when it opens and hands it back to the Bulk Actions button when it closes. -->
<div
    #panel
    class="bulk-menu"
    role="menu"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (click)="$event.stopPropagation()"
>
    @if (showManageLabels()) {
        <button
            type="button"
            class="menu-item"
            role="menuitem"
            aria-haspopup="menu"
            matTooltip="Manage Labels"
            (click)="$event.stopPropagation(); ld.openAt(panel, labelsPositions)"
        >
            <span class="label">Manage Labels</span>
            <app-svg-icon
                icon="arrow-right"
                size="0.7rem"
                class="chevron"
            />
        </button>

        <app-label-dropdown
            #ld
            [hideTrigger]="true"
            [selectedLabelIds]="commonLabelIds()"
            [indeterminateLabelIds]="partialLabelIds()"
            (bulkChange)="onLabelsApplied($event)"
        />
    }

    @for (action of actions(); track action.label) {
        @if (action.isPermitted) {
            <button
                type="button"
                class="menu-item"
                role="menuitem"
                [matTooltip]="action.label"
                (click)="onSelect(action)"
            >
                <span class="label">{{ action.label }}</span>
                @if (action.hasSubmenu) {
                    <app-svg-icon
                        icon="arrow-right"
                        size="0.7rem"
                        class="chevron"
                    />
                }
            </button>
        }
    }
</div>

<div
    class="dialog"
    (appEnterSubmit)="onSubmit()"
    [appEnterSubmitDisabled]="!canSubmit()"
>
    <div class="header">
        <span class="title">{{ dialogTitle() }}</span>
        <div class="actions">
            @if (canDuplicate()) {
                <app-button
                    leftIcon="copy"
                    type="outline-primary"
                    [disabled]="extensionRows.isLoading()"
                    (click)="onDuplicate()"
                >
                    Duplicate Role
                </app-button>
            }
            <app-button
                type="outline-primary"
                (click)="onCancel()"
            >
                Cancel
            </app-button>
            <app-button
                type="primary"
                [disabled]="!canSubmit()"
                (click)="onSubmit()"
            >
                {{ primaryButtonLabel() }}
            </app-button>
        </div>
    </div>

    <form
        class="subheader"
        [formGroup]="form"
    >
        @if (!isEditMode()) {
            <div class="control">
                <label class="label">Organization <span class="required">*</span></label>
                <!-- A new role's dialog opens with the focus here, its first field. -->
                <app-select
                    cdkFocusInitial
                    placeholder="Select organization..."
                    [items]="orgOptions()"
                    [selectedValue]="targetOrgId()"
                    (changed)="onTargetOrgChanged($event)"
                />
            </div>
        }

        <div class="control">
            <label class="label">Role Name <span class="required">*</span></label>
            <!-- The edit dialog opens with the focus here: the organization is fixed, so this is its first field. -->
            <app-custom-input
                [attr.cdkFocusInitial]="isEditMode() ? '' : null"
                placeholder="Enter the name..."
                ariaLabel="Role Name"
                formControlName="name"
            />
        </div>
        <app-validation-errors [control]="form.controls.name" />

        <div class="control">
            <label class="label">Description</label>
            <app-custom-input
                placeholder="Enter the description..."
                ariaLabel="Description"
                formControlName="description"
            />
        </div>
        <app-validation-errors [control]="form.controls.description" />
    </form>

    <!-- CONTENT: permissions -->
    <div class="content">
        @if (extensionNotice(); as notice) {
            <p
                class="permission-notice permission-notice--error"
                role="alert"
            >
                {{ notice }}
            </p>
        }
        @if (leftOutNotice(); as notice) {
            <p
                class="permission-notice permission-notice--warning"
                role="status"
            >
                {{ notice }}
            </p>
        }
        @if (catalog(); as cat) {
            <app-permissions-table
                [catalog]="cat"
                [extensionGroups]="extensionRows.groups()"
                [selectedPermissions]="matrixSelection()"
                [disabledPermissions]="disabledPermissions()"
                (permissionToggle)="onPermissionToggle($event)"
                (resourceToggle)="onResourceToggle($event)"
                (groupToggle)="onGroupToggle($event)"
                (groupActionToggle)="onGroupActionToggle($event)"
                (selectAllClick)="onSelectAll()"
                (clearAllClick)="onClearAll()"
                (enableRecommendedForResource)="onEnableRecommendedForResource($event)"
            />
        }
    </div>
</div>

<div class="dialog">
    <div class="header">
        <span class="title">{{ dialogTitle() }}</span>
        <div class="actions">
            <app-button
                type="outline-primary"
                (click)="onCancel()"
            >
                Cancel
            </app-button>
            <app-button
                type="primary"
                [disabled]="!canSubmit()"
                (click)="onSubmit()"
            >
                {{ isEditMode ? 'Save' : 'Create' }}
            </app-button>
        </div>
    </div>

    <form
        class="subheader"
        [formGroup]="form"
    >
        @if (!isEditMode) {
            <div class="control">
                <label class="label">Organization <span class="required">*</span></label>
                <app-select
                    placeholder="Select organization..."
                    [items]="orgOptions()"
                    [selectedValue]="targetOrgId()"
                    (changed)="onTargetOrgChanged($event)"
                />
            </div>
        }

        <div class="control">
            <label class="label">Role Name <span class="required">*</span></label>
            <app-custom-input
                placeholder="Enter the name..."
                formControlName="name"
            />
        </div>
        @if (form.controls.name.errors?.['conflict']) {
            <span class="server-error">A role with this name already exists in the organization.</span>
        }
        <app-validation-errors [control]="form.controls.name" />

        <div class="control">
            <label class="label">Description</label>
            <app-custom-input
                placeholder="Enter the description..."
                formControlName="description"
            />
        </div>
        <app-validation-errors [control]="form.controls.description" />
    </form>

    <!-- CONTENT: permissions -->
    <div class="content">
        @if (catalog(); as cat) {
            <app-permissions-table
                [catalog]="cat"
                [selectedPermissions]="selectedPermissions()"
                [disabledPermissions]="disabledPermissions()"
                (permissionToggle)="onPermissionToggle($event)"
                (selectAllClick)="onSelectAll()"
                (clearAllClick)="onClearAll()"
                (groupSelectAllClick)="onGroupSelectAll($event)"
                (groupClearClick)="onGroupClear($event)"
            />
        }
    </div>
</div>

<div
    class="dialog"
    (appEnterSubmit)="onSubmit()"
    [appEnterSubmitDisabled]="submitDisabled()"
>
    <div class="header">
        <span class="title">{{ isEditMode ? 'Edit Organization' : 'Create New Organization' }}</span>

        <div class="actions">
            <app-button
                type="outline-primary"
                (click)="onCancel()"
            >
                Cancel
            </app-button>

            <app-button
                type="primary"
                (click)="onSubmit()"
                [disabled]="submitDisabled()"
            >
                {{ isEditMode ? 'Save' : 'Create' }}
            </app-button>
        </div>
    </div>

    <div class="subheader">
        <div class="control">
            <label class="label">Organization Name <span class="required">*</span></label>

            <app-custom-input
                placeholder="Enter organization name"
                [formControl]="orgNameControl"
            />
        </div>

        <app-validation-errors [control]="orgNameControl" />

        <div class="control">
            <label class="label retention__label">Session Audit Retention</label>

            <div class="retention">
                <app-select
                    class="retention__unit"
                    [items]="retentionUnitItems"
                    [(selectedValue)]="retentionUnit"
                />
                @if (retentionUnit() !== 'unlimited') {
                    <app-number-stepper
                        class="retention__amount"
                        ariaLabel="Retention amount"
                        [alwaysShowButtons]="true"
                        [integer]="true"
                        [min]="1"
                        [max]="maxRetentionAmount()"
                        [value]="clampedRetentionAmount()"
                        (changed)="setRetentionAmount($event)"
                    />
                }
            </div>
        </div>
    </div>

    <app-org-members-editor
        [organizationId]="organizationId"
        [isEditMode]="isEditMode"
    />
</div>

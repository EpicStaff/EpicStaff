<form
    [formGroup]="form"
    class="form"
>
    <div class="primary">

        <!--                formControlName="full_name"-->
        <!--            />-->
        <!--        </div>-->
        <!--        <app-validation-errors [control]="form.get('full_name')!" />-->
        <div class="control">
            <label
                class="label"
                for="user-details-email"
            >
                <span>Email<span class="required">*</span></span>
                <app-help-tooltip
                    [text]="'The user\'s login email address. Must be unique across the system.'"
                    ariaLabel="Email help"
                    position="right"
                ></app-help-tooltip>
            </label>

            <app-custom-input
                [id]="'user-details-email'"
                (blur)="trimEmail()"
                placeholder="Enter user email..."
                formControlName="email"
            />
        </div>
        <app-validation-errors [control]="form.get('email')!" />
        @if (!editMode()) {
            <div class="control">
                <label
                    class="label"
                    for="user-details-password"
                >
                    <span>Password<span class="required">*</span></span>
                    <app-help-tooltip
                        [text]="'Minimum 8 characters. The user can change it after their first login.'"
                        ariaLabel="Password help"
                        position="right"
                    ></app-help-tooltip>
                </label>

                <app-custom-input
                    [id]="'user-details-password'"
                    type="password"
                    [placeholder]="editMode() ? 'Leave blank to keep current...' : 'Enter user password...'"
                    formControlName="password"
                />
            </div>
            <app-validation-errors [control]="form.get('password')!" />
            <app-password-strength [password]="password" />
        }
        <!--        <div class="control top">-->
        <!--            <label class="label">-->
        <!--                Picture-->
        <!--                <app-help-tooltip-->
        <!--                    [text]="''"-->
        <!--                    position="right"-->
        <!--                ></app-help-tooltip>-->
        <!--            </label>-->
        <!--            <app-avatar-upload (imageChange)="form.patchValue({ picture: $event })" />-->
        <!--        </div>-->
    </div>
    <div class="secondary">
        <div class="label">
            Make Superadmin
            <app-help-tooltip
                [text]="'Superadmins have full access to all organizations and system settings.'"
                ariaLabel="Make Superadmin help"
                position="right"
            ></app-help-tooltip>
        </div>

        <app-toggle-switch formControlName="superadmin" />
    </div>
</form>

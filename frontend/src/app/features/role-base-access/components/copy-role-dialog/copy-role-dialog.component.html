<div
    class="dialog"
    (appEnterSubmit)="onCopy()"
    [appEnterSubmitDisabled]="!canSubmit() || form.invalid"
>
    <div class="header">
        <span class="title">Duplicate Role</span>
        <app-svg-icon
            class="close-btn"
            icon="x"
            size="20px"
            role="button"
            tabindex="0"
            aria-label="Close dialog"
            (click)="onCancel()"
        />
    </div>

    <form
        class="body"
        [formGroup]="form"
    >
        <div class="control">
            <label
                class="label"
                for="copy-role-name"
            >
                <span>Name<span class="required">*</span></span>
                <app-help-tooltip
                    text="Name for the duplicated role. Must be unique within the target organization."
                    ariaLabel="Name help"
                    position="right"
                />
            </label>
            <app-custom-input
                [id]="'copy-role-name'"
                placeholder="Role name..."
                formControlName="name"
            />
            <app-validation-errors [control]="form.controls.name" />
        </div>

        <div class="control">
            <div class="label">
                <span>Assign to Organization</span>
                <app-help-tooltip
                    text="Organization where the duplicated role will be created."
                    ariaLabel="Assign to Organization help"
                    position="right"
                />
            </div>
            <app-select
                placeholder="Select organization..."
                [items]="orgOptions()"
                [selectedValue]="targetOrgId()"
                (changed)="onTargetOrgChanged($event)"
            />
        </div>
    </form>

    <div class="footer">
        <app-button
            type="outline-primary"
            (click)="onCancel()"
        >
            Cancel
        </app-button>
        <app-button
            type="primary"
            [disabled]="!canSubmit() || form.invalid"
            (click)="onCopy()"
        >
            Duplicate
        </app-button>
    </div>
</div>

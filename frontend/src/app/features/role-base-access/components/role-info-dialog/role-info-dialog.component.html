<div class="dialog">
    <!-- HEADER -->
    <div class="header">
        <span class="title">Role Information</span>
        <div class="actions">
            @if (canDuplicate()) {
                <app-button
                    leftIcon="copy"
                    type="outline-primary"
                    [disabled]="extensionRows.isLoading()"
                    (click)="onDuplicate()"
                >
                    Duplicate Role
                </app-button>
            }
            <app-svg-icon
                (click)="onClose()"
                class="close-btn"
                icon="x"
                size="20px"
            />
        </div>
    </div>

    <!-- ROLE IDENTITY -->
    <div class="role-identity">
        <app-user-avatar
            [name]="role.name"
            class="role-avatar"
        />
        <div class="role-info">
            <span class="role-name">{{ role.name }}</span>
            <span class="role-desc">{{ role.description }}</span>
        </div>
    </div>

    <!-- PERMISSIONS (read-only) -->
    <div class="content">
        @if (extensionNotice(); as notice) {
            <p
                class="permission-notice permission-notice--error"
                role="alert"
            >
                {{ notice }}
            </p>
        }
        @if (catalog(); as cat) {
            <app-permissions-table
                [catalog]="cat"
                [extensionGroups]="extensionRows.groups()"
                [selectedPermissions]="matrixSelection()"
                [readonly]="true"
            />
        }
    </div>
</div>

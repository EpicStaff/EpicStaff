<div class="profile-page">
    <div class="header">
        <div
            class="header-titles"
            appHideInlineSubtitleOnOverflow
        >
            <h1 class="title">
                My Profile
                <span class="subtitle-inline"
                    >Update your profile, review your organization memberships and assigned roles.</span
                >
            </h1>
        </div>
        <div class="header-actions">
            <app-button
                type="outline-primary"
                (click)="onSignOut()"
            >
                <app-svg-icon
                    icon="sign-out"
                    size="16px"
                />
                Sign out
            </app-button>
        </div>
    </div>

    @if (user(); as user) {
        <div class="user-section">
            <div class="user-identity">
                <app-user-avatar
                    [name]="user.display_name || user.email"
                    [avatarUrl]="user.avatar_url"
                    class="user-avatar-lg"
                />
                <div class="user-info">
                    <span class="user-name">{{ user.display_name }}</span>
                    <span class="user-email">{{ user.email }}</span>
                </div>
            </div>
            <div class="user-actions">
                <app-button
                    type="outline-primary"
                    leftIcon="lock"
                    (click)="onPasswordChange()"
                >
                    Change Password
                </app-button>
                <app-button
                    type="primary"
                    leftIcon="edit"
                    (click)="onProfileEdit()"
                >
                    Edit
                </app-button>
            </div>
        </div>

        <app-route-tabs
            class="profile-tabs"
            [tabs]="tabs"
        />

        <div class="tab-content">
            <router-outlet></router-outlet>
        </div>
    }
</div>

<div class="dialog">
    <div class="dialog__header">
        <span class="dialog__header-title"> Graph RAG Configuration </span>

        <div class="dialog__actions">
            <app-button
                type="outline-primary"
                (click)="onClose()"
            >
                Close
            </app-button>

            @if (activeTab() === 'configuration') {
                @if (isIndexing()) {
                    <app-button
                        *appHasPermission="[ResourceCode.KnowledgeSources, ActionCode.Update]"
                        type="primary"
                        (click)="stopIndexing(processingDocIds())"
                    >
                        Stop indexing
                    </app-button>
                } @else {
                    <app-button
                        *appHasPermission="[ResourceCode.KnowledgeSources, ActionCode.Update]"
                        type="primary"
                        [disabled]="indexingDisabled()"
                        (click)="runIndexing()"
                    >
                        {{ runButtonLabel() }}
                    </app-button>
                }
            }
        </div>
    </div>

    @if (graphRag(); as rag) {
        <app-graph-rag-tabbed-view [ragId]="rag.graph_rag_id">
            <app-graph-rag-configuration
                class="dialog__content"
                [graphRag]="graphRag()!"
            />
        </app-graph-rag-tabbed-view>
    }
</div>

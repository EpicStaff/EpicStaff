<div class="configure">
    <div class="files-section">
        <div class="files-header">
            <div class="header-title">
                Index Mode
                <app-help-tooltip
                    class="tooltip-icon"
                    text="Update new: only re-index files that were not indexed before, and keep existing configuration. Total re-index: re-index all files with potentially new configuration."
                    position="right"
                />
            </div>
            <app-radio-button
                [(value)]="indexMode"
                [options]="indexModeOptions"
            />
        </div>

        <!--        <div class="files-header">-->
        <!--            <div class="header-title">-->
        <!--                Convert to Format-->
        <!--                <app-help-tooltip-->
        <!--                    class="tooltip-icon"-->
        <!--                    text="Select format"-->
        <!--                    position="right"-->
        <!--                />-->
        <!--            </div>-->
        <!--            <app-radio-button-->
        <!--                [(value)]="selectedFormat"-->
        <!--                [options]="formatOptions"-->
        <!--                [disabled]="true"-->
        <!--            />-->
        <!--        </div>-->

        @if (hasNonTxtDocuments()) {
            <div class="non-txt-warning">
                <app-svg-icon
                    icon="warning"
                    size="1rem"
                    class="warning-icon"
                />
                <span>Non-txt files may not be properly processed, resulting in empty search results.</span>
            </div>
        }

        <div class="files-content">
            @if (documentsLoading()) {
                <app-loading-spinner size="md" />
            } @else {
                <app-graph-rag-files-list
                    [ragId]="graphRag().graph_rag_id"
                    [documents]="documents()"
                    [checkedDocIds]="checkedDocIds()"
                    [indexMode]="indexMode()"
                    (toggleDoc)="toggleDoc($event)"
                    (pendingDelete)="markPendingDelete($event)"
                    (reIncludeFiles)="onReIncludeFiles()"
                />
            }
        </div>
    </div>

    <div class="params-section">
        <app-graph-rag-index-parameters
            #indexParameters
            [selectedFormat]="selectedFormat()"
            [indexConfig]="graphRag().index_config"
            [readonly]="isReadonly()"
            (reset)="clearPendingDeletes()"
        />
    </div>
</div>

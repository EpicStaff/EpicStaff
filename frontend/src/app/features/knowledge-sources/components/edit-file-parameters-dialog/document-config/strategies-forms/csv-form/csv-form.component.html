<form [formGroup]="strategyForm">
    <span class="config__divider"></span>

    <div
        class="config__grid"
        formGroupName="additionalParams"
    >
        <span class="config__grid-item">Additional parameters</span>
        <span class="config__grid-item"></span>

        <div class="config__grid-item">
            <label>Rows In Chunk</label>
            <app-help-tooltip
                class="config__tooltip"
                text="The number of CSV rows included in each chunk. Larger values preserve more tabular context, while smaller values create more granular chunks."
                position="right"
            />
        </div>
        <div class="config__grid-item config__grid-item--short">
            @if (canUpdate()) {
                <app-input-number
                    ariaLabel="Rows In Chunk"
                    formControlName="rows_in_chunk"
                    [min]="ROWS_IN_CHUNK_MIN"
                    [max]="ROWS_IN_CHUNK_MAX"
                    [invalid]="!!getAdditionalParamControl('rows_in_chunk')?.invalid"
                />
                <app-validation-errors [control]="getAdditionalParamControl('rows_in_chunk')!" />
            } @else {
                <span>{{ rowsInChunk() }}</span>
            }
        </div>

        <div class="config__grid-item">
            <label>Headers level</label>
            <app-help-tooltip
                class="config__tooltip"
                text="The number of header rows to include with each chunk. Ensures column context is preserved when splitting large CSV files."
                position="right"
            />
        </div>
        <div class="config__grid-item config__grid-item--short">
            @if (canUpdate()) {
                <app-input-number
                    ariaLabel="Headers level"
                    formControlName="headers_level"
                    [min]="HEADERS_LEVEL_MIN"
                    [max]="HEADERS_LEVEL_MAX"
                    [invalid]="!!getAdditionalParamControl('headers_level')?.invalid"
                />
                <app-validation-errors [control]="getAdditionalParamControl('headers_level')!" />
            } @else {
                <span>{{ headersLevel() }}</span>
            }
        </div>
    </div>
</form>

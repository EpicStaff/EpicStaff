<div class="dialog">
    <div class="dialog__header">
        <span class="dialog__header-title"> Editing File Parameters </span>

        <div class="dialog__actions">
            <div class="dialog__actions-switcher">
                <!-- aria-disabled, not disabled: reaching the first file must not drop the focus out of the dialog. -->
                <button
                    type="button"
                    class="dialog__action"
                    aria-label="Previous file"
                    matTooltip="Previous file"
                    [attr.aria-disabled]="isPrevDisabled() || null"
                    [class.dialog__action--disabled]="isPrevDisabled()"
                    (click)="prevDocument()"
                >
                    <app-svg-icon
                        icon="arrow-left"
                        size="1.5rem"
                    />
                </button>
                <span>
                    {{ document().file_name }}
                </span>
                <button
                    type="button"
                    class="dialog__action"
                    aria-label="Next file"
                    matTooltip="Next file"
                    [attr.aria-disabled]="isNextDisabled() || null"
                    [class.dialog__action--disabled]="isNextDisabled()"
                    (click)="nextDocument()"
                >
                    <app-svg-icon
                        icon="arrow-right"
                        size="1.5rem"
                    />
                </button>
            </div>
            <button
                type="button"
                class="dialog__action"
                aria-label="Close"
                matTooltip="Close"
                (click)="onClose()"
            >
                <app-svg-icon
                    icon="x"
                    size="1.5rem"
                />
            </button>
        </div>
    </div>

    <div class="dialog__content">
        <div class="dialog__chunk-preview">
            <app-document-chunks-section
                #chunksSection
                [naiveRagId]="data.ragId"
                [collectionId]="data.collectionId"
                [selectedDocumentId]="selectedDocumentId()"
            >
                <app-button
                    [disabled]="!canRunChunking()"
                    [matTooltip]="
                        canRunChunking() ? 'Run chunking process' : 'You dont have permission to run chunking'
                    "
                    matTooltipPosition="above"
                    class="dialog__chunk-preview-button"
                    type="outline-primary"
                    (click)="onShowChunks()"
                >
                    Show
                </app-button>
            </app-document-chunks-section>
        </div>

        <app-document-config
            #formSection
            [ragId]="data.ragId"
            [document]="document()"
            class="dialog__document-config"
        />
    </div>
</div>

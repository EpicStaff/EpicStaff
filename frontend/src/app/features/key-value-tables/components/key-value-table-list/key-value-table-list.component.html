<!-- Same header as the Knowledge Sources collections sidebar. -->
<div class="table-list__header">
    <span class="table-list__header-label"
        >Tables
        <span class="table-list__header-count">{{ tables().length }}</span>
    </span>
    @if (canCreate()) {
        <app-button
            [type]="tables().length ? 'primary' : 'outline-primary'"
            [leftIcon]="'plus'"
            (click)="createRequested.emit()"
        >
            Add
        </app-button>
    }
</div>
@if (showFilter()) {
    <div class="table-list__filter">
        <app-search
            mod="small"
            placeholder="Filter tables..."
            [(searchTerm)]="filterText"
        />
    </div>
}
<ul class="table-list">
    @for (table of visibleTables(); track table.id) {
        <li
            class="table-list__row"
            [class.active]="table.id === selectedId()"
            [class.table-list__row--menu-open]="table.id === menuOpenTableId()"
        >
            <button
                type="button"
                class="table-list__select"
                (click)="selected.emit(table)"
                (mouseenter)="showFullName(nameElement, table.name)"
                (mouseleave)="hideFullName()"
                (focus)="showFullName(nameElement, table.name)"
                (blur)="hideFullName()"
            >
                <app-svg-icon
                    class="table-list__icon"
                    icon="database"
                    width="16px"
                    height="18px"
                />
                <span class="table-list__text">
                    <span
                        #nameElement
                        class="table-list__name"
                        >{{ table.name }}</span
                    >
                    <span class="table-list__count">{{ table.entry_count }} entries</span>
                </span>
            </button>
            <!-- A sibling of the select button, not inside it: opening the menu never selects the row. -->
            <div class="table-list__hover-actions">
                <button
                    #menuTrigger="cdkMenuTriggerFor"
                    #menuTriggerButton
                    type="button"
                    class="table-list__hover-btn"
                    attr.aria-label="More actions for {{ table.name }}"
                    [cdkMenuTriggerFor]="menu"
                    [cdkMenuPosition]="menuPositions"
                    (cdkMenuOpened)="menuOpenTableId.set(table.id)"
                    (cdkMenuClosed)="menuOpenTableId.set(null)"
                >
                    <app-svg-icon
                        icon="dots-vertical"
                        size="1rem"
                    />
                </button>
            </div>
            <ng-template #menu>
                <div
                    cdkMenu
                    class="table-list-menu"
                >
                    @if (canRename()) {
                        <button
                            cdkMenuItem
                            type="button"
                            class="table-list-menu__item"
                            (cdkMenuItemTriggered)="onRename(table, menuTrigger, menuTriggerButton)"
                        >
                            Rename
                        </button>
                    }
                    <!-- Authorship is read-only, so seeing the table is enough to see who created and edited it. -->
                    <button
                        cdkMenuItem
                        type="button"
                        class="table-list-menu__item"
                        (cdkMenuItemTriggered)="onViewDetails(table, menuTrigger, menuTriggerButton)"
                    >
                        View Details
                    </button>
                    @if (canDelete()) {
                        <button
                            cdkMenuItem
                            type="button"
                            class="table-list-menu__item"
                            (cdkMenuItemTriggered)="onDelete(table, menuTrigger, menuTriggerButton)"
                        >
                            Delete
                        </button>
                    }
                </div>
            </ng-template>
        </li>
    } @empty {
        <li class="table-list__empty">{{ emptyMessage() }}</li>
    }
</ul>
@if (truncatedName(); as truncated) {
    <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="truncated.element"
        [cdkConnectedOverlayOpen]="true"
        [cdkConnectedOverlayPositions]="namePositions"
    >
        <div
            class="table-list__full-name"
            role="tooltip"
        >
            {{ truncated.name }}
        </div>
    </ng-template>
}

<div
    class="key-value-dialog"
    (appEnterSubmit)="submit()"
    [appEnterSubmitDisabled]="isSubmitting()"
>
    <header class="key-value-dialog__header">
        <span class="key-value-dialog__title">{{ isRename ? 'Rename table' : 'Create table' }}</span>
        <button
            type="button"
            class="key-value-dialog__close-btn"
            aria-label="Close"
            matTooltip="Close"
            (click)="cancel()"
        >
            <app-svg-icon
                icon="close"
                size="16px"
            />
        </button>
    </header>

    <form
        class="key-value-dialog__form"
        [formGroup]="form"
        (ngSubmit)="submit()"
    >
        @if (errorMessage()) {
            <div class="key-value-dialog__error-message">
                <p>{{ errorMessage() }}</p>
            </div>
        }

        <div>
            <!-- The dialog opens with the focus here, its first field. -->
            <app-custom-input
                cdkFocusInitial
                label="Name"
                formControlName="name"
                [required]="true"
                placeholder="e.g. customer_profiles"
            />
            <app-validation-errors [control]="form.controls.name" />
        </div>

        <app-custom-input
            label="Description"
            formControlName="description"
            placeholder="What this table stores"
        />
    </form>

    <div class="key-value-dialog__actions">
        <app-button
            type="outline-primary"
            (click)="cancel()"
        >
            Cancel
        </app-button>
        <app-button
            type="primary-white"
            [disabled]="form.invalid || isSubmitting()"
            (click)="submit()"
        >
            {{ isSubmitting() ? 'Saving...' : 'Save' }}
        </app-button>
    </div>
</div>

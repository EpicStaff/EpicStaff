<!-- aria-disabled, not disabled: an arrow keeps the focus when its step reaches the first or last session. -->
<button
    type="button"
    [attr.aria-disabled]="!hasPreviousSession"
    (click)="goToPreviousSession()"
    aria-label="Previous session"
    matTooltip="Previous session"
    class="btn-switch-session"
>
    <div class="icon-arrow">
        <app-svg-icon
            icon="chevron-down"
            size="20px"
        />
    </div>
</button>

<div class="session-dropdown-wrapper">
    <button
        type="button"
        class="session-dropdown-trigger"
        aria-haspopup="dialog"
        [attr.aria-expanded]="isDropdownOpen"
        [matTooltip]="'Session: ' + selectedSessionLabel"
        (click)="toggleDropdown()"
    >
        <span class="session-dropdown-trigger__label">{{ selectedSessionLabel }}</span>
        <app-svg-icon
            icon="chevron-down"
            size="16px"
        />
    </button>

    @if (isDropdownOpen) {
        <div
            class="session-dropdown-overlay"
            (click)="closeDropdown()"
        ></div>
        <!-- Takes the focus when it opens and hands it back to the trigger when it closes. -->
        <div
            class="session-dropdown"
            role="dialog"
            aria-label="Sessions"
            cdkTrapFocus
            [cdkTrapFocusAutoCapture]="true"
            (keydown.escape)="onDropdownEscape($event)"
        >
            <div class="session-dropdown__search">
                <input
                    type="text"
                    placeholder="Search by ID..."
                    aria-label="Search by ID"
                    matTooltip="Search by ID"
                    [(ngModel)]="searchQuery"
                    (click)="$event.stopPropagation()"
                    class="session-dropdown__input"
                />
            </div>
            <div class="session-dropdown__list">
                @for (session of filteredSessions; track session.id) {
                    <button
                        type="button"
                        class="session-dropdown__item"
                        [class.active]="session.id.toString() === selectedSessionId"
                        [attr.aria-current]="session.id.toString() === selectedSessionId"
                        [matTooltip]="'Session ID ' + session.id"
                        (click)="onSessionChange(session.id.toString())"
                    >
                        <span class="session-dropdown__item-id">ID {{ session.id }}</span>
                        <span class="session-dropdown__item-time">{{ getTimeAgo(session.status_updated_at) }}</span>
                    </button>
                }
                @if (filteredSessions.length === 0) {
                    <div class="session-dropdown__empty">No sessions found</div>
                }
            </div>
        </div>
    }
</div>

<button
    type="button"
    [attr.aria-disabled]="!hasNextSession"
    (click)="goToNextSession()"
    aria-label="Next session"
    matTooltip="Next session"
    class="btn-switch-session"
>
    <div class="icon-arrow">
        <app-svg-icon
            icon="chevron-up"
            size="20px"
        />
    </div>
</button>

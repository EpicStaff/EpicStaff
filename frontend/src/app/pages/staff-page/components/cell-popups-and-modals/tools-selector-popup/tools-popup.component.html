<!-- Tools Selection Popup -->
<div class="tools-popup-container">
    <!-- Header -->
    <div class="header">
        <div class="list-header">
            <input
                #searchInput
                type="text"
                [(ngModel)]="searchTerm"
                placeholder="Search tools..."
            />
            <!-- Commented out filter button as requested -->
            <!-- <button class="filter-button"><i class="ti ti-filter"></i> Filter</button> -->
        </div>

        <div class="menu-header">
            <div class="menu-tabs">
                <button
                    [class.active]="selectedMenu === 'custom'"
                    (click)="toggleToolType('custom')"
                >
                    Custom Tools
                </button>
                <button
                    [class.active]="selectedMenu === 'mcp'"
                    (click)="toggleToolType('mcp')"
                >
                    MCP Tools
                </button>
            </div>

            @if (selectedMenu === 'custom') {
                <app-button
                    *appHasPermission="[ResourceCode.Tools, ActionCode.Create]"
                    type="primary"
                    mod="small"
                    iconSize="0.9rem"
                    [leftIcon]="'plus'"
                    (click)="openCustomToolDialog()"
                >
                    Create custom tool
                </app-button>
            } @else if (selectedMenu === 'mcp') {
                <app-button
                    *appHasPermission="[ResourceCode.Tools, ActionCode.Create]"
                    type="primary"
                    mod="small"
                    iconSize="0.9rem"
                    [leftIcon]="'plus'"
                    (click)="openMcpToolDialog()"
                >
                    Add MCP tool
                </app-button>
            }
        </div>
    </div>

    <!-- Body -->
    <div class="body">
        <!-- Python/Custom Tools -->
        <div
            class="python-tools"
            *ngIf="selectedMenu === 'custom'"
        >
            <!-- Loading Spinner -->
            <div
                *ngIf="loading"
                class="loading-spinner"
            >
                <div class="dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>

            <!-- No python tools message -->
            <div
                class="no-tools"
                *ngIf="!loading && pythonTools.length === 0"
            >
                <p>No custom tools available</p>
                <app-button
                    *appHasPermission="[ResourceCode.Tools, ActionCode.Create]"
                    type="primary"
                    class="btn-primary create-btn"
                    [leftIcon]="'plus'"
                    (click)="openCustomToolDialog()"
                >
                    Create custom tool
                </app-button>
            </div>

            <!-- Using Python Tool Item Component for each tool -->
            <div
                class="tools-list"
                *ngIf="!loading && pythonTools.length > 0"
            >
                <app-python-tool-item
                    *ngFor="let pTool of filteredPythonTools"
                    [tool]="pTool"
                    [isSelected]="selectedPythonTools.has(pTool.id)"
                    (toolToggled)="onPythonToolToggle($event)"
                >
                </app-python-tool-item>
            </div>
        </div>

        <!-- MCP Tools -->
        <div
            class="mcp-tools"
            *ngIf="selectedMenu === 'mcp'"
        >
            <!-- Loading Spinner -->
            <div
                *ngIf="loading"
                class="loading-spinner"
            >
                <div class="dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>

            <!-- No MCP tools message -->
            <div
                class="no-tools"
                *ngIf="!loading && mcpTools.length === 0"
            >
                <p>No MCP tools available</p>
                <app-button
                    *appHasPermission="[ResourceCode.Tools, ActionCode.Create]"
                    type="primary"
                    class="btn-primary create-btn"
                    [leftIcon]="'plus'"
                    (click)="openMcpToolDialog()"
                >
                    Add MCP Tool
                </app-button>
            </div>

            <!-- Using MCP Tool Item Component for each tool -->
            <div
                class="tools-list"
                *ngIf="!loading && mcpTools.length > 0"
            >
                <app-mcp-tool-item
                    *ngFor="let mcpTool of filteredMcpTools"
                    [tool]="mcpTool"
                    [isSelected]="selectedMcpTools.has(mcpTool.id)"
                    (toolToggled)="onMcpToolToggle($event)"
                >
                </app-mcp-tool-item>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <app-button
            type="ghost"
            (click)="onCancel()"
        >
            Cancel
        </app-button>
        <app-button (click)="save()"> Save </app-button>
    </div>
</div>

@if (isLoaded()) {
    <app-flow-header
        [graphName]="graph.name"
        [graphId]="graph.id"
        [isAssistantOpen]="flowAssistantService.isOpen()"
        [graph]="graph"
        [isSaving]="isSaving()"
        [isRunning]="isRunning()"
        [hasUnsavedChanges]="hasUnsavedChangesSignal()"
        (save)="onHeaderSave()"
        (saveVersion)="onSaveVersion()"
        (viewVersionHistory)="onViewVersionHistory()"
        (viewSessions)="handleViewSessions()"
        (run)="handleRunFlow()"
        (getCurl)="handleGetCurl()"
        (toggleAssistant)="onToggleAssistant()"
        (flowEdited)="onFlowEdited($event)"
        [editors]="collaborationEditors()"
    ></app-flow-header>

    @if (savedByBanner()) {
        <div class="saved-by-banner">
            <i class="ti ti-device-floppy"></i>
            Saved by {{ savedByBanner() }}
            <button class="dismiss-btn" (click)="savedByBanner.set(null)">
                <i class="ti ti-x"></i>
            </button>
        </div>
    }

    <div class="body">
        @if (restoreWarnings().length > 0) {
            <button
                class="restore-warning-btn"
                (click)="onShowRestoreWarnings()"
            >
                <app-svg-icon
                    icon="alert-triangle"
                    size="1rem"
                />
                {{ restoreWarnings().length }} missing
                {{ restoreWarnings().length === 1 ? 'dependency' : 'dependencies' }}
            </button>
        }
        <app-flow-graph
            [flowState]="currentFlowState()"
            [currentFlowId]="graph.id"
            [flowName]="graph.name"
            [initialNodeId]="initialNodeId"
            [isSaving]="isSaving()"
            [hasUnsavedChanges]="hasUnsavedChanges()"
            (save)="onGraphSave($event)"
            (openShortcuts)="openShortcutsModal($event)"
            (requestReload)="refreshCurrentFlow()"
            (importComplete)="handlePartialImportComplete()"
        ></app-flow-graph>
        <app-shortcuts-modal
            [open]="isShortcutsOpen()"
            [pos]="shortcutsPos()"
            title="Command & Shortcuts"
            icon="shortcut"
            [sections]="shortcutSections"
            (closed)="closeShortcutsModal()"
        ></app-shortcuts-modal>
        @if (isPanelOpen() || !isPanelOpen()) {
            <div
                class="drag-handle"
                [class.dragging]="isDragging"
                [class.collapsed]="isPanelCollapsed()"
                (mousedown)="onDragStart($event)"
            >
                <button
                    class="collapse-toggle"
                    (mousedown)="$event.stopPropagation()"
                    (click)="togglePanelCollapsed()"
                    [matTooltip]="isPanelCollapsed() ? 'Open sessions panel' : 'Close sessions panel'"
                    matTooltipPosition="left"
                >
                    <span class="collapse-toggle__icon">
                        <app-svg-icon
                            [icon]="isPanelCollapsed() ? 'chevron-left' : 'chevron-right'"
                            size="1rem"
                        ></app-svg-icon>
                    </span>
                </button>
            </div>
            @if (!isPanelCollapsed()) {
                <app-flow-messages-panel
                    [style.width.px]="panelWidthPx"
                    [graphId]="graph.id"
                    [sessionId]="currentSessionId"
                    (close)="closeMessagesPanel()"
                    (sessionSelected)="onSessionSelected($event)"
                ></app-flow-messages-panel>
            }
        }
        @if (isSaving()) {
            <div
                class="saving-lock-overlay"
                title="Saving… editing is locked until the save completes"
            ></div>
        }
    </div>
    @if (flowAssistantService.isOpen()) {
        <app-flow-assistant-panel />
    }
} @else {
    <app-spinner
        [text]="'Loading flow...'"
        [accentColor]="'#6562f5'"
        [isOverlay]="false"
    ></app-spinner>
}

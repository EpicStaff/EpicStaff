@if (open() && pos()) {
    <!-- Sibling of the modal, not its parent: the two need different stacking layers (see the scss). -->
    <div
        class="shortcuts__overlay"
        (click)="closed.emit()"
    ></div>
    <!-- Takes the focus when it opens, keeps Tab inside and hands the focus back to the opener when it closes. -->
    <div
        class="shortcuts__modal"
        role="dialog"
        aria-labelledby="shortcuts-modal-title"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
        [style.top.px]="pos()!.top"
        [style.left]="leftStyle()"
        [style.--shortcuts-modal-height]="modalHeightPx + 'px'"
        (click)="$event.stopPropagation()"
        (keydown)="onModalKeydown($event)"
        [class.shortcuts__modal--compact]="size() === 'compact'"
        [class.shortcuts__modal--wide]="size() === 'wide'"
        [class.shortcuts__modal--settling]="isSettling()"
        [class.shortcuts__modal--four-columns]="isFourColumns()"
    >
        <div class="shortcuts__frame">
            <div class="shortcuts__header">
                <div class="shortcuts__header-left">
                    @if (icon()) {
                        <app-svg-icon
                            class="shortcuts__header-icon"
                            [icon]="icon()!"
                            size="1.5rem"
                            aria-hidden="true"
                        />
                    }
                    <div
                        id="shortcuts-modal-title"
                        class="shortcuts__header-title"
                    >
                        {{ heading() }}
                    </div>
                </div>

                <div class="shortcuts__header-right">
                    <button
                        type="button"
                        class="shortcuts__size-btn"
                        (click)="toggleSize()"
                        [disabled]="isMediaLocked()"
                        [attr.aria-label]="size() === 'wide' ? 'Minimize' : 'Expand'"
                        [matTooltip]="size() === 'wide' ? 'Minimize' : 'Expand'"
                    >
                        <app-svg-icon
                            [icon]="size() === 'wide' ? 'arrows-minimize' : 'arrows-maximize'"
                            size="1.25rem"
                        />
                    </button>

                    @if (showClose()) {
                        <button
                            type="button"
                            class="shortcuts__close-btn"
                            (click)="closed.emit()"
                            aria-label="Close"
                            matTooltip="Close"
                        >
                            <app-svg-icon
                                class="shortcuts__close-icon"
                                icon="x"
                                size="1.25rem"
                            />
                        </button>
                    }
                </div>
            </div>

            <app-shortcuts-editor
                [flows]="flows()"
                [currentFlowId]="currentFlowId()"
                [layout]="size()"
            />
        </div>
    </div>
}

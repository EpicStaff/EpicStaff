<!-- The focus moves in on open and back to the chevron on close. -->
<div
    class="save-dropdown"
    role="menu"
    aria-label="Save options"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
>
    <button
        type="button"
        role="menuitem"
        class="save-dropdown__item"
        (click)="save.emit()"
    >
        Save
    </button>
    <button
        type="button"
        role="menuitem"
        class="save-dropdown__item"
        (click)="saveVersion.emit()"
    >
        Save Version
    </button>
    <button
        type="button"
        role="menuitem"
        class="save-dropdown__item"
        (click)="viewVersionHistory.emit()"
    >
        Version History
        <app-svg-icon
            icon="arrow-up-right"
            size="1rem"
        />
    </button>
</div>

<div class="header">
    <div class="title-search">
        <h2 class="title">
            <div
                class="flows-prefix"
                routerLink="/flows"
            >
                <app-svg-icon
                    icon="arrow-left"
                    size="20px"
                    class="back-arrow"
                />
                <span>Flows</span>
            </div>
            <span class="slash">/</span>
            <div class="graph-name-row">
                <div class="graph-name project-link">
                    {{ graphName ?? 'Loading...' }}
                </div>
                <button
                    *appHasPermission="[ResourceCode.Flows, ActionCode.Update]"
                    class="edit-name-btn"
                    (click)="openRenameDialog()"
                    matTooltip="Edit flow name"
                    matTooltipPosition="below"
                >
                    <app-svg-icon
                        icon="edit"
                        size="16px"
                    />
                </button>
                @switch (saveStatus()) {
                    @case ('unsaved') {
                        <span
                            class="save-status-chip save-status-chip--unsaved"
                            matTooltip="Unsaved changes"
                            matTooltipPosition="below"
                            [appCollapseOnOverflow]="true"
                            collapseOnOverflowTarget=".save-status-chip__label"
                            collapseOnOverflowClass="save-status-chip--icon-only"
                            collapseOnOverflowRequireSelector="app-svg-icon"
                        >
                            <app-svg-icon
                                icon="timer-zero"
                                size="20px"
                            />
                            <span class="save-status-chip__label">Unsaved changes</span>
                        </span>
                    }
                    @case ('saved') {
                        <span
                            class="save-status-chip save-status-chip--saved"
                            matTooltip="All changes saved"
                            matTooltipPosition="below"
                            [appCollapseOnOverflow]="true"
                            collapseOnOverflowTarget=".save-status-chip__label"
                            collapseOnOverflowClass="save-status-chip--icon-only"
                            collapseOnOverflowRequireSelector="app-svg-icon"
                        >
                            <app-svg-icon
                                icon="checkmark-filled"
                                size="20px"
                            />
                            <span class="save-status-chip__label">Saved</span>
                        </span>
                    }
                    @case ('saving') {
                        <span
                            class="save-status-chip save-status-chip--saving"
                            matTooltip="Saving changes"
                            matTooltipPosition="below"
                            [appCollapseOnOverflow]="true"
                            collapseOnOverflowTarget=".save-status-chip__label"
                            collapseOnOverflowClass="save-status-chip--icon-only"
                            collapseOnOverflowRequireSelector=".save-status-chip__spinner"
                        >
                            <span class="save-status-chip__spinner"></span>
                            <span class="save-status-chip__label">Saving…</span>
                        </span>
                    }
                }
                @if (runStatus(); as status) {
                    <app-status-badge [sessionStatus]="status" />
                }
            </div>
        </h2>
    </div>
    <app-graph-presence-indicators [editors]="editors" />
    <div class="header-actions">
        <span
            class="tooltip-host"
            [matTooltip]="
                isPreviewMode() ? previewBlockedMessages.sessions : keymap.withShortcut('Sessions', 'flow.sessions')
            "
            matTooltipPosition="below"
        >
            <button
                class="sessions-button"
                [appCollapseOnOverflow]="true"
                collapseOnOverflowTarget=".btn-label"
                collapseOnOverflowClass="btn--icon-only"
                collapseOnOverflowRequireSelector="app-svg-icon"
                [disabled]="isPreviewMode()"
                (click)="onViewSessions()"
            >
                <app-svg-icon
                    icon="history"
                    size="1.25rem"
                />
                <span class="btn-label">Sessions</span>
            </button>
        </span>
        @if (canUseFlow()) {
            <span
                class="tooltip-host"
                [matTooltip]="
                    isPreviewMode() ? previewBlockedMessages.getCurl : keymap.withShortcut('Get cURL', 'flow.curl')
                "
                matTooltipPosition="below"
            >
                <button
                    class="get-curl-button"
                    [appCollapseOnOverflow]="true"
                    collapseOnOverflowTarget=".btn-label"
                    collapseOnOverflowClass="btn--icon-only"
                    collapseOnOverflowRequireSelector="app-svg-icon"
                    [disabled]="isPreviewMode()"
                    (click)="onGetCurl()"
                >
                    <span class="btn-label">Get cURL</span>
                </button>
            </span>
        }
        <button
            class="open-chat-button"
            [appCollapseOnOverflow]="true"
            collapseOnOverflowTarget=".btn-label"
            collapseOnOverflowClass="btn--icon-only"
            collapseOnOverflowRequireSelector=".open-chat-button__icon"
            [matTooltip]="keymap.withShortcut(isAssistantOpen ? 'Close chat' : 'Open chat', 'flow.chat')"
            matTooltipPosition="below"
            (click)="onToggleAssistant()"
        >
            <img
                class="open-chat-button__icon"
                src="assets/icons/ui/epicstaff-chat-logo.svg"
                alt=""
                width="20"
                height="20"
            />
            <span class="btn-label">{{ isAssistantOpen ? 'Close chat' : 'Open chat' }}</span>
        </button>

        <ng-container *appHasPermission="[ResourceCode.Flows, ActionCode.Update]">
            <div
                #saveSplitOrigin="cdkOverlayOrigin"
                cdkOverlayOrigin
                class="save-split-btn"
                [class.disabled]="isSaving || isRunning || isPreviewMode()"
                [appCollapseOnOverflow]="true"
                collapseOnOverflowTarget=".btn-label"
                collapseOnOverflowClass="save-split-btn--icon-only"
                collapseOnOverflowRequireSelector="app-svg-icon"
            >
                <span
                    class="tooltip-host"
                    [matTooltip]="
                        isPreviewMode() ? previewBlockedMessages.save : keymap.withShortcut('Save', 'editing.save')
                    "
                    matTooltipPosition="below"
                >
                    <button
                        class="save-split-btn__main"
                        [disabled]="isSaving || isRunning || isPreviewMode()"
                        (click)="onSave()"
                    >
                        @if (isSaving) {
                            <app-spinner2 [size]="16"></app-spinner2>
                        } @else {
                            <app-svg-icon
                                icon="floppy"
                                size="1.25rem"
                            />
                        }
                        <span class="btn-label">Save</span>
                    </button>
                </span>
                <span
                    class="tooltip-host"
                    [matTooltip]="isPreviewMode() ? previewBlockedMessages.save : 'Save options'"
                    matTooltipPosition="below"
                >
                    <button
                        class="save-split-btn__chevron"
                        [disabled]="isSaving || isRunning || isPreviewMode()"
                        (click)="toggleSaveDropdown($event)"
                    >
                        <app-svg-icon
                            icon="chevron-down"
                            size="1rem"
                        />
                    </button>
                </span>
            </div>
            <ng-template
                cdkConnectedOverlay
                [cdkConnectedOverlayOrigin]="saveSplitOrigin"
                [cdkConnectedOverlayOpen]="isSaveDropdownOpen()"
                [cdkConnectedOverlayPositions]="[
                    {
                        originX: 'end',
                        originY: 'bottom',
                        overlayX: 'end',
                        overlayY: 'top',
                        offsetY: 6,
                    },
                ]"
                (overlayOutsideClick)="closeSaveDropdown()"
                (detach)="closeSaveDropdown()"
            >
                <app-save-dropdown
                    (save)="onSave(); closeSaveDropdown()"
                    (saveVersion)="saveVersion.emit(); closeSaveDropdown()"
                    (viewVersionHistory)="viewVersionHistory.emit(); closeSaveDropdown()"
                />
            </ng-template>
        </ng-container>
        @if (canUseFlow()) {
            <span
                class="tooltip-host"
                [matTooltip]="isPreviewMode() ? previewBlockedMessages.run : keymap.withShortcut('Run', 'flow.run')"
                matTooltipPosition="below"
            >
                <button
                    class="run-button"
                    [appCollapseOnOverflow]="true"
                    collapseOnOverflowTarget=".btn-label"
                    collapseOnOverflowClass="btn--icon-only"
                    collapseOnOverflowRequireSelector="app-svg-icon"
                    [disabled]="isSaving || isRunning || isPreviewMode()"
                    (click)="onRun()"
                >
                    @if (isRunning) {
                        <app-spinner2 [size]="16"></app-spinner2>
                    } @else {
                        <app-svg-icon
                            icon="player-play-filled"
                            size="1.25rem"
                        />
                    }
                    <span class="btn-label">Run</span>
                </button>
            </span>
        }
    </div>
</div>

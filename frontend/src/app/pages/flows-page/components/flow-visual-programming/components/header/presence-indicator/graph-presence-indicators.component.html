<div class="presence-indicators">
    @for (editor of visibleEditors(); track editor.user_id) {
        <div
            class="avatar"
            [style.--avatar-color]="getColor(editor.user_id)"
            [matTooltip]="getTooltip(editor)"
            matTooltipPosition="below"
        >
            @if (editor.resolvedAvatarUrl) {
                <img
                    class="avatar__img"
                    [src]="editor.resolvedAvatarUrl"
                    [alt]="getInitials(editor)"
                    (error)="onAvatarError(editor.resolvedAvatarUrl)"
                />
            } @else {
                {{ getInitials(editor) }}
            }
        </div>
    }
    @if (hiddenCount() > 0) {
        <div
            class="avatar avatar--overflow"
            [matTooltip]="hiddenTooltip()"
            matTooltipPosition="below"
        >
            +{{ hiddenCount() }}
        </div>
    }
</div>

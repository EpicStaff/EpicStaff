<!-- chat-controls.component.html -->
<div class="chat-controls">
    <!-- Text input area that shows when keyboard mode is active -->
    @if (isKeyboardMode() && isConversationSetuped) {
        <div class="text-input-container">
            <!-- Enter sends, Shift+Enter starts a new line, Tab leaves the field. -->
            <textarea
                #messageInput
                class="message-input"
                placeholder="Enter your message..."
                aria-label="Message"
                matTooltip="Message"
                [(ngModel)]="messageText"
                (keydown.enter)="$event.preventDefault(); sendMessage()"
            ></textarea>
            <button
                type="button"
                class="send-btn"
                aria-label="Send message"
                matTooltip="Send message"
                (click)="sendMessage()"
            >
                <app-svg-icon
                    icon="send"
                    size="1.25rem"
                />
            </button>
        </div>
    }

    <!-- Initial controls for starting conversation -->
    @if (!isConversationSetuped) {
        <div class="controls-container">
            <!-- aria-disabled, not disabled: it keeps the focus while it connects. -->
            <button
                #startSpeakingButton
                type="button"
                class="start-speaking-btn"
                [appCollapseOnOverflow]="true"
                collapseOnOverflowTarget=".start-speaking-btn__label"
                collapseOnOverflowClass="start-speaking-btn--only-icon"
                [collapseOnOverflowCheckExternalClip]="true"
                [attr.aria-label]="isConnecting() ? 'Connecting...' : 'Start Speaking'"
                [matTooltip]="isConnecting() ? 'Connecting...' : 'Start Speaking'"
                matTooltipShowDelay="400"
                (click)="onStartSpeaking()"
                [attr.aria-disabled]="!canStartSpeaking()"
            >
                @if (!isConnecting()) {
                    <app-svg-icon
                        icon="microphone"
                        size="1.25rem"
                    />
                }
                @if (isConnecting()) {
                    <app-svg-icon
                        icon="loader"
                        size="1.25rem"
                        class="ti-spin"
                    />
                }
                <span class="start-speaking-btn__label">{{ isConnecting() ? 'Connecting...' : 'Start Speaking' }}</span>
            </button>
            <app-microphone-selector></app-microphone-selector>
        </div>
    }

    <!-- Controls when conversation is active -->
    @if (isConversationSetuped) {
        <div class="controls-container active-recording">
            <app-voice-visualizer></app-voice-visualizer>
            <div class="recording-controls">
                <!-- Switch to keyboard/mic button -->
                <button
                    #keyboardToggle
                    type="button"
                    class="control-btn"
                    [class.active]="isKeyboardMode()"
                    aria-label="Keyboard input"
                    [attr.aria-pressed]="isKeyboardMode()"
                    [matTooltip]="isKeyboardMode() ? 'Keyboard input: On' : 'Keyboard input: Off'"
                    (click)="toggleInputMode()"
                >
                    <app-svg-icon
                        icon="keyboard"
                        size="1.25rem"
                    />
                </button>
                <!-- Pause/Resume microphone button -->
                <button
                    type="button"
                    class="control-btn"
                    [class.active]="isMicrophoneMuted()"
                    aria-label="Mute microphone"
                    [attr.aria-pressed]="isMicrophoneMuted()"
                    [matTooltip]="isMicrophoneMuted() ? 'Mute microphone: On' : 'Mute microphone: Off'"
                    (click)="toggleRecording()"
                >
                    <app-svg-icon
                        icon="microphone-off"
                        size="1.25rem"
                    />
                </button>
                <!-- Divider -->
                <span class="control-divider"></span>
                <!-- End conversation button -->
                <button
                    type="button"
                    class="control-btn end-btn"
                    aria-label="End conversation"
                    matTooltip="End conversation"
                    (click)="stopConversation()"
                >
                    <app-svg-icon
                        icon="x"
                        size="1.25rem"
                    />
                </button>
            </div>
        </div>
    }
</div>

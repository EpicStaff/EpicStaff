<section class="chats-content">
    @if (hasSelection) {
        <app-chat></app-chat>
    } @else {
        <div class="no-agent-message">
            <h3>No Agents Available</h3>
            <p>
                No agents have a realtime model configured. Open an agent on the Agents page and set its Realtime Config
                in Additional Settings.
            </p>
            <a
                routerLink="/agents"
                class="action-button"
                >Go to Agents</a
            >
        </div>
    }
</section>

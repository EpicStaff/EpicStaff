<div
    class="language-selector"
    appClickOutside
    (appClickOutside)="isOpen = false"
>
    <!-- <label *ngIf="label">{{ label }}</label> -->
    <button
        type="button"
        class="selector"
        aria-haspopup="listbox"
        [class.disabled]="disabled"
        [disabled]="disabled"
        [attr.aria-expanded]="isOpen"
        [attr.aria-label]="label + ': ' + getSelectedLanguageName()"
        [matTooltip]="label + ': ' + getSelectedLanguageName()"
        (click)="toggleDropdown()"
    >
        <span class="selected-language">{{ getSelectedLanguageName() }}</span>
        <span
            class="selector-arrow"
            [class.open]="isOpen"
        >
            <svg
                width="10"
                height="6"
                viewBox="0 0 10 6"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M1 1L5 5L9 1"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </span>
    </button>

    @if (isOpen) {
        <!-- Takes the focus when it opens and hands it back to the trigger when it closes; Escape closes only it. -->
        <div
            class="dropdown-menu"
            role="listbox"
            [attr.aria-label]="label"
            cdkTrapFocus
            [cdkTrapFocusAutoCapture]="true"
            (keydown.escape)="closeOnEscape($event)"
        >
            @for (lang of languages; track lang) {
                <button
                    type="button"
                    class="dropdown-item"
                    role="option"
                    [class.selected]="lang.id === selectedLanguage"
                    [attr.aria-selected]="lang.id === selectedLanguage"
                    [attr.cdkFocusInitial]="lang.id === selectedLanguage ? '' : null"
                    [matTooltip]="lang.name"
                    (click)="selectLanguage(lang.id)"
                >
                    {{ lang.name }}
                </button>
            }
        </div>
    }
</div>

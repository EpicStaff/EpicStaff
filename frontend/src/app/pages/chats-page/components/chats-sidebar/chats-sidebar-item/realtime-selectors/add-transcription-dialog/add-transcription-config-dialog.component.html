<div class="dialog-container">
    <div class="dialog-header">
        <h2 class="dialog-title">
            {{ isEditMode ? 'Edit Transcription Configuration' : 'Create Transcription Configuration' }}
        </h2>
        <button
            class="close-button"
            (click)="onCancel()"
        >
            <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
            >
                <line
                    x1="18"
                    y1="6"
                    x2="6"
                    y2="18"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                />
                <line
                    x1="6"
                    y1="6"
                    x2="18"
                    y2="18"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                />
            </svg>
        </button>
    </div>

    <div class="dialog-content">
        <form [formGroup]="transcriptionForm">
            <div class="form-group">
                <label for="model">Transcription Model</label>
                <app-select
                    formControlName="realtime_transcription_model"
                    placeholder="Select a model"
                    [items]="modelItems"
                />
            </div>

            <div class="form-group">
                <label for="customName">Custom Name</label>
                <input
                    type="text"
                    id="customName"
                    formControlName="custom_name"
                    placeholder="Enter a custom name"
                    class="text-input"
                />
            </div>

            <div class="form-group">
                <label for="apiKey">API Key</label>
                <app-select
                    id="apiKey"
                    formControlName="api_key_secret_id"
                    variant="boxed"
                    placeholder="Select a secret"
                    [items]="secretItems"
                    [showSearch]="true"
                    searchPlaceholder="Search a secret..."
                />
                @if (!transcriptionForm.get('api_key_secret_id')?.value) {
                    <app-hint-message>
                        Choose an existing secret. To add a new one, go to the <strong>Secrets tab</strong>.
                    </app-hint-message>
                }
            </div>
        </form>
    </div>

    <div class="dialog-footer">
        <button
            class="button secondary"
            (click)="onCancel()"
        >
            Cancel
        </button>
        <button
            class="button primary"
            [disabled]="transcriptionForm.invalid || submitting"
            (click)="onConfirm()"
        >
            @if (isEditMode) {
                {{ submitting ? 'Saving...' : 'Save' }}
            } @else {
                {{ submitting ? 'Creating...' : 'Create' }}
            }
        </button>
    </div>
</div>

<aside class="chats-sidebar">
    <div class="chats-sidebar__search">
        <app-search
            [(searchTerm)]="searchTerm"
            placeholder="Search agents..."
        />
    </div>

    @if (filteredAgents.length === 0) {
        <p class="chats-sidebar__empty">No agents with a realtime config.</p>
    } @else {
        <ul class="chats-sidebar__list">
            @for (agent of filteredAgents; track trackByAgent($index, agent)) {
                <li>
                    <app-chats-sidebar-item
                        [chatAgent]="agent"
                        (agentUpdated)="agentUpdated.emit($event)"
                    ></app-chats-sidebar-item>
                </li>
            }
        </ul>
    }
</aside>

<div
    class="resizable-sidebar-handle"
    [appResizableSidebar]="sidebarStorageKey"
    [sidebarTarget]="hostElement"
></div>

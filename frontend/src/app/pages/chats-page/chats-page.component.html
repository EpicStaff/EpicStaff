<div class="chats-page">
    <div class="sticky-header">
        <header class="header">
            <div
                class="header-titles"
                appHideInlineSubtitleOnOverflow
            >
                <h1 class="title">
                    Chats
                    <span class="subtitle-inline"> Talk to agents with a realtime voice model configured. </span>
                </h1>
            </div>
        </header>
    </div>

    <main class="body">
        @if (isLoading()) {
            <div class="chats-page__loading">
                <app-spinner
                    [text]="'Loading chats...'"
                    [accentColor]="'#6562f5'"
                    [isOverlay]="false"
                ></app-spinner>
            </div>
        } @else {
            <app-chats-sidebar
                [agents]="agents()"
                (agentUpdated)="onAgentUpdated($event)"
            ></app-chats-sidebar>
            <app-chats-content></app-chats-content>
        }
    </main>
</div>

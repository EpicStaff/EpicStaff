<!-- Editor Header -->

@if (showHeader && compactHeader()) {
    <!-- Same look as the JSON editor's header; the actions stay real buttons for keyboard users. -->
    <div class="editor-header editor-header--compact">
        <div class="left-section">
            <span class="editor-title">
                <app-svg-icon
                    icon="python"
                    size="1.2rem"
                    class="python-icon"
                />
                Python3
            </span>
            <span class="editor-subtitle">(entrypoint "main")</span>
        </div>
        <div class="right-section">
            <button
                type="button"
                class="action-icon"
                aria-label="Copy code"
                matTooltip="Copy code"
                matTooltipPosition="above"
                (click)="copyCode()"
            >
                <app-svg-icon
                    icon="copy"
                    size="1rem"
                />
            </button>
            @if (allowExpand()) {
                <button
                    type="button"
                    class="action-icon"
                    [attr.aria-label]="expandLabel()"
                    [matTooltip]="expandLabel()"
                    matTooltipPosition="above"
                    (click)="onExpand()"
                >
                    <app-svg-icon
                        icon="editor-expand"
                        size="0.875rem"
                    />
                </button>
            }
        </div>
    </div>
} @else if (showHeader) {
    <div class="editor-header">
        <div class="left-section">
            <span class="editor-title">
                <app-svg-icon
                    icon="python"
                    size="1.2rem"
                    class="python-icon"
                ></app-svg-icon>
                Python3 <span class="entrypoint-main"> (entrypoint "main")</span>
            </span>
        </div>
        <div class="right-section">
            <app-icon-button
                icon="copy"
                size="2rem"
                ariaLabel="Copy code"
                matTooltip="Copy code"
                matTooltipPosition="above"
                (onClick)="copyCode()"
            ></app-icon-button>
            @if (allowExpand()) {
                <app-icon-button
                    icon="editor-expand"
                    size="2rem"
                    [ariaLabel]="expandLabel()"
                    [matTooltip]="expandLabel()"
                    matTooltipPosition="above"
                    (onClick)="onExpand()"
                ></app-icon-button>
            }
        </div>
    </div>
}

<!-- Editor Container -->
<div
    class="editor-container"
    [style.height.px]="currentEditorHeight()"
    #editorContainer
>
    <ngx-monaco-editor
        [options]="editorOptions"
        [ngModel]="pythonCode"
        (ngModelChange)="onCodeChange($event)"
        (onInit)="onEditorInit($event)"
        class="monaco-editor"
    ></ngx-monaco-editor>

    <!-- Loading Overlay -->
    @if (!editorLoaded) {
        <div class="editor-loading-overlay">
            <div class="spinner"></div>
            <span>Loading editor...</span>
        </div>
    }
</div>

<!-- Resize Handle (only with an opt-in fixed height) -->
@if (currentEditorHeight() !== null) {
    <div
        class="editor-resize-handle"
        appResizable
        (heightChange)="onResize($event)"
    >
        <div class="little-handle"></div>
    </div>
}

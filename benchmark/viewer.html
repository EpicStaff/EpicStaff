<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EpicStaff Benchmarks</title>
  <link rel="icon" href="data:," />
  <script>
    // the theme before the first paint (the control in the header changes it later)
    (() => {
      let choice = "auto";
      try { choice = localStorage.getItem("epicstaff-bench-theme") || "auto"; } catch { /* storage blocked: Auto */ }
      const dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    /* Layout: one-column workbench — actions, run picker, differences, then tabbed comparisons; wide tables scroll inside their own box. */
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --ink: #12161c;
      --ink-2: #4b5360;
      --muted: #646c79; /* 4.9:1 on --bg, 5.3:1 on --surface */
      --line: #d9dee5;
      --grid: #e6e9ee;
      --accent: #1f5bc4;
      --accent-soft: #e5edfb;
      --good: #0b7a0b;
      --bad: #c42b2b;
      --warning: #9a5b00; /* status only (findings, flagged panels); 5.4:1 on --surface */
      --alert-bg: #fdeceb;
      --alert-ink: #8a1c1c;
      --alert-line: #eeb1ad;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --series-4: #eda100;
      --series-5: #e87ba4;
      --series-6: #008300;
      --series-7: #4a3aa7;
      --series-8: #e34948;
      --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-data: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    }
    /* dark theme: <html data-theme="dark">, set by the theme control (Auto follows the OS setting) */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0e1116;
      --surface: #161a21;
      --ink: #edf0f4;
      --ink-2: #b6bdc8;
      --muted: #8f98a5; /* 6.5:1 on --bg, 6.0:1 on --surface */
      --line: #2b313b;
      --grid: #232830;
      --accent: #79a6f2;
      --accent-soft: #1b2940;
      --good: #43c15b;
      --bad: #f07070;
      --warning: #fab219;
      --alert-bg: #3a1618;
      --alert-ink: #ffd0cc;
      --alert-line: #7d2d2d;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding-inline: 16px;
      padding-block: 20px 48px;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 var(--font-ui);
    }
    body > * { max-width: 1440px; margin-inline: auto; }
    h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
    h2 { font-size: 16px; margin: 0 0 4px; text-wrap: balance; }
    h3 { font-size: 13px; margin: 16px 0 6px; color: var(--ink-2); font-weight: 600; letter-spacing: 0.02em; }
    p { margin: 0; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px; }
    .subtitle { color: var(--ink-2); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
    button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .drop { border: 1px dashed var(--line); border-radius: 6px; padding: 6px 12px; color: var(--muted); }
    .drop.over { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; min-width: 0; }
    .panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 12px; }
    .filters { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 12px; margin-bottom: 12px; }
    label.field { display: grid; gap: 2px; font-size: 12px; color: var(--ink-2); }
    label.inline { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; color: var(--ink-2); }
    label.inline > select { min-width: 0; }
    select, input[type="search"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-bottom: 12px; }
    .table-wrap { overflow-x: auto; max-width: 100%; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; white-space: nowrap; }
    th { font-size: 12px; font-weight: 600; color: var(--ink-2); }
    th.num, td.num { text-align: right; }
    th button { all: unset; cursor: pointer; }
    th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    th[aria-sort="ascending"] button::after { content: " ▲"; }
    th[aria-sort="descending"] button::after { content: " ▼"; }
    tr.selected td { background: var(--accent-soft); }
    .mono { font-family: var(--font-data); font-size: 12.5px; }
    .clip { max-width: 28ch; overflow: hidden; text-overflow: ellipsis; }
    .wrap { white-space: normal; min-width: 18ch; max-width: 36ch; }
    .chip { display: inline-block; padding: 0 6px; margin-right: 4px; border: 1px solid var(--line); border-radius: 999px; font-size: 11.5px; color: var(--ink-2); }
    .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }
    .delta { display: block; font-size: 12px; }
    .delta.better { color: var(--good); }
    .delta.worse { color: var(--bad); }
    .delta.same, .muted { color: var(--muted); }
    .reason { display: block; font-size: 12px; color: var(--ink-2); }
    .warn { cursor: help; color: var(--bad); }
    .banner { margin-bottom: 12px; padding: 10px 12px; border: 1px solid var(--alert-line); border-radius: 6px; background: var(--alert-bg); color: var(--alert-ink); font-weight: 600; }
    #messages { display: grid; gap: 6px; }
    #messages:not(:empty) { margin-bottom: 16px; }
    #messages p { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 1px solid var(--alert-line); border-radius: 6px; background: var(--alert-bg); color: var(--alert-ink); }
    nav { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--ink-2); }
    nav button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
    .hint { max-width: 80ch; margin: 2px 0 12px; font-size: 12.5px; color: var(--ink-2); }
    .empty { padding: 24px 0; color: var(--ink-2); }
    .chart { position: relative; width: 100%; }
    /* the Timeline's shared crosshair: a 1px overlay per chart, moved without redrawing the canvas */
    .crosshair { position: absolute; top: 0; width: 1px; background: var(--ink-2); pointer-events: none; }
    .grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
    .grid-2 > * { min-width: 0; }
    .key { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
    /* Column tooltips: the definition is in the header's aria-describedby text; #tip shows it on hover and focus. */
    th [aria-describedby] { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; cursor: help; }
    th button[aria-describedby] { cursor: pointer; }
    #tip { position: fixed; z-index: 10; max-width: min(44ch, calc(100vw - 16px)); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 12px; line-height: 1.4; box-shadow: 0 2px 8px rgb(0 0 0 / 0.18); pointer-events: none; }
    .glyph { font-weight: 700; }
    .findings h3 { display: flex; align-items: center; gap: 6px; }
    .finding-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .finding-list button { all: unset; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
    .finding-list button:hover { background: var(--accent-soft); }
    .finding-list button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .goto { font-size: 12px; color: var(--accent); }
    /* Timeline zoom: the range being dragged, and the overview's brush over the visible range */
    .selection, .brush { position: absolute; pointer-events: none; background: color-mix(in srgb, var(--accent) 22%, transparent); border-inline: 1px solid var(--accent); }
    .container-row { margin: 0 0 16px; padding: 8px 8px 4px; border: 1px solid var(--grid); border-radius: 6px; min-width: 0; }
    .container-row.warning { border: 2px solid var(--warning); }
    .container-row.critical { border: 2px solid var(--bad); }
    .container-row .name { margin: 0 0 4px; color: var(--ink); font-size: 14px; }
    .container-row .flag { margin: 0 0 4px; font-size: 12.5px; color: var(--ink-2); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>EpicStaff Benchmarks</h1>
      <p class="subtitle">Pick runs, set a baseline, compare capacity, latency and resources.</p>
    </div>
    <div class="actions">
      <label class="inline">Theme <select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <button id="load-index" type="button">Load index.json</button>
      <button id="open-folders" type="button" class="primary">Open run folders…</button>
      <input id="folder-input" type="file" webkitdirectory multiple hidden />
      <div id="drop-zone" class="drop">or drop run folders here</div>
    </div>
  </header>
  <div id="messages" role="status" aria-live="polite"></div>
  <section id="runs" class="panel" aria-labelledby="runs-title">
    <div class="panel-head">
      <h2 id="runs-title">Runs</h2>
      <p id="runs-count" class="muted"></p>
    </div>
    <div class="filters">
      <label class="field">Kind <select id="filter-kind"></select></label>
      <label class="field">Case <select id="filter-case"></select></label>
      <label class="field">Ref <select id="filter-ref"></select></label>
      <label class="field">Host <select id="filter-host"></select></label>
      <label class="field">Search <input id="filter-text" type="search" placeholder="note, label, sha, folder" /></label>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col" data-def="select">Select</th>
            <th scope="col" data-def="baseline">Baseline</th>
            <th scope="col" data-def="run">Run</th>
            <th scope="col" data-def="created_at">Date (UTC)</th>
            <th scope="col" data-def="run_kind">Kind</th>
            <th scope="col" data-def="case_variant">Case / variant</th>
            <th scope="col" data-def="ref">Ref</th>
            <th scope="col" data-def="sha">Sha</th>
            <th scope="col" data-def="host">Host</th>
            <th scope="col" data-def="note">Note</th>
            <th scope="col" data-def="labels">Labels</th>
            <th scope="col" data-def="result">Result</th>
          </tr>
        </thead>
        <tbody id="runs-body"></tbody>
      </table>
    </div>
  </section>
  <section id="diff" class="panel" hidden></section>
  <nav id="tabs" role="tablist" aria-label="Comparison views"></nav>
  <main id="tab"></main>
  <div id="tip" aria-hidden="true" hidden></div>
  <script>
    "use strict";

    const TABS = ["Verdicts", "Curves", "Time breakdown", "Timeline", "Nodes", "Containers", "Waterfall"];
    // Same text columns as compare.py: never coerced to numbers, even when they look numeric.
    const TEXT_COLUMNS = new Set([
      "phase", "kind", "verdict", "live_verdict", "fail_reasons", "bottleneck", "node_name", "node_type",
      "container", "status", "error_reason", "censored", "service", "checkpoint", "extra_json",
      "stage", "severity", "message", "tab",
    ]);
    // One line per column, consistent with benchmark/docs/METRICS.md: every table header's tooltip.
    // Keys are CSV column names (test_bench.ViewerDefinitionsTest checks that every column the
    // analyzer writes has one), "<file>.<column>" where a name means different things in two
    // files, meta.json verdict keys, and the viewer's own columns. A duration statistic such as
    // e2e_s_p95 is explained by its statistic (p95) and its duration (e2e_s); see definition().
    const DEFINITIONS = {
      phase: "Phase of the case: one flow with its pass rules. Phases run one after another.",
      segment: "Stretch of load after a stack restart: 1 is the ladder, every bisect probe is its own segment.",
      level: "Concurrency level: sessions kept in flight at the same time (0 outside a level).",
      kind: "ladder, bisect or dev level; for a session also cold (first after a restart) or finish (sent while the level waited for its measured sessions; never measured).",
      cold: "1 for the first session after a restart: start-up cost, never in aggregates.",
      session_id: "EpicStaff session id (empty when the start request failed).",
      intended_ts: "When the load controller decided to start the session (epoch s). Decides whether it is measured.",
      sent_ts: "When the start request was actually sent (epoch s).",
      gen_lag_ms: "sent_ts − intended_ts: how late the load generator sent the session.",
      api_ms: "Duration of the start request.",
      http_status: "HTTP status of the start request.",
      arrival_ts: "Django request_received: when the start request arrived.",
      received_ts: "Crew received the session.",
      slot_ts: "Crew acquired a slot and started the flow.",
      end_ts: "Session end: crew's session_end, or the runner's own stop time for timeout, http_error and interrupted.",
      status: "Final status: crew's (end, error, stop, …) or the runner's http_error, timeout, interrupted. Empty: no end known.",
      censored: "True when the duration is only a lower bound (interrupted, or still running when judged).",
      error_reason: "Why the session did not end with end: the request error or crew's reason.",
      e2e_s: "End-to-end seconds: request sent → session end, as a client sees it.",
      dispatch_s: "Request sent → crew received: HTTP, Django creating and publishing the session, Redis delivery to crew.",
      queue_wait_s: "Crew received → slot acquired: waiting for a crew slot.",
      run_s: "Slot acquired → session end: executing the flow.",
      llm_s: "Sum of time inside LLM provider calls (parallel calls can exceed wall time).",
      llm_calls: "Number of LLM calls.",
      tokens: "Total LLM tokens.",
      cost_usd: "LLM cost reported by the agent, USD.",
      agent_queue_s: "Sum of crew agent_dispatched → agent request_consumed: waiting for an agent worker.",
      python_s: "Sum of sandbox exec_start → exec_end: running Python code in the sandbox.",
      sandbox_wait_s: "Sum of sandbox_dispatched (crew or agent) → sandbox exec_start: code handed to the sandbox but not running yet.",
      other_s: "Crew overhead: run_s − LLM − Python − agent queue − sandbox wait (≥ 0): orchestration, node bookkeeping, Redis hops. In runs without sandbox_wait_s it still contains the sandbox wait.",
      platform_overhead_s: "e2e_s − llm_s: everything that is not the LLM provider.",
      p50: "Median: half the sessions were faster",
      p90: "90 % of the sessions were faster",
      p95: "95 % of the sessions were faster (the pass rules use it)",
      p99: "99 % of the sessions were faster (close to max with few sessions)",
      max: "Slowest session",
      mean: "Arithmetic mean",
      target: "Concurrency target (= level).",
      inflight_mean: "Mean sessions in flight in the measured window; well below target means the generator or the API could not keep up.",
      running_mean: "Mean sessions crew was executing (slot acquired, not ended). 0 in fallback mode.",
      steady_s: "Measured window: end of settle → end of hold, seconds.",
      sent: "Measured sessions of the level.",
      completed: "Measured sessions that ended with status end.",
      failed: "Measured sessions that ended with another status (interrupted ones excluded).",
      interrupted: "Measured sessions stopped because the run itself was stopped. Not failures.",
      throughput_per_min: "Sessions of the phase that ended end in the level's measured window, per minute.",
      error_rate: "failed / sent over the measured sessions.",
      cpu_s_per_session: "CPU-seconds of all containers in the measured window / sessions that ended end in it. Includes idle CPU.",
      mb_per_concurrent: "Per level: Σ (container memory − baseline) / mean running sessions. Includes fixed growth, so it reads high at low levels.",
      gen_lag_p99_ms: "p99 generator lag of the measured sessions; above 500 ms the level is invalid (the tool, not the server, was the limit).",
      verdict: "Final verdict of the level: pass, fail or invalid.",
      live_verdict: "Verdict the runner took during the run; it decided whether the ladder continued.",
      fail_reasons: "The rules that failed, or why the level is invalid.",
      bottleneck: "Why a level failed, first match of: container restart/OOM, timed-out sessions (with the checkpoint where they hung), host RAM, host CPU, container CPU limit, crew slots full, agent queue growing, Postgres connections.",
      container: "Container name.",
      cpu_s: "CPU-seconds the container used in the level's measured window.",
      "containers.cpu_s_per_session": "This container's CPU-seconds in the measured window / sessions that ended end in it.",
      cpu_pct_mean: "Mean sampled CPU in the window, % of one core.",
      cpu_pct_max: "Highest sampled CPU in the window, % of one core.",
      mem_mean_mb: "Mean sampled memory in the window, MB.",
      mem_peak_mb: "Highest 2-second memory sample in the level's measured window, MB.",
      restarts: "Rise of the container's restart count.",
      oom_kills: "Rise of the container's OOM-kill counter.",
      phase_peak_mb: "Highest memory sample of the container over the whole phase: every level including the failing one, drain and cooldown.",
      phase_peak_level: "Level of the phase peak sample; 0 = outside a level (cold session, baseline, drain or cooldown), shown as “outside a level”.",
      baseline_mb: "Mean container memory before load (the phase's first baseline window), MB.",
      "container_phases.mb_per_concurrent": "Slope of the container's memory against running sessions over the phase's first segment: MB one more concurrent session costs.",
      r2: "r²: how well that slope fits (1 = a perfect line, 0 = none). Below 0.5 it stays out of the headline.",
      retained_mb_after_cooldown: "Memory above baseline in the last 60 s of the cooldown: caches, fragmentation or a leak.",
      node_name: "Node as named in the flow.",
      node_type: "Node type.",
      count: "Node executions in the level's measured sessions.",
      p50_s: "Median node execution time, s.",
      p95_s: "95th percentile node execution time, s.",
      mean_s: "Mean node execution time, s.",
      max_s: "Slowest node execution, s.",
      error_count: "Executions whose node_end reported ok = false.",
      ts: "Sample or event time (epoch s).",
      rel_s: "Seconds since the segment's sampler started; restarts at 0 in every segment.",
      run_rel_s: "Seconds since the run's first sample, continuous across segments (the timeline x axis).",
      inflight: "Sessions in flight: started, not ended (includes sessions queued in crew).",
      running: "Sessions crew is executing.",
      queued: "inflight − running: waiting for a slot or not yet received by crew.",
      "timeline.completed": "Sessions ended with end so far in the segment (cumulative).",
      "timeline.failed": "Sessions failed so far in the segment (cumulative, interrupted excluded).",
      host_cpu_pct: "Busy share of all host cores, %.",
      host_mem_avail_mb: "Host MemAvailable, MB.",
      host_mem_avail_pct: "Host MemAvailable, % of RAM.",
      load1: "Host 1-minute load average.",
      pg_connections: "Rows in pg_stat_activity (includes Postgres background processes).",
      pg_max_connections: "Postgres max_connections.",
      redis_used_mb: "Redis used_memory, MB.",
      runner_cpu_pct: "CPU of the benchmark process itself, % of one core.",
      "timeline.throughput_per_min": "Sessions that ended with end in the 60 s before the sample (a rolling rate per minute).",
      e2e_p95_60s: "p95 end-to-end seconds of the sessions that ended with end in the 60 s before the sample.",
      cpu_pct: "Container CPU between two samples, % of one core (100 = one full core).",
      mem_mb: "Container memory, MB.",
      service: "Service that logged the checkpoint: django_app, crew, agent, sandbox.",
      checkpoint: "BENCH checkpoint name.",
      extra_json: "Every other field of the checkpoint line.",
      stage: "Where an in-flight session is, from the last checkpoint it reached: waiting for crew, crew, agent queue, agent, LLM, waiting for sandbox, python, result return.",
      "inflight_stages.count": "Sessions in flight at that stage at the sample.",
      severity: "critical, warning or info.",
      "findings.kind": "Rule that produced the finding.",
      message: "What the rule found.",
      tab: "Viewer tab to read on.",
      max_pass_concurrency: "Highest level with a final pass (ladder or bisect): the measured capacity under the pass rules.",
      first_fail_level: "Lowest failing level; the true limit lies between it and the max passing level.",
      throughput_per_min_at_max: "Throughput at the highest passing level, sessions per minute.",
      p95_e2e_s_at_max: "p95 end-to-end seconds at the highest passing level.",
      p95_platform_overhead_s_at_max: "p95 of e2e minus LLM time at the highest passing level.",
      cpu_s_per_session_at_max: "CPU-seconds per session at the highest passing level (all containers, idle CPU included).",
      mb_per_concurrent_total: "Sum of the containers' memory slopes with r² ≥ 0.5: memory one more concurrent session costs.",
      p50_e2e_s: "Median end-to-end seconds.",
      p95_e2e_s: "95th percentile end-to-end seconds.",
      capacity_estimate: "Smallest bound (CPU, RAM, configured caps) extrapolated from the highest passing level; the bounds are in the cell's title.",
      run: "Run: #N from the results index, L1, L2 … for folders opened from disk.",
      select: "Tick to compare the run.",
      baseline: "The run the others are compared with (Δ %).",
      created_at: "When the run started (UTC).",
      run_kind: "capacity (ladder until a level fails) or dev (fixed load, no verdict).",
      case_variant: "Case file and the variant (env overrides) it ran.",
      ref: "Git ref that was measured.",
      sha: "Git commit that was measured.",
      host: "Host the stack ran on.",
      note: "--note given to the run.",
      labels: "Labels limiting what the run can show (interrupted, crashed, fallback-control, dirty-tree, …).",
      result: "Capacity runs: highest passing concurrency per phase. Dev runs: p95 end-to-end seconds.",
      field: "meta.json field that differs between the selected runs.",
      sessions: "Completed sessions of the level the bar averages over (cold sessions excluded).",
      headline_level: "Highest passing level (dev: its only level): where CPU and peak memory are read.",
      delta_p50: "Change of the node's p50 against the same node in the baseline run.",
    };
    const NUMBER = /^-?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/;
    const MEASURED_KINDS = new Set(["ladder", "bisect", "dev"]);
    const CAPACITY_COLUMNS = [
      // [verdict key, label, +1 higher is better / -1 lower is better]
      ["max_pass_concurrency", "Max passing concurrency", 1],
      ["first_fail_level", "First failing level", 1],
      ["throughput_per_min_at_max", "Throughput /min", 1],
      ["p95_e2e_s_at_max", "p95 end-to-end s", -1],
      ["p95_platform_overhead_s_at_max", "p95 platform overhead s", -1],
      ["cpu_s_per_session_at_max", "CPU-s / session", -1],
      ["mb_per_concurrent_total", "MB / concurrent session", -1],
    ];
    const DEV_COLUMNS = [
      ["level", "Concurrency", 0],
      ["throughput_per_min", "Throughput /min", 1],
      ["p50_e2e_s", "p50 end-to-end s", -1],
      ["p95_e2e_s", "p95 end-to-end s", -1],
      ["cpu_s_per_session", "CPU-s / session", -1],
    ];
    const CURVE_METRICS = {
      throughput_per_min: "Throughput (sessions / min)",
      e2e_s_p50: "p50 end-to-end (s)",
      e2e_s_p95: "p95 end-to-end (s)",
      queue_wait_s_p95: "p95 queue wait (s)",
      platform_overhead_s_p95: "p95 platform overhead (s)",
      sandbox_wait_s_p95: "p95 sandbox wait (s)",
      error_rate: "Error rate (0–1)",
      cpu_s_per_session: "CPU-seconds per session",
      mb_per_concurrent: "MB per concurrent session",
    };
    // Stacked charts colour each stage with the categorical slot of its position, in this fixed
    // order (the palette is validated for neighbours in slot order; a custom order failed it).
    // Both lists put the shared stages on the same slot — dispatch / waiting for crew, crew
    // overhead / crew, agent queue, LLM, sandbox wait / waiting for sandbox, Python — so a colour
    // means the same thing in both charts; only slot 4 differs (queue wait / agent).
    const BREAKDOWN = [
      ["dispatch_s", "Dispatch"], ["other_s", "Crew overhead"], ["agent_queue_s", "Agent queue"],
      ["queue_wait_s", "Queue wait"], ["llm_s", "LLM"], ["sandbox_wait_s", "Sandbox wait"], ["python_s", "Python"],
    ];
    // analyze.STAGES, same order
    const STAGES = ["waiting for crew", "crew", "agent queue", "agent", "LLM", "waiting for sandbox", "python", "result return"];
    // [severity, glyph, label, status colour token]: the glyph and the label carry the meaning, never the colour alone
    const SEVERITIES = [["critical", "✖", "Critical", "--bad"], ["warning", "▲", "Warning", "--warning"], ["info", "ⓘ", "Info", "--ink-2"]];
    // findings.csv kind → the short label of its timeline marker
    const MARKER_LABELS = {
      timeouts: "first timeout", abort: "abort", container_restart: "restart/OOM", http_errors: "first HTTP error",
      invalid_level: "invalid level", cpu_limit: "CPU limit",
    };
    const SPAN_TYPES = [
      ["session", "Session (request → end)", "--muted"], ["queue", "Queue (received → slot)", "--series-2"],
      ["node", "Node", "--series-1"], ["llm", "LLM call", "--series-7"], ["exec", "Python exec (sandbox)", "--series-3"],
    ];
    const PICKS = ["fastest", "median", "slowest", "failed", "cold"];
    // capacity_estimate.limit → short label; the raw name stays in the cell's tooltip
    const LIMIT_NAMES = { cpu: "CPU", ram: "RAM", CREW_MAX_CONCURRENT_SESSIONS: "crew slots", AGENT_MAX_CONCURRENT_RUNS: "agent runs" };

    const state = {
      runs: new Map(),
      selected: [],
      baseline: null,
      tab: "Verdicts",
      filters: { kind: "", case: "", ref: "", host: "", text: "" },
      curveMetric: "throughput_per_min",
      logX: true,
      focusRun: null,
      sessionPick: "median",
      highlight: null, // run_rel_s of a finding to show once the Timeline is drawn
      zoom: null, // { run, from, to }: the Timeline's visible range, kept across re-draws
    };
    let charts = [];
    let tipCount = 0;
    let localCount = 0;
    let diffToken = 0;
    const notified = new Set();

    // ------------------------------------------------------------ small helpers

    const $ = (selector) => document.querySelector(selector);

    function el(tag, attributes = {}, ...children) {
      const node = document.createElement(tag);
      for (const [name, value] of Object.entries(attributes)) {
        if (value === undefined || value === null || value === false) continue;
        if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
        else if (name === "class") node.className = value;
        else node.setAttribute(name, value === true ? "" : value);
      }
      node.append(...children.flat(Infinity).filter((child) => child !== null && child !== undefined && child !== false));
      return node;
    }

    const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    function fmt(value) {
      if (value === null || value === undefined || value === "") return "—";
      if (typeof value !== "number") return String(value);
      if (Number.isInteger(value)) return String(value);
      const size = Math.abs(value);
      return String(+value.toFixed(size >= 100 ? 1 : size >= 10 ? 2 : 3));
    }

    // Every compared metric is non-negative in reality; a negative value is a fit artefact
    // (e.g. MB per concurrent session from a noisy slope), so it gets no percentage.
    function percentChange(value, base) {
      if (typeof value !== "number" || typeof base !== "number" || base <= 0 || value < 0) return null;
      return ((value - base) / Math.abs(base)) * 100;
    }

    function delta(value, base, better) {
      const percent = percentChange(value, base);
      if (percent === null) return null;
      const tone = !better || Math.abs(percent) < 0.05 ? "same" : (percent > 0) === (better > 0) ? "better" : "worse";
      return el("span", { class: `delta ${tone}` }, `${percent >= 0 ? "+" : ""}${percent.toFixed(1)}%`);
    }

    function mean(values) {
      const known = values.filter((value) => typeof value === "number");
      return known.length ? known.reduce((sum, value) => sum + value, 0) / known.length : null;
    }

    function notify(text) {
      if (notified.has(text)) return;
      notified.add(text);
      const line = el("p", {}, el("span", {}, text));
      line.append(el("button", { type: "button", onclick: () => { line.remove(); notified.delete(text); } }, "Dismiss"));
      $("#messages").append(line);
    }

    const byCreated = (left, right) => (left.summary.created_at || "").localeCompare(right.summary.created_at || "");
    const byName = (left, right) => String(left ?? "").localeCompare(String(right ?? ""), undefined, { numeric: true });
    const swatch = (run) => el("span", { class: "swatch", style: `background: var(--series-${run.slot + 1})`, "aria-hidden": "true" });
    const runColor = (run) => css(`--series-${run.slot + 1}`);
    const comparable = (run, baseline) => run !== baseline && run.summary.kind === baseline.summary.kind;

    function runCell(run, baseline, ...extra) {
      return el("td", { title: run.folder }, swatch(run), run.tag, " ",
        run === baseline ? el("span", { class: "chip" }, "baseline") : null, extra);
    }

    function phaseList(rowLists) {
      const names = [];
      for (const rows of rowLists) for (const row of rows) if (row && row.phase && !names.includes(row.phase)) names.push(row.phase);
      return names;
    }

    // Same rule as compare.headline: capacity → highest passing step; otherwise the first step.
    function headline(run, steps, phase) {
      const own = steps.filter((step) => step.phase === phase);
      const passes = own.filter((step) => step.verdict === "pass");
      if (run.summary.kind === "capacity" && passes.length) return passes.reduce((best, step) => (step.level > best.level ? step : best));
      return own[0] || null;
    }

    const sameStep = (row, step) => row.phase === step.phase && row.segment === step.segment && row.level === step.level && row.kind === step.kind;

    // ------------------------------------------------------------ column tooltips

    function definition(key) {
      if (!key) return null;
      if (DEFINITIONS[key]) return DEFINITIONS[key];
      const match = /^(.+)_(p50|p90|p95|p99|max|mean)$/.exec(key);
      return match && DEFINITIONS[match[1]] ? `${match[2]}: ${DEFINITIONS[match[2]]}, of ${DEFINITIONS[match[1]]}` : null;
    }

    function showTip(anchor, text) {
      const tip = $("#tip");
      tip.textContent = text;
      tip.hidden = false;
      const box = anchor.getBoundingClientRect();
      const left = Math.max(8, Math.min(box.left, innerWidth - tip.offsetWidth - 8));
      const below = box.bottom + 6;
      tip.style.left = `${left}px`;
      tip.style.top = `${below + tip.offsetHeight > innerHeight - 8 ? box.top - tip.offsetHeight - 6 : below}px`;
    }

    const hideTip = () => { $("#tip").hidden = true; };

    // A header cell whose definition is announced (aria-describedby) and shown on hover and on
    // keyboard focus — `title` alone reaches neither keyboard nor touch users.
    function header(label, key, { numeric = false, onSort = null } = {}) {
      const text = definition(key);
      const id = text ? `def-${++tipCount}` : undefined;
      const control = onSort
        ? el("button", { type: "button", onclick: onSort, "aria-describedby": id }, label)
        : text ? el("span", { tabindex: "0", "aria-describedby": id }, label) : label;
      const cell = el("th", { scope: "col", class: numeric ? "num" : "" }, control, text ? el("span", { id, hidden: true }, text) : null);
      if (text) {
        cell.addEventListener("mouseenter", () => showTip(cell, text));
        cell.addEventListener("mouseleave", hideTip);
        cell.addEventListener("focusin", () => showTip(cell, text));
        cell.addEventListener("focusout", hideTip);
      }
      return cell;
    }

    // ------------------------------------------------------------ loading

    async function loadIndex() {
      try {
        const response = await fetch("benchmarks/index.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const index = await response.json();
        if (index.schema_version !== 1) {
          notify(`benchmarks/index.json has schema_version ${index.schema_version}; this viewer reads version 1. Update index.html from benchmark/viewer.html.`);
          return;
        }
        for (const entry of index.runs) {
          const key = `served:${entry.folder}`;
          const existing = state.runs.get(key);
          if (existing) existing.summary = entry;
          else state.runs.set(key, {
            key, tag: `#${entry.number}`, number: entry.number, folder: entry.folder, local: false,
            source: `benchmarks/${encodeURIComponent(entry.folder)}/`, summary: entry,
          });
        }
        if (!state.selected.length && index.runs.length) {
          const newest = [...state.runs.values()].filter((run) => !run.local).sort(byCreated).pop();
          toggleSelect(newest, true);
          return;
        }
        refresh();
      } catch (error) {
        notify(`Could not load benchmarks/index.json (${error.message}). If you opened this page from disk, use “Open run folders…” instead.`);
      }
    }

    async function openFolders(fileList) {
      const folders = new Map();
      for (const file of fileList) {
        const parts = (file.relativePath || file.webkitRelativePath || file.name).split("/");
        if (parts.length < 2) continue;
        const folder = parts[parts.length - 2];
        if (!folders.has(folder)) folders.set(folder, new Map());
        folders.get(folder).set(parts[parts.length - 1], file);
      }
      const opened = [];
      for (const [folder, files] of folders) {
        if (!files.has("meta.json")) continue;
        try {
          opened.push({ folder, files, meta: JSON.parse(await files.get("meta.json").text()) });
        } catch (error) {
          notify(`${folder}: meta.json is not valid JSON (${error.message}).`);
        }
      }
      opened.sort((left, right) => (left.meta.created_at || "").localeCompare(right.meta.created_at || "")); // L1 = oldest, like #1
      let added = 0;
      for (const { folder, files, meta } of opened) {
        if (!checkSchema(meta)) continue;
        const key = `local:${folder}`;
        const existing = state.runs.get(key);
        const run = existing || { key, tag: `L${++localCount}`, number: null, folder, local: true };
        Object.assign(run, { source: files, summary: summaryFromMeta(meta), metaPromise: Promise.resolve(meta), cache: new Map() });
        state.runs.set(key, run);
        added++;
      }
      if (!added) notify("No run folders found: pick a run folder (it holds meta.json) or a folder that contains run folders.");
      refresh();
    }

    function summaryFromMeta(meta) {
      return {
        created_at: meta.created_at, kind: meta.kind, case: meta.case?.name, variant: meta.case?.variant,
        ref: meta.git?.ref, sha: (meta.git?.sha || "").slice(0, 7), host: meta.host?.hostname, note: meta.note,
        labels: meta.labels || [],
        verdicts: Object.fromEntries((meta.phases || []).map((phase) => [phase.name, phase.verdict || {}])),
      };
    }

    async function readText(source, name) {
      let blob;
      if (typeof source === "string") {
        const response = await fetch(source + name);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        blob = await response.blob();
      } else {
        blob = source.get(name);
        if (!blob) throw new Error("not in the folder");
      }
      if (name.endsWith(".gz")) {
        // A server that sends Content-Encoding: gzip has already decoded it; only gunzip real gzip bytes.
        const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
        if (head[0] === 0x1f && head[1] === 0x8b) {
          return new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).text();
        }
      }
      return blob.text();
    }

    function parseCsv(text) {
      const records = [];
      const length = text.length;
      let row = [];
      let position = text.charCodeAt(0) === 0xfeff ? 1 : 0;
      while (position < length) {
        let value;
        if (text[position] === '"') {
          value = "";
          position++;
          for (;;) {
            const close = text.indexOf('"', position);
            if (close === -1) { value += text.slice(position); position = length; break; }
            value += text.slice(position, close);
            if (text[close + 1] === '"') { value += '"'; position = close + 2; } else { position = close + 1; break; }
          }
        } else {
          let end = position;
          while (end < length && text[end] !== "," && text[end] !== "\n" && text[end] !== "\r") end++;
          value = text.slice(position, end);
          position = end;
        }
        row.push(value);
        if (text[position] === ",") {
          position++;
          if (position === length) row.push("");
          continue;
        }
        records.push(row);
        row = [];
        if (text[position] === "\r") position++;
        if (text[position] === "\n") position++;
      }
      if (row.length) records.push(row);
      const [header, ...body] = records;
      if (!header) return [];
      return body
        .filter((cells) => !(cells.length === 1 && cells[0] === ""))
        .map((cells) => {
          const object = {};
          header.forEach((name, column) => {
            const raw = cells[column] ?? "";
            object[name] = raw === "" ? null : !TEXT_COLUMNS.has(name) && NUMBER.test(raw) ? Number(raw) : raw;
          });
          return object;
        });
    }

    function checkSchema(meta) {
      if (meta.schema_version === 1) return true;
      notify(`Run ${meta.run_id || "(no run_id)"} has schema_version ${meta.schema_version ?? "(missing)"}; this viewer reads version 1 only, so the run cannot be opened. Update index.html from benchmark/viewer.html.`);
      return false;
    }

    function loadMeta(run) {
      run.metaPromise ??= readText(run.source, "meta.json")
        .then(JSON.parse)
        .then((meta) => {
          if (checkSchema(meta)) return meta;
          run.refused = true;
          return null;
        })
        .catch((error) => {
          notify(`${run.tag}: could not read meta.json (${error.message}).`);
          run.refused = true;
          return null;
        });
      return run.metaPromise;
    }

    function runCsv(run, name) {
      run.cache ??= new Map();
      if (!run.cache.has(name)) {
        run.cache.set(name, readText(run.source, name).then(parseCsv).catch((error) => {
          notify(`${run.tag}: could not read ${name} (${error.message}).`);
          return [];
        }));
      }
      return run.cache.get(name);
    }

    // A file older run folders do not have: null without a message when it is missing.
    function optionalCsv(run, name) {
      run.cache ??= new Map();
      const key = `optional:${name}`;
      if (!run.cache.has(key)) run.cache.set(key, readText(run.source, name).then(parseCsv).catch(() => null));
      return run.cache.get(key);
    }

    // ------------------------------------------------------------ selection and the run list

    function toggleSelect(run, on) {
      if (on && !state.selected.includes(run.key)) {
        const used = new Set(state.selected.map((key) => state.runs.get(key).slot));
        run.slot = [0, 1, 2, 3, 4, 5, 6, 7].find((slot) => !used.has(slot)) ?? state.selected.length % 8;
        state.selected.push(run.key);
        state.baseline ??= run.key;
        loadMeta(run).then((meta) => { if (!meta) toggleSelect(run, false); });
      } else if (!on) {
        state.selected = state.selected.filter((key) => key !== run.key);
        if (state.baseline === run.key) state.baseline = state.selected[0] ?? null;
      }
      refresh();
    }

    function setBaseline(run) {
      state.baseline = run.key;
      if (state.selected.includes(run.key)) refresh();
      else toggleSelect(run, true);
    }

    function selectedRuns() {
      const runs = state.selected.map((key) => state.runs.get(key)).filter((run) => run && !run.refused);
      const baseline = runs.find((run) => run.key === state.baseline) || runs[0];
      return baseline ? [baseline, ...runs.filter((run) => run !== baseline).sort(byCreated)] : [];
    }

    function refresh() {
      renderRuns();
      renderDiff(selectedRuns());
      renderTab();
    }

    function resultText(summary) {
      return Object.entries(summary.verdicts || {}).map(([phase, verdict]) =>
        summary.kind === "capacity"
          ? `${phase} ${fmt(verdict.max_pass_concurrency)}`
          : `${phase} p95 ${fmt(verdict.p95_e2e_s ?? verdict.p95_e2e_s_at_max)} s`).join(" · ") || "—";
    }

    function renderRuns() {
      const runs = [...state.runs.values()];
      for (const key of ["kind", "case", "ref", "host"]) {
        const select = $(`#filter-${key}`);
        const values = [...new Set(runs.map((run) => run.summary[key]).filter(Boolean))].sort();
        select.replaceChildren(el("option", { value: "" }, "All"), ...values.map((value) => el("option", { value }, value)));
        if (!values.includes(state.filters[key])) state.filters[key] = "";
        select.value = state.filters[key];
      }
      const text = state.filters.text.trim().toLowerCase();
      const visible = runs
        .filter((run) => ["kind", "case", "ref", "host"].every((key) => !state.filters[key] || run.summary[key] === state.filters[key]))
        .filter((run) => !text || [run.tag, run.folder, run.summary.note, run.summary.sha, ...(run.summary.labels || [])]
          .join(" ").toLowerCase().includes(text))
        .sort((left, right) => byCreated(right, left) || (right.number ?? 0) - (left.number ?? 0));
      $("#runs-count").textContent = `${visible.length} of ${runs.length} runs shown · ${state.selected.length} selected`;
      const body = $("#runs-body");
      if (!runs.length) {
        body.replaceChildren(el("tr", {}, el("td", { colspan: 12, class: "empty" },
          "No runs loaded yet. On the results site the list loads by itself; from disk, use “Open run folders…” or drop run folders above.")));
        return;
      }
      body.replaceChildren(...visible.map((run) => {
        const selected = state.selected.includes(run.key);
        const summary = run.summary;
        return el("tr", { class: selected ? "selected" : "" },
          el("td", {}, el("input", {
            type: "checkbox", "aria-label": `Select run ${run.tag}`, checked: selected, disabled: run.refused,
            onchange: (event) => toggleSelect(run, event.target.checked),
          })),
          el("td", {}, el("input", {
            type: "radio", name: "baseline", "aria-label": `Use run ${run.tag} as the baseline`,
            checked: state.baseline === run.key, disabled: run.refused, onchange: () => setBaseline(run),
          })),
          el("td", { title: run.folder }, selected ? swatch(run) : null, run.local ? el("span", { class: "chip" }, "local") : null, run.tag),
          el("td", { class: "mono" }, (summary.created_at || "").replace("T", " ").slice(0, 16) || "—"),
          el("td", {}, summary.kind || "—"),
          el("td", {}, `${summary.case || "—"} / ${summary.variant || "—"}`),
          el("td", {}, summary.ref || "—"),
          el("td", { class: "mono" }, summary.sha || "—"),
          el("td", {}, summary.host || "—"),
          el("td", { class: "clip", title: summary.note || "" }, summary.note || "—"),
          el("td", {}, (summary.labels || []).length ? summary.labels.map((label) => el("span", { class: "chip" }, label)) : "—"),
          el("td", {}, run.refused ? el("span", { class: "chip" }, "unsupported schema") : resultText(summary)));
      }));
    }

    // ------------------------------------------------------------ what's different

    async function renderDiff(runs) {
      const token = ++diffToken;
      const section = $("#diff");
      if (runs.length < 2) { section.hidden = true; return; }
      const metas = await Promise.all(runs.map(loadMeta));
      if (token !== diffToken) return;
      const known = runs.map((run, index) => [run, metas[index]]).filter(([, meta]) => meta);
      const get = (meta, path) => path.split(".").reduce((value, key) => value?.[key], meta);
      const phase = (meta, name) => (meta.phases || []).find((item) => item.name === name);
      const rows = ["git.ref", "git.sha", "git.dirty", "case.hash", "case.variant", "case.overrides"]
        .map((path) => [path, known.map(([, meta]) => get(meta, path))]);
      const envKeys = [...new Set(known.flatMap(([, meta]) => Object.keys(meta.env || {})))].sort();
      rows.push(...envKeys.map((key) => [`env.${key}`, known.map(([, meta]) => meta.env?.[key])]));
      rows.push(...["host.hostname", "host.vcpu", "host.ram_mb", "labels"].map((path) => [path, known.map(([, meta]) => get(meta, path))]));
      const phaseNames = [...new Set(known.flatMap(([, meta]) => (meta.phases || []).map((item) => item.name)))];
      for (const name of phaseNames) {
        rows.push([`phases[${name}].graph_hash`, known.map(([, meta]) => phase(meta, name)?.graph_hash)]);
        rows.push([`phases[${name}].provider_health.slow_provider`, known.map(([, meta]) => phase(meta, name)?.provider_health?.slow_provider)]);
      }
      const show = (value) => value === undefined || value === null || (Array.isArray(value) && !value.length)
        ? "—" : typeof value === "object" ? JSON.stringify(value) : String(value);
      const differing = rows.filter(([, values]) => new Set(values.map(show)).size > 1);
      const caseDiffers = new Set(known.map(([, meta]) => meta.case?.hash)).size > 1;
      const graphDiffers = phaseNames.some((name) =>
        new Set(known.map(([, meta]) => phase(meta, name)?.graph_hash).filter(Boolean)).size > 1);
      section.replaceChildren(
        el("div", { class: "panel-head" }, el("h2", {}, "What’s different")),
        caseDiffers || graphDiffers
          ? el("p", { class: "banner", role: "alert" }, "Different workload — not comparable (case or a phase graph differs)")
          : "",
        differing.length
          ? el("div", { class: "table-wrap" }, el("table", {},
            el("thead", {}, el("tr", {}, header("Field", "field"), known.map(([run]) => el("th", { scope: "col", title: run.folder }, swatch(run), run.tag)))),
            el("tbody", {}, differing.map(([path, values]) => el("tr", {},
              el("th", { scope: "row", class: "mono" }, path),
              values.map((value) => el("td", { class: "mono clip", title: show(value) }, show(value))))))))
          : el("p", { class: "muted" }, "The selected runs share git ref and sha, case, variant, env, host and labels."));
      section.hidden = false;
    }

    // ------------------------------------------------------------ tabs

    function renderNav() {
      $("#tabs").replaceChildren(...TABS.map((name) => el("button", {
        type: "button", role: "tab", "aria-selected": String(state.tab === name),
        onclick: () => { state.tab = name; renderTab(); },
      }, name)));
    }

    function destroyCharts() {
      activeView?.dispose();
      activeView = null;
      charts.forEach((chart) => chart.destroy());
      charts = [];
    }

    async function renderTab() {
      renderNav();
      destroyCharts();
      const main = $("#tab");
      const runs = selectedRuns();
      if (!runs.length) {
        main.replaceChildren(el("p", { class: "empty" },
          "Select one or more runs above. The first run you select is the baseline; change it in the Baseline column."));
        return;
      }
      if (window.Chart) {
        Chart.defaults.color = css("--ink-2");
        Chart.defaults.borderColor = css("--grid");
        Chart.defaults.font.family = css("--font-ui");
        Chart.defaults.animation = false;
        Chart.defaults.maintainAspectRatio = false;
        // the Timeline's tooltips: one point per series at the crosshair's x (see nearestAtX)
        if (Chart.Interaction?.modes) Chart.Interaction.modes.sameX ??= (chart, event) => nearestAtX(chart, chart.scales.x.getValueForPixel(event.x));
      }
      const host = el("div");
      main.replaceChildren(host);
      const baseline = runs[0];
      try {
        if (state.tab === "Verdicts") await renderVerdicts(runs, baseline, host);
        else if (state.tab === "Curves") await renderCurves(runs, host);
        else if (state.tab === "Time breakdown") await renderBreakdown(runs, host);
        else if (state.tab === "Timeline") await renderTimeline(focusRun(runs, host), host);
        else if (state.tab === "Nodes") await renderNodes(runs, baseline, host);
        else if (state.tab === "Containers") await renderContainers(runs, baseline, host);
        else await renderWaterfall(focusRun(runs, host), host);
      } catch (error) {
        console.error(error);
        if (host.isConnected) host.append(el("p", { class: "banner" }, `Could not draw ${state.tab}: ${error.message}`));
      }
    }

    function focusRun(runs, host) {
      const run = runs.find((item) => item.key === state.focusRun) || runs[0];
      if (runs.length > 1) {
        const select = el("select", {
          id: "focus-run", onchange: (event) => { state.focusRun = event.target.value; renderTab(); },
        }, runs.map((item) => el("option", { value: item.key }, `${item.tag} · ${item.summary.ref || ""} · ${item.summary.case || ""}`)));
        select.value = run.key;
        host.append(el("div", { class: "controls" }, el("label", { class: "inline" }, "Run", select)));
      }
      return run;
    }

    function makeChart(parent, config, height, description) {
      if (!window.Chart) {
        parent.append(el("p", { class: "muted" }, "Charts need Chart.js from cdnjs.cloudflare.com, which did not load. The tables still work."));
        return null;
      }
      const canvas = el("canvas", { role: "img", "aria-label": description });
      parent.append(el("div", { class: "chart", style: `height: ${height}px` }, canvas));
      const chart = new Chart(canvas, config);
      charts.push(chart);
      return chart;
    }

    function sortableTable(columns, rows) {
      let sortColumn = null;
      let direction = 1;
      const body = el("tbody");
      const headers = columns.map((column, index) => header(column.label, column.key, {
        numeric: column.numeric, onSort: () => { direction = sortColumn === index ? -direction : 1; sortColumn = index; draw(); },
      }));
      function draw() {
        const ordered = sortColumn === null ? rows : [...rows].sort((left, right) => {
          const column = columns[sortColumn];
          const a = column.value(left);
          const b = column.value(right);
          if (a === null || a === undefined) return b === null || b === undefined ? 0 : 1;
          if (b === null || b === undefined) return -1;
          return (typeof a === "number" && typeof b === "number" ? a - b : byName(a, b)) * direction;
        });
        headers.forEach((header, index) => header.setAttribute("aria-sort", index === sortColumn ? (direction > 0 ? "ascending" : "descending") : "none"));
        body.replaceChildren(...ordered.map((row) => el("tr", {}, columns.map((column) =>
          column.cell ? column.cell(row) : el("td", { class: column.numeric ? "num" : "" }, fmt(column.value(row)))))));
      }
      draw();
      return el("div", { class: "table-wrap" }, el("table", {}, el("thead", {}, el("tr", {}, headers)), body));
    }

    const numberCell = (value, base, better, show) => el("td", { class: "num" }, fmt(value), show ? delta(value, base, better) : null);

    // ------------------------------------------------------------ Verdicts

    function openFinding(run, finding) {
      state.focusRun = run.key;
      if (TABS.includes(finding.tab)) state.tab = finding.tab;
      state.highlight = state.tab === "Timeline" && typeof finding.run_rel_s === "number" ? finding.run_rel_s : null;
      if (state.highlight !== null) state.zoom = { run: run.key, from: state.highlight - FINDING_ZOOM_S, to: state.highlight + FINDING_ZOOM_S };
      renderTab().then(() => $("#tabs").scrollIntoView({ block: "start" }));
    }

    // findings.csv of each run, grouped by severity; each item opens the tab it points to (and on
    // the Timeline moves the crosshair to its moment). Older run folders have no findings.csv.
    async function renderFindings(runs, host) {
      const lists = await Promise.all(runs.map((run) => optionalCsv(run, "findings.csv")));
      if (!host.isConnected) return;
      runs.forEach((run, index) => {
        const findings = lists[index];
        if (!findings) return;
        const panel = el("section", { class: "panel findings" }, el("h2", {}, runs.length > 1 ? `Findings · ${run.tag}` : "Findings"),
          el("p", { class: "hint" }, "What to look at first, found by simple rules (docs/METRICS.md → findings.csv). Select one to open the tab it points to."));
        if (!findings.length) panel.append(el("p", { class: "muted" }, "No rule found anything to flag in this run."));
        for (const [severity, glyph, label, token] of SEVERITIES) {
          const own = findings.filter((finding) => finding.severity === severity);
          if (!own.length) continue;
          panel.append(el("h3", {}, el("span", { class: "glyph", style: `color: var(${token})`, "aria-hidden": "true" }, glyph), `${label} (${own.length})`),
            el("ul", { class: "finding-list" }, own.map((finding) => el("li", {}, el("button", { type: "button", onclick: () => openFinding(run, finding) },
              el("span", { class: "chip" }, finding.phase || "run"),
              el("span", {}, finding.message),
              el("span", { class: "goto" }, `→ ${finding.tab}${finding.tab === "Timeline" && typeof finding.run_rel_s === "number" ? ` at ${elapsed(finding.run_rel_s, true)}` : ""}`))))));
        }
        host.append(panel);
      });
    }

    async function renderVerdicts(runs, baseline, host) {
      const findingsHost = el("div");
      host.append(findingsHost);
      const [metas] = await Promise.all([Promise.all(runs.map(loadMeta)), renderFindings(runs, findingsHost)]);
      if (!host.isConnected) return;
      const baseMeta = metas[0];
      const phases = phaseList(metas.map((meta) => (meta?.phases || []).map((phase) => ({ phase: phase.name }))));
      host.append(el("p", { class: "hint" },
        `Capacity runs: values at the highest passing concurrency level. Δ vs baseline ${baseline.tag}, only between runs of the same kind: green is better, red is worse (lower is better for latency, CPU and memory). No % is shown when the baseline value is 0 or below, or the value itself is negative.`));
      for (const phaseName of phases) {
        const panel = el("section", { class: "panel" }, el("h2", {}, `Phase ${phaseName}`));
        let slow = false;
        for (const kind of ["capacity", "dev"]) {
          const rows = runs.map((run, index) => ({ run, meta: metas[index], phase: metas[index]?.phases?.find((item) => item.name === phaseName) }))
            .filter((row) => row.meta?.kind === kind && row.phase);
          if (!rows.length) continue;
          const basePhase = baseMeta?.kind === kind ? baseMeta.phases.find((item) => item.name === phaseName) : null;
          const columns = kind === "capacity" ? CAPACITY_COLUMNS : DEV_COLUMNS;
          const head = el("tr", {}, header(kind === "capacity" ? "Capacity run" : "Dev run", "run"),
            columns.map(([key, label]) => header(label, key, { numeric: true })),
            kind === "capacity" ? [header("Estimated limit", "capacity_estimate", { numeric: true }), header("Bottleneck at first failing level", "bottleneck")] : null);
          const body = rows.map(({ run, phase }) => {
            const verdict = phase.verdict || {};
            const showDelta = basePhase && run !== baseline;
            const warn = phase.provider_health?.slow_provider;
            if (warn) slow = true;
            const cells = columns.map(([key, , better]) => numberCell(verdict[key], basePhase?.verdict?.[key], better, showDelta));
            if (kind === "capacity") {
              const estimate = phase.capacity_estimate;
              cells.push(el("td", { class: "num", title: estimate ? JSON.stringify(estimate.bounds) : undefined },
                estimate ? `${fmt(estimate.concurrency)} (${LIMIT_NAMES[estimate.limit] || estimate.limit})` : "—",
                showDelta ? delta(estimate?.concurrency, basePhase.capacity_estimate?.concurrency, 1) : null));
              cells.push(el("td", { class: "wrap" }, verdict.bottleneck || "—",
                verdict.fail_reasons ? el("span", { class: "reason" }, verdict.fail_reasons) : null));
            }
            return el("tr", {}, runCell(run, baseline, warn
              ? el("span", { class: "warn", title: "The LLM provider was slow during this run: latency and throughput reflect the provider, not EpicStaff." }, "⚠")
              : null), cells);
          });
          panel.append(el("div", { class: "table-wrap" }, el("table", {}, el("thead", {}, head), el("tbody", {}, body))));
        }
        if (slow) panel.append(el("p", { class: "hint" }, "⚠ The LLM provider was slow during this run (LLM p95 more than twice the smoke run’s): latency and throughput reflect the provider, not EpicStaff."));
        host.append(panel);
      }
    }

    // ------------------------------------------------------------ Curves

    async function renderCurves(runs, host) {
      const steps = await Promise.all(runs.map((run) => runCsv(run, "steps.csv")));
      if (!host.isConnected) return;
      const metric = el("select", { id: "curve-metric", onchange: (event) => { state.curveMetric = event.target.value; renderTab(); } },
        Object.entries(CURVE_METRICS).map(([key, label]) => el("option", { value: key }, label)));
      metric.value = state.curveMetric;
      host.append(el("div", { class: "controls" },
        el("label", { class: "inline" }, "Metric", metric),
        el("label", { class: "inline" }, el("input", {
          id: "curve-log", type: "checkbox", checked: state.logX, onchange: (event) => { state.logX = event.target.checked; renderTab(); },
        }), "Log scale for concurrency")));
      const surface = css("--surface");
      for (const phase of phaseList(steps)) {
        const datasets = [];
        const levels = new Set();
        runs.forEach((run, index) => {
          const rows = steps[index].filter((step) => step.phase === phase && MEASURED_KINDS.has(step.kind)).sort((a, b) => a.level - b.level);
          if (!rows.length) return;
          const color = runColor(run);
          rows.forEach((row) => levels.add(row.level));
          datasets.push({
            label: `${run.tag} ${run.summary.ref || ""}`.trim(),
            data: rows.map((row) => ({ x: row.level, y: row[state.curveMetric], verdict: row.verdict })),
            borderColor: color, backgroundColor: color, borderWidth: 2, spanGaps: true,
            pointRadius: 5, pointHoverRadius: 7, pointBorderWidth: 2, pointBorderColor: color,
            pointBackgroundColor: (context) => (context.raw?.verdict === "pass" ? color : surface),
            pointStyle: (context) => (context.raw?.verdict === "invalid" ? "crossRot" : "circle"),
          });
        });
        const ticks = [...levels].filter((level) => typeof level === "number" && level > 0).sort((a, b) => a - b);
        if (!ticks.length) continue; // no measured level in this phase: nothing to draw, and no NaN axis bounds
        const panel = el("section", { class: "panel" }, el("h2", {}, `Phase ${phase}`));
        host.append(panel);
        makeChart(panel, {
          type: "line",
          data: { datasets },
          options: {
            interaction: { mode: "nearest", intersect: false },
            scales: {
              x: {
                type: state.logX ? "logarithmic" : "linear",
                min: state.logX ? ticks[0] / 1.25 : 0,
                max: ticks[ticks.length - 1] * (state.logX ? 1.25 : 1.05),
                title: { display: true, text: "Concurrency level (sessions in flight)" },
                afterBuildTicks: (axis) => { axis.ticks = ticks.map((value) => ({ value })); },
                ticks: { callback: (value) => value },
              },
              y: { beginAtZero: true, title: { display: true, text: CURVE_METRICS[state.curveMetric] } },
            },
            plugins: {
              legend: { position: "bottom", labels: { usePointStyle: true, pointStyle: "line" } },
              tooltip: { callbacks: { label: (item) => `${item.dataset.label}: ${fmt(item.raw.y)} at ${item.raw.x} (${item.raw.verdict || "no verdict"})` } },
            },
          },
        }, 320, `${CURVE_METRICS[state.curveMetric]} by concurrency level, phase ${phase}`);
        panel.append(el("p", { class: "key" }, el("span", {}, "● pass"), el("span", {}, "○ fail"), el("span", {}, "✕ invalid (too few sessions or generator-limited)")));
      }
    }

    // ------------------------------------------------------------ Time breakdown

    async function renderBreakdown(runs, host) {
      const data = await Promise.all(runs.map(async (run) => ({ run, steps: await runCsv(run, "steps.csv"), sessions: await runCsv(run, "sessions.csv.gz") })));
      if (!host.isConnected) return;
      host.append(el("p", { class: "hint" }, "Mean seconds per completed session at every measured level of each run (ladder, bisect and dev levels; levels where no session completed are left out). Cold-start sessions are left out. Crew overhead is the run time not spent in the LLM, Python, the agent queue or waiting for the sandbox."));
      const older = data.filter(({ sessions }) => sessions.length && !("sandbox_wait_s" in sessions[0])).map(({ run }) => run.tag);
      if (older.length) {
        host.append(el("p", { class: "hint" }, `${older.join(", ")}: analyzed before the sandbox wait was measured, so there it is 0 and Crew overhead still contains it (the old “Other”).`));
      }
      for (const phase of phaseList(data.map((item) => item.steps))) {
        const bars = [];
        for (const { run, steps, sessions } of data) {
          const levels = steps.filter((step) => step.phase === phase && MEASURED_KINDS.has(step.kind))
            .sort((a, b) => a.segment - b.segment || a.level - b.level);
          for (const step of levels) {
            const rows = sessions.filter((session) => sameStep(session, step) && !session.cold && session.status === "end");
            if (!rows.length) continue;
            const means = Object.fromEntries(BREAKDOWN.map(([key]) => [key, mean(rows.map((row) => row[key]))]));
            bars.push({ run, step, level: step.level, count: rows.length, means, total: mean(rows.map((row) => row.e2e_s)) });
          }
        }
        if (!bars.length) continue;
        const panel = el("section", { class: "panel" }, el("h2", {}, `Phase ${phase}`));
        host.append(panel);
        makeChart(panel, {
          type: "bar",
          data: {
            labels: bars.map((bar) => `${bar.run.tag} L${bar.level}${bar.step.kind === "bisect" ? " (bisect)" : ""}`),
            datasets: BREAKDOWN.map(([key, label], index) => ({
              label, data: bars.map((bar) => bar.means[key]),
              backgroundColor: css(`--series-${index + 1}`), borderColor: css("--surface"), borderWidth: 1, maxBarThickness: 28,
            })),
          },
          options: {
            indexAxis: "y",
            scales: { x: { stacked: true, beginAtZero: true, title: { display: true, text: "Mean seconds per session" } }, y: { stacked: true } },
            plugins: {
              legend: { position: "bottom" },
              tooltip: {
                callbacks: {
                  label: (item) => `${item.dataset.label}: ${fmt(item.raw)} s`,
                  footer: (items) => `end-to-end mean ${fmt(bars[items[0].dataIndex].total)} s · ${bars[items[0].dataIndex].count} sessions`,
                },
              },
            },
          },
        }, 90 + 32 * bars.length, `Where session time goes at each level, phase ${phase}`);
        panel.append(sortableTable([
          { label: "Run", key: "run", value: (bar) => bar.run.tag, cell: (bar) => runCell(bar.run, runs[0]) },
          { label: "Level", key: "level", value: (bar) => bar.level, numeric: true },
          { label: "Kind", key: "kind", value: (bar) => bar.step.kind },
          { label: "Verdict", key: "verdict", value: (bar) => bar.step.verdict },
          { label: "Sessions", key: "sessions", value: (bar) => bar.count, numeric: true },
          ...BREAKDOWN.map(([key, label]) => ({ label: `${label} s`, key, value: (bar) => bar.means[key], numeric: true })),
          { label: "End-to-end s", key: "e2e_s", value: (bar) => bar.total, numeric: true },
        ], bars));
      }
    }

    // ------------------------------------------------------------ Timeline
    //
    // Every chart of the Timeline shares one time view: x = seconds since the run's first sample
    // (run_rel_s), one visible range (zoom) and one crosshair. Samples are aggregated into
    // buckets sized to the visible range, about one per PX_PER_BUCKET pixels: the line is the
    // bucket mean and a light band of the same hue its min–max, so spikes stay visible zoomed out.

    const Y_AXIS_WIDTH = 76; // every timeline chart reserves the same y-axis width, so their x axes line up
    const PX_PER_BUCKET = 3;
    const BUCKET_STEPS_S = [2, 4, 6, 10, 20, 30, 60, 120, 180, 300, 600, 900, 1800, 3600];
    const TICK_STEPS_S = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400];
    const TICK_SPACING_PX = 90; // at most one x tick per this many pixels
    const MIN_SPAN_S = 20; // the narrowest zoom: ten 2-second samples
    const SHORT_SPAN_S = 600; // below this visible span the axis reads m:ss instead of h:mm
    const FINDING_ZOOM_S = 300; // a finding opens the Timeline zoomed to ± this many seconds around it
    const BAND_OPACITY = 0.18;
    let activeView = null;

    // Elapsed time: h:mm, or m:ss (h:mm:ss past an hour) when `precise`.
    function elapsed(seconds, precise) {
      const total = Math.round(Math.max(0, seconds));
      const two = (number) => String(number).padStart(2, "0");
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      if (!precise) return `${hours}:${two(minutes)}`;
      return hours ? `${hours}:${two(minutes)}:${two(total % 60)}` : `${minutes}:${two(total % 60)}`;
    }

    const utcClock = (epoch) => `${new Date(epoch * 1000).toISOString().slice(11, 19)} UTC`;
    const axisTitle = (span) => `Elapsed (${span < SHORT_SPAN_S ? "m:ss" : "h:mm"})`;

    function alpha(color, opacity) {
      const match = /^#([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(color.trim());
      return match ? `rgba(${parseInt(match[1], 16)}, ${parseInt(match[2], 16)}, ${parseInt(match[3], 16)}, ${opacity})` : color;
    }

    // Ticks at round elapsed times (0:15, 0:30, …), at most one per TICK_SPACING_PX.
    function timeTicks(from, to, widthPx) {
      const span = to - from;
      const most = Math.max(2, Math.floor(widthPx / TICK_SPACING_PX));
      let step = TICK_STEPS_S.find((candidate) => span / candidate <= most) ?? TICK_STEPS_S[TICK_STEPS_S.length - 1];
      if (span >= SHORT_SPAN_S) step = Math.max(step, 60); // h:mm labels need whole minutes
      const ticks = [];
      for (let value = Math.ceil(from / step) * step; value <= to + 1e-9; value += step) ticks.push({ value });
      return ticks;
    }

    function bucketSize(span, widthPx) {
      const wanted = span / Math.max(1, widthPx / PX_PER_BUCKET);
      return BUCKET_STEPS_S.find((step) => step >= wanted) ?? BUCKET_STEPS_S[BUCKET_STEPS_S.length - 1];
    }

    // Rows in time order with their x, the [start, end) row range of each segment, and numeric
    // columns (NaN where unknown) read once per key.
    function sampleSet(rows, xOf) {
      const xs = rows.map(xOf);
      const ranges = [];
      const segmentOf = (row) => `${row.phase}|${row.segment}`;
      let start = 0;
      for (let index = 1; index <= rows.length; index++) {
        if (index === rows.length || segmentOf(rows[index]) !== segmentOf(rows[index - 1])) {
          ranges.push([start, index]);
          start = index;
        }
      }
      const columns = new Map();
      const column = (key) => {
        if (!columns.has(key)) columns.set(key, rows.map((row) => (typeof row[key] === "number" ? row[key] : NaN)));
        return columns.get(key);
      };
      return { rows, xs, ranges, column };
    }

    // Mean, min and max of `values` per bucket of `size` seconds around [from, to], segment by
    // segment. A bucket's x is the mean x of its samples, so all columns of one set share the
    // grid (stacked areas stay aligned); a null point between segments breaks the line there.
    function bucketize(set, values, from, to, size) {
      const points = [];
      const { xs } = set;
      for (const [start, end] of set.ranges) {
        if (xs[end - 1] < from - size || xs[start] > to + size) continue;
        let low = start;
        let high = end;
        while (low < high) {
          const middle = (low + high) >> 1;
          if (xs[middle] < from - size) low = middle + 1;
          else high = middle;
        }
        if (points.length) points.push({ x: (points[points.length - 1].x + xs[low]) / 2, y: null });
        let bucket = null;
        let rows = 0;
        let xSum = 0;
        let count = 0;
        let sum = 0;
        let min = Infinity;
        let max = -Infinity;
        const flush = () => {
          if (rows) points.push(count ? { x: xSum / rows, y: sum / count, min, max } : { x: xSum / rows, y: null });
        };
        for (let index = low; index < end && xs[index] <= to + size; index++) {
          const key = Math.floor(xs[index] / size);
          if (key !== bucket) {
            flush();
            bucket = key;
            rows = xSum = count = sum = 0;
            min = Infinity;
            max = -Infinity;
          }
          rows++;
          xSum += xs[index];
          const value = values[index];
          if (!Number.isNaN(value)) {
            count++;
            sum += value;
            min = Math.min(min, value);
            max = Math.max(max, value);
          }
        }
        flush();
      }
      return points;
    }

    // Per visible series (not the min–max bands), the point nearest to x, within its bucket.
    function nearestAtX(chart, value) {
      const tolerance = Math.max(3, 1.5 * (chart.$bucket || 2));
      const items = [];
      chart.data.datasets.forEach((dataset, datasetIndex) => {
        const data = dataset.data;
        if (dataset.band || !data.length || !chart.isDatasetVisible(datasetIndex)) return;
        let low = 0;
        let high = data.length - 1;
        while (low < high) {
          const middle = (low + high) >> 1;
          if (data[middle].x < value) low = middle + 1;
          else high = middle;
        }
        if (low > 0 && Math.abs(data[low - 1].x - value) < Math.abs(data[low].x - value)) low--;
        const point = data[low];
        const element = chart.getDatasetMeta(datasetIndex).data[low];
        if (element && typeof point.y === "number" && Math.abs(point.x - value) <= tolerance) items.push({ datasetIndex, index: low, element });
      });
      return items;
    }

    // The shared range and crosshair. Zoom changes are applied in the next animation frame;
    // charts scrolled out of view are only marked stale and redrawn once they scroll back in.
    function createTimeView(full, origin) {
      const view = { full: Math.max(full, 1), origin, from: 0, to: Math.max(full, 1), x: null, source: null, entries: [], overview: null, zoomFrame: 0, crossFrame: 0, onRange: null, onApply: null };
      view.span = () => view.to - view.from;
      const observer = typeof IntersectionObserver === "function"
        ? new IntersectionObserver((records) => {
          for (const record of records) {
            const entry = view.entries.find((item) => item.wrapper === record.target);
            if (!entry) continue;
            entry.visible = record.isIntersecting;
            if (entry.visible && entry.stale) refresh(entry);
          }
        }, { rootMargin: "400px 0px" })
        : null;

      view.setRange = (from, to, immediate = false) => {
        const span = Math.min(view.full, Math.max(MIN_SPAN_S, to - from));
        const center = to - from < MIN_SPAN_S ? (from + to) / 2 - span / 2 : from;
        view.from = Math.min(Math.max(0, center), view.full - span);
        view.to = view.from + span;
        view.onRange?.(view.from, view.to);
        if (immediate) return;
        cancelAnimationFrame(view.zoomFrame);
        view.zoomFrame = requestAnimationFrame(view.apply);
      };
      view.zoomAt = (center, factor) => view.setRange(center - (center - view.from) * factor, center + (view.to - center) * factor);
      view.pan = (delta) => view.setRange(view.from + delta, view.to + delta);
      view.reset = () => view.setRange(0, view.full);

      function placeCrosshair(entry) {
        const { chart, line, tooltip } = entry;
        const area = chart.chartArea;
        if (!area || !chart.canvas?.isConnected) return;
        const pixel = view.x === null ? null : chart.scales.x.getPixelForValue(view.x);
        line.hidden = pixel === null || pixel < area.left || pixel > area.right;
        if (!line.hidden) Object.assign(line.style, { left: `${pixel}px`, top: `${area.top}px`, height: `${area.bottom - area.top}px` });
        const show = !line.hidden && (tooltip === "always" || chart === view.source);
        if (!show && !entry.showing) return;
        entry.showing = show;
        chart.tooltip?.setActiveElements(show ? nearestAtX(chart, view.x) : [], { x: show ? pixel : 0, y: (area.top + area.bottom) / 2 });
        chart.draw();
      }

      function refresh(entry) {
        const { chart } = entry;
        entry.stale = false;
        const width = chart.chartArea ? chart.chartArea.right - chart.chartArea.left : chart.width - Y_AXIS_WIDTH;
        chart.$bucket = bucketSize(view.span(), width);
        entry.build(view.from, view.to, chart.$bucket).forEach((data, index) => { chart.data.datasets[index].data = data; });
        Object.assign(chart.options.scales.x, { min: view.from, max: view.to });
        chart.options.scales.x.title.text = axisTitle(view.span());
        chart.update("none");
        placeCrosshair(entry);
      }

      function placeBrush() {
        if (!view.overview) return;
        const { chart, brush } = view.overview;
        const area = chart.chartArea;
        const whole = view.from <= 0 && view.to >= view.full;
        brush.hidden = whole || !area;
        if (brush.hidden) return;
        const left = chart.scales.x.getPixelForValue(view.from);
        const right = chart.scales.x.getPixelForValue(view.to);
        Object.assign(brush.style, { left: `${left}px`, width: `${Math.max(2, right - left)}px`, top: `${area.top}px`, height: `${area.bottom - area.top}px` });
      }

      view.apply = () => {
        for (const entry of view.entries) {
          if (entry.visible) refresh(entry);
          else entry.stale = true;
        }
        placeBrush();
        view.onApply?.(view.entries[0]?.chart.$bucket);
      };

      view.setCrosshair = (value, source = null) => {
        view.x = value;
        view.source = source;
        cancelAnimationFrame(view.crossFrame);
        view.crossFrame = requestAnimationFrame(() => {
          for (const entry of view.entries) if (entry.visible) placeCrosshair(entry);
        });
      };

      // Pointer: drag selects a range, Shift+drag pans, the wheel zooms around the pointer,
      // hovering moves the crosshair. Keyboard (focusable charts): arrows move the crosshair,
      // Shift+arrows pan, + and − zoom around it, 0 resets, Escape clears.
      function interact(chart, wrapper, { onSelect, onClick, follow = true }) {
        const canvas = chart.canvas;
        canvas.style.touchAction = "pan-y"; // vertical swipes still scroll the page on a phone
        const selection = el("div", { class: "selection", hidden: true, "aria-hidden": "true" });
        wrapper.append(selection);
        const pointAt = (event) => {
          const area = chart.chartArea;
          const offset = event.clientX - canvas.getBoundingClientRect().left;
          const pixel = Math.min(area.right, Math.max(area.left, offset));
          return { pixel, value: chart.scales.x.getValueForPixel(pixel), inside: offset >= area.left && offset <= area.right };
        };
        let drag = null;
        canvas.addEventListener("pointerdown", (event) => {
          const at = pointAt(event);
          if (event.button !== 0 || !at.inside) return;
          drag = { ...at, pan: event.shiftKey && follow, from: view.from, to: view.to, moved: false };
          canvas.setPointerCapture?.(event.pointerId);
        });

        canvas.addEventListener("pointermove", (event) => {
          const at = pointAt(event);
          if (!drag) {
            if (at.inside && follow) view.setCrosshair(at.value, chart);
            return;
          }
          drag.moved ||= Math.abs(at.pixel - drag.pixel) > 4;
          if (!drag.moved) return;
          if (drag.pan) {
            const perPixel = (drag.to - drag.from) / (chart.chartArea.right - chart.chartArea.left);
            const shift = (drag.pixel - at.pixel) * perPixel;
            view.setRange(drag.from + shift, drag.to + shift);
            return;
          }
          const area = chart.chartArea;
          selection.hidden = false;
          Object.assign(selection.style, { left: `${Math.min(drag.pixel, at.pixel)}px`, width: `${Math.abs(at.pixel - drag.pixel)}px`, top: `${area.top}px`, height: `${area.bottom - area.top}px` });
        });
        canvas.addEventListener("pointerup", (event) => {
          if (!drag) return;
          const at = pointAt(event);
          selection.hidden = true;
          if (drag.moved && !drag.pan) onSelect(Math.min(drag.value, at.value), Math.max(drag.value, at.value));
          else if (!drag.moved) onClick?.(at.value);
          drag = null;
        });
        canvas.addEventListener("pointercancel", () => { drag = null; selection.hidden = true; });
        canvas.addEventListener("pointerleave", () => { if (!drag && follow) view.setCrosshair(null); });
        canvas.addEventListener("wheel", (event) => {
          const at = pointAt(event);
          if (!at.inside) return;
          event.preventDefault();
          view.zoomAt(follow ? at.value : view.from + view.span() / 2, Math.exp(Math.max(-200, Math.min(200, event.deltaY)) * 0.002));
        }, { passive: false });
      }

      view.add = (chart, build, { tooltip = "always", focusable = false } = {}) => {
        const wrapper = chart.canvas.parentNode;
        const line = el("div", { class: "crosshair", hidden: true, "aria-hidden": "true" });
        wrapper.append(line);
        const entry = { chart, build, tooltip, wrapper, line, visible: true, stale: false, showing: false };
        view.entries.push(entry);
        observer?.observe(wrapper);
        interact(chart, wrapper, { onSelect: (from, to) => view.setRange(from, to) });
        refresh(entry);
        if (!focusable) return;
        const canvas = chart.canvas;
        canvas.tabIndex = 0;
        canvas.addEventListener("blur", () => view.setCrosshair(null));
        canvas.addEventListener("keydown", (event) => {
          const here = view.x ?? (view.from + view.to) / 2;
          const step = view.span() / 100;
          const moveTo = (value) => view.setCrosshair(Math.min(view.to, Math.max(view.from, value)), chart);
          const actions = {
            ArrowRight: () => (event.shiftKey ? view.pan(view.span() / 10) : moveTo((view.x ?? view.from) + step)),
            ArrowLeft: () => (event.shiftKey ? view.pan(-view.span() / 10) : moveTo((view.x ?? view.to) - step)),
            Home: () => moveTo(view.from),
            End: () => moveTo(view.to),
            "+": () => view.zoomAt(here, 1 / 1.5),
            "=": () => view.zoomAt(here, 1 / 1.5),
            "-": () => view.zoomAt(here, 1.5),
            0: () => view.reset(),
            Escape: () => view.setCrosshair(null),
          };
          const action = actions[event.key];
          if (!action) return;
          event.preventDefault();
          action();
        });
      };

      // The overview strip always shows the whole run; dragging on it selects the range, a click
      // centres the current range there, and the brush shows what the charts below show.
      view.addOverview = (chart) => {
        const wrapper = chart.canvas.parentNode;
        const brush = el("div", { class: "brush", hidden: true, "aria-hidden": "true" });
        wrapper.append(brush);
        view.overview = { chart, brush };
        interact(chart, wrapper, {
          follow: false,
          onSelect: (from, to) => view.setRange(from, to),
          onClick: (value) => view.setRange(value - view.span() / 2, value + view.span() / 2),
        });
        placeBrush();
      };

      view.dispose = () => {
        observer?.disconnect();
        cancelAnimationFrame(view.zoomFrame);
        cancelAnimationFrame(view.crossFrame);
      };
      return view;
    }

    // Vertical markers: level starts (row 0, green pass / red fail / grey invalid), stack restarts
    // between segments (row 1, dashed) and findings with a moment (row 2, status glyph + label).
    // Labels are drawn only on the first chart; text is in ink, the glyph carries the status.
    function markerPlugin(markers, withLabels) {
      return {
        id: "markers",
        afterDatasetsDraw(chart) {
          const { ctx, chartArea, scales } = chart;
          const ink = css("--ink-2");
          const labelEnd = [-Infinity, -Infinity, -Infinity]; // per row: where the last label ends
          ctx.save();
          ctx.font = `11px ${css("--font-ui")}`;
          for (const marker of markers) {
            const x = scales.x.getPixelForValue(marker.x);
            if (x < chartArea.left || x > chartArea.right) continue;
            ctx.strokeStyle = marker.color;
            ctx.setLineDash(marker.dash || []);
            ctx.lineWidth = marker.glyph ? 1.5 : 1;
            ctx.beginPath();
            ctx.moveTo(x, chartArea.top);
            ctx.lineTo(x, chartArea.bottom);
            ctx.stroke();
            if (!withLabels || !marker.label) continue;
            const glyph = marker.glyph ? `${marker.glyph} ` : "";
            const width = ctx.measureText(glyph + marker.label).width;
            let left = x + 3;
            if (left + width > chartArea.right) left = Math.max(chartArea.left, x - 3 - width);
            if (left < labelEnd[marker.row] + 6) continue; // would overlap the previous label of its row
            const y = chartArea.top + 11 + 13 * marker.row;
            if (glyph) {
              ctx.fillStyle = marker.color;
              ctx.fillText(glyph, left, y);
            }
            ctx.fillStyle = ink;
            ctx.fillText(marker.label, left + ctx.measureText(glyph).width, y);
            labelEnd[marker.row] = left + width;
          }
          ctx.restore();
        },
      };
    }

    function timelineMarkers(steps, timeline, findings, xOf, origin) {
      const verdictColor = { pass: css("--good"), fail: css("--bad") };
      const markers = [];
      let lastPhase = null;
      for (const step of steps.filter((item) => MEASURED_KINDS.has(item.kind))) {
        const first = timeline.find((row) => row.phase === step.phase && row.segment === step.segment && row.level === step.level);
        if (!first) continue;
        markers.push({ x: xOf(first), row: 0, color: verdictColor[step.verdict] || css("--muted"), label: step.phase !== lastPhase ? `${step.phase} ${step.level}` : String(step.level) });
        lastPhase = step.phase;
      }
      let previous = null;
      for (const row of timeline) {
        if (previous && (row.phase !== previous.phase || row.segment !== previous.segment)) {
          const levels = steps.filter((step) => step.phase === row.phase && step.segment === row.segment && MEASURED_KINDS.has(step.kind));
          const what = row.phase !== previous.phase ? `phase ${row.phase}` : `${levels[0]?.kind || "segment"} ${levels.map((step) => step.level).join(", ")}`.trim();
          markers.push({ x: xOf(row), row: 1, color: css("--ink-2"), dash: [4, 3], label: `restart · ${what}` });
        }
        previous = row;
      }
      for (const finding of findings) {
        const x = typeof finding.run_rel_s === "number" ? finding.run_rel_s : typeof finding.ts === "number" ? finding.ts - origin : null;
        const severity = SEVERITIES.find(([name]) => name === finding.severity);
        if (x === null || !severity) continue;
        const label = MARKER_LABELS[finding.kind] || finding.kind;
        markers.push({ x, row: 2, color: css(severity[3]), glyph: severity[1], label: finding.container ? `${label}: ${finding.container}` : label });
      }
      return markers.sort((a, b) => a.x - b.x);
    }

    // A chart of the time view. spec.series: [{ label, color, key | values, band, stepped, dash }]
    // over spec.set (sampleSet); a series with `band` gets its min–max band; spec.stacked draws
    // stacked areas (spec.series[].fill) on the set's common bucket grid.
    function timeChart(parent, view, spec) {
      if (spec.title) parent.append(el("h3", {}, spec.title));
      const datasets = [];
      for (const series of spec.series) {
        datasets.push({
          label: series.label, data: [], pointRadius: 0, stepped: series.stepped, borderDash: series.dash,
          borderColor: spec.stacked ? css("--surface") : series.color,
          backgroundColor: spec.stacked ? series.fill : series.color,
          borderWidth: spec.stacked ? 1 : series.width ?? 1.5,
          fill: spec.stacked ? (datasets.length ? "-1" : "origin") : false,
        });
        if (series.band) {
          datasets.push(
            { label: `${series.label} min–max`, band: true, data: [], pointRadius: 0, borderWidth: 0, backgroundColor: alpha(series.color, BAND_OPACITY), fill: "+1" },
            { label: "", band: true, data: [], pointRadius: 0, borderWidth: 0, fill: false },
          );
        }
      }
      const build = (from, to, size) => spec.series.flatMap((series) => {
        const points = bucketize(spec.set, series.values ?? spec.set.column(series.key), from, to, size);
        if (!series.band) return [points];
        const edge = (side) => points.map((point) => ({ x: point.x, y: point.y === null ? null : point[side] }));
        return [points, edge("max"), edge("min")];
      });
      const range = spec.range || [view.from, view.to];
      const chart = makeChart(parent, {
        type: "line",
        data: { datasets },
        options: {
          parsing: false,
          normalized: true,
          events: ["click"], // hover is the shared crosshair; clicks keep the legend working
          interaction: { mode: window.Chart?.Interaction?.modes?.sameX ? "sameX" : "nearest", axis: "x", intersect: false },
          scales: {
            x: {
              type: "linear", min: range[0], max: range[1],
              title: { display: true, text: axisTitle(range[1] - range[0]) },
              afterBuildTicks: (axis) => { axis.ticks = timeTicks(axis.min, axis.max, axis.width); },
              ticks: { maxRotation: 0, autoSkip: false, callback(value) { return elapsed(value, this.max - this.min < SHORT_SPAN_S); } },
            },
            y: {
              beginAtZero: spec.beginAtZero ?? true, stacked: Boolean(spec.stacked),
              title: { display: true, text: spec.yTitle }, ticks: { maxTicksLimit: spec.yTicks ?? 6 },
              afterFit: (scale) => { scale.width = Y_AXIS_WIDTH; },
            },
          },
          plugins: {
            legend: {
              display: spec.series.length > 1, position: "bottom",
              labels: { filter: (item, data) => !data.datasets[item.datasetIndex].band, ...(spec.stacked ? { boxWidth: 12, boxHeight: 12 } : { boxWidth: 14, boxHeight: 2 }) },
            },
            tooltip: {
              filter: (item) => !item.dataset.band,
              itemSort: spec.stacked ? (a, b) => b.datasetIndex - a.datasetIndex : undefined, // top of the stack first
              callbacks: {
                title: (items) => (items.length ? `${elapsed(items[0].parsed.x, true)} elapsed · ${utcClock(view.origin + items[0].parsed.x)}` : ""),
                label: (item) => {
                  const { min, max } = item.raw;
                  const spread = typeof min === "number" && min !== max ? ` (${fmt(+min.toFixed(2))}–${fmt(+max.toFixed(2))})` : "";
                  return `${fmt(+item.parsed.y.toFixed(2))}${spec.unit || ""}${spread} · ${item.dataset.label}`;
                },
              },
            },
          },
        },
        plugins: [markerPlugin(spec.markers || [], Boolean(spec.labels))],
      }, spec.height, `${spec.description || spec.title}. Drag across it to zoom; with focus, arrow keys move the crosshair, + and − zoom, 0 resets.`);
      if (!chart) return null;
      if (spec.range) {
        const arrays = build(range[0], range[1], bucketSize(range[1] - range[0], chart.chartArea.right - chart.chartArea.left));
        chart.data.datasets.forEach((dataset, index) => { dataset.data = arrays[index]; });
        chart.update("none");
      } else view.add(chart, build, { tooltip: spec.tooltip || "always", focusable: Boolean(spec.focusable) });
      return chart;
    }

    const missingColumn = (parent, title) => parent.append(el("h3", {}, title),
      el("p", { class: "muted" }, "Not in this run folder: it was analyzed before this was measured."));

    // Stacked areas of in-flight sessions per stage, from inflight_stages.csv (a stage without a
    // row at a sample has 0 there). Every stage keeps its STAGES colour, also when stages without
    // sessions are left out. The table gives the same numbers without colour.
    function stageChart(parent, view, timeSet, stageRows, markers) {
      const counts = new Map();
      for (const row of stageRows) {
        if (!counts.has(row.ts)) counts.set(row.ts, {});
        counts.get(row.ts)[row.stage] = row.count;
      }
      const present = STAGES.filter((stage) => stageRows.some((row) => row.stage === stage));
      const series = present.map((stage) => ({
        label: stage, fill: css(`--series-${STAGES.indexOf(stage) + 1}`),
        values: timeSet.rows.map((row) => counts.get(row.ts)?.[stage] ?? 0),
      }));
      timeChart(parent, view, {
        title: "In flight by stage", yTitle: "Sessions in flight", stacked: true, height: 300, focusable: true, markers,
        description: "In-flight sessions by the stage of the last checkpoint they reached, stacked", set: timeSet, series,
      });
      const peaks = series.map(({ label, values }) => {
        let best = 0;
        values.forEach((value, index) => { if (value > values[best]) best = index; });
        return { stage: label, count: values[best] ?? 0, x: values.length ? timeSet.xs[best] : null };
      });
      // the same numbers without colour: some stage fills are below 3:1 contrast on the light surface
      parent.append(el("details", {}, el("summary", {}, "Peak per stage (table)"), sortableTable([
        { label: "Stage", key: "stage", value: (row) => row.stage },
        { label: "Peak sessions", key: "inflight_stages.count", value: (row) => row.count, numeric: true },
        { label: "At (elapsed)", key: "run_rel_s", value: (row) => row.x, numeric: true, cell: (row) => el("td", { class: "num" }, row.x === null ? "—" : elapsed(row.x, true)) },
      ], peaks)));
    }

    // One full-width row per container on the same time scale as the charts above: memory and
    // CPU as two stacked charts. Containers a finding names (memory not released, CPU limit,
    // restart) come first with a status border, glyph and the finding's text; then by peak memory.
    function containerCharts(parent, view, containerRows, xOf, findings, markers) {
      const byContainer = new Map();
      for (const row of containerRows) {
        if (!byContainer.has(row.container)) byContainer.set(row.container, []);
        byContainer.get(row.container).push(row);
      }
      const flags = new Map();
      for (const finding of findings) {
        if (!finding.container) continue;
        if (!flags.has(finding.container)) flags.set(finding.container, []);
        flags.get(finding.container).push(finding);
      }
      const rank = (severity) => SEVERITIES.findIndex(([name]) => name === severity);
      const worst = (name) => Math.min(...(flags.get(name) || []).map((finding) => rank(finding.severity)), SEVERITIES.length);
      const peak = (name) => Math.max(0, ...byContainer.get(name).map((row) => row.mem_mb ?? 0));
      const names = [...byContainer.keys()].sort((a, b) => worst(a) - worst(b) || peak(b) - peak(a) || byName(a, b));
      parent.append(el("h2", {}, "Memory and CPU per container"),
        el("p", { class: "hint" }, "One row per container, on the same time scale and zoom as the charts above. Containers a finding names come first, then by peak memory. Each has its own memory scale; CPU is % of one core (100 = one full core)."));
      const restarts = markers.filter((marker) => marker.row === 1);
      for (const name of names) {
        const own = (flags.get(name) || []).sort((a, b) => rank(a.severity) - rank(b.severity));
        const top = SEVERITIES.find(([severity]) => severity === own[0]?.severity);
        const block = el("section", { class: `container-row${top ? ` ${top[0]}` : ""}`, "aria-label": `Container ${name}` },
          el("h3", { class: "name" }, el("span", { class: "mono" }, name), el("span", { class: "muted" }, ` · peak ${fmt(+peak(name).toFixed(1))} MB`)),
          own.map((finding) => {
            const [, glyph, label, token] = SEVERITIES.find(([severity]) => severity === finding.severity) || SEVERITIES[2];
            return el("p", { class: "flag" }, el("span", { class: "glyph", style: `color: var(${token})`, "aria-hidden": "true" }, glyph), ` ${label}: ${finding.message}`);
          }));
        parent.append(block);
        const set = sampleSet([...byContainer.get(name)].sort((a, b) => a.ts - b.ts), xOf);
        timeChart(block, view, {
          description: `Memory of ${name}`, yTitle: "Memory (MB)", unit: " MB", height: 200, beginAtZero: false, tooltip: "source", markers: restarts, set,
          series: [{ label: "memory", key: "mem_mb", color: css("--series-1"), band: true }],
        });
        timeChart(block, view, {
          description: `CPU of ${name}`, yTitle: "CPU % (100 = 1 core)", unit: " %", height: 150, yTicks: 4, tooltip: "source", markers: restarts, set,
          series: [{ label: "CPU", key: "cpu_pct", color: css("--series-2"), band: true }],
        });
      }
    }

    async function renderTimeline(run, host) {
      const [steps, timelineRows, containerRows, stageRows, findingRows] = await Promise.all([
        runCsv(run, "steps.csv"), runCsv(run, "timeline.csv"), runCsv(run, "container_timeline.csv"),
        optionalCsv(run, "inflight_stages.csv"), optionalCsv(run, "findings.csv"),
      ]);
      if (!host.isConnected) return;
      if (!timelineRows.length) {
        host.append(el("p", { class: "empty" }, `${run.tag} has no timeline samples.`));
        return;
      }
      const timeline = [...timelineRows].sort((a, b) => a.ts - b.ts);
      const origin = timeline[0].ts;
      // run_rel_s is written by newer analyses; for older folders the same value from ts
      const xOf = (row) => (typeof row.run_rel_s === "number" ? row.run_rel_s : row.ts - origin);
      const findings = findingRows || [];
      const view = createTimeView(xOf(timeline[timeline.length - 1]), origin);
      activeView = view;
      const zoom = state.zoom?.run === run.key ? state.zoom : null;
      if (zoom) view.setRange(zoom.from, zoom.to, true);
      view.onRange = (from, to) => { state.zoom = { run: run.key, from, to }; };
      const markers = timelineMarkers(steps, timeline, findings, xOf, origin);
      const timeSet = sampleSet(timeline, xOf);
      const has = (key) => timeline.some((row) => typeof row[key] === "number");

      const reset = el("button", { type: "button", onclick: () => view.reset() }, "Reset zoom");
      const readout = el("span", { class: "muted", "aria-live": "polite" });
      view.onApply = (bucket) => {
        const whole = view.from <= 0 && view.to >= view.full;
        reset.disabled = whole;
        // always to the second here: "1:06" alone could be an hour or a minute
        readout.textContent = `${whole ? "Whole run" : `${elapsed(view.from, true)} – ${elapsed(view.to, true)}`} of ${elapsed(view.full, true)}${bucket ? ` · ${bucket} s per point` : ""}`;
      };
      host.append(el("p", { class: "hint" },
        "All charts share one time axis (elapsed since the run's first sample) and one crosshair. Zoom: drag across any chart or the overview, or use the mouse wheel over a chart; Shift+drag pans; Reset zoom shows the whole run. With a chart focused: arrow keys move the crosshair, Shift+arrows pan, + / − zoom, 0 resets. Each line is the mean per time bucket (the bucket grows with the visible range), the light band its min–max. Vertical lines: measured level starts (green passed, red failed, grey invalid), dashed stack restarts, and findings (✖ critical, ▲ warning)."));
      const panel = el("section", { class: "panel", id: "timeline-stack" },
        el("div", { class: "panel-head" }, el("h2", {}, `${run.tag} · ${run.summary.case || ""} · ${run.summary.ref || ""}`), el("div", { class: "controls" }, readout, reset)));
      host.append(panel);
      const overview = timeChart(panel, view, {
        title: "Whole run (drag to zoom)", yTitle: "In flight", height: 130, yTicks: 3, range: [0, view.full], markers: markers.filter((marker) => marker.row === 1), set: timeSet,
        description: "Overview of the whole run: sessions in flight",
        series: [{ label: "in flight", key: "inflight", color: css("--series-1") }],
      });
      if (overview) view.addOverview(overview);
      const line = (label, key, color, extra = {}) => ({ label, key, color, band: true, ...extra });
      timeChart(panel, view, {
        title: "Sessions", yTitle: "Sessions", labels: true, height: 320, focusable: true, markers, set: timeSet,
        series: [
          line("target", "target", css("--muted"), { stepped: true, width: 1, band: false }),
          line("in flight", "inflight", css("--series-1")),
          line("running", "running", css("--series-3")),
          line("queued", "queued", css("--series-2")),
        ],
      });
      if (stageRows) stageChart(panel, view, timeSet, stageRows, markers);
      else missingColumn(panel, "In flight by stage");
      if (has("throughput_per_min")) {
        timeChart(panel, view, { title: "Throughput", yTitle: "Ended per minute", height: 260, focusable: true, markers, set: timeSet, series: [line("sessions ended (last 60 s)", "throughput_per_min", css("--series-1"))] });
      } else missingColumn(panel, "Throughput");
      if (has("e2e_p95_60s")) {
        timeChart(panel, view, { title: "p95 end-to-end (last 60 s)", yTitle: "Seconds", unit: " s", height: 260, focusable: true, markers, set: timeSet, series: [line("p95 e2e of sessions ended in the last 60 s", "e2e_p95_60s", css("--series-1"))] });
      } else missingColumn(panel, "p95 end-to-end (last 60 s)");
      if (has("host_cpu_pct")) {
        timeChart(panel, view, { title: "Host CPU", yTitle: "% of all cores", unit: " %", height: 260, focusable: true, markers, set: timeSet, series: [line("host CPU", "host_cpu_pct", css("--series-1"))] });
      } else {
        panel.append(el("h3", {}, "Host CPU"), el("p", { class: "muted" }, "Not sampled on this host (no /proc, e.g. Docker Desktop)."));
      }
      const containers = el("section", { class: "panel", id: "timeline-containers" });
      host.append(containers);
      containerCharts(containers, view, containerRows, xOf, findings, markers);
      const services = el("section", { class: "panel" }, el("h2", {}, "Postgres and Redis"));
      host.append(services);
      const restarts = markers.filter((marker) => marker.row === 1);
      timeChart(services, view, {
        title: "Postgres connections", yTitle: "Connections", height: 220, tooltip: "source", markers: restarts, set: timeSet,
        series: [line("connections", "pg_connections", css("--series-1")), line("max connections", "pg_max_connections", css("--muted"), { dash: [5, 3], width: 1, band: false })],
      });
      timeChart(services, view, { title: "Redis memory", yTitle: "MB", unit: " MB", height: 220, tooltip: "source", markers: restarts, set: timeSet, series: [line("used memory", "redis_used_mb", css("--series-1"))] });
      view.onApply(view.entries[0]?.chart.$bucket);
      if (state.highlight !== null) {
        view.setCrosshair(state.highlight);
        state.highlight = null;
        requestAnimationFrame(() => panel.scrollIntoView({ block: "start" }));
      }
    }

    // ------------------------------------------------------------ Nodes

    async function renderNodes(runs, baseline, host) {
      const data = await Promise.all(runs.map(async (run) => ({ run, steps: await runCsv(run, "steps.csv"), nodes: await runCsv(run, "nodes.csv") })));
      if (!host.isConnected) return;
      host.append(el("p", { class: "hint" }, `Node durations at each run’s headline level. Δ p50 compares with the same node in baseline ${baseline.tag} (runs of the same kind only). Click a column header to sort.`));
      const atHeadline = ({ run, steps, nodes }, phase) => {
        const step = headline(run, steps, phase);
        return step ? nodes.filter((node) => sameStep(node, step)) : [];
      };
      for (const phase of phaseList(data.map((item) => item.steps))) {
        const baseNodes = atHeadline(data[0], phase);
        const rows = data.flatMap((item) => atHeadline(item, phase).map((node) => {
          const base = comparable(item.run, baseline) ? baseNodes.find((other) => other.node_name === node.node_name) : null;
          return { run: item.run, node, base, change: percentChange(node.p50_s, base?.p50_s) };
        })).sort((a, b) => byName(a.node.node_name, b.node.node_name)); // stable: runs stay in order under each node
        if (!rows.length) continue;
        host.append(el("section", { class: "panel" }, el("h2", {}, `Phase ${phase}`), sortableTable([
          { label: "Node", key: "node_name", value: (row) => row.node.node_name },
          { label: "Type", key: "node_type", value: (row) => row.node.node_type },
          { label: "Run", key: "run", value: (row) => row.run.tag, cell: (row) => runCell(row.run, baseline) },
          { label: "Level", key: "headline_level", value: (row) => row.node.level, numeric: true },
          { label: "Count", key: "count", value: (row) => row.node.count, numeric: true },
          { label: "p50 s", key: "p50_s", value: (row) => row.node.p50_s, numeric: true },
          { label: "p95 s", key: "p95_s", value: (row) => row.node.p95_s, numeric: true },
          { label: "Errors", key: "error_count", value: (row) => row.node.error_count, numeric: true },
          {
            label: "Δ p50 vs baseline", key: "delta_p50", value: (row) => row.change, numeric: true,
            cell: (row) => el("td", { class: "num" }, delta(row.node.p50_s, row.base?.p50_s, -1) || "—"),
          },
        ], rows)));
      }
    }

    // ------------------------------------------------------------ Containers

    async function renderContainers(runs, baseline, host) {
      const data = await Promise.all(runs.map(async (run) => ({
        run, steps: await runCsv(run, "steps.csv"), phases: await runCsv(run, "container_phases.csv"), containers: await runCsv(run, "containers.csv"),
      })));
      if (!host.isConnected) return;
      host.append(el("p", { class: "hint" }, `Memory model per container over the whole phase (baseline MB, MB added per concurrent session with its r², MB still held after cooldown, the phase's highest memory sample and where it was taken) and CPU / peak memory at each run’s headline level. Δ vs baseline ${baseline.tag} for runs of the same kind.`));
      const collect = ({ run, steps, phases, containers }, phase) => {
        const step = headline(run, steps, phase);
        const names = new Set([
          ...phases.filter((row) => row.phase === phase).map((row) => row.container),
          ...(step ? containers.filter((row) => sameStep(row, step)).map((row) => row.container) : []),
        ]);
        return [...names].map((container) => ({
          run, container, level: step?.level,
          model: phases.find((row) => row.phase === phase && row.container === container) || {},
          load: (step && containers.find((row) => sameStep(row, step) && row.container === container)) || {},
          // the same on every level row of the phase; absent in folders analyzed before it existed
          peak: containers.find((row) => row.phase === phase && row.container === container && typeof row.phase_peak_mb === "number") || {},
        }));
      };
      const peakCell = (row) => el("td", { class: "num" }, fmt(row.peak.phase_peak_mb),
        typeof row.peak.phase_peak_level === "number"
          ? el("span", { class: "reason" }, row.peak.phase_peak_level === 0 ? "outside a level" : `at level ${row.peak.phase_peak_level}`)
          : null);
      for (const phase of phaseList(data.flatMap((item) => [item.steps, item.phases]))) {
        const baseRows = collect(data[0], phase);
        const rows = data.flatMap((item) => collect(item, phase).map((row) => ({
          ...row, base: comparable(row.run, baseline) ? baseRows.find((other) => other.container === row.container) : null,
        }))).sort((a, b) => byName(a.container, b.container));
        if (!rows.length) continue;
        const withDelta = (pick, better) => (row) => numberCell(pick(row), row.base ? pick(row.base) : null, better, Boolean(row.base));
        host.append(el("section", { class: "panel" }, el("h2", {}, `Phase ${phase}`), sortableTable([
          { label: "Container", key: "container", value: (row) => row.container },
          { label: "Run", key: "run", value: (row) => row.run.tag, cell: (row) => runCell(row.run, baseline) },
          { label: "Baseline MB", key: "baseline_mb", value: (row) => row.model.baseline_mb, numeric: true },
          { label: "MB / concurrent session", key: "container_phases.mb_per_concurrent", value: (row) => row.model.mb_per_concurrent, numeric: true, cell: withDelta((row) => row.model.mb_per_concurrent, -1) },
          { label: "r²", key: "r2", value: (row) => row.model.r2, numeric: true },
          { label: "Retained MB after cooldown", key: "retained_mb_after_cooldown", value: (row) => row.model.retained_mb_after_cooldown, numeric: true },
          { label: "Phase peak MB", key: "phase_peak_mb", value: (row) => row.peak.phase_peak_mb, numeric: true, cell: peakCell },
          { label: "Headline level", key: "headline_level", value: (row) => row.level, numeric: true },
          { label: "CPU-s / session", key: "containers.cpu_s_per_session", value: (row) => row.load.cpu_s_per_session, numeric: true, cell: withDelta((row) => row.load.cpu_s_per_session, -1) },
          { label: "Peak memory MB", key: "mem_peak_mb", value: (row) => row.load.mem_peak_mb, numeric: true, cell: withDelta((row) => row.load.mem_peak_mb, -1) },
        ], rows)));
      }
    }

    // ------------------------------------------------------------ Waterfall

    function sessionSpans(events) {
      const sorted = [...events].sort((a, b) => a.ts - b.ts);
      const extra = (event) => { try { return JSON.parse(event.extra_json || "{}"); } catch { return {}; } };
      const first = (service, checkpoint) => sorted.find((event) => event.service === service && event.checkpoint === checkpoint);
      const origin = first("django_app", "request_received") || sorted[0];
      const spans = [];
      const end = first("crew", "session_end");
      if (end) spans.push({ type: "session", label: "Session", start: 0, end: end.ts - origin.ts });
      const received = first("crew", "received");
      const slot = first("crew", "slot_acquired");
      if (received && slot) spans.push({ type: "queue", label: "Queue", start: received.ts - origin.ts, end: slot.ts - origin.ts });
      const pair = (startName, endName, key, type, label) => {
        const open = new Map();
        for (const event of sorted) {
          const id = key(event);
          if (event.checkpoint === startName) {
            if (!open.has(id)) open.set(id, []);
            open.get(id).push(event);
          } else if (event.checkpoint === endName && open.get(id)?.length) {
            const start = open.get(id).shift();
            spans.push({ type, label: label(start), start: start.ts - origin.ts, end: event.ts - origin.ts });
          }
        }
      };
      pair("node_start", "node_end", (event) => event.node_name, "node", (event) => event.node_name || "Node");
      pair("llm_start", "llm_end", (event) => extra(event).correlation_id, "llm", (event) => (event.node_name ? `LLM · ${event.node_name}` : "LLM call"));
      pair("exec_start", "exec_end", (event) => extra(event).execution_id, "exec", () => "Python exec");
      return spans.sort((a, b) => a.start - b.start || b.end - a.end);
    }

    async function renderWaterfall(run, host) {
      const [sessions, events] = await Promise.all([runCsv(run, "sessions.csv.gz"), runCsv(run, "events_sample.csv")]);
      if (!host.isConnected) return;
      const eventsBySession = new Map();
      for (const event of events) {
        if (!eventsBySession.has(event.session_id)) eventsBySession.set(event.session_id, []);
        eventsBySession.get(event.session_id).push(event);
      }
      const sampled = sessions.filter((session) => eventsBySession.has(session.session_id));
      const finished = sampled.filter((session) => session.status === "end" && session.e2e_s !== null && !session.cold).sort((a, b) => a.e2e_s - b.e2e_s);
      const picks = {
        fastest: finished[0], median: finished[Math.floor(finished.length / 2)], slowest: finished[finished.length - 1],
        failed: sampled.find((session) => session.status !== null && session.status !== "end"), cold: sampled.find((session) => session.cold),
      };
      const pick = picks[state.sessionPick] ? state.sessionPick : PICKS.find((name) => picks[name]);
      const select = el("select", { id: "session-pick", onchange: (event) => { state.sessionPick = event.target.value; renderTab(); } },
        PICKS.map((name) => el("option", { value: name, disabled: !picks[name] },
          picks[name] ? `${name}: session ${picks[name].session_id}, ${fmt(picks[name].e2e_s)} s` : `${name}: none in this run`)));
      host.append(el("div", { class: "controls" }, el("label", { class: "inline" }, "Session", select)));
      if (!pick) {
        host.append(el("p", { class: "empty" }, `${run.tag} has no sampled session events (events_sample.csv).`));
        return;
      }
      select.value = pick;
      const session = picks[pick];
      const spans = sessionSpans(eventsBySession.get(session.session_id));
      const panel = el("section", { class: "panel" },
        el("h2", {}, `${run.tag} · session ${session.session_id}`),
        el("p", { class: "hint" }, `Phase ${session.phase}, level ${fmt(session.level)} (${session.kind}) · end-to-end ${fmt(session.e2e_s)} s · status ${session.status || "unfinished"}${session.error_reason ? ` · ${session.error_reason}` : ""}. Bars start at the moment Django received the request.`));
      host.append(panel);
      const types = SPAN_TYPES.filter(([type]) => spans.some((span) => span.type === type));
      makeChart(panel, {
        type: "bar",
        data: {
          labels: spans.map((span) => span.label),
          datasets: types.map(([type, label, token]) => ({
            label, grouped: false, backgroundColor: css(token), borderRadius: 2, barPercentage: 0.8, categoryPercentage: 0.9,
            data: spans.map((span) => (span.type === type ? [span.start, span.end] : null)),
          })),
        },
        options: {
          indexAxis: "y",
          scales: { x: { beginAtZero: true, title: { display: true, text: "Seconds since request received" } }, y: { grid: { display: false } } },
          plugins: {
            legend: { position: "bottom" },
            tooltip: {
              callbacks: {
                label: (item) => {
                  const [start, end] = item.raw;
                  return `${spans[item.dataIndex].label}: ${fmt(start)} → ${fmt(end)} s (${fmt(end - start)} s)`;
                },
              },
            },
          },
        },
      }, 80 + 24 * spans.length, `Span waterfall for session ${session.session_id}`);
    }

    // ------------------------------------------------------------ wiring

    $("#load-index").addEventListener("click", loadIndex);
    $("#open-folders").addEventListener("click", () => $("#folder-input").click());
    $("#folder-input").addEventListener("change", (event) => {
      openFolders([...event.target.files]);
      event.target.value = "";
    });
    for (const key of ["kind", "case", "ref", "host"]) {
      $(`#filter-${key}`).addEventListener("change", (event) => { state.filters[key] = event.target.value; renderRuns(); });
    }
    $("#filter-text").addEventListener("input", (event) => { state.filters.text = event.target.value; renderRuns(); });

    async function walk(entry, prefix, files) {
      const path = prefix + entry.name;
      if (entry.isFile) {
        const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
        file.relativePath = path;
        files.push(file);
        return;
      }
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
        if (!batch.length) break;
        await Promise.all(batch.map((child) => walk(child, `${path}/`, files)));
      }
    }

    const dropZone = $("#drop-zone");
    dropZone.addEventListener("dragover", (event) => { event.preventDefault(); dropZone.classList.add("over"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
    dropZone.addEventListener("drop", async (event) => {
      event.preventDefault();
      dropZone.classList.remove("over");
      const entries = [...event.dataTransfer.items].map((item) => item.webkitGetAsEntry?.()).filter(Boolean);
      const files = [];
      await Promise.all(entries.map((entry) => walk(entry, "", files)));
      openFolders(files);
    });
    // Theme: Auto follows the OS setting, Light and Dark override it; the choice is kept in
    // localStorage when the browser allows it. Charts read their colours when drawn, so the
    // tab is drawn again (the Timeline keeps its zoom).
    const THEME_KEY = "epicstaff-bench-theme";
    function themeChoice() {
      try { return localStorage.getItem(THEME_KEY) || "auto"; } catch { return "auto"; }
    }
    function applyTheme(choice) {
      const dark = choice === "dark" || (choice === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      if (state.selected.length) renderTab();
    }
    $("#theme").value = themeChoice();
    $("#theme").addEventListener("change", (event) => {
      try { localStorage.setItem(THEME_KEY, event.target.value); } catch { /* not kept, still applied */ }
      applyTheme(event.target.value);
    });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if ($("#theme").value === "auto") applyTheme("auto"); });
    // the static run-list headers get the same tooltips as every other table
    for (const cell of document.querySelectorAll("#runs th[data-def]")) cell.replaceWith(header(cell.textContent, cell.dataset.def));
    // a tooltip can always be dismissed without moving the pointer or focus (WCAG 1.4.13)
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") hideTip(); });
    addEventListener("scroll", hideTip, true);

    refresh();
    if (/^https?:$/.test(location.protocol)) loadIndex();
  </script>
</body>

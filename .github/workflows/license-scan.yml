name: Licence scan

# Daily, on main: regenerates THIRD-PARTY-NOTICES.md from the real install
# trees (nothing is committed) and checks every shipped package's licence
# against scripts/license-policy.json, and the OS packages in the published
# images against scripts/os-license-policy.json. Pull requests get the cheap version of
# the same check in pr.yml; this run is what catches a hand-edited notices
# file and a policy that was tightened after a package landed.
#
# It emails only when something is wrong: a package outside the policy, or a
# scan that could not finish (a broken scan must not read as a clean one).
# The alert job still runs every day and logs in to the mail server, so a
# broken login turns the run red long before an alert depends on it.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: license-scan
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Shipped dependency licences
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Matches the service Dockerfiles: without this uv may fetch its own
      # interpreter instead of the one set up below.
      UV_PYTHON_DOWNLOADS: never
      # The `prepare` script installs husky git hooks, which CI has no use for.
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Every service pins requires-python to exactly this version.
          python-version: '3.12.10'

      - name: Install uv
        run: python -m pip install --no-cache-dir --require-hashes -r .github/requirements/uv.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # --ignore-scripts: block install-time lifecycle hooks; see frontend/Dockerfile.fe.
        run: npm ci --ignore-scripts

      - name: Regenerate backend notices
        run: python scripts/generate-python-notices.py

      # Also refuses a package outside the policy, naming it; the output is
      # kept so the alert can quote it.
      - name: Regenerate frontend notices
        working-directory: frontend
        run: |
          set -o pipefail
          node scripts/generate-third-party-notices.mjs 2>&1 | tee ../frontend-notices.log

      # Runs even when the frontend generator refused, so backend problems
      # are reported in the same alert.
      - name: Check licences
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/check-licenses.mjs | tee license-report.txt

      # Package names only, so a public artifact is fine. Handed to the alert
      # job because this runner has executed third-party package code.
      - name: Keep the report for the alert
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-report
          path: |
            license-report.txt
            frontend-notices.log
          if-no-files-found: ignore
          retention-days: 7

  # The OS packages inside the images users run: base image plus whatever the
  # Dockerfiles install with apt/apk, checked against scripts/os-license-policy.json.
  # Catches a policy tightened after an image was built; pull requests check
  # each image they build in compose-build.yml.
  images:
    name: Shipped image OS package licences
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          # Same scanner version as dependency-scan.yml.
          version: v0.74.0

      # :latest is what every push to main publishes (build-and-push.yml).
      # Third-party images in the compose file (redis, opensearch, ...) are not
      # ours to ship, so only ghcr.io/epicstaff images are checked.
      - name: Scan the published images
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          images=$(grep -ohE '^\s*image:\s*ghcr\.io/epicstaff/[a-z0-9_-]+' src/docker-compose.yaml | awk '{print $2}' | sort -u)
          [ -n "$images" ] || { echo "::error::No ghcr.io/epicstaff images found in src/docker-compose.yaml"; exit 1; }
          mkdir image-reports
          for image in $images; do
            trivy image --quiet --scanners license --pkg-types os --format json \
              --output "image-reports/$(basename "$image").json" "$image:latest"
          done

      - name: Check licences
        run: |
          set -o pipefail
          node scripts/check-image-licenses.mjs image-reports/*.json | tee image-license-report.txt

      - name: Keep the report for the alert
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-license-report
          path: image-license-report.txt
          if-no-files-found: ignore
          retention-days: 7

  # A separate job on a fresh runner: the scan above installs and runs every
  # shipped Python package, and the mailbox password must never share a runner
  # with that code. Only this job sees the secrets; the license-alerts
  # environment limits them to main.
  alert:
    needs: [scan, images]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    environment: license-alerts
    permissions:
      contents: read
      # The issue below is the second channel: it reaches people when email cannot.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          sparse-checkout: .github

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'

      # Absent when the scan broke before writing anything; the alert says so.
      - name: Fetch the report
        if: needs.scan.result != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: license-report
          path: report

      - name: Fetch the image report
        if: needs.images.result != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: image-license-report
          path: report

      # Recipients are a secret, not a variable: the runner prints a step's env
      # in the public log and masks only secrets.
      - name: Check the mailbox login and email any problem
        run: |
          cat report/license-report.txt report/frontend-notices.log report/image-license-report.txt > alert.txt 2>/dev/null || true
          python .github/scripts/send_license_alert.py
        env:
          LICENSE_ALERT_SMTP_HOST: ${{ secrets.LICENSE_ALERT_SMTP_HOST }}
          LICENSE_ALERT_SMTP_USER: ${{ secrets.LICENSE_ALERT_SMTP_USER }}
          LICENSE_ALERT_SMTP_PASSWORD: ${{ secrets.LICENSE_ALERT_SMTP_PASSWORD }}
          LICENSE_ALERT_RECIPIENTS: ${{ secrets.LICENSE_ALERT_RECIPIENTS }}
          # One result for both scans: anything but success sends the alert.
          SCAN_RESULT: ${{ (needs.scan.result == 'success' && needs.images.result == 'success') && 'success' || 'failure' }}
          REPORT_PATH: alert.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # A dead credential would silently swallow every future alert, so it is
      # reported through GitHub instead: one open issue while alerting is broken
      # (no duplicates, no daily comments), closed by the next healthy run. The
      # repository is public, so the issue says only that alerting is broken.
      # LICENSE_ALERT_ISSUE_ASSIGNEES: comma-separated GitHub logins (a repository
      # variable; logins are public anyway). They are assigned after the issue
      # exists, one by one, so a login that is no longer valid only warns instead
      # of stopping the issue from being opened.
      - name: Open an issue when alerting is broken
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEES: ${{ vars.LICENSE_ALERT_ISSUE_ASSIGNEES }}
        run: |
          title='Licence alerting is broken'
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open."
            exit 0
          fi
          url=$(gh issue create --title "$title" --body "The daily licence scan could not run its alert step, so licence problems on \`main\` are currently **not emailed** to anyone.

          Failed run: $RUN_URL

          The run log names the cause. Usually the alert mailbox's password changed, or the mail server stopped accepting the login: update \`LICENSE_ALERT_SMTP_PASSWORD\` in the \`license-alerts\` environment. This issue closes itself on the next healthy run.")
          number="${url##*/}"
          echo "Opened issue #$number."
          for login in ${ASSIGNEES//,/ }; do
            assigned=$(gh api -X POST "repos/$GH_REPO/issues/$number/assignees" -f "assignees[]=$login" \
              --jq "[.assignees[].login] | index(\"$login\") != null" || echo false)
            if [ "$assigned" = true ]; then
              echo "Assigned $login."
            else
              echo "::warning::Could not assign $login to issue #$number (not a collaborator, or the login changed)."
            fi
          done

      - name: Close the issue once alerting works again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Licence alerting is broken'
          gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[].number" |
            while read -r number; do
              gh issue close "$number" --comment "Alerting works again: $RUN_URL"
            done

name: Licence scan

# Daily, on main: regenerates THIRD-PARTY-NOTICES.md from the real install
# trees (nothing is committed) and checks every shipped package's licence
# against scripts/license-policy.json. Pull requests get the cheap version of
# the same check in pr.yml; this run is what catches a hand-edited notices
# file and a policy that was tightened after a package landed.
#
# It emails only when something is wrong: a package outside the policy, or a
# scan that could not finish (a broken scan must not read as a clean one).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: license-scan
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Shipped dependency licences
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Matches the service Dockerfiles: without this uv may fetch its own
      # interpreter instead of the one set up below.
      UV_PYTHON_DOWNLOADS: never
      # The `prepare` script installs husky git hooks, which CI has no use for.
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Every service pins requires-python to exactly this version.
          python-version: '3.12.10'

      - name: Install uv
        run: python -m pip install --no-cache-dir --require-hashes -r .github/requirements/uv.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # --ignore-scripts: block install-time lifecycle hooks; see frontend/Dockerfile.fe.
        run: npm ci --ignore-scripts

      - name: Regenerate backend notices
        run: python scripts/generate-python-notices.py

      # Also refuses a package outside the policy, naming it; the output is
      # kept so the alert can quote it.
      - name: Regenerate frontend notices
        working-directory: frontend
        run: |
          set -o pipefail
          node scripts/generate-third-party-notices.mjs 2>&1 | tee ../frontend-notices.log

      # Runs even when the frontend generator refused, so backend problems
      # are reported in the same alert.
      - name: Check licences
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/check-licenses.mjs | tee license-report.txt

      # Package names only, so a public artifact is fine. Handed to the alert
      # job because this runner has executed third-party package code.
      - name: Keep the report for the alert
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-report
          path: |
            license-report.txt
            frontend-notices.log
          if-no-files-found: ignore
          retention-days: 7

  # A separate job on a fresh runner: the scan above installs and runs every
  # shipped Python package, and the Gmail key (delegated to send as any domain
  # user) must never share a runner with that code. Only this job sees the
  # secrets; the license-alerts environment limits them to main.
  alert:
    needs: scan
    if: failure()
    runs-on: ubuntu-24.04
    environment: license-alerts
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          sparse-checkout: .github

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'

      - name: Install alert dependencies
        run: python -m pip install --require-hashes -r .github/requirements/google-drive.txt

      # Absent when the scan broke before writing anything; the alert says so.
      - name: Fetch the report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: license-report
          path: report

      # Addresses are secrets, not variables: the runner prints a step's env
      # in the public log and masks only secrets.
      - name: Email the licence alert
        run: |
          cat report/license-report.txt report/frontend-notices.log > alert.txt 2>/dev/null || true
          python .github/scripts/send_license_alert.py
        env:
          LICENSE_ALERT_GMAIL_SERVICE_ACCOUNT_JSON: ${{ secrets.LICENSE_ALERT_GMAIL_SERVICE_ACCOUNT_JSON }}
          LICENSE_ALERT_SENDER: ${{ secrets.LICENSE_ALERT_SENDER }}
          LICENSE_ALERT_RECIPIENTS: ${{ secrets.LICENSE_ALERT_RECIPIENTS }}
          REPORT_PATH: alert.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

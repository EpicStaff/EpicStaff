name: build images from compose

on:
  workflow_call:
    inputs:
      compose-file:
        required: true
        type: string
      max-parallel:
        required: false
        type: number
        default: 4

permissions:
  contents: read

env:
  COMPOSE_FILE: src/docker-compose.yaml
concurrency:
  group: pr-${{ github.event.pull_request.number }}-compose-build
  cancel-in-progress: true

jobs:
  generate-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Generate dev env from env.yaml
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements/pyyaml.txt
          python scripts/envtool.py --dev

      - name: Generate compose config json
        shell: bash
        run: |
          set -euo pipefail
          REPO_ROOT="$(pwd)"
          # --profile chat --profile plugins: config leaves profiled services out unless their profile is active.
          docker compose --env-file "$REPO_ROOT/src/.env" -f "$REPO_ROOT/$COMPOSE_FILE" --profile chat --profile plugins config --format json > "$REPO_ROOT/compose.json"
          ls -la "$REPO_ROOT/compose.json"

      - name: Generate matrix (python)
        id: gen
        run: |
          python --version
          python ./.github/scripts/compose_matrix.py --compose-json compose.json --repo-root .

      - name: Show matrix
        run: |
          echo '${{ steps.gen.outputs.matrix }}' | python -m json.tool

  build:
    needs: generate-matrix
    runs-on: ubuntu-24.04
    if: ${{ contains(needs.generate-matrix.outputs.matrix, '"service"') }}

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Prepare image name
        id: img
        run: |
          echo "repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.service }} (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # Loaded into the runner's Docker so the licence scan below can read it.
          load: true
          tags: local/${{ steps.img.outputs.repo }}-${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The base image and whatever the Dockerfile installs with apt/apk ship
      # to users with the image, so their licences are checked the same day a
      # Dockerfile changes them. Python and npm packages are check-licenses' job.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          # Same scanner version as dependency-scan.yml.
          version: v0.74.0

      - name: Check OS package licences of ${{ matrix.service }}
        env:
          IMAGE: local/${{ steps.img.outputs.repo }}-${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
        run: |
          trivy image --quiet --scanners license --pkg-types os --format json --output image-licenses.json "$IMAGE"
          node scripts/check-image-licenses.mjs image-licenses.json

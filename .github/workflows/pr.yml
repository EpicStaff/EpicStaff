name: PR build

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-cla:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLA signatures branch
        # Toggle: set repo variable CLA_ENFORCED=true to enforce. Unset/anything else = gate skipped, build runs.
        if: vars.CLA_ENFORCED == 'true'
        uses: actions/checkout@v4
        with:
          ref: cla-signatures
          sparse-checkout: signatures/cla.json
          sparse-checkout-cone-mode: false

      - name: Verify PR author signed the CLA
        if: vars.CLA_ENFORCED == 'true'
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          if jq -e --arg a "$AUTHOR" '.signedContributors[]? | select(.name == $a)' signatures/cla.json > /dev/null; then
            echo "$AUTHOR has signed the CLA — proceeding with build."
          else
            echo "::error::$AUTHOR has not signed the CLA. Build will not run until the CLA is signed."
            exit 1
          fi

  check-external-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for runtime CDN / external URL references
        run: node scripts/check-external-urls.mjs

  build:
    needs: [check-cla, check-external-urls]
    uses: ./.github/workflows/compose-build.yml
    with:
      compose-file: src/docker-compose.yaml
      max-parallel: 2
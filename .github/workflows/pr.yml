name: PR build

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-cla:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Toggle: set repo variable CLA_ENFORCED=true to enforce. Unset/anything else = gate skipped, build runs.
        if: vars.CLA_ENFORCED == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: vars.CLA_ENFORCED == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: vars.CLA_ENFORCED == 'true'
        run: pip install requests

      - name: Verify PR author signed the CLA
        if: vars.CLA_ENFORCED == 'true'
        run: python .github/scripts/cla_check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  check-external-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for runtime CDN / external URL references
        run: node scripts/check-external-urls.mjs

  build:
    needs: [check-cla, check-external-urls]
    uses: ./.github/workflows/compose-build.yml
    with:
      compose-file: src/docker-compose.yaml
      max-parallel: 2
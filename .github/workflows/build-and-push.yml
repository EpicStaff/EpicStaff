name: build-and-push

on:
  # No direct push triggers — this workflow is invoked exclusively via workflow_call
  # (from deploy.yaml on push:main, and from publish_release.yml on push:tags) and
  # workflow_dispatch (for ad-hoc manual branch builds).
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (slugified into the image tag)'
        required: false
        default: 'main'
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out and build'
        required: true
        type: string
      tag:
        description: 'Image tag to push (e.g. latest, branch-slug, vX.Y.Z)'
        required: true
        type: string
      is_release:
        description: 'Whether this build is an actual release (gates signing/SBOM steps)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  OWNER: epicstaff
  COMPOSE_FILE: src/docker-compose.yaml
  EXCLUDE_SERVICES: redis-monitor

concurrency:
  group: build-and-push-${{ github.event_name }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve ref/tag and generate matrix
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      tag: ${{ steps.r.outputs.tag }}
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Resolve ref + tag
        id: r
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BRANCH: ${{ inputs.branch }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # When invoked via workflow_call, github.event_name is the CALLER's event
          # (e.g. push, workflow_dispatch) — never 'workflow_call'. Detect the call
          # path by presence of inputs.ref/inputs.tag instead.
          if [ -n "$INPUT_REF" ] && [ -n "$INPUT_TAG" ]; then
            REF="$INPUT_REF"
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REF="$INPUT_BRANCH"
            # slugify: lowercase, replace non-[a-z0-9.] with '-', collapse dashes, trim
            TAG=$(echo "$REF" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9.]/-/g; s/--*/-/g; s/^-//; s/-$//')
          elif [ "$EVENT_NAME" = "push" ]; then
            REF="$GH_REF"
            if [[ "$REF" == refs/tags/v* ]]; then
              TAG="${REF#refs/tags/}"
            else
              TAG="latest"
            fi
          else
            echo "Unsupported event/inputs: event=$EVENT_NAME input_ref=$INPUT_REF input_tag=$INPUT_TAG" >&2
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo ">> resolved ref=$REF tag=$TAG"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.r.outputs.ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.10'

      - name: Generate dev env from env.yaml
        run: |
          python -m pip install --quiet pyyaml
          python scripts/envtool.py --dev

      - name: Generate compose config json
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file src/.env -f "$COMPOSE_FILE" config --format json > compose.json
          ls -la compose.json

      - name: Generate build matrix
        id: gen
        shell: bash
        env:
          EXCLUDE_CSV: ${{ env.EXCLUDE_SERVICES }}
        run: |
          set -euo pipefail
          # The script writes `matrix=...` to GITHUB_OUTPUT and also prints the
          # JSON to stdout. Capture stdout, filter excluded services via jq,
          # then write the filtered version to GITHUB_OUTPUT (last write wins).
          RAW=$(python ./.github/scripts/compose_matrix.py \
            --compose-json compose.json \
            --repo-root . \
            | python -c "import sys,json; print(json.dumps(json.loads(sys.stdin.read())))")
          # Note: --exclude not passed to script (older script versions at old
          # release tags may not support it). Exclusion happens via jq below.

          # Build a jq array from the CSV exclude list
          EXCL_JSON=$(echo "$EXCLUDE_CSV" | jq -Rc 'split(",") | map(select(length>0))')
          FILTERED=$(echo "$RAW" | jq -c --argjson excl "$EXCL_JSON" \
            '.include |= map(select(.service as $s | $excl | index($s) | not))')

          echo "matrix=$FILTERED" >> "$GITHUB_OUTPUT"
          echo "$FILTERED" | python -m json.tool

  build:
    name: Build & push ${{ matrix.service }}
    needs: resolve
    if: ${{ contains(needs.resolve.outputs.matrix, '"service"') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        shell: bash
        env:
          BASE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}
          PRIMARY_TAG: ${{ needs.resolve.outputs.tag }}
          GH_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAGS="${BASE}:${PRIMARY_TAG}"
          if [[ "$EVENT_NAME" = "push" && "$GH_REF" == refs/tags/v* ]]; then
            TAGS="${TAGS},${BASE}:latest"
          fi
          if [[ "$EVENT_NAME" = "push" && "$GH_REF" = "refs/heads/main" ]]; then
            SHORT_SHA="${GH_SHA:0:7}"
            TAGS="${TAGS},${BASE}:main-${SHORT_SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo ">> tags: ${TAGS}"

      - name: Build & push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Install cosign
        if: ${{ inputs.is_release }}
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Install syft
        if: ${{ inputs.is_release }}
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Sign image (keyless)
        if: ${{ inputs.is_release }}
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"

      - name: Generate SBOM (SPDX)
        if: ${{ inputs.is_release }}
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          syft "$IMAGE_REF" -o spdx-json="${{ matrix.service }}.spdx.json"

      - name: Attest SBOM (keyless)
        if: ${{ inputs.is_release }}
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type spdxjson \
            --predicate "${{ matrix.service }}.spdx.json" \
            "$IMAGE_REF"

      - name: Write digest record
        shell: bash
        run: |
          set -euo pipefail
          printf '{"%s":"%s"}\n' "${{ matrix.service }}" "${{ steps.build.outputs.digest }}" \
            > "${{ matrix.service }}-digest.json"
          cat "${{ matrix.service }}-digest.json"

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.service }}
          path: ${{ matrix.service }}-digest.json
          retention-days: 7

  aggregate-digests:
    name: Aggregate image digests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all digest artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Merge into digest-map.json
        shell: bash
        run: |
          set -euo pipefail
          ls -la digests
          jq -s 'add' digests/*-digest.json > digest-map.json
          cat digest-map.json

      - name: Upload digest-map artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-map
          path: digest-map.json
          retention-days: 7

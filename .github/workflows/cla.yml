name: "CLA Assistant"

on:
  pull_request_target:
    types: [opened, closed, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    # Toggle: set repo variable CLA_ENFORCED=true to enable. Unset/anything else = CLA bot off.
    if: vars.CLA_ENFORCED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        run: pip install google-api-python-client google-auth requests

      # The Actions cache is read-only in this event context, so the fake
      # signatures live on the `cla-fake-drive` branch of the fork instead.
      - name: Restore fake Drive
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        run: |
          if git fetch --depth=1 origin cla-fake-drive:cla-fake-drive; then
            git worktree add .cla-fake-drive cla-fake-drive
          else
            git worktree add --orphan -b cla-fake-drive .cla-fake-drive
          fi

      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        run: python .github/scripts/cla_sign_fake_drive.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # main() reads it; the fake Drive ignores it.
          CLA_GDRIVE_ROOT_ID: fake
          # Comma-separated bot logins exempt from signing. Unset/empty = dependabot[bot].
          CLA_ALLOWLIST: ${{ vars.CLA_ALLOWLIST }}

      - name: Show fake Drive contents
        if: always()
        run: find .cla-fake-drive -name '*.json' -print -exec cat {} \; || true

      - name: Save fake Drive
        if: always() && ((github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target')
        working-directory: .cla-fake-drive
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new signatures."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Fake CLA signatures from run ${{ github.run_id }}"
          git push origin cla-fake-drive

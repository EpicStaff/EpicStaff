name: "CLA Assistant"

on:
  pull_request_target:
    types: [opened, closed, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    # Toggle: set repo variable CLA_ENFORCED=true to enable. Unset/anything else = CLA bot off.
    if: vars.CLA_ENFORCED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: actions/checkout@v4

      - name: Set up Python
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        run: pip install google-api-python-client google-auth requests

      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        run: python .github/scripts/cla_sign.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CLA_GDRIVE_ROOT_ID: ${{ vars.CLA_GDRIVE_ROOT_ID }}
          CLA_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.CLA_GDRIVE_SERVICE_ACCOUNT_JSON }}

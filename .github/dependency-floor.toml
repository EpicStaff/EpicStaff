# Services that cannot currently reach the floor, each with the upstream cap
# that blocks it. These are tracked gaps, not hidden ones: the check prints them
# on every run and fails if one is listed but no longer needed.

[[exception]]
package = "certifi"
services = ["sandbox"]
blocked_at = "2025.11.12"
reason = "miniopy-async 1.23.5 requires certifi >=2025.1.31,<2026.0.0. Needs a miniopy-async upgrade."

[[exception]]
package = "litellm"
services = ["knowledge"]
blocked_at = "1.80.0"
reason = "litellm >=1.83 requires openai >=2.8, but knowledge declares openai <2.0.0. Blocked behind the openai 2.x migration."

[[exception]]
package = "openai"
services = ["knowledge", "realtime"]
blocked_at = "1.58.1"
reason = "openai 1.x -> 2.x is a breaking major. knowledge declares openai <2.0.0; realtime pins 1.58.1. Needs its own migration."

[[exception]]
package = "starlette"
services = ["realtime", "webhook"]
blocked_at = "0.49.3"
reason = "fastapi 0.120.1 pins starlette <0.50.0. Needs a FastAPI major upgrade; carries 4 open HIGH advisories."

[[exception]]
package = "langchain-core"
services = ["crew"]
blocked_at = "0.3.86"
reason = "Deliberately held on the 0.3 line: 1.x is a breaking LangChain release and crew is the LangGraph orchestrator. 0.3.86 closes CVE-2025-68664."


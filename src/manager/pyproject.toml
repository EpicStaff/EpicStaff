[tool.poetry]
name = "manager"
version = "0.1.0"
description = "background worker: session TTL watchdog and schedule-trigger scheduler"
authors = ["Ihor Orlenko", "Maksym Yevstratiev"]

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "==1.2.2"
redis = "==5.3.1"
loguru = "0.7.2"
sqlalchemy = "==2.0.49"
asyncpg = "^0.30.0"
pydantic = "==2.13.4"
apscheduler = "^3.10.4"

[tool.poetry.group.dev.dependencies]
watchfiles = "^0.22.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
select = ["E"]
ignore = ["E402","E501"]

[tool.poetry.group.secfloor.dependencies]
idna = "==3.18"
pyjwt = "==2.13.0"
anyio = "==4.14.2"

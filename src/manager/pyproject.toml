[project]
name = "manager"
version = "1.0.0"
description = "background worker: session TTL watchdog and schedule-trigger scheduler"
authors = [
    { name = "EpicStaff" },
    { name = "Ihor Orlenko" },
    { name = "Maksym Yevstratiev" },
    { name = "Artur Drohomeretskyi" },
    { name = "Vasyl Cherkes" },
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "apscheduler==3.11.2",
    "asyncpg==0.30.0",
    "loguru==0.7.2",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "redis==5.3.1",
    "sqlalchemy==2.0.49",
]

[dependency-groups]
dev = [
    "watchfiles==0.22.0",
]
transitive-pins = [
    "anyio==4.14.2",
    "idna==3.18",
    "pyjwt==2.13.0",
]

[tool.uv]
package = false

[tool.ruff]
select = ["E"]
ignore = ["E402","E501"]

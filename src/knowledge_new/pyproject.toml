[project]
name = "knowledge"
version = "0.1.0"
description = ""

requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "litellm (>=1.92.0,<2.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "chonkie (>=1.6.8,<2.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pdfplumber (>=0.11.10,<0.12.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "psycopg (>=3.3.4,<4.0.0)",
    "graphrag (>=3.1.0,<4.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "miniopy-async (>=1.23.5,<2.0.0)",
    "litestar (>=2.24.0,<3.0.0)",
    "uvicorn (>=0.52.2,<0.53.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.0,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

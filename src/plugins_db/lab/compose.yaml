# The plugin database lab: the plugins_db service exactly as src/docker-compose.yaml defines it
# (extends: image, command, init script, pg_hba.conf, environment, healthcheck), published on a
# free loopback port for the tests. Run with run.sh, which gives every run a project and container
# name of its own (so runs never collide), sets random passwords and removes everything afterwards.
name: plugins-db-lab

services:
  plugins_db:
    extends:
      file: ../../docker-compose.yaml
      service: plugins_db
    container_name: ${PLUGINS_DB_LAB_CONTAINER:?}
    ports:
      - "127.0.0.1::5432"

volumes:
  plugins_pgdata: {}

networks:
  # The stack's network is internal, and Docker publishes no port of a container that is only on
  # internal networks. Here it is a plain bridge, so the tests reach the published port.
  plugins-db-network: {}

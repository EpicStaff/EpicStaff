# plugins_db client authentication, named by `-c hba_file=` so it applies to an existing data
# directory too. The superuser works only over the container's own socket, as the postgres OS
# user. Every other role logs in over TCP with SCRAM: the plugin node as plugins_admin and as a
# plugin's owner during migrations, and each plugin's process as its app role.
local   all  postgres              peer
local   all  all                   reject
host    all  postgres  0.0.0.0/0   reject
host    all  postgres  ::/0        reject
host    all  all       0.0.0.0/0   scram-sha-256
host    all  all       ::/0        scram-sha-256

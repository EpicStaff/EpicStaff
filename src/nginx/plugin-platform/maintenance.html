<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="30">
<title>Being updated</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f7f9;
    color: #1f2328;
  }
  main {
    max-width: 32rem;
    padding: 2rem;
    text-align: center;
    line-height: 1.5;
  }
  h1 {
    margin: 0 0 0.5rem;
    font-size: 1.25rem;
    font-weight: 600;
  }
  p {
    margin: 0;
    color: #59636e;
  }
  @media (prefers-color-scheme: dark) {
    body {
      background: #16181d;
      color: #e6e8eb;
    }
    p {
      color: #9ba3ae;
    }
  }
</style>
</head>
<body>
<main>
<h1>This plugin is being updated.</h1>
<p>It will be back in a few minutes. This page reloads by itself.</p>
</main>
</body>
</html>

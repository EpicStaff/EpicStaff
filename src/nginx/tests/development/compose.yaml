# The plugin development lab: EpicStaff's real nginx templates and entrypoint scripts in the nginx
# image pinned in src/docker-compose.yaml (run.sh reads the pin), rendered with plugin development
# mode on (nginx) and off (nginx-off), against a stand-in django_app that answers both checks, a
# stand-in frontend development server, and a plugin backend. nginx-unmarked has development mode
# on without src/docker-compose.plugins-dev.yaml's marker, and must refuse to start. Run with
# run.sh, which gives every run a project name of its own and removes everything afterwards. No
# host ports. The plugins network's subnet is fixed, apart from the stack's and the gateway
# lab's, so two runs of this lab at once would collide on it.
name: es-development-lab

x-lab-secret: &lab-secret
  PLUGINS_GATEWAY_SECRET: 7c2e9a1f4b6d8e0a3c5f7b9d1e3a5c7e9b1d3f5a7c9e1b3d5f7a9c1e3b5d7f9a

x-plugins-subnet: &plugins-subnet 10.235.253.0/24

# The gateway lab's image: Python with aiohttp, curl and jq.
x-lab-service: &lab-service
  build:
    context: ../gateway
  init: true
  mem_limit: 128m
  volumes:
    - ./services:/lab/services:ro
    - ./scripts:/lab/scripts:ro

x-nginx-environment: &nginx-environment
  <<: *lab-secret
  NGINX_ENTRYPOINT_QUIET_LOGS: "1"
  NGINX_SERVER_NAME: epicstaff.localhost
  NGINX_SSL_MODE: "off"
  # Plain http on the developer's machine, with nothing in front: no Strict-Transport-Security on
  # the plugin hosts, the development server's page included (the gateway lab has it on).
  NGINX_HSTS_ENABLED: "false"
  DJANGO_HOST: decision
  DJANGO_PORT: "8000"
  FRONTEND_HOST: frontend
  FRONTEND_PORT: "80"
  REALTIME_HOST: realtime
  REALTIME_PORT: "8050"
  WEBHOOK_HOST: webhook
  WEBHOOK_PORT: "8009"
  AUDITOR_HOST: auditor
  AUDITOR_PORT: "8010"
  CHAT_ENABLED: "false"
  CHAT_UPSTREAM_URL: http://chat:8200
  PLUGINS_ENABLED: "true"
  PLUGINS_DEV_MODE: "true"
  # The .localhost names development mode needs.
  PLUGINS_BASE_DOMAIN: plugins.epicstaff.localhost
  DJANGO_FRONTEND_BASE_URL: http://epicstaff.localhost
  PLUGINS_MAX_PACKAGE_MB: "300"
  PLUGINS_MAX_REQUEST_BODY_MB: "1"
  PLUGINS_NETWORK_SUBNET: *plugins-subnet
  STORAGE_HOST: storage
  STORAGE_PORT: "9000"
  STORAGE_BUCKET: epicstaff
  AVATAR_URL_SIGNING_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210

x-nginx: &nginx
  image: ${DEVELOPMENT_LAB_NGINX_IMAGE:?}
  environment: *nginx-environment
  volumes:
    - ../../templates/:/etc/nginx/templates:ro
    # Every hook in src/nginx/docker-entrypoint.d, as src/docker-compose.yaml mounts them
    # (tests/check_templates.sh fails when one is missing): the long syntax, so a missing file
    # stops `up` instead of becoming an empty folder that nginx skips.
    - type: bind
      source: ../../docker-entrypoint.d/15-normalize-chat-enabled.envsh
      target: /docker-entrypoint.d/15-normalize-chat-enabled.envsh
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../../docker-entrypoint.d/16-check-ssl-mode.envsh
      target: /docker-entrypoint.d/16-check-ssl-mode.envsh
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../../docker-entrypoint.d/16-normalize-plugins-enabled.envsh
      target: /docker-entrypoint.d/16-normalize-plugins-enabled.envsh
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../../docker-entrypoint.d/17-normalize-hsts-enabled.envsh
      target: /docker-entrypoint.d/17-normalize-hsts-enabled.envsh
      read_only: true
      bind:
        create_host_path: false
    - plugin_spa:/srv/plugin-spa:ro
    - ../../plugin-platform:/usr/share/nginx/plugin-platform:ro
  sysctls:
    net.ipv4.tcp_tw_reuse: "1"
  mem_limit: 128m
  depends_on: [decision, author, plugin_alpha]

services:
  # Development mode on, with what src/docker-compose.plugins-dev.yaml adds. The public networks,
  # and plugins-network as epicstaff-api, as in the stack.
  nginx:
    <<: *nginx
    environment:
      <<: *nginx-environment
      PLUGINS_DEV_LOOPBACK_ONLY: "true"
    networks:
      public: {}
      backend: {}
      plugins:
        aliases:
          - epicstaff-api

  # The same templates with development mode off: no page decision and nothing on 8082. Without
  # the development compose file's marker, which development mode off does not need.
  nginx-off:
    <<: *nginx
    environment:
      <<: *nginx-environment
      PLUGINS_DEV_MODE: "false"
    networks: [public, backend, plugins]

  # Development mode on, started without the development compose file (no marker): its start
  # script must stop it with 64. Run once by run.sh (`compose run`), never by `up`.
  nginx-unmarked:
    <<: *nginx
    profiles: [refusal]
    network_mode: none

  decision:
    <<: *lab-service
    command: ["python", "-u", "/lab/services/decision.py"]
    environment:
      <<: *lab-secret
      PORT: "8000"
      AUTHOR_HOST: author
      PLUGIN_UPSTREAM: plugin_alpha:20001
    # backend: nginx's checks and API; public: where it resolves the development server's name.
    networks: [backend, public]

  # The developer's frontend development server. nginx reaches it as it reaches the Docker host,
  # by an address outside every network of the stack's own services. Like esbuild's, it refuses
  # any Host but localhost and 127.0.0.1.
  author:
    <<: *lab-service
    command: ["python", "-u", "/lab/services/author.py"]
    environment:
      PORT: "5173"
    networks: [public]

  # The installed plugin's backend, on the plugins network only: /api/ still goes there.
  plugin_alpha:
    <<: *lab-service
    command: ["python", "-u", "/lab/gateway/backend.py"]
    environment:
      BACKEND_NAME: alpha
      PORT: "20001"
      EVIDENCE_FILE: /tmp/backend.log
    volumes:
      - ../gateway/services/backend.py:/lab/gateway/backend.py:ro
    networks: [plugins]

  # A browser's, and the developer machine's, view: not on the plugins network.
  tools:
    <<: *lab-service
    command: ["sleep", "infinity"]
    mem_limit: 256m
    environment:
      <<: *lab-secret
    volumes:
      - ./services:/lab/services:ro
      - ./scripts:/lab/scripts:ro
      - ../gateway/spa:/lab/spa:ro
      - ../../plugin-platform:/lab/plugin-platform:ro
      - plugin_spa:/srv/plugin-spa
    networks: [public, backend]

  # A plugin backend's or the node's view: on the plugins network only.
  inside:
    <<: *lab-service
    command: ["sleep", "infinity"]
    mem_limit: 256m
    volumes:
      - ./scripts:/lab/scripts:ro
    networks: [plugins]

volumes:
  plugin_spa: {}

networks:
  public: {}
  backend: {}
  plugins:
    internal: true
    ipam:
      config:
        - subnet: *plugins-subnet

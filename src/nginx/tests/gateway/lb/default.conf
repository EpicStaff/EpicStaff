# The lab's load balancer: ends TLS in front of EpicStaff's nginx, as a deployment with
# NGINX_SSL_MODE=off has one (docs/setup/ssl.md, "Behind a load balancer"), and tells nginx the
# browser's scheme in X-Forwarded-Proto. Its certificate is made when the container starts
# (compose.yaml), so nothing secret is committed.
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /tmp/lb-fullchain.pem;
    ssl_certificate_key /tmp/lb-privkey.pem;

    location / {
        proxy_pass http://nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

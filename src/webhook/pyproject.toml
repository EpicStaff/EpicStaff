[tool.poetry]
name = "webhook"
version = "0.1.0"
description = "EpicStaff webhook service"
authors = ["MaksymYevstratievHYS <maksym.yevstratiev@hys-enterprise.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "==0.120.1"
uvicorn = {version = "==0.49.0", extras = ["standard"]}
pyngrok = "7.4.1"
pydantic = "==2.13.4"
pydantic-settings = "2.11.0"
redis = "==5.3.1"
loguru = "0.7.3"
passlib = "1.7.4"


[tool.poetry.group.tests.dependencies]
httpx = "^0.28.1"
pytest = "^8.3.5"
pytest-asyncio = "^0.25.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.poetry.group.dev.dependencies]
watchfiles = "^1.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.secfloor.dependencies]
certifi = "==2026.7.22"
python-dotenv = "==1.2.2"
idna = "==3.18"
pyjwt = "==2.13.0"
anyio = "==4.14.2"

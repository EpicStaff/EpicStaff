[project]
name = "webhook"
version = "1.0.0"
description = "EpicStaff webhook service"
authors = [
    { name = "EpicStaff" },
    { name = "Maksym Yevstratiev" },
    { name = "Nikita Zaloha" },
]
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "fastapi==0.120.1",
    "loguru==0.7.3",
    "pydantic-settings==2.11.0",
    "pydantic==2.13.4",
    "pyngrok==7.4.1",
    "redis==5.3.1",
    "uvicorn[standard]==0.49.0",
]

[dependency-groups]
tests = [
    "httpx==0.28.1",
    "pytest-asyncio==0.25.3",
    "pytest==8.4.2",
]
dev = [
    "watchfiles==1.2.0",
]
transitive-pins = [
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "idna==3.18",
    "pyjwt==2.13.0",
    "python-dotenv==1.2.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = false

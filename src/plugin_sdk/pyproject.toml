[project]
name = "epicstaff-plugin"
version = "0.1.0"
description = "Contracts, package format, signing and the command-line tool for EpicStaff plugins."
authors = [{ name = "EpicStaff" }]
# A library for plugin authors, not a service: it supports every Python a plugin
# backend may use, so the services' exact interpreter pin does not apply.
requires-python = ">=3.12,<3.14"
dependencies = [
    "cryptography>=50",
    # The client a plugin backend calls EpicStaff's API with (epicstaff_plugin.client).
    "httpx>=0.28,<1",
    "packaging>=24",
    "pydantic>=2.13,<3",
    "pyjwt>=2.10,<3",
]

[project.scripts]
epicstaff-plugin = "epicstaff_plugin.cli.main:run"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    # `pack --download-wheels` runs pip, which a uv-made environment does not have.
    "pip==26.0.1",
    # The Weather sample backend and a real `epicstaff_plugin.serve` run in the tests, at
    # the versions the other services ship (the shared dependency floor).
    "anyio==4.14.2",
    "fastapi==0.141.1",
    "h11==0.16.0",
    "idna==3.18",
    "starlette==1.6.0",
    "uvicorn==0.52.3",
    # The `postgres` tests run `epicstaff_plugin.database` and the Weather sample's stores
    # against a real PostgreSQL, with the driver and pool django_app ships.
    "psycopg[binary,pool]==3.3.4",
    "psycopg-pool==3.3.3",
]
# The versions django_app ships, transitive ones included. A newer version in this lock would
# raise the shared dependency floor (.github/dependency-floor.toml) for django_app and add a
# second copy of the package to THIRD-PARTY-NOTICES.md.
django-app-versions = [
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    # django_app ships 2025.11.12, held below the floor by a recorded exception (miniopy-async);
    # the floor version, which es_plugins ships with the same httpx, needs no exception here.
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "cryptography==50.0.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "packaging==26.3",
    "pycparser==3.0",
    "pydantic-core==2.46.4",
    "pydantic==2.13.4",
    "pyjwt==2.13.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a plugins_db server (ES_PLUGINS_TEST_PG_HOST, _PORT, _ADMIN_PASSWORD; src/plugins_db/lab/run.sh); skipped otherwise",
]

[project]
name = "agent"
version = "1.0.0"
description = "EpicStaff agent execution runtime"
authors = [
    { name = "EpicStaff" },
    { name = "Vitalii Povroznyk "},
]
requires-python = "==3.12.10"
dependencies = [
    "fastmcp==4.1.6",
    "foundation",
    "jsonschema==4.26.0",
    "litellm==1.108.1",
    "loguru==0.7.3",
    "mcp==2.3.0",
    "pydantic==2.13.4",
    "redis==5.3.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio==1.4.0",
    "pytest==9.0.3",
]
transitive-pins = [
    "aiohttp==3.14.3",
    "anyio==4.14.2",
    "authlib==1.7.2",
    "certifi==2026.10.23",
    "charset-normalizer==3.4.7",
    "cryptography==50.0.1",
    "idna==3.18",
    "jinja2==3.1.6",
    "pyjwt==2.15.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "urllib3==2.7.0",
    "uvicorn==0.52.3",
    "yarl==1.24.5",
]

[tool.uv]
package = false

[tool.uv.sources]
foundation = { path = "../foundation", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

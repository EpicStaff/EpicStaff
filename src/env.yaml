# Source of truth for src/.dev.env, src/.debug.env, src/.env.example.
# Edit this file — never edit generated files directly.
# Regenerate:  python scripts/generate_env.py
# Check drift: python scripts/generate_env.py --check

header:
  example: |
    EpicStaff environment configuration.
    Copy to `.env`, fill in the marked secrets, then `docker compose up -d`.
    #
    # Lines marked CHANGE ME must be set before first run.
    # Everything else has sensible defaults that work for a local install.

# Groups map to "# ===== NAME =====" banners (closing "# =================="
# banner rendered after the last section of a group).
# Each section renders a blank line before its comment, then its vars.
# Var rendered in env iff its effective envs list (var-level → section-level →
# all) includes that env.
# Value resolution: env-specific key if present, else `default`.
# Per-env inline comment: mapping {value: ..., comment: "..."} on an env key.
# Above-var comment: var-level `comment:` key (or `<env>_comment:` override).

groups:

  # ------------------------------------------------------------------
  # Pre-SHARED block: IMAGE_TAG before the SHARED banner (example only)
  # ------------------------------------------------------------------
  - name: _PRE_SHARED
    no_banner: true
    sections:
      - comment: "Image tag to pull from ghcr.io/epicstaff/*\n# Use 'latest' to track main, or pin to a release like v1.0.7"
        envs: [example]
        vars:
          IMAGE_TAG:
            default: latest

  # ------------------------------------------------------------------
  # SHARED
  # ------------------------------------------------------------------
  - name: SHARED
    sections:
      - comment: Redis Configuration
        vars:
          REDIS_HOST:
            default: redis
            debug: 127.0.0.1
          REDIS_PORT:
            default: 6379
          REDIS_PASSWORD:
            default: redis_password
            example:
              value: ""
              comment: "CHANGE ME (any non-empty string)"

      - comment: "Redis broker/storage URLs — read per prefix in communication.py\n# (crew/services + django_app); HOST/PORT/DB required, USER/PASSWORD optional"
        vars:
          CREW_BROKER_HOST:
            default: redis
            debug: 127.0.0.1
          CREW_BROKER_PORT:
            default: 6379
          CREW_BROKER_DB:
            default: 0
          CREW_BROKER_USER:
            default: ""
          CREW_BROKER_PASSWORD:
            default: redis_password
            example:
              value: ""
              comment: "CHANGE ME (any non-empty string)"
          CREW_STORAGE_HOST:
            default: redis
            debug: 127.0.0.1
          CREW_STORAGE_PORT:
            default: 6379
          CREW_STORAGE_DB:
            default: 1
          CREW_STORAGE_USER:
            default: ""
          CREW_STORAGE_PASSWORD:
            default: redis_password
            example:
              value: ""
              comment: "CHANGE ME (any non-empty string)"
          DJANGO_BROKER_HOST:
            default: redis
            debug: 127.0.0.1
          DJANGO_BROKER_PORT:
            default: 6379
          DJANGO_BROKER_DB:
            default: 0
          DJANGO_BROKER_USER:
            default: ""
          DJANGO_BROKER_PASSWORD:
            default: redis_password
            example:
              value: ""
              comment: "CHANGE ME (any non-empty string)"
          DJANGO_STORAGE_HOST:
            default: redis
            debug: 127.0.0.1
          DJANGO_STORAGE_PORT:
            default: 6379
          DJANGO_STORAGE_DB:
            default: 1
          DJANGO_STORAGE_USER:
            default: ""
          DJANGO_STORAGE_PASSWORD:
            default: redis_password
            example:
              value: ""
              comment: "CHANGE ME (any non-empty string)"

      - comment: redis-monitor
        envs: [dev, debug]
        vars:
          REDIS_CHECK_INTERVAL:
            default: 5
          REDIS_MAX_FAILURES:
            default: 1

      - comment: Database configuration
        vars:
          POSTGRES_DB:
            default: crew
          POSTGRES_PASSWORD:
            default: admin
            example:
              value: ""
              comment: "CHANGE ME (postgres superuser password)"
          PGDATA:
            default: /var/lib/postgresql/data
            debug: /var/lib/postgresql/data/pgdata
          DB_HOST_NAME:
            default: crewdb
            debug: 127.0.0.1
          DB_NAME:
            default: crew
          DB_PORT:
            default: 5432
          DB_USER:
            default: postgres

      - comment: "Communication"
        envs: [example]
        vars:
          _COMMENTED_PAYLOAD_THRESHOLD:
            raw_line: "# DEFAULT_PAYLOAD_SIZE_THRESHOLD=        # To change default payload size threshold for all producers"

  # ------------------------------------------------------------------
  # SERVICES  (rendered with name "==== SERVICES ====")
  # ------------------------------------------------------------------
  - name: "==== SERVICES ===="
    sections:
      - comment: django_app
        vars:
          DEBUG:
            default: "True"
            example: "False"
          DJANGO_LOG_LEVEL:
            default: DEBUG
            example: WARNING
          SECRET_KEY:
            default: "example-5$8!dbhafy9bp!gfu&jz6rt!f8+@!mpx$*bmajxg**u%=v2i+0"
            example:
              value: ""
              comment: "CHANGE ME (Django SECRET_KEY; generate a 50+ char random string)"
          JWT_SECRET:
            default: example-jwt-secret-change-me
            envs: [dev, example]
            example:
              value: ""
              comment: "CHANGE ME (≥32 char random string for JWT signing)"
          JWT_ACCESS_MINUTES:
            default: 10000
            envs: [dev, example]
            example: 60
          JWT_REFRESH_DAYS:
            default: 30
            envs: [dev, example]
            example: 7
          FIRST_SETUP_MODE:
            default: open
            example: cli_only
            envs: [dev, example]
            comment: "Who may create the first superadmin.\n# cli_only (default) - `manage.py create_superadmin` only; the HTTP\n# endpoint is refused. Required for internet-exposed deployments.\n# open - POST /api/auth/first-setup/ creates it (local development only)."
          LOGIN_THROTTLE_RATE:
            default: 5/min
            envs: [dev, example]
          DEFAULT_ORGANIZATION_NAME:
            default: Organization
            envs: [dev, example]
          PASSWORD_RESET_TOKEN_TTL:
            default: 900
            envs: [dev, example]
          PASSWORD_RESET_REQUEST_THROTTLE_RATE:
            default: 5/hour
            envs: [dev, example]
          PASSWORD_RESET_CONFIRM_THROTTLE_RATE:
            default: 10/hour
            envs: [dev, example]
            comment: "Per-IP cap on POST /api/auth/password-reset/confirm/."
          TOKEN_REFRESH_THROTTLE_RATE:
            default: 30/min
            envs: [dev, example]
            comment: "Per-IP cap on POST /api/auth/refresh/."
          EMAIL_HOST:
            default: mailpit
            envs: [dev, example]
            comment: "SMTP — leave EMAIL_HOST/USER/PASSWORD blank to fall back to the console email backend"
            example_comment: "SMTP — leave EMAIL_HOST/USER/PASSWORD blank to fall back to the console email backend."
          EMAIL_PORT:
            default: 1025
            envs: [dev, example]
          EMAIL_HOST_USER:
            default: ""
            envs: [dev, example]
          EMAIL_HOST_PASSWORD:
            default: ""
            envs: [dev, example]
          EMAIL_USE_TLS:
            default: "False"
            envs: [dev, example]
          EMAIL_USE_SSL:
            default: "False"
            envs: [dev, example]
          DEFAULT_FROM_EMAIL:
            default: no-reply@epicstaff.local
            envs: [dev, example]
          FRONTEND_BASE_URL:
            default: http://localhost:4200
            envs: [dev, example]
          FRONTEND_PASSWORD_RESET_PATH:
            default: /reset-password
            envs: [dev, example]
          PASSWORD_CHANGE_TICKET_TTL_SECONDS:
            default: 300
            envs: [dev, example]
          AVATAR_MAX_BYTES:
            default: 5242880
            envs: [dev, example]
          AVATAR_ALLOWED_FORMATS:
            default: JPEG,PNG
            envs: [dev, example]
          DJANGO_API_KEY:
            default: es_debug_only_system_key_change_me
            envs: [dev, example]
            comment: "Internal-services system API key (superadmin-equivalent, never expires). Generate a long random string; never share with users."
            example_comment: "Internal-services system API key (superadmin-equivalent, never expires). Generate a long random string; never share with users."
            example:
              value: ""
              comment: "CHANGE ME (any random string)"
          ALLOWED_HOSTS:
            default: "0.0.0.0,127.0.0.1,localhost,django_app"
          GUNICORN_WORKERS:
            default: 1
          GUNICORN_THREADS:
            default: 4
          MEDIA_ROOT:
            default: /app/media
            envs: [dev, example]
          DB_NAME_DJANGO:
            # duplicate DB_NAME entry that appears in the django_app section of .dev.env
            key: DB_NAME
            default: crew
            envs: [dev]
          DJANGO_HOST:
            default: localhost
            envs: [dev, example, debug]
          DJANGO_PORT:
            default: 8000
          LOAD_DEBUG_ENV:
            default: "False"
            debug: "True"
            dev: "True"
          MALLOC_ARENA_MAX:
            default: 2
            envs: [dev, example]
            comment: Memory tuning
          MALLOC_TRIM_INTERVAL_SECONDS:
            default: 60
            envs: [dev, example]

      - comment: Gunicorn
        envs: [dev, example]
        vars:
          GUNICORN_MAX_REQUESTS:
            default: 1000
          GUNICORN_MAX_REQUESTS_JITTER:
            default: 100

      - comment: realtime
        vars:
          DB_REALTIME_USER:
            default: realtime_user_v104
            example: realtime_user
          DB_REALTIME_PASSWORD:
            default: realtime_password_v104
            example:
              value: ""
              comment: "CHANGE ME (postgres role password for realtime service)"
          REALTIME_PORT:
            default: 8050
          DJANGO_AUTH_URL:
            default: http://django_app:8000
            debug: http://127.0.0.1:8000
          DJANGO_API_KEY:
            # In .debug.env DJANGO_API_KEY appears under realtime (not django_app)
            default: es_debug_only_system_key_change_me
            envs: [debug]
          DJANGO_AUTH_TIMEOUT:
            default: 5

      - comment: manager
        vars:
          DB_MANAGER_USER:
            default: manager_user_v104
            example: manager_user
          DB_MANAGER_PASSWORD:
            default: manager_password_v104
            example:
              value: ""
              comment: "CHANGE ME (postgres role password for manager service)"
          CREW_SAVEFILES_PATH:
            default: /c/savefiles
            envs: [dev, debug]
          CREW_SAVEFILES_PATH_EX:
            key: CREW_SAVEFILES_PATH
            default: /c/savefiles
            envs: [example]
            comment: "CREW_SAVEFILES_PATH must be an absolute host path. Linux/macOS: e.g. /home/<you>/savefiles.\n# Windows + Docker Desktop: /c/savefiles. Override per-OS in the install command."
          TIMEZONE:
            default: Europe/Kyiv
            envs: [dev, debug]
            comment: "Timezone for ScheduleTriggerNode (APScheduler). IANA format, e.g. UTC, Europe/Kyiv, America/New_York"
          _SAVEFILES_NOTE:
            raw_line: "# CREW_SAVEFILES_PATH -> For linux use a valid path (ex. /home/folder/project/savefiles)"
            envs: [dev, debug]

      - comment: crew
        vars:
          HAYSTACK_TELEMETRY_ENABLED:
            default: "False"
          ANONYMIZED_TELEMETRY:
            default: "False"
          EC_TELEMETRY:
            default: "False"
          MONITORING_MODE:
            default: local
          DB_CREW_USER:
            default: crew_user_v104
            example: crew_user
          DB_CREW_PASSWORD:
            default: crew_password_v104
            example:
              value: ""
              comment: "CHANGE ME (postgres role password for crew service)"
          MAX_CONCURRENT_SESSIONS:
            default: 25
          REMEMBERED_OUTPUTS_TTL_S:
            default: 3600
            comment: "TTL (seconds) for remembered task outputs during flow run"
          DEFAULT_RAG_SEARCH_TIMEOUT:
            default: 40
            envs: [dev, example]
            comment: "RAG search timeouts (seconds)"
          NAIVE_RAG_SEARCH_TIMEOUT:
            default: 40
            envs: [dev, example]
          GRAPH_RAG_SEARCH_TIMEOUT:
            default: 180
            envs: [dev, example]

      - comment: sandbox
        vars:
          BASE_VENV_PATH:
            default: /app/src/sandbox/venvs/
          OUTPUT_PATH:
            default: /app/src/sandbox/executions/
          MASK_SECRET:
            default: true
            comment: "Replace secret values with [REDACTED] in Python-node output.\n# Set false only to debug locally: plaintext credentials then reach\n# execution results, the SSE stream and the container logs."
          CONTAINER_SAVEFILES_PATH:
            default: /app/src/sandbox/savefiles/
            comment: sandbox volumes
            envs: [dev, debug]
          CONTAINER_SAVEFILES_PATH_EX:
            key: CONTAINER_SAVEFILES_PATH
            default: /app/src/sandbox/savefiles/
            envs: [example]

      - comment: knowledge
        vars:
          DB_KNOWLEDGE_USER:
            default: knowledge_user_v104
            example: knowledge_user
          DB_KNOWLEDGE_PASSWORD:
            default: knowledge_password_v104
            example:
              value: ""
              comment: "CHANGE ME (postgres role password for knowledge service)"

      - comment: webhook
        vars:
          WEBHOOK_HOST_NAME:
            default: '"webhook"'
            debug: '"localhost"'
            example: webhook
          USE_TUNNEL:
            default: '"True"'
            dev: "False"
            example: "False"
          WEBHOOK_TUNNEL:
            default: '"NGROK"'
            dev: ""
            debug: '"ngrok"'
            example: NGROK
          WEBHOOK_PORT:
            default: 8009
          NGROK_AUTHTOKEN:
            default: ""
            envs: [example]
            comment: "Ngrok (only used when USE_TUNNEL=True and WEBHOOK_TUNNEL=NGROK)"
          NGROK_DOMAIN:
            default: ""
            envs: [example]

      - comment: frontend
        vars:
          FRONTEND_PORT:
            default: 4200
          # Must be same-origin with the address the app is opened at, otherwise
          # the HttpOnly SameSite=Lax refresh cookie (set on the API host) is
          # never stored for the page origin and the first token refresh logs the
          # user out. localhost != 127.0.0.1 for cookies; the port is irrelevant.
          # Both go through epicstaff-nginx, so no service port is needed here.
          API_URL:
            default: http://localhost/api/
            debug: http://127.0.0.1:8000/api/
          REALTIME_API_URL:
            default: http://localhost/realtime/
            debug: http://127.0.0.1:8000/realtime/

      - comment: nginx
        vars:
          DOMAIN_NAME:
            default: '"localhost"'
            example: localhost
          SSL_ENABLE:
            default: "#"
            comment: 'SSL_ENABLE=#  <-- for disabling ssl in nginx\n# SSL_ENABLE=  <-- for enabling ssl in nginx'
            example_comment: 'SSL_ENABLE=#  <-- # disables ssl\n# SSL_ENABLE=   <-- empty enables ssl'

      - comment: storage
        envs: [dev, example]
        vars:
          STORAGE_ENDPOINT:
            default: http://minio:9000
          STORAGE_ACCESS_KEY:
            default: minioadmin
          STORAGE_SECRET_KEY:
            default: minioadmin_secret
            example:
              value: ""
              comment: "CHANGE ME (minio secret, ≥8 chars)"
          STORAGE_BUCKET_NAME:
            default: epicstaff
          MINIO_PORT:
            default: 9000
          MINIO_CONSOLE_PORT:
            default: 9001

      - comment: agent
        vars:
          AGENT_PORT:
            default: 8052
          AGENT_DEFAULT_MAX_RETRIES:
            default: 5
          AGENT_DEFAULT_MAX_ITER:
            default: 25
            comment: Max tool-use iterations per run (the agent loop)
          AGENT_SCHEMA_MAX_RETRIES:
            default: 2
            comment: Max re-prompts to make the final answer match output_schema (separate from loop iters)
          AGENT_DROP_UNSUPPORTED_LLM_PARAMS:
            default: "true"
            comment: Drop LLM params a provider doesn't support (e.g. presence/frequency_penalty on Anthropic) instead of erroring
          AGENT_CONTEXT_WARNING_RATIO:
            default: 0.8
            comment: Warn (advisory, in response 'warnings') when input context reaches this fraction of the model's context window; 0 disables
          AGENT_LOG_LEVEL:
            default: DEBUG
            example: INFO

      - comment: Knowledge New
        vars:
          KNOWLEDGE_DATABASE_USER:
            default: knowledge_user
          KNOWLEDGE_DATABASE_PASSWORD:
            default: knowledge_password
            example:
              value: ""
              comment: "CHANGE ME (postgres role password for knowledge service)"
          KNOWLEDGE_SEARCH_REQUEST_CHANNEL:
            default: knowledge:search:request
          KNOWLEDGE_SEARCH_RESPONSE_CHANNEL:
            default: knowledge:search:response
          KNOWLEDGE_PRECHUNK_REQUEST_CHANNEL:
            default: knowledge:chunk:request
          KNOWLEDGE_PRECHUNK_RESPONSE_CHANNEL:
            default: knowledge:chunk:response
          KNOWLEDGE_INDEX_REQUEST_CHANNEL:
            default: knowledge:indexing:request
          KNOWLEDGE_CANCEL_REQUEST_CHANNEL:
            default: knowledge:cancel:request

      - comment: Communication
        vars:
          COMMUNICATION_BROKER_USER:
            default: ""
          COMMUNICATION_BROKER_PASSWORD:
            default: ""
          COMMUNICATION_BROKER_HOST:
            default: communication_redis_broker
          COMMUNICATION_BROKER_PORT:
            default: 6379
          COMMUNICATION_BROKER_NAME:
            default: 0
          COMMUNICATION_STORAGE_USER:
            default: ""
          COMMUNICATION_STORAGE_PASSWORD:
            default: ""
          COMMUNICATION_STORAGE_HOST:
            default: communication_redis_storage
          COMMUNICATION_STORAGE_PORT:
            default: 6379
          COMMUNICATION_STORAGE_NAME:
            default: 0

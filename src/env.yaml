# Source of truth for src/.env and src/.env.example.
# Edit this file. Never edit generated files directly.
# Regenerate:  python scripts/envtool.py

# Docker forwards every var (compose uses ${VAR:?}, which refuses an empty string).

groups:
  deploy:
    vars:
      IMAGE_TAG:
        description:
          "Container image tag for ghcr pulls in non-build deploys. Prod must pin a release tag 
          (webhook enforces it); dev builds locally so latest is fine."
        default: latest
  
  crewdb:
    vars:
      DB_USER:
        description: "Postgres superuser for the shared crewdb instance."
        default:
          dev: root_user
      DB_PASSWORD:
        description: "Password for the crewdb Postgres superuser."
        default:
          dev: root_password
      DB_HOST:
        description: "Hostname of the Postgres container on the backend network."
        default: crewdb
      DB_PORT:
        description: "Postgres TCP port."
        default: 5432
      DB_NAME:
        description: "Default database created on first init."
        default: epicstaff_db
      PGDATA:
        description: "Postgres data directory inside the container (mounted volume)."
        default: "/var/lib/postgresql/data/pgdata"

  redis:
    vars:
      REDIS_USER:
        description: "Redis ACL user used by services to connect."
        default:
          dev: root_user
      REDIS_PASSWORD:
        description: "Password for the Redis user."
        default:
          dev: root_password
      REDIS_HOST:
        description: "Hostname of the Redis container."
        default: redis
      REDIS_PORT:
        description: "Redis TCP port."
        default: 6379

  storage:
    vars:
      STORAGE_USER:
        description: "Object storage (RustFS) root access key."
        default:
          dev: root_user
      STORAGE_PASSWORD:
        description: "Object storage (RustFS) root secret key."
        default:
          dev: root_password
      STORAGE_HOST:
        description: "Hostname of the object storage (RustFS) container."
        default: storage
      STORAGE_SSL:
        description: "Use HTTPS when talking to object storage."
        default: false
      STORAGE_PORT:
        description: "Object storage S3 API port."
        default: 9000
      STORAGE_BUCKET:
        description: "Bucket used for object storage."
        default: epicstaff

  compose:
    vars:
      COMPOSE_PROFILES:
        description:
          "Docker Compose profile activation — keep in sync with DJANGO_DEBUG;
          controls whether dev-only containers (e.g. mailpit) start.
          Comma-separated if multiple profiles are needed (e.g. \"dev,voice\")."
        default:
          prod: "none"
          dev: dev

  django:
    vars:
      DJANGO_HOST:
        description: "Hostname the django_app service binds/announces on."
        default: django
      DJANGO_PORT:
        description: "Port the django_app service listens on."
        default: 8000
      DJANGO_SGI_WORKERS:
        description: "Gunicorn worker processes."
        default: 1
      DJANGO_SGI_THREADS:
        description: "Threads per Gunicorn worker."
        default: 4
      DJANGO_SGI_MAX_REQUESTS:
        description: "Requests a worker handles before it is recycled (memory-leak guard)."
        default: 1000
      DJANGO_SGI_MAX_REQUESTS_JITTER:
        description: "Random spread added to max-requests so workers don't recycle in lockstep."
        default: 100
      DJANGO_LOG_LEVEL:
        description: "Log level for django_app: the stdlib root logger and the app's own loguru logs. BENCH (between DEBUG and INFO) also writes benchmark checkpoint lines; see benchmark/README.md."
        default:
          prod: INFO
          dev: DEBUG
      DJANGO_SECRET_KEY:
        description:
          "Django SECRET_KEY for signing sessions and tokens. Required in prod; rotating it
          invalidates all existing sessions and signed values."
        default:
          dev: akunamatata
      DJANGO_DEBUG:
        description: "Django debug mode. Never enable in production."
        default:
          prod: false
          dev: true
      DJANGO_ALLOWED_HOSTS:
        description: "Comma-separated hostnames Django will serve (Host header allow-list)."
        default: "*"
      DJANGO_TIMEZONE:
        description: "Server timezone (IANA name, e.g. UTC, Europe/Kyiv)."
        default: UTC
      DJANGO_JWT_ACCESS_LIFETIME:
        description: "Access-token lifetime."
        default: 15m
      DJANGO_JWT_REFRESH_LIFETIME:
        description: "Refresh-token lifetime."
        default: 7d
      DJANGO_REFRESH_COOKIE_SECURE:
        description:
          "Send the refresh cookie only over HTTPS (the cookie's Secure attribute). Set true for
           any TLS deployment; set false for plain-HTTP installs (LAN/VPN/no-domain) or the browser
           silently drops the cookie and sessions die. No prod default on purpose, so each
           deployment must choose a value consciously."
        default:
          dev: false
      DJANGO_EMAIL_HOST:
        description:
          "SMTP host. Leave blank together with user/password to fall back to the console email
          backend; self-service password reset is then disabled and operators reset passwords
          with `manage.py reset_password`."
        default:
          prod: "none"
          dev: mailpit
      DJANGO_EMAIL_PORT:
        description: "SMTP port."
        default: 1025
      DJANGO_EMAIL_USER:
        description: "SMTP username; blank means unauthenticated relay."
        default: none
      DJANGO_EMAIL_PASSWORD:
        description: "SMTP password; blank means unauthenticated relay."
        default: none
      DJANGO_EMAIL_USE_TLS:
        description: "Use STARTTLS for SMTP."
        default: true
      DJANGO_EMAIL_USE_SSL:
        description: "Use implicit SSL for SMTP (mutually exclusive with TLS)."
        default: false
      DJANGO_DEFAULT_FROM_EMAIL:
        description: "Default From address for outgoing mail."
        default: no-reply@epicstaff.local
      DJANGO_PASSWORD_RESET_TOKEN_TTL:
        description: "Lifetime of a password-reset token."
        default: 15m
      DJANGO_PASSWORD_CHANGE_TICKET_TTL:
        description: "Lifetime of a password-change ticket."
        default: 5m
      DJANGO_PASSWORD_RESET_REQUEST_THROTTLE_RATE:
        description: "Cap on password-reset requests per IP and email pair."
        default: 5/hour
      DJANGO_PASSWORD_RESET_REQUEST_IP_THROTTLE_RATE:
        description: "Per-IP cap on password-reset requests, whatever the email."
        default: 20/hour
      DJANGO_PASSWORD_RESET_CONFIRM_THROTTLE_RATE:
        description: "Per-IP cap on password-reset confirmations."
        default: 10/hour
      DJANGO_LOGIN_THROTTLE_RATE:
        description: "Cap on login attempts per IP and email pair."
        default: 5/min
      DJANGO_LOGIN_IP_THROTTLE_RATE:
        description: "Per-IP cap on login attempts, whatever the email."
        default: 20/min
      DJANGO_TOKEN_REFRESH_THROTTLE_RATE:
        description: "Per-IP cap on token-refresh calls."
        default: 30/min
      DJANGO_NOTIFY_EMAIL_THROTTLE_RATE:
        description: "Per-user cap on emails sent through the notify endpoint."
        default: 10/hour
      DJANGO_NUM_PROXIES:
        description:
          "Number of trusted proxies in front of Django (the bundled nginx is one). Throttles
          read the client address this many entries from the end of X-Forwarded-For. Too high
          lets callers choose their identity; too low puts every caller in one bucket."
        default: 1
      DJANGO_FIRST_SETUP_MODE:
        description:
          "Who may create the first superadmin. cli_only: only `manage.py create_superadmin`
          (safe for internet-exposed deploys). open: the first-setup HTTP endpoint is enabled
          (local dev only)."
        default:
          prod: cli_only
          dev: open
      DJANGO_FRONTEND_BASE_URL:
        description: "Public base URL of the frontend, used to build links in emails."
        default:
          dev: http://localhost:4200
      DJANGO_FRONTEND_PASSWORD_RESET_PATH:
        description: "Frontend route appended to the base URL for reset links."
        default: "/reset-password"
      DJANGO_CORS_ALLOWED_ORIGINS:
        description:
          "Comma-separated allowlist of browser origins permitted to make credentialed calls to
           the API (django_app/realtime/webhook). Only relevant when the frontend and API are on
           different origins; the default nginx single-origin setup is same-origin and needs no
           entries."
        default:
          dev: http://localhost:4200,https://localhost:4200
      DJANGO_API_KEY:
        description:
          "Internal system API key for service-to-service calls (superadmin-equivalent, never
          expires). Use a long random string; never expose to end users."
        default:
          prod: "none"
          dev: akunamatata
      DJANGO_AVATAR_MAX_SIZE:
        description: "Maximum avatar upload size."
        default: 50mb
      DJANGO_AVATAR_ALLOWED_FORMATS:
        description: "Comma-separated allowed avatar image formats."
        default: JPEG,PNG
      DJANGO_MAX_UPLOAD_FILE_SIZE:
        description: "Knowledge document upload only: max size of one file."
        default: 50mb
      DJANGO_MAX_UPLOAD_TOTAL_SIZE:
        description: "Knowledge document upload only: max total size of one request."
        default: 50mb
      DJANGO_MAX_ARCHIVE_UNCOMPRESSED_SIZE:
        description: "Knowledge document upload only: max unpacked size of a zip-based file such as .docx (zip-bomb guard)."
        default: 50mb
      DJANGO_MAX_ARCHIVE_ENTRIES:
        description: "Max entries allowed when unpacking an uploaded archive (zip-bomb guard)."
        default: 2000
      DJANGO_ORG_STORAGE_QUOTA:
        description: "Storage space per organization."
        default: 50gb
      DJANGO_MAX_STREAM_UPLOAD_FILE_SIZE:
        description: "Max size of one uploaded file (not an archive); none = no cap, only the quota."
        default: 2gb
      DJANGO_MAX_ARCHIVE_FILE_SIZE:
        description: "Max size of an uploaded archive before unpacking; Must not be none: the archive is buffered whole."
        default: 50mb
      DJANGO_UPLOAD_PART_SIZE:
        description: "Chunk size of one S3 part (min 5mb). S3 allows 10000 parts, so 10000 x this must be >= DJANGO_ORG_STORAGE_QUOTA."
        default: 16mb
      DJANGO_UPLOAD_MAX_CONCURRENCY:
        description: "Uploads one Django worker runs at once, all organizations together. RAM ~ this x DJANGO_UPLOAD_PART_SIZE (4 x 16mb = 64mb)."
        default: 4
      DJANGO_UPLOAD_MAX_CONCURRENCY_PER_ORG:
        description: "Uploads one organization may run or queue per worker; more get 429. Keep >= 3 (the UI sends 3 at once) and below DJANGO_UPLOAD_MAX_CONCURRENCY."
        default: 3
      DJANGO_UPLOAD_SLOT_TIMEOUT:
        description: "Max wait for a free upload slot; then 503 with Retry-After."
        default: 30s
      DJANGO_UPLOAD_IDLE_TIMEOUT:
        description: "Abort an upload with 408 if the client sends nothing for this long. Keep below nginx client_body_timeout (150s)."
        default: 120s
      DJANGO_UPLOAD_MAX_DURATION:
        description: "Abort an upload with 408 after this total time. Keep below the storage's 24h cleanup of unfinished uploads."
        default: 5h
      DJANGO_ARCHIVE_UPLOAD_CONCURRENCY:
        description: "Files of one archive sent to S3 in parallel. RAM ~ this x DJANGO_UPLOAD_PART_SIZE (8 x 16mb = 128mb)."
        default: 8
      DJANGO_MALLOC_ARENA_MAX:
        description: "glibc malloc arena cap; limits RSS growth from fragmentation."
        default: 2
      DJANGO_MALLOC_TRIM_INTERVAL:
        description: "How often to return freed heap memory to the OS."
        default: 60s
      DJANGO_GRAPH_MESSAGE_BATCH_SIZE:
        description: "Graph messages read from the crew stream and stored per batch. Each can be ~300 KB and costs ~2 MB of worker RAM while it is parsed and stored, so RAM ~ this x 2 MB."
        default: 50
      DJANGO_API_URL:
        description:
          "Base URL the built-in backend tools (fanout, notification, schedule_manager) use to call
           the Django REST API."
        default: "http://localhost/api/"

  realtime:
    vars:
      REALTIME_HOST:
        description: "Hostname the realtime service binds/announces on."
        default: realtime
      REALTIME_PORT:
        description: "Port the realtime WebSocket service listens on."
        default: 8050
      REALTIME_SGI_WORKERS:
        default: 1
      REALTIME_PERSIST_RAW_AUDIO:
        description:
          "Store raw voice audio in realtime session items (browser chats and Twilio calls). Off by
          default because that table has no retention, is readable with the org's voice permission,
          and gets one row per audio frame (tens per second) when this is on. Browser chats keep no
          other copy of their audio, so turn it on only if you need chat audio."
        default: false
      REALTIME_DB_USER:
        description: "Postgres role for the realtime service."
        default:
          dev: realtime_db_user
      REALTIME_DB_PASSWORD:
        description: "Password for the realtime Postgres role."
        default:
          dev: realtime_db_password
      DJANGO_AUTH_URL:
        description: "Base URL realtime calls to authenticate requests against django_app."
        default:
          dev: "http://django:8000"
      DJANGO_AUTH_TIMEOUT:
        description: "Timeout for the auth call to django_app."
        default: 5s
      REALTIME_LOG_LEVEL:
        description:
          "Loguru log level for the realtime service; uvicorn's own logs are unchanged. Ignored in
          --debug mode, which always logs DEBUG. DEBUG and TRACE print conversation text
          (transcripts, agent replies): never use them on a shared host."
        default: INFO

  manager:
    vars:
      MANAGER_DB_USER:
        description: "Postgres role for the manager service."
        default:
          dev: manager_db_user
      MANAGER_DB_PASSWORD:
        description: "Password for the manager Postgres role."
        default:
          dev: manager_db_password
      MANAGER_LOG_LEVEL:
        description:
          "Loguru log level for the manager service (stdout and logs/file.log); stdlib logging is
          unchanged."
        default: INFO

  sandbox:
    vars:
      SANDBOX_HOST:
        description: "Hostname the sandbox service binds/announces on."
        default: sandbox
      SANDBOX_PORT:
        description: "Port the sandbox service listens on."
        default: 8090
      SANDBOX_LOG_LEVEL:
        description: "Loguru log level for the sandbox service; stdlib logging is unchanged. BENCH (between DEBUG and INFO) also writes benchmark checkpoint lines; see benchmark/README.md."
        default: INFO
      SANDBOX_BASE_VENV_PATH:
        description: "Directory holding per-execution Python virtualenvs."
        default: "/app/src/sandbox/venvs/"
      SANDBOX_OUTPUT_PATH:
        description: "Directory where code-execution outputs are written."
        default: "/app/src/sandbox/executions/"
      SANDBOX_MASK_SECRET:
        description:
          "Replace secret values with [REDACTED] in Python-node output. Disable only for local
          debugging; when off, plaintext credentials reach the results, the SSE stream, and logs."
        default:
          prod: true
          dev: false
      CONTAINER_SAVEFILES_PATH:
        description:
          "Directory inside the sandbox container where agent-saved files are written (bind target). 
          If this directory is not owned by sandboxuser (uid 1000), the sandbox makes sandboxuser 
          its owner at runtime, not recursively; on native Linux Docker this also changes the owner 
          of the host directory. Existing files and subdirectories keep their owner: if user code 
          must write into them, run sudo chown -R 1000 <dir> on the host once."
        default: "/app/src/sandbox/savefiles/"
      CREW_SAVEFILES_PATH:
        description:
          "Absolute HOST path bind-mounted into the sandbox for agent-saved files (Docker creates it
          if missing). Machine-specific override per host."
        default:
          dev: "./savefiles"
      SANDBOX_REQUIRE_ISOLATION:
        description:
          "Enforce the Landlock filesystem jail around every code execution. Set false only to run
          on a kernel without Landlock support during local debugging: executions then run UNCONFINED.
          Never use false with real data."
        default: true
      SANDBOX_REQUIRE_SIGNAL_ISOLATION:
        description:
          "Stop code executions from sending signals (kill, stop, ...) to each other or to the
          sandbox service, and from connecting to each other's abstract UNIX sockets. Needs Landlock
          ABI 6+ / kernel 6.12+; there it is always on and this value is ignored. On older kernels:
          true refuses to run code, false runs it without this protection -- executions can then
          kill each other. Never use false with real data. The dev default is false because
          Docker Desktop's WSL2 kernel (5.15 / 6.6) is older than 6.12 and would refuse every
          Python node."
        default:
          prod: true
          dev: false
      SANDBOX_BLOCK_NETWORK:
        description:
          "Restrict outbound network access for every code execution: blocks all IP sockets, except
          for storage-enabled executions which are instead restricted to the storage port (requires
          Landlock ABI 4+ / kernel 6.7+; executions refuse to run without it). False leaves internet
          access open; private addresses are governed by SANDBOX_BLOCK_PRIVATE_NETWORK."
        default: false
      SANDBOX_BLOCK_PRIVATE_NETWORK:
        description:
          "Block code executions from reaching private, link-local and host addresses (the Docker
          host, the LAN, cloud metadata, other containers) while leaving the internet open. Set false
          only where node code must call internal APIs on private addresses, or on a runtime without
          iptables / CAP_NET_ADMIN (otherwise executions are refused) -- never on a shared instance."
        default: true
      SANDBOX_EXECUTION_TIMEOUT:
        description:
          "Maximum time a single python code execution may run before it is killed. Protects against
           user code that hangs or loops forever."
        default: 5m

  webhook:
    vars:
      WEBHOOK_HOST:
        description: "Hostname the webhook service binds/announces on."
        default: webhook
      WEBHOOK_PORT:
        description: "Port the webhook service listens on."
        default: 8009
      WEBHOOK_TUNNEL:
        description: "Tunnel provider used to expose webhooks publicly."
        default: ngrok
      WEBHOOK_USE_TUNNEL:
        description: "Whether to open a public tunnel for incoming webhooks."
        default: false
      WEBHOOK_NGROK_DOMAIN:
        description: "Reserved ngrok domain (used when the tunnel is ngrok)."
        default: none
      WEBHOOK_NGROK_AUTHTOKEN:
        description: "ngrok auth token (used when the tunnel is ngrok)."
        default: none
      WEBHOOK_EMPTY_JSON_PATHS:
        default: none
      WEBHOOK_LOG_LEVEL:
        description: "Root log level for the webhook service."
        default:
          prod: INFO
          dev: DEBUG

  frontend:
    vars:
      FRONTEND_HOST:
        description: "Hostname of the frontend container nginx proxies to (Docker service name)."
        default: frontend
      FRONTEND_PORT:
        description: "Port the frontend container listens on (nginx upstream target for the SPA)."
        default: 80
      API_URL:
        description:
          "Base path the frontend calls for the REST API. Relative on purpose: it inherits
           the page's scheme and host, so it stays same-origin under both http and https."
        default: "/api/"
      REALTIME_API_URL:
        description:
          "Base path the frontend calls for the realtime API. Relative on purpose: inherits the
           page's scheme and host."
        default: "/realtime/"
      AUDITOR_API_URL:
        description:
          "Base path the frontend calls for the auditor API (nginx strips the /auditor/ prefix).
           Relative on purpose: inherits the page's scheme and host."
        default: "/auditor/"

  nginx:
    vars:
      NGINX_SERVER_NAME:
        description: "Public domain nginx serves; also used for SSL certs."
        default: localhost
      NGINX_SSL_MODE:
        description:
          "SSL mode: `on` includes the HTTPS server block (ssl-on.snippet) and required generating
           certificates, `off` serves plain HTTP on :80 (ssl-off.snippet). 
           Keep the values quoted so YAML does not parse them as booleans."
        default:
          prod: "on"
          dev: "off"

  agent:
    vars:
      AGENT_HOST:
        description: "Hostname the agent service binds/announces on."
        default: agent
      AGENT_PORT:
        description: "Port the agent service listens on."
        default: 8052

      AGENT_LOG_LEVEL:
        description: "Log level for the agent service. BENCH (between DEBUG and INFO) also writes benchmark checkpoint lines; see benchmark/README.md."
        default:
          prod: INFO
          dev: DEBUG

      AGENT_REQUEST_STREAM:
        description: "Redis stream the agent consumes execution requests from."
        default: "agent.requests"
      AGENT_RESULT_STREAM:
        description:
          "Prefix of the per-run Redis result streams: each agent run publishes to and crew reads
          from `<prefix>:<correlation_id>`."
        default: "agent.results"
      AGENT_RESULT_STREAM_TTL:
        description:
          "Expiry the agent sets on a per-run result stream at every publish. Crew deletes the
          stream when it stops waiting; the TTL only cleans up streams crew never deleted."
        default: 1h
      AGENT_CONSUMER_GROUP:
        description: "Redis consumer group name for agent workers."
        default: agent-executors
      AGENT_MAX_CONCURRENT_RUNS:
        description:
          "Max agent/task runs one agent replica executes at the same time (at least 1). Requests
          beyond this stay in the stream for other replicas."
        default: 10

      AGENT_DEFAULT_MAX_RETRIES:
        description: "Default retries for a failed agent step."
        default: 5
      AGENT_DEFAULT_MAX_ITER:
        description: "Max tool-use iterations per run (the agent loop)."
        default: 25
      AGENT_SCHEMA_MAX_RETRIES:
        description:
          "Max re-prompts to make the final answer match output_schema (separate from loop iters)."
        default: 2
      AGENT_DROP_UNSUPPORTED_LLM_PARAMS:
        description:
          "Drop LLM params a provider doesn't support (e.g. presence/frequency_penalty on
          Anthropic) instead of erroring."
        default: true
      AGENT_CONTEXT_WARNING_RATIO:
        description:
          "Warn (advisory, in response 'warnings') when input context reaches this fraction of the
          model's context window; 0 disables."
        default: 0.8
      AGENT_RESULT_TIMEOUT:
        default: 10s

  crew:
    vars:
      CREW_HOST:
        description: "Hostname the crew service binds/announces on."
        default: crew
      CREW_PORT:
        description: "Port the crew service listens on."
        default:
      CREW_LOG_LEVEL:
        description: "Loguru log level for the crew service; stdlib logging is unchanged. BENCH (between DEBUG and INFO) also writes benchmark checkpoint lines; see benchmark/README.md."
        default: INFO
      CREW_MAX_CONCURRENT_SESSIONS:
        description: "Max flow sessions running concurrently in crew."
        default: 25
      CREW_REMEMBERED_OUTPUTS_TTL:
        description: "TTL for remembered task outputs during a flow run."
        default: 1h
      DEFAULT_RAG_SEARCH_TIMEOUT:
        description: "Fallback timeout for a RAG search."
        default: 30s
      NAIVE_RAG_SEARCH_TIMEOUT:
        description: "Timeout for a naive-RAG search."
        default: 40s
      GRAPH_RAG_SEARCH_TIMEOUT:
        description: "Timeout for a GraphRAG search (slower by design)."
        default: 3m
      CREW_LLM_HEADERS:
        default: "none"
      CREW_TOKEN_BUDGET:
        default: "0"
      CREW_KEY_VALUE_TIMEOUT:
        description: "Timeout for a Key-Value node's call to Django's internal key-value route."
        default: 10s
      CREW_GRAPH_MESSAGE_STREAM_MAXLEN:
        description: "Approximate cap on the graph message stream django_app stores from. Only reached when django_app falls behind; past it the oldest unstored messages are dropped. Redis RAM up to ~ this x 300 KB."
        default: 2000

  auditor:
    vars:
      AUDITOR_DEBUG:
        description: "Enables auditor's OpenAPI docs (/docs, /redoc, /openapi.json). Never enable in production."
        default:
          prod: false
          dev: true
      AUDIT_TRAIL_ENABLED:
        description:
          "Master switch for the audit trail. When false django_app and crew drop audit events
          instead of shipping them, and the auditor stack need not run."
        default: false
      AUDITOR_HOST:
        description: "Hostname of the auditor container nginx proxies /auditor/ to (Docker service name)."
        default: auditor
      AUDITOR_PORT:
        description: "Port the auditor service listens on (internal Docker network only, not published to the host)."
        default: 8060
      AUDITOR_URL:
        description: "Base URL django_app and crew ship audit events to."
        default: "http://auditor:8060"
      AUDITOR_LOG_LEVEL:
        description: "Root log level for the auditor service."
        default:
          prod: INFO
          dev: DEBUG
      AUDITOR_INGEST_API_KEY:
        description:
          "Shared secret authenticating django_app/crew against the auditor ingest endpoint.
          Anyone holding it can forge audit records."
        default:
          dev: dev-auditor-ingest-key
      AUDIT_JWT_SECRET:
        description:
          "Signing key for the short-lived audit tokens django_app mints and the auditor verifies
          locally. Separate from DJANGO_SECRET_KEY so the auditor never holds Django's session key."
        default:
          dev: example-jwt-secret-change-me
      AUDIT_TOKEN_TTL_SECONDS:
        description: "Lifetime in seconds of an audit token issued by POST /api/audit/token/."
        default: 300
      AUDIT_STORAGE_BACKEND:
        description: "Storage engine behind the auditor. Only opensearch is implemented."
        default: opensearch
      AUDITOR_REDIS_DB:
        description:
          "Logical Redis DB for export-job tracking, kept off DB 0 so it never mixes with the
          primary session pub/sub traffic. Shared with manager's sweep."
        default: 1
      AUDITOR_EXPORT_DATA_DIR:
        description:
          "Directory on the auditor_data volume where export files land. Must match the mount
          path in both auditor and manager."
        default: /app/export_data
      AUDITOR_EXPORT_FILE_TTL_SECONDS:
        description: "How long an export file and its job record survive before manager's sweep deletes them."
        default: 86400
      AUDITOR_EXPORT_SWEEP_INTERVAL_SECONDS:
        description: "How often manager's ExportCleanupService looks for expired export jobs."
        default: 60
      AUDITOR_EXPORT_MAX_ROWS:
        description: "Maximum cap of rows to export."
        default: 100000

  opensearch:
    vars:
      OPENSEARCH_HOST:
        description: "Hostname of the OpenSearch container."
        default: opensearch
      OPENSEARCH_PORT:
        description: "OpenSearch HTTP port."
        default: 9200
      OPENSEARCH_USER:
        description: "OpenSearch admin user the auditor connects as."
        default: admin
      OPENSEARCH_PASSWORD:
        description:
          "OpenSearch admin password. Must satisfy OpenSearch's strength policy (upper, lower,
          digit, special, 8+ chars); avoid a literal $ since compose expands it."
        default:
          dev: "opensearch_PASSWORD67"
      OPENSEARCH_JAVA_OPTS:
        description: "JVM heap settings for the OpenSearch container."
        default: "-Xms1g -Xmx1g"

  communication:
    vars:
      CODE_EXEC_CHANNEL:
        default: code_exec_tasks
      CODE_RESULT_CHANNEL:
        default: code_results
      SESSION_EVENT_UPDATE_CHANNEL:
        default: session:event:update
      SESSION_EVENT_CHANNEL:
        default: session:event
      SESSION_SCHEMA_CHANNEL:
        default: sessions:schema
      SCHEDULE_CHANNEL:
        default: schedule_channel
      STOP_SESSION_CHANNEL:
        default: sessions:stop
      KNOWLEDGE_INDEXING_CHANNEL:
        default: knowledge:indexing
      KNOWLEDGE_DOCUMENT_CHUNK_REQUEST_CHANNEL:
        default: knowledge:chunk
      KNOWLEDGE_DOCUMENT_CHUNK_RESPONSE_CHANNEL:
        default: knowledge:chunk:response
      KNOWLEDGE_SEARCH_REQUEST_CHANNEL:
        default: knowledge:search:get
      KNOWLEDGE_SEARCH_RESPONSE_CHANNEL:
        default: knowledge:search:response
      WEBHOOK_MESSAGE_CHANNEL:
        default: webhooks
      REQUEST_WEBHOOK_UPDATE_CHANNEL:
        default: REQUEST_WEBHOOK_UPDATE_CHANNEL
      STORAGE_MUTATION_CHANNEL:
        default: storage_mutations
      SESSION_TIMEOUT_CHANNEL:
        description: "Read by crew & manager; no producer found in repo (may be dead code)."

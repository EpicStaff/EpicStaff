        default: epicstaff-knowledge
      KNOWLEDGE_CUSTOM_EMBED_BASE_URL:
        description:
          "Overrides the endpoint of every naive-RAG embedding request, ignoring the per-model
          base_url. OpenAI-style base without the /embeddings suffix, which litellm appends
          itself: http://localhost:8080/v1. Leave at none unless you have such a gateway."
        default: none
      KNOWLEDGE_EMBEDDING_HEADERS:
        description:
          "JSON object of extra HTTP headers sent with every naive-RAG embedding request,

# Source of truth for src/.dev.env, src/.debug.env, src/.env.example.
# Edit this file — never edit generated files directly.
# Regenerate:  python scripts/envtool.py

groups:
  crewdb:
    vars:
      DB_USER:
        description: "Postgres superuser for the shared crewdb instance."
        default:
          dev: root_user
      DB_PASSWORD:
        description: "Password for the crewdb Postgres superuser."
        default:
          dev: root_password
      DB_HOST:
        description: "Hostname of the Postgres container on the backend network."
        default: crewdb
      DB_PORT:
        description: "Postgres TCP port."
        default: 5432
      DB_NAME:
        description: "Default database created on first init."
        default: epicstaff_db
      PGDATA:
        description: "Postgres data directory inside the container (mounted volume)."
        default: "/var/lib/postgresql/data/pgdata"

  redis:
    vars:
      REDIS_USER:
        description: "Redis ACL user used by services to connect."
        default:
          dev: root_user
      REDIS_PASSWORD:
        description: "Password for the Redis user."
        default:
          dev: root_password
      REDIS_HOST:
        description: "Hostname of the Redis container."
        default: redis
      REDIS_PORT:
        description: "Redis TCP port."
        default: 6379

  minio:
    vars:
      MINIO_USER:
        description: "MinIO root access key."
        default:
          dev: root_user
      MINIO_PASSWORD:
        description: "MinIO root secret key."
        default:
          dev: root_password
      MINIO_HOST:
        description: "Hostname of the MinIO container."
        default: minio
      MINIO_SSL:
        description: "Use HTTPS when talking to MinIO."
        default: false
      MINIO_PORT:
        description: "MinIO S3 API port."
        default: 9000
      MINIO_CONSOLE_PORT:
        description: "MinIO web console port."
        default: 9001
      MINIO_BUCKET:
        description: "Bucket used for object storage."
        default: epicstaff

  django:
    vars:
      DJANGO_HOST:
        description: "Hostname the django_app service binds/announces on."
        default: django
      DJANGO_PORT:
        description: "Port the django_app service listens on."
        default: 8000
      DJANGO_SGI_WORKERS:
        description: "Gunicorn worker processes."
        default: 1
      DJANGO_SGI_THREADS:
        description: "Threads per Gunicorn worker."
        default: 4
      DJANGO_SGI_MAX_REQUESTS:
        description: "Requests a worker handles before it is recycled (memory-leak guard)."
        default: 1000
      DJANGO_SGI_MAX_REQUESTS_JITTER:
        description: "Random spread added to max-requests so workers don't recycle in lockstep."
        default: 100
      DJANGO_LOG_LEVEL:
        description: "Root log level for django_app."
        default:
          prod: INFO
          dev: DEBUG
      DJANGO_SECRET_KEY:
        description:
          "Django SECRET_KEY for signing sessions and tokens. Required in prod; rotating it
          invalidates all existing sessions and signed values."
        default:
          dev: akunamatata
      DJANGO_DEBUG:
        description: "Django debug mode. Never enable in production."
        default:
          prod: false
          dev: true
      DJANGO_ALLOWED_HOSTS:
        description: "Comma-separated hostnames Django will serve (Host header allow-list)."
        default: "*"
      DJANGO_TIMEZONE:
        description: "Server timezone (IANA name, e.g. UTC, Europe/Kyiv)."
        default: UTC
      DJANGO_JWT_ACCESS_LIFETIME:
        description: "Access-token lifetime."
        default: 15m
      DJANGO_JWT_REFRESH_LIFETIME:
        description: "Refresh-token lifetime."
        default: 7d
      DJANGO_EMAIL_HOST:
        description:
          "SMTP host. Leave blank together with user/password to fall back to the console email
          backend (reset links printed to stdout)."
        default: "none"
      DJANGO_EMAIL_PORT:
        description: "SMTP port."
        default: 1025
      DJANGO_EMAIL_USER:
        description: "SMTP username; blank means unauthenticated relay."
        default: "none"
      DJANGO_EMAIL_PASSWORD:
        description: "SMTP password; blank means unauthenticated relay."
        default: "none"
      DJANGO_EMAIL_USE_TLS:
        description: "Use STARTTLS for SMTP."
        default: true
      DJANGO_EMAIL_USE_SSL:
        description: "Use implicit SSL for SMTP (mutually exclusive with TLS)."
        default: false
      DJANGO_DEFAULT_FROM_EMAIL:
        description: "Default From address for outgoing mail."
        default: no-reply@epicstaff.local
      DJANGO_PASSWORD_RESET_TOKEN_TTL:
        description: "Lifetime of a password-reset token."
        default: 15m
      DJANGO_PASSWORD_CHANGE_TICKET_TTL:
        description: "Lifetime of a password-change ticket."
        default: 5m
      DJANGO_PASSWORD_RESET_REQUEST_THROTTLE_RATE:
        description: "Per-IP cap on password-reset requests."
        default: 5/hour
      DJANGO_PASSWORD_RESET_CONFIRM_THROTTLE_RATE:
        description: "Per-IP cap on password-reset confirmations."
        default: 10/hour
      DJANGO_LOGIN_THROTTLE_RATE:
        description: "Per-IP cap on login attempts."
        default: 5/min
      DJANGO_TOKEN_REFRESH_THROTTLE_RATE:
        description: "Per-IP cap on token-refresh calls."
        default: 30/min
      DJANGO_NOTIFY_EMAIL_THROTTLE_RATE:
        default: 10/hour
      DJANGO_FIRST_SETUP_MODE:
        description:
          "Who may create the first superadmin. cli_only: only `manage.py create_superadmin`
          (safe for internet-exposed deploys). open: the first-setup HTTP endpoint is enabled
          (local dev only)."
        default:
          prod: cli_only
          dev: open
      DJANGO_FRONTEND_BASE_URL:
        description: "Public base URL of the frontend, used to build links in emails."
        default:
          dev: http://localhost:4200
      DJANGO_FRONTEND_PASSWORD_RESET_PATH:
        description: "Frontend route appended to the base URL for reset links."
        default: "/reset-password"
      DJANGO_CORS_ALLOWED_ORIGINS:
        description: "Comma-separated trusted origins for CORS (django_app/realtime/webhook)."
        default:
          dev: http://localhost:4200
      DJANGO_API_KEY:
        description:
          "Internal system API key for service-to-service calls (superadmin-equivalent, never
          expires). Use a long random string; never expose to end users."
        default: "none"
      DJANGO_AVATAR_MAX_SIZE:
        description: "Maximum avatar upload size."
        default: 50mb
      DJANGO_AVATAR_ALLOWED_FORMATS:
        description: "Comma-separated allowed avatar image formats."
        default: JPEG,PNG
      DJANGO_MAX_UPLOAD_FILE_SIZE:
        description: "Maximum size of a single uploaded file."
        default: 50mb
      DJANGO_MAX_UPLOAD_TOTAL_SIZE:
        description: "Maximum total size of one upload request."
        default: 50mb
      DJANGO_MAX_ARCHIVE_ENTRIES:
        description: "Max entries allowed when unpacking an uploaded archive (zip-bomb guard)."
        default: 2000
      DJANGO_MAX_ARCHIVE_UNCOMPRESSED_SIZE:
        description: "Max total uncompressed size when unpacking an archive (zip-bomb guard)."
        default: 256mb
      DJANGO_MALLOC_ARENA_MAX:
        description: "glibc malloc arena cap; limits RSS growth from fragmentation."
        default: 2
      DJANGO_MALLOC_TRIM_INTERVAL:
        description: "How often to return freed heap memory to the OS."
        default: 60s
      DJANGO_API_URL:
        default: "http://localhost/api/"

  realtime:
    vars:
      REALTIME_HOST:
        description: "Hostname the realtime service binds/announces on."
        default: realtime
      REALTIME_PORT:
        description: "Port the realtime WebSocket service listens on."
        default: 8050
      REALTIME_SGI_WORKERS:
        default: 1
      REALTIME_DB_USER:
        description: "Postgres role for the realtime service."
        default:
          dev: realtime_db_user
      REALTIME_DB_PASSWORD:
        description: "Password for the realtime Postgres role."
        default:
          dev: realtime_db_password
      DJANGO_AUTH_URL:
        description: "Base URL realtime calls to authenticate requests against django_app."
        default: "none"
      DJANGO_AUTH_TIMEOUT:
        description: "Timeout for the auth call to django_app."
        default: 5s
      TWILIO_ACCOUNT_SID:
        description: "Twilio account SID for voice calls; blank disables Twilio."
        default: "none"
      TWILIO_AUTH_TOKEN:
        description: "Twilio auth token; blank disables Twilio."
        default: "none"
      TWILIO_VOICE_AGENT_ID:
        description: "Default voice-agent identifier."
        default: "none"
      TWILIO_VOICE_STREAM_URL:
        description: "Public URL Twilio streams audio to."
        default: "none"

  manager:
    vars:
      MANAGER_DB_USER:
        description: "Postgres role for the manager service."
        default:
          dev: manager_db_user
      MANAGER_DB_PASSWORD:
        description: "Password for the manager Postgres role."
        default:
          dev: manager_db_password

  sandbox:
    vars:
      SANDBOX_HOST:
        description: "Hostname the sandbox service binds/announces on."
        default: sandbox
      SANDBOX_PORT:
        description: "Port the sandbox service listens on."
        default: 8090
      SANDBOX_BASE_VENV_PATH:
        description: "Directory holding per-execution Python virtualenvs."
        default: "/app/src/sandbox/venvs/"
      SANDBOX_OUTPUT_PATH:
        description: "Directory where code-execution outputs are written."
        default: "/app/src/sandbox/executions/"
      SANDBOX_MASK_SECRET:
        description:
          "Replace secret values with [REDACTED] in Python-node output. Disable only for local
          debugging — plaintext credentials then reach results, the SSE stream and logs."
        default:
          prod: true
          dev: false
      CONTAINER_SAVEFILES_PATH:
        description: "Directory inside the sandbox container where agent-saved files are written (bind target)."
        default: "/app/src/sandbox/savefiles/"
      CREW_SAVEFILES_PATH:
        description:
          "Absolute HOST path bind-mounted into the sandbox for agent-saved files (Docker creates it
          if missing). Machine-specific — override per host."
        default:
          dev: "./savefiles"

  webhook:
    vars:
      WEBHOOK_HOST:
        description: "Hostname the webhook service binds/announces on."
        default: webhook
      WEBHOOK_PORT:
        description: "Port the webhook service listens on."
        default: 8009
      WEBHOOK_TUNNEL:
        description: "Tunnel provider used to expose webhooks publicly."
        default: ngrok
      WEBHOOK_USE_TUNNEL:
        description: "Whether to open a public tunnel for incoming webhooks."
        default: false
      WEBHOOK_NGROK_DOMAIN:
        description: "Reserved ngrok domain (used when the tunnel is ngrok)."
        default: "none"
      WEBHOOK_NGROK_AUTHTOKEN:
        description: "ngrok auth token (used when the tunnel is ngrok)."
        default: "none"
      WEBHOOK_EMPTY_JSON_PATHS:
        default: "none"
      WEBHOOK_LOG_LEVEL:
        description: "Root log level for the webhook service."
        default:
          prod: INFO
          dev: DEBUG

  frontend:
    vars:
      FRONTEND_HOST:
        description: "Hostname the frontend is served on."
        default: localhost
      FRONTEND_PORT:
        description: "Port the frontend dev server / container listens on."
        default: 4200
      API_URL:
        description: "Base URL the frontend calls for the REST API (through nginx)."
        default: "http://localhost/api/"
      REALTIME_API_URL:
        description: "Base URL the frontend calls for the realtime API (through nginx)."
        default: "http://localhost/realtime/"

  nginx:
    vars:
      NGINX_DOMAIN_NAME:
        description: "Public domain nginx serves; also used for SSL certs."
        default: localhost
      NGINX_SSL_ENABLE:
        description:
          "SSL toggle via comment hack: `#` disables the SSL server block, empty enables it."
        default: "#"
      FRONTEND_INTERNAL_PORT:
        description: "Upstream port nginx proxies the frontend on (frontend container listens on 80)."
        default: 80

  agent:
    vars:
      AGENT_HOST:
        description: "Hostname the agent service binds/announces on."
        default: agent
      AGENT_PORT:
        description: "Port the agent service listens on."
        default: 8052

      AGENT_LOG_LEVEL:
        description: "Log level for the agent service."
        default:
          prod: INFO
          dev: DEBUG

      AGENT_REQUEST_STREAM:
        description: "Redis stream the agent consumes execution requests from."
        default: "agent.requests"
      AGENT_RESULT_STREAM:
        description: "Redis stream the agent publishes results to."
        default: "agent.result"
      AGENT_CONSUMER_GROUP:
        description: "Redis consumer group name for agent workers."
        default: agent-executors

      AGENT_DEFAULT_MAX_RETRIES:
        description: "Default retries for a failed agent step."
        default: 5
      AGENT_DEFAULT_MAX_ITER:
        description: "Max tool-use iterations per run (the agent loop)."
        default: 25
      AGENT_SCHEMA_MAX_RETRIES:
        description:
          "Max re-prompts to make the final answer match output_schema (separate from loop iters)."
        default: 2
      AGENT_DROP_UNSUPPORTED_LLM_PARAMS:
        description:
          "Drop LLM params a provider doesn't support (e.g. presence/frequency_penalty on
          Anthropic) instead of erroring."
        default: true
      AGENT_CONTEXT_WARNING_RATIO:
        description:
          "Warn (advisory, in response 'warnings') when input context reaches this fraction of the
          model's context window; 0 disables."
        default: 0.8
      AGENT_RESULT_TIMEOUT:
        default: 10s

  knowledge:
    vars:
      KNOWLEDGE_HOST:
        description: "Hostname the knowledge service binds/announces on."
        default: knowledge
      KNOWLEDGE_PORT:
        description: "Port the knowledge service listens on."
        default: 8100
      KNOWLEDGE_DB_USER:
        description: "Postgres role for the knowledge service (pgvector store)."
        default:
          dev: knowledge_db_user
      KNOWLEDGE_DB_PASSWORD:
        description: "Password for the knowledge Postgres role."
        default:
          dev: knowledge_db_password
      KNOWLEDGE_MAX_EXTRACTION_INPUT_SIZE:
        description: "Max size of a single document accepted for text extraction."
        default: 50mb
      KNOWLEDGE_MAX_EXTRACTION_UNPACKED_SIZE:
        description: "Max total uncompressed size when extracting an archive."
        default: 256mb
      KNOWLEDGE_MAX_EXTRACTION_CONTENT_SIZE:
        description:
          "Max decoded content one document may yield. PDFs declare no unpacked size, so streams
          are inflated up to this cap before layout."
        default: 4mb
      KNOWLEDGE_MAX_EXTRACTION_HTML_SIZE:
        description: "Largest HTML file that may be parsed."
        default: 2mb
      KNOWLEDGE_MAX_EXTRACTION_PAGES:
        description: "Max pages processed per document."
        default: 2000
      KNOWLEDGE_GRAPH_DATA_DIR:
        description: "Directory holding GraphRAG index data (mounted volume)."
        default: "/home/user/root/app/graph_data"
      KNOWLEDGE_EMBEDDING_HEADERS:
        description: "Extra HTTP headers sent to the embedding provider (JSON); blank for none."
        default: "none"

  crew:
    vars:
      CREW_HOST:
        description: "Hostname the crew service binds/announces on."
        default: crew
      CREW_PORT:
        description: "Port the crew service listens on."
        default:
      CREW_DB_USER:
        description: "Postgres role for the crew service."
        default:
          dev: crew_db_user
      CREW_DB_PASSWORD:
        description: "Password for the crew Postgres role."
        default:
          dev: crew_db_password
      CREW_MAX_CONCURRENT_SESSIONS:
        description: "Max flow sessions running concurrently in crew."
        default: 25
      CREW_REMEMBERED_OUTPUTS_TTL:
        description: "TTL for remembered task outputs during a flow run."
        default: 1h
      DEFAULT_RAG_SEARCH_TIMEOUT:
        description: "Fallback timeout for a RAG search."
        default: 30s
      NAIVE_RAG_SEARCH_TIMEOUT:
        description: "Timeout for a naive-RAG search."
        default: 40s
      GRAPH_RAG_SEARCH_TIMEOUT:
        description: "Timeout for a GraphRAG search (slower by design)."
        default: 3m
      CREW_LLM_HEADERS:
        default: "none"
      TOKEN_BUDGET:
        description: "crew DEFAULT_TOKEN_BUDGET; 0 disables (→ None in code)."
        default: 0

  communication:
    vars:
      CODE_EXEC_CHANNEL:
        default: code_exec_tasks
      CODE_RESULT_CHANNEL:
        default: code_results
      SESSION_EVENT_UPDATE_CHANNEL:
        default: session:event:update
      SESSION_EVENT_CHANNEL:
        default: session:event
      SESSION_STATUS_CHANNEL:
        default: sessions:session_status
      SESSION_SCHEMA_CHANNEL:
        default: sessions:schema
      SCHEDULE_CHANNEL:
        default: schedule_channel
      STOP_SESSION_CHANNEL:
        default: sessions:stop
      KNOWLEDGE_INDEXING_CHANNEL:
        default: knowledge:indexing
      KNOWLEDGE_DOCUMENT_CHUNK_REQUEST_CHANNEL:
        default: knowledge:chunk
      KNOWLEDGE_DOCUMENT_CHUNK_RESPONSE_CHANNEL:
        default: knowledge:chunk:response
      KNOWLEDGE_SEARCH_REQUEST_CHANNEL:
        default: "knowledge:search:get"
      KNOWLEDGE_SEARCH_RESPONSE_CHANNEL:
        default: "knowledge:search:response"
      GRAPH_MESSAGES_CHANNEL:
        default: graph:messages
      GRAPH_MESSAGE_UPDATE_CHANNEL:
        default: graph:message:update
      WEBHOOK_MESSAGE_CHANNEL:
        default: webhooks
      REQUEST_WEBHOOK_UPDATE_CHANNEL:
        default: REQUEST_WEBHOOK_UPDATE_CHANNEL
      STORAGE_MUTATION_CHANNEL:
        default: storage_mutations
      MEMORY_UPDATE_CHANNEL:
        default: memory:update
      SESSION_TIMEOUT_CHANNEL:
        description: "REVIEW — read by crew & manager; no producer found in repo (may be dead code)."
        default: "sessions:timeout"
      CREWAI_OUTPUT_CHANNEL:
        description: "REVIEW — read by crew; no producer found in repo (may be dead code)."
        default: "crewai:output"
      REALTIME_AGENTS_SCHEMA_CHANNEL:
        description: "REVIEW — read by realtime; verify producer/contract."
        default: "realtime_agents:schema"
      KNOWLEDGE_SOURCES_CHANNEL:
        description: "REVIEW — read by knowledge; verify producer/contract."
        default: knowledge_sources

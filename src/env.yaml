    vars:
      KNOWLEDGE_DB_USER:
        description: "Postgres role for the knowledge service (pgvector store)."
        default:
          dev: knowledge_db_user
      KNOWLEDGE_DB_PASSWORD:
        description: "Password for the knowledge Postgres role."
        default:
          dev: knowledge_db_password
      KNOWLEDGE_HOST:
        description: "Hostname other services dial the knowledge service on."
        default: knowledge_new
      KNOWLEDGE_PORT:
        description: "Port the knowledge service listens on."
        default: 8100
      KNOWLEDGE_DEBUG:
        default:
          prod: false
          dev: true
      KNOWLEDGE_LOG_LEVEL:
        description: "Loguru log level for the knowledge service; uvicorn's own logs are unchanged."

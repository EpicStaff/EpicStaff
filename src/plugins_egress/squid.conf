# plugins_egress: the only way out for plugin backends. Each plugin authenticates as itself and
# may open CONNECT tunnels to port 443 of the hosts on its own list, never to a private address.
# The plugin node writes both policy files into /etc/squid/policy (read-only here); a change
# applies within about 30 s, without a restart. Nothing is cached and no tunnel is decrypted.

http_port 3128
visible_hostname plugins-egress
httpd_suppress_version_string on
pid_filename /run/squid/squid.pid
max_filedescriptors 4096
# A stop or restart does not wait for open tunnels to drain.
shutdown_lifetime 1 seconds

cache deny all
cache_mem 8 MB
memory_pools off

# The four refusal pages of this file, and Squid's own pages for every other answer.
error_directory /etc/squid/errors

# The user is the plugin's identifier; no header is ever logged. A debug level above ALL,1 can
# print request headers, the proxy credentials among them.
logformat plugin %ts.%03tu %6tr %>a user=%un %Ss/%03>Hs %rm %ru server=%<a:%<p err=%err_code/%err_detail
access_log stdio:/dev/stdout plugin
cache_log stdio:/dev/stderr
strip_query_terms on
debug_options ALL,1

# One user per plugin, checked against the bcrypt hashes the node writes. A removed password
# stops working when Squid's cached check of it expires: 30 s here, two hours by default.
# Without casesensitive, Squid would lower-case the user names.
# Every wrong password costs a hash check, so a plugin can flood them: 16 checkers share the
# load, and when their queue has stayed over 32 for 3 minutes, Squid answers further checks
# with ERR (407) at once instead of exiting, which is its default.
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/policy/passwords
auth_param basic children 16 startup=4 idle=2 queue-size=32 on-persistent-overload=ERR
auth_param basic realm plugins-egress
auth_param basic credentialsttl 30 seconds
auth_param basic casesensitive on

# Is the CONNECT host on this plugin's list? Both answers are cached for 30 s. With more than 16
# lookups queued, Squid refuses the request at once without asking the helper or looking up the
# name; the answer is 407, as for wrong credentials, because the lookup names the user. There is
# no overload action to set here, and none that stops Squid.
external_acl_type plugin_hosts ttl=30 negative_ttl=30 children-max=4 children-startup=1 children-idle=1 queue-size=16 %ul %DST /usr/local/bin/plugin_host_acl /etc/squid/policy/hosts.json

acl CONNECT method CONNECT
acl SSL_ports port 443
acl authenticated proxy_auth REQUIRED
acl plugin_hosts external plugin_hosts
# A deny line whose last ACL depends on authentication answers 407, which clients read as wrong
# credentials. Ending the host line with this one makes its refusal a 403 with its own page.
acl reason_host_not_allowed src all
# The same file the entrypoint's firewall reads, so the two cannot drift apart.
acl to_private dst "/etc/squid/private_ranges.txt"

deny_info ERR_ONLY_CONNECT CONNECT
deny_info ERR_PORT_NOT_ALLOWED SSL_ports
deny_info ERR_HOST_NOT_ALLOWED reason_host_not_allowed
deny_info ERR_PRIVATE_DST to_private

# The host list comes before the private-address check, so Squid never resolves a name the plugin
# may not reach, and the address check is the last step before the connection. Squid resolves
# the name again to connect; the entrypoint's firewall refuses a private address at that point.
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny !authenticated
http_access deny !plugin_hosts reason_host_not_allowed
http_access deny to_private
http_access allow plugin_hosts
http_access deny all

[alembic]
script_location = %(here)s/infrastructure/database/alembic
path_separator = os
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is taken from settings in env.py; tests override it on the Config object.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

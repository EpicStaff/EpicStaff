[project]
name = "epicstaff-graph"
version = "1.0.0"
description = "This service is inteded to build and run EpicStaff Flows."
authors = [
    { name = "Epicstaff" }, 
    { name = "Maksym Yevstratiev" },
    { name = "Artur Drohomeretskyi" },
    { name = "Vitalii Povoroznyk" },
    { name = "Vasyl Cherkes" },
]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datamodel-code-generator==0.64.0",
    "langchain-core==1.4.7",
    "langgraph==1.2.11",
    "litellm==1.85.1",
    "loguru==0.7.2",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "redis==5.3.1",
]

[dependency-groups]
dotdict = [
    "dotdict",
]
dev = [
    "black==26.3.1",
    "fakeredis==2.32.0",
    "flake8==7.3.0",
    "mypy==1.18.2",
    "polyfactory==2.22.3",
    "pre-commit==3.8.0",
    "pydantic==2.13.4",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.15.1",
    "pytest-vcr==1.0.2",
    "pytest==8.4.2",
    "watchfiles==0.22.0",
]
secfloor = [
    "aiohttp==3.14.3",
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.7",
    "idna==3.18",
    "jinja2==3.1.6",
    "pyjwt==2.13.0",
    "requests==2.34.2",
    "urllib3==2.7.0",
    "yarl==1.24.5",
]

[tool.uv]
package = false

[tool.uv.sources]
dotdict = { path = "../shared/dotdict" }

[tool.ruff]
select = ["F","E"]
ignore = ["E402","E501"]

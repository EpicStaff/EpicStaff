[tool.poetry]
name = "epicstaff-graph"
version = "1.0.0"
description = "This service is inteded to build and run EpicStaff Flows."
authors = ["Epicstaff"]
license = "MIT"
readme = "README.md"
package-mode = false
packages = [
    { include = "src" }
]


[tool.poetry.dependencies]
python = ">=3.12,<3.13"
langgraph = "^0.5.4"
pyyaml = "6.0.2"
python-dotenv = "1.1.0"
datamodel-code-generator = "0.26.0"
redis = "5.2.0"
loguru = "0.7.2"
litellm = "1.75.7"

[tool.poetry.group.dotdict.dependencies]
dotdict = { path = "../shared/dotdict" }

[tool.poetry.group.dev.dependencies]
watchfiles = "^0.22.0"
pytest = "^8.3.2"
black = "^25.9.0"
flake8 = "^7.1.1"
mypy = "^1.11.1"
pre-commit = "^3.8.0"
pytest-mock = "^3.14.0"
pytest-asyncio = "^0.24.0"
pytest-vcr = "^1.0.2"
fakeredis = "^2.26.1"
polyfactory = "^2.17.0"
pydantic = ">=2.10.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
select = ["F","E"]
ignore = ["E402","E501"]

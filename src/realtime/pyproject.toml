[project]
name = "realtime"
version = "1.0.0"
description = "FastAPI WebSocket Audio Backend"
authors = [
    { name = "EpicStaff" },
    { name = "Maksym Yevstratiev" },
    { name = "Nikita Zaloha" },
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiohttp==3.14.3",
    "asyncpg==0.30.0",
    "fastapi==0.120.1",
    "google-genai==1.19.0",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "numpy==1.26.4",
    "openai==1.58.1",
    "psycopg2==2.9.12",
    "pydantic-settings==2.12.0",
    "pydantic[email]==2.13.4",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "redis==5.3.1",
    "sqlalchemy==2.0.49",
    "tiktoken==0.9.0",
    "uvicorn[standard]==0.49.0",
    "websockets==13.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio==0.23.0",
    "pytest-cov==4.1.0",
    "pytest==7.4.0",
]
secfloor = [
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.7",
    "cryptography==50.0.1",
    "idna==3.18",
    "pyjwt==2.13.0",
    "requests==2.34.2",
    "urllib3==2.7.0",
    "yarl==1.24.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# "." = src/realtime (resolves api, services, ai, ...)
# "../.." = project root crewai-sheetsui (resolves src.shared)
pythonpath = [".", "../.."]

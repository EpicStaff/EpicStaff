[mypy]
# Docs: https://mypy.readthedocs.io/en/stable/config_file.html
#
# django_app-SPECIFIC config. It exists because django_app is the only Django
# service and needs the django-stubs plugin, which is GLOBAL: putting it in the
# shared ../../.mypy.ini would make every other service (crew, agent, sandbox,
# ...) load the plugin and try to import django_app.settings on startup, which
# aborts mypy for them. So django_app gets its own config here.
#
# KEEP THE SHARED SETTINGS BELOW IN SYNC with ../../.mypy.ini. Only the
# [mypy.plugins.django-stubs] block and the `plugins` line are django_app-only.

python_version = 3.12

# django-stubs: teach mypy Django's dynamic types (Model.objects, TextChoices
# members, model fields). Removes the .objects / tuple[str,str].value noise.
plugins = mypy_django_plugin.main

# Forbid partially annotated functions (some annotations present -> all required).
# DISABLED for gradual adoption: this legacy codebase has ~540 partially-typed
# functions; forcing full signatures now is a separate annotation effort, not a
# bug fix. Re-enable once annotations are backfilled (ratchet).
# disallow_incomplete_defs = true

# Type-check the bodies of unannotated functions (skipped by default).
check_untyped_defs = true

# Forbid untyped decorators (an untyped decorator erases the wrapped function's type).
# DISABLED for gradual adoption: most hits are untyped third-party/framework
# decorators (DRF @action, Django signals) that need stubs, not our code.
# disallow_untyped_decorators = true

# Warn when returning Any where a concrete type is declared.
# DISABLED: with ignore_missing_imports, stubless libs return Any and flood this.
# warn_return_any = true

# Warn about `# type: ignore` that no longer suppresses anything.
warn_unused_ignores = true

# Warn about cast() to a type the expression already has.
warn_redundant_casts = true

# Warn about per-module config sections that matched no files (catches typos).
warn_unused_configs = true

# Warn about statically unreachable code.
warn_unreachable = true

# Don't error on imports without stubs -- treat such modules as Any.
ignore_missing_imports = true

# Append the error code [e.g. arg-type] to messages (needed for `# type: ignore[code]`).
show_error_codes = true

# Pretty output: source line + caret under the error.
pretty = true

# Include column numbers in messages.
show_column_numbers = true

# Show "in function X" context before an error.
show_error_context = true

# Map every file to exactly one module name: its path relative to the directory
# mypy is invoked from (plus MYPYPATH). Without this, a package dir that lacks
# __init__.py (utils/, services/, ...) is discovered BOTH as a namespace
# subpackage of the run dir (utils.logger) AND as its own root (logger), which
# aborts with "Source file found twice under different module names". This is
# correct ONLY because mypy is run from each service root (so the base is that
# service dir and internal imports like `from utils.logger import` resolve).
namespace_packages = true
explicit_package_bases = true

# Skip test packages and auto-generated migrations from recursive collection.
exclude = (?x)(
    (^|/)tests(/|$)
    | (^|/)migrations(/|$)
  )

[mypy.plugins.django-stubs]
# Matches DJANGO_SETTINGS_MODULE in manage.py. Resolves to
# src/django_app/django_app/settings/ when mypy is run from src/django_app/
# (base = cwd via explicit_package_bases). The plugin imports this module on
# startup, so run mypy in an environment where django_app.settings imports
# cleanly (its __init__ does `from src.shared.envtools import Env` and reads
# .env / RUN_IN_DOCKER -- i.e. the service's own env / docker).
django_settings_module = "django_app.settings"

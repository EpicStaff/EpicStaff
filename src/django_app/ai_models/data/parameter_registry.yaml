  petals:
    label: Petals
    kinds: [llm]
    # LiteLLM's bundled map has no models of this provider; it runs any typed name.
    custom_models: true
    connection_fields:
      base_url: *base_url
    common_parameters:
      llm: [temperature, top_p, max_tokens]
  replicate:
    label: Replicate
    kinds: [llm]
    connection_fields:
      base_url: *base_url
    common_parameters:
      llm: [temperature, top_p, stop, max_tokens, seed]
  sagemaker:
    label: AWS SageMaker
    kinds: [llm]
    aliases: [aws_sagemaker]
    connection_fields:
      aws_access_key_id: *aws_access_key_id
      aws_secret_access_key: *aws_secret_access_key
      aws_session_token: *aws_session_token
      aws_region_name: *aws_region_name
      base_url: *base_url
    common_parameters:
      llm: [temperature, top_p, stop, max_tokens]
  sambanova:
    label: SambaNova
    kinds: [llm]
    connection_fields:
      base_url: *base_url
    common_parameters:
      llm: [temperature, top_p, stop, max_tokens]
  together_ai:
    label: Together AI
    kinds: [llm, embedding]
    aliases: [together-ai]
    connection_fields:
      base_url: *base_url
    common_parameters:
      llm: *openai_compatible_parameters
      embedding: []
  v0:
    label: v0
    kinds: [llm]
    connection_fields:
      base_url: *base_url
    common_parameters:
      llm: []
  vertex_ai:
    label: Vertex AI
    kinds: [llm]
    connection_fields:
      # Optional: configs created before these fields existed take the project and
      # location from the service environment (VERTEXAI_PROJECT, VERTEXAI_LOCATION).
      vertex_project:
        label: Project
        litellm_argument: vertex_project
        endpoint: true
      vertex_location:
        label: Location
        litellm_argument: vertex_location
        endpoint: true
      base_url: *base_url
    common_parameters:
      llm: *openai_compatible_parameters
  vllm:
    label: vLLM
    kinds: [llm]
    custom_models: true
    connection_fields:
      base_url: *base_url
    common_parameters:
      llm: *openai_compatible_reasoning_parameters
  # Embedding-only provider that knowledge_new cannot run yet, so it has no kinds.
  voyage:
    label: Voyage
    kinds: []
  watsonx:
    label: watsonx
    kinds: [llm]
    connection_fields:
      base_url: *required_base_url
      project_id:
        label: Project ID
        litellm_argument: project_id
        endpoint: true
      space_id:
        label: Space ID
        litellm_argument: space_id
        endpoint: true
    common_parameters:
      llm:
        - temperature
        - top_p
        - stop
        - max_tokens
        - presence_penalty
        - frequency_penalty
        - seed
        - logprobs
        - top_logprobs
        - reasoning_effort
  # Embedding-only provider that knowledge_new cannot run yet, so it has no kinds.
  xinference:
    label: Xinference
    kinds: []

# Settings declared for every model of a provider and kind, because LiteLLM has no
# per-model discovery there (its generic embedding call returns the chat settings).
kind_parameters:
  embedding:
    openai: [dimensions]
    gemini: [task_type, dimensions]
    cohere: [dimensions]
    mistral: []
    together_ai: []
  transcription:
    # Voice configs do not store settings yet; transcription models are only picked by name.
    openai: []

recommended_models:
  anthropic: [claude-opus-5-5, claude-sonnet-5-5]
  fireworks_ai: [fireworks_ai/gpt-oss-120b]
  gemini:
    - gemini/gemini-4-argon
    - gemini/gemini-3.8-flash
    - gemini/gemini-3.5-flash
    - gemini/gemini-3.1-pro-preview
    - gemini/gemini-2.5-flash
  groq: [groq/openai/gpt-oss-120b]
  openai:
    - gpt-6-sol
    - gpt-6-luna
    - gpt-5.5
    - gpt-5-mini
    - gpt-5-nano
    - o3
    - gpt-4o
    - gpt-4o-mini
    - text-embedding-3-small

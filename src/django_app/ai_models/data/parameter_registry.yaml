# Settings declared for every model of a provider and kind, because LiteLLM has no
# per-model discovery there (its generic embedding call returns the chat settings).
kind_parameters:
  embedding:
    openai: [dimensions]
    gemini: [task_type, dimensions]
    cohere: [dimensions]
    mistral: []
    together_ai: []
  transcription:
    # Voice configs do not store settings yet; transcription models are only picked by name.
    openai: []


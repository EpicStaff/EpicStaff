[project]
name = "knowledge"
version = "1.0.0"
description = "This module provides RAG functionality for EpicStaff"
authors = [
    { name = "EpicStaff" },
    { name = "Artur Drohomeretskyi"},
    { name = "Bogdan Timchenko" },
    { name = "Vasyl Cherkes" },
    { name = "Vitalii Povoroznyk" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4==4.14.3",
    "google-genai==1.75.0",
    "httpx==0.28.1",
    "langchain-text-splitters==0.3.11",
    "loguru==0.7.3",
    "lxml==6.1.3",
    "numpy==1.26.4",
    "openai==1.109.1",
    "pandas==2.3.3",
    "pdfplumber==0.11.9",
    "pgvector==0.4.2",
    "psycopg2==2.9.12",
    "pydantic==2.13.4",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "redis==5.3.1",
    "sqlalchemy==2.0.49",
    "tiktoken==0.12.0",
    "requests==2.34.2",
]

[dependency-groups]
graphrag = [
    "graphrag",
]
dev = [
    "watchfiles==1.1.1",
]
transitive-pins = [
    "aiohttp==3.14.3",
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.7",
    "cryptography==50.0.1",
    "idna==3.18",
    "jinja2==3.1.6",
    "pyjwt==2.13.0",
    "urllib3==2.7.0",
    "yarl==1.24.5",
]

[tool.uv]
package = false

[tool.uv.sources]
graphrag = { path = "libraries/graphrag" }

[tool.ruff]
select = ["E"]
ignore = ["E402","E501"]

[project]
name = "knowledge"
version = "0.1.0"
description = ""
authors = [
    {name = "Artur Drohomeretskyi",email = "artur.drohomeretskyi@hys-enterprise.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
package-mode = false
dependencies = [
    "langchain-text-splitters (>=0.3.6,<0.4.0)",
    "openai (>=1.65.2,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pydantic (==2.13.4)",
    "python-dotenv (==1.2.2)",
    "redis (==5.3.1)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "lxml (>=5.3.1,<6.0.0)",
    "beautifulsoup4 (>=4.13.3,<5.0.0)",
    "google-genai (>=1.13.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (==2.0.49)",
    "pgvector (>=0.4.1,<0.5.0)",
    "python-docx (>=1.1.2,<2.0.0)",
    "numpy (<2.4)",
    "pdfplumber (>=0.11.9,<0.12.0)",
    "pandas (>=2.2.3,<3.0.0)",
]

[tool.poetry.group.graphrag.dependencies]
graphrag = {path = "libraries/graphrag"}

[tool.poetry.group.dev.dependencies]
watchfiles = ">=1.1.1,<2.0.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"



[tool.ruff]
select = ["E"]
ignore = ["E402","E501"]

[tool.poetry.group.secfloor.dependencies]
urllib3 = "==2.7.0"
requests = "==2.34.2"
jinja2 = "==3.1.6"
certifi = "==2026.7.22"
aiohttp = "==3.14.3"
cryptography = "==50.0.1"
idna = "==3.18"
pyjwt = "==2.13.0"
charset-normalizer = "==3.4.7"
yarl = "==1.24.5"
anyio = "==4.14.2"

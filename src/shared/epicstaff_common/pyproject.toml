[project]
name = "epicstaff-common"
version = "0.1.0"
description = "Shared helper code for EpicStaff sandbox Python tools"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["epicstaff_common"]

[tool.setuptools.package-dir]
epicstaff_common = "."

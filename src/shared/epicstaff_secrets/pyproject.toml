[project]
name = "epicstaff-secrets"
version = "0.1.0"
description = "Secret access module for EpicStaff sandbox Python nodes"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["epicstaff_secrets"]

[tool.setuptools.package-dir]
epicstaff_secrets = "."

[pytest]
addopts = --disable-warnings
testpaths = tests
# `..` (src/shared, this package's parent) rather than `.`: tests/conftest.py
# imports the installed `epicstaff_storage` package (not the bare `storage`
# module) so it keeps working when these tests are collected alongside
# sibling packages under src/shared in a single pytest session, where only
# one pytest.ini's pythonpath setting is honored for the whole run.
pythonpath = ..
log_cli=true
log_level=WARNING

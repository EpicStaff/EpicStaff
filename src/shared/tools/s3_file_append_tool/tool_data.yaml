tool-data:
  name: "S3 File Append Tool"
  description: "Append text to the end of an S3-stored file. Params: file_path, content (both required). Creates the file if it does not already exist. Use s3_file_insert_tool to add content at a specific line instead of the end, or s3_file_edit_tool to replace existing content."
  args-schema: "args_schema.json"
  code-file: "main.py"
  entrypoint: "main"
  requirements: "requirements.txt"
  use-storage: true

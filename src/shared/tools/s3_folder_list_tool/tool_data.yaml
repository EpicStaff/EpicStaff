tool-data:
  name: "S3 Folder List Tool"
  description: "List files and folders in S3 storage (ls semantics). Params: path - folder to list; path must be within your flow's allowed files (the files attached to this flow) - root/whole-bucket listing is not available, pass one of your allowed paths; recursive (default false) - set true to descend into every nested folder (like ls -R) instead of one level; long (default false) - include size and last-modified time for each entry. Output is capped at roughly 30,000 characters; if truncated, narrow path or drop recursive to see fewer entries."
  args-schema: "args_schema.json"
  code-file: "main.py"
  entrypoint: "main"
  requirements: "requirements.txt"
  use-storage: true

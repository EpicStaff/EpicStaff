tool-data:
  name: "Natural Language To SQL Tool"
  description: "Converts natural language into SQL queries and executes them on the provided database. Requires db_uri and api_key tool configuration fields. In read-only mode (default), the database connection rejects INSERT, UPDATE, DELETE and DROP statements."
  args-schema: "args_schema.json"
  code-file: "main.py"
  entrypoint: "main"
  requirements: "requirements.txt"

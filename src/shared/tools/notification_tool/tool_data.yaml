tool-data:
  name: "Notification Tool"
  description: "Sends a short (<=200 char) out-of-band notification via email or webhook, without pausing the flow. For channel='email' requires the 'api_key' (an EpicStaff API key) configuration field to be set when configuring this tool for an agent. The agent supplies 'message', 'channel' and 'target'."
  args-schema: "args_schema.json"
  code-file: "main.py"
  entrypoint: "main"
  requirements: "requirements.txt"

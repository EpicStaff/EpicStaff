[project]
name = "foundation"
version = "0.1.0"
description = "Bases for EpicStaff"
authors = [
    { name = "BogdanTimchenkoHYS", email = "bogdan.timchenko@hys-enterprise.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
litestar = [
    "litestar==2.24.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # The litestar helpers are tested too, and `make uv-sync` installs groups, not extras.
    "litestar==2.24.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `make uv-sync` does not install the project itself, so the package is imported from source.
pythonpath = ["src"]
asyncio_mode = "auto"

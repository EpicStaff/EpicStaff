[project]
name = "foundation"
version = "0.1.0"
description = "Bases for EpicStaff"
authors = [
    { name = "BogdanTimchenkoHYS", email = "bogdan.timchenko@hys-enterprise.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "loguru==0.7.3",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
litestar = [
    "litestar==2.24.0",
]

s3-storage = [
    "boto3==1.43.111",
    "boto3-stubs==1.43.111",
]

transitive-pins = [
    "certifi==2026.10.23",
    "idna==3.18",
    "urllib3==2.7.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--disable-warnings -m \"not slow\""
log_cli = true
log_level = "WARNING"
markers = [
    "slow: writes 1000+ real objects against a live S3 backend; excluded from the default run",
]

# redis.conf
# Loaded by the redis service command in docker-compose.yaml; the --port/--requirepass/--user
# flags there override directives of the same name here.
port 6379

# Large session events (~300 KB each) reach the SSE subscribers of session channels in bursts. Redis's
# built-in pubsub limit (32mb hard, 8mb for 60s) disconnects such a subscriber, so this file
# must be loaded for the limit below to apply. A subscriber is disconnected when its buffer
# passes 64mb, or stays above 16mb for 60 seconds.
client-output-buffer-limit pubsub 64mb 16mb 60

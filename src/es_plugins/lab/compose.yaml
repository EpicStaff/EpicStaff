# The plugin node lab: the es_plugins service exactly as src/docker-compose.yaml defines it
# (extends), against a stand-in for django_app's node API, with two probe plugins. Run with
# run.sh (project es-plugins-lab), which exports the variables the extended service needs and
# removes everything afterwards. No host ports.
name: es-plugins-lab

x-lab-image: &lab-image
  build:
    context: ../..
    dockerfile: es_plugins/lab/Dockerfile
  image: es-plugins-lab-helper:local
  init: true

services:
  packer:
    <<: *lab-image
    profiles: [pack]
    command: ["sh", "/lab/pack_probes.sh"]
    volumes:
      - packages:/packages

  control:
    <<: *lab-image
    command: ["python", "-u", "/lab/control.py"]
    environment:
      PLUGINS_NODE_KEY: ${PLUGINS_NODE_KEY:?}
    volumes:
      - packages:/packages:ro
    networks:
      - plugins-network

  es_plugins:
    extends:
      file: ../../docker-compose.yaml
      service: es_plugins
    image: es-plugins-lab-node:local
    container_name: es-plugins-lab-node
    depends_on:
      - control

  tools:
    <<: *lab-image
    command: ["sleep", "infinity"]
    networks:
      - plugins-network

volumes:
  packages: {}
  es_plugins_data: {}

networks:
  plugins-network:
    internal: true

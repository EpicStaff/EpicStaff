# Installation
# pip install pre-commit
# pre-commit install -t pre-commit

exclude: |
  (?x)(
    (^|/)migrations/
    | (^|/)libraries/
    | (^|/)tests/
  )

fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^src/docker-compose\.plugins-dev\.yaml$
      # Compose's !override tag has no YAML constructor, so this one file is checked for syntax
      # only; `docker compose config` validates what it means.
      - id: check-yaml
        name: check yaml (syntax only, compose tags)
        args: [--unsafe]
        files: ^src/docker-compose\.plugins-dev\.yaml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [ "--fix", "--config", ".ruff.toml" ]
        stages: [ pre-commit ]

      - id: ruff-format
        args: [ "--config", ".ruff.toml" ]
        stages: [ pre-commit ]
